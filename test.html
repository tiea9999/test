let currentHls = null;

function setStatus(text, autoHide=true){
  const box = document.getElementById("status");
  if(!box) return;
  box.textContent = text || "";
  box.style.display = text ? "block" : "none";
  if(autoHide && text){
    clearTimeout(setStatus._timer);
    setStatus._timer = setTimeout(()=>{ box.style.display = "none"; }, 4500);
  }
}

function isWorkerUrl(url){
  return String(url || "").includes("workers.dev");
}

function shouldAvoidProxy(url){
  url = String(url || "").toLowerCase();
  return (url.includes(".mpd") || url.includes("thaicdn") || url.includes("mux") || url.includes("byteark") || url.includes("akamaized") || url.includes("cloudfront"));
}
function proxyUrl(url){
  url = String(url || "").trim();
  if(!url) return "";
  if(isWorkerUrl(url)) return url;
  if(shouldAvoidProxy(url)) return url;
  return WORKER_PROXY + encodeURIComponent(url);
}
function makeProxyUrl(url){
  url = String(url || "").trim();
  if(!url) return "";
  if(isWorkerUrl(url)) return url;
  return WORKER_PROXY + encodeURIComponent(url);
}

function directUrl(url){
  return String(url || "").trim();
}

function forceAudio100(){
  const video = document.getElementById("html5-player");
  try{
    video.muted = false;
    video.defaultMuted = false;
    video.volume = 1.0;
  }catch(e){}
}

function openIntent(url, pkg){
  url = url || (activeChannel ? activeChannel.file : "") || activeUrl;
  if(!url) return;
  try{
    const u = new URL(url);
    const scheme = u.protocol.replace(":","");
    const hostPath = u.host + u.pathname + (u.search || "");
    let intent = "intent://" + hostPath + "#Intent;scheme=" + scheme + ";action=android.intent.action.VIEW;type=video/*";
    if(pkg) intent += ";package=" + pkg;
    intent += ";S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
    window.location.href = intent;
  }catch(e){ window.location.href = url; }
}
function openExternal(url){ openIntent(url || (activeChannel ? activeChannel.file : "") || activeUrl, ""); }
function openMX(url){ openIntent(url || (activeChannel ? activeChannel.file : "") || activeUrl, "com.mxtech.videoplayer.ad"); }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}

  }

  if(mpegTsPlayer){
    try{ mpegTsPlayer.destroy(); }catch(e){}
    mpegTsPlayer = null;
  }

  if(shakaPlayer){
    try{ await shakaPlayer.destroy(); }catch(e){}
    shakaPlayer = null;
  }

  try{
    video.pause();
    video.removeAttribute("src");
    video.load();
  }catch(e){}

  video.style.display = "none";

  const jwBox = document.getElementById("jw-player");
  if(jwBox) jwBox.style.display = "none";
  setStatus("");
}


function isHlsLike(url){
  url = String(url || "").toLowerCase();
  return url.includes(".m3u8") || url.includes("extension=m3u8") || url.includes("type=m3u8");
}

function isNativePlaying(){
  const video = document.getElementById("html5-player");
  return video && video.readyState >= 2 && (video.currentTime || 0) > 0.2;
}

function playDirectNative(url){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");

  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;

  try{
    video.pause();
    video.removeAttribute("src");
    video.src = url;
    video.load();
  }catch(e){}

  forceAudio100();
  setStatus("กำลังเล่นลิงก์ตรงเหมือนบราวเซอร์...");

  const tryPlay = ()=>{
    forceAudio100();
    video.play().then(()=>{
      setStatus("กำลังเล่นลิงก์ตรง");
    }).catch(()=>{
      setStatus("ถ้าไม่เล่น ให้แตะ ▶ หรือกด PLAYER/MX", false);
    });
  };

  setTimeout(tryPlay, 100);
  setTimeout(tryPlay, 700);
  setTimeout(tryPlay, 1500);

  // ถ้า native ไม่ขึ้นจริง ๆ ค่อยลอง HLS.js ตรง ไม่ใช้ Worker
  setTimeout(()=>{
    if(isNativePlaying()) return;
    setStatus("ลิงก์ตรงยังไม่ขึ้น กำลังลอง HLS.js ตรง...");
    useHLS_STABLE_DIRECT_ONLY(url);
  }, 4500);
}

function useHLS_STABLE_DIRECT_ONLY(url){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");

  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(window.Hls && Hls.isSupported() && isHlsLike(url)){
    setStatus("กำลังโหลด HLS.js ตรง...");

    currentHls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      maxBufferLength: 40,
      maxMaxBufferLength: 70,
      backBufferLength: 20,
      maxBufferHole: 3,
      highBufferWatchdogPeriod: 6,
      manifestLoadingMaxRetry: 6,
      levelLoadingMaxRetry: 6,
      fragLoadingMaxRetry: 8,
      manifestLoadingTimeOut: 15000,
      levelLoadingTimeOut: 15000,
      fragLoadingTimeOut: 22000,
      startFragPrefetch: true,
      capLevelToPlayerSize: true,
      testBandwidth: false,
      abrEwmaDefaultEstimate: 700000,
      liveSyncDurationCount: 6,
      liveMaxLatencyDurationCount: 14
    });

    currentHls.loadSource(url);
    currentHls.attachMedia(video);

    currentHls.on(Hls.Events.MANIFEST_PARSED, function(){
      forceAudio100();
      video.play().catch(()=>{});
      setStatus("กำลังเล่น HLS.js ตรง");
    });

    currentHls.on(Hls.Events.ERROR, function(event, data){
      console.log("HLS ERROR:", data);
      if(!currentHls) return;

      if(data && data.fatal){
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
          setStatus("เน็ตเวิร์กสะดุด กำลังต่อใหม่...");
          try{ currentHls.startLoad(); }catch(e){}
        }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
          setStatus("ภาพสะดุด กำลังกู้คืน...");
          try{ currentHls.recoverMediaError(); }catch(e){}
        }else{
          setStatus("เว็บเล่นไม่ได้ ให้กด PLAYER/MX", false);
        }
      }
    });

    startWatchdog(url);
  }else{
    setStatus("เครื่องนี้ไม่รองรับ HLS.js ให้กด PLAYER/MX", false);
  }
}

async function loadChannel(channel, element){
  activeChannel = channel;
  activeElement = element;

  document.querySelectorAll(".channel").forEach(ch=>ch.classList.remove("active"));
  if(element) element.classList.add("active");

  document.getElementById("player-container").style.display = "block";
  showPlayerControls();
  await stopAllPlayers();

  const original = directUrl(channel.file);
  activeUrl = original;

  if(original.toLowerCase().includes(".mpd")){
    playMPD(channel, original, false);
  }else if(original.toLowerCase().includes(".ts") && !original.toLowerCase().includes(".m3u8")){
    playSingleTsAsHls(original);
  }else{
    // สำคัญ: ลิงก์นี้บราวเซอร์เล่นตรงได้ จึงต้องใช้ตรงก่อน ห้าม Worker
    playDirectNative(original);
  }

  setTimeout(()=>{
    const btn = document.getElementById("closeBtn");
    if(btn) btn.focus();
  },300);
}


/* ================= MPD ผ่าน workers.dev ================= */
async function playMPD(channel, url, usedProxy){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");
  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();
  if(!window.shaka){ setStatus("เครื่องนี้โหลด Shaka Player ไม่ได้ ให้กด PLAYER/MX", false); return; }
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){ setStatus("เครื่องนี้ไม่รองรับ MPD/DRM ผ่านเว็บ ให้กด PLAYER/MX", false); return; }
  try{ if(shakaPlayer){ await shakaPlayer.destroy(); shakaPlayer=null; } }catch(e){}
  shakaPlayer = new shaka.Player(video);
  shakaPlayer.configure({
    streaming:{ bufferingGoal:24, rebufferingGoal:3, bufferBehind:12, lowLatencyMode:false, retryParameters:{maxAttempts:4, baseDelay:900, backoffFactor:1.6, fuzzFactor:0.4, timeout:22000}},
    manifest:{ retryParameters:{maxAttempts:4, baseDelay:900, timeout:22000}}
  });
  const kid = channel.keyId || channel.kid || channel.key_id || "";
  const key = channel.key || channel.clearkey || "";
  if(channel.drm && kid && key){ shakaPlayer.configure({drm:{clearKeys:{[kid]:key}}}); }
  shakaPlayer.addEventListener("error", function(e){ console.log("MPD ERROR:", e.detail); setStatus("MPD สะดุด กำลังกู้คืน..."); try{ video.play().catch(()=>{}); }catch(err){} });
  try{
    setStatus(usedProxy ? "กำลังโหลด MPD ผ่าน Worker..." : "กำลังโหลด MPD ตรง...");
    await shakaPlayer.load(url);
    forceAudio100();
    video.play().catch(()=>{});
    setTimeout(()=>{ forceAudio100(); video.play().catch(()=>{}); },500);
    setStatus("กำลังเล่น MPD");
    startMpdWatchdog(url, usedProxy);
  }catch(e){
    console.log("MPD LOAD ERROR:", e);
    if(!usedProxy && !shouldAvoidProxy(url)){
      const purl = makeProxyUrl(url);
      if(purl && purl !== url){ setStatus("MPD ตรงไม่ได้ กำลังลองผ่าน Worker..."); return playMPD(channel, purl, true); }
    }
    setStatus("MPD เล่นไม่ได้บนเครื่องนี้ ให้กด PLAYER/MX", false);
  }
}

function startMpdWatchdog(url, usedProxy){
  const video = document.getElementById("html5-player");
  if(hlsWatchdog){ clearInterval(hlsWatchdog); hlsWatchdog=null; }
  let lastTime=0, stuck=0;
  hlsWatchdog=setInterval(()=>{
    if(document.getElementById("player-container").style.display !== "block"){ clearInterval(hlsWatchdog); hlsWatchdog=null; return; }
    if(!shakaPlayer) return;
    forceAudio100();
    if(video.paused && video.readyState>=2){ video.play().catch(()=>{}); return; }
    if(video.readyState<2){ setStatus("กำลังเติมบัฟเฟอร์ MPD..."); return; }
    if(Math.abs((video.currentTime||0)-lastTime)<0.05) stuck++; else stuck=0;
    lastTime=video.currentTime||0;
    if(stuck>=7){ setStatus("MPD ค้าง กำลังต่อสัญญาณใหม่..."); try{ shakaPlayer.retryStreaming(); video.play().catch(()=>{}); }catch(e){} stuck=0; }
  },4000);
}


function playSingleTsAsHls(tsUrl){
  const video = document.getElementById("html5-player");

  setStatus("กำลังโหลด TS Live Smooth...");

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(mpegTsPlayer){
    try{ mpegTsPlayer.destroy(); }catch(e){}
    mpegTsPlayer = null;
  }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(window.mpegts && mpegts.getFeatureList().mseLivePlayback){
    try{
      mpegTsPlayer = mpegts.createPlayer({
        type: "mpegts",
        isLive: true,
        url: tsUrl,
        cors: true,
        withCredentials: false
      },{
        // TS BUFFER SMOOTH FINAL
        // หน่วงเพิ่มนิด แต่ไหลลื่นกว่าแบบเร็ว
        enableWorker: false,
        enableStashBuffer: true,
        stashInitialSize: 1024 * 1024,

        lazyLoad: false,
        deferLoadAfterSourceOpen: false,

        autoCleanupSourceBuffer: true,
        autoCleanupMaxBackwardDuration: 60,
        autoCleanupMinBackwardDuration: 20,

        liveBufferLatencyChasing: true,
        liveBufferLatencyMaxLatency: 8,
        liveBufferLatencyMinRemain: 2,

        fixAudioTimestampGap: true,
        accurateSeek: false
      });

      mpegTsPlayer.attachMediaElement(video);
      mpegTsPlayer.load();

      const tryPlay = ()=>{
        forceAudio100();
        video.play().then(()=>{
          setStatus("กำลังเล่น TS Live Smooth");
        }).catch(()=>{
          setStatus("กด ▶ บนจอ 1 ครั้ง ถ้าเครื่องบล็อก autoplay", false);
        });
      };

      setTimeout(tryPlay, 600);
      setTimeout(tryPlay, 1800);
      setTimeout(tryPlay, 3500);

      let lastTime = 0;
      let stuck = 0;
      let reloadLock = false;

      hlsWatchdog = setInterval(()=>{
        if(document.getElementById("player-container").style.display !== "block"){
          clearInterval(hlsWatchdog);
          hlsWatchdog = null;
          return;
        }

        forceAudio100();

        // ถ้าหยุดเอง ให้เล่นต่อก่อน ยังไม่รีโหลดทันที
        if(video.paused){
          setStatus("เล่นต่ออัตโนมัติ...");
          video.play().catch(()=>{});
          return;
        }

        if(video.readyState < 2){
          setStatus("กำลังเติมบัฟเฟอร์ TS...");
          return;
        }

        if(Math.abs(video.currentTime - lastTime) < 0.05){
          stuck++;
        }else{
          stuck = 0;
        }

        lastTime = video.currentTime;

        // รอให้นานขึ้นก่อน reload เพื่อลดอาการหมุนถี่
        if(stuck >= 10 && !reloadLock){
          reloadLock = true;
          setStatus("TS ค้างนาน กำลังต่อสัญญาณใหม่...");

          try{
            mpegTsPlayer.pause && mpegTsPlayer.pause();
          }catch(e){}

          try{
            mpegTsPlayer.unload();
          }catch(e){}

          setTimeout(()=>{
            try{
              mpegTsPlayer.load();
              video.play().catch(()=>{});
            }catch(e){}
            stuck = 0;
            reloadLock = false;
          },1200);
        }
      },3000);

      mpegTsPlayer.on(mpegts.Events.ERROR,function(type,detail,info){
        console.log("MPEGTS ERROR",type,detail,info);

        // อย่า reload รัว ให้รอแล้วค่อยต่อใหม่
        setStatus("TS สะดุด กำลังรอสัญญาณกลับมา...");
        setTimeout(()=>{
          try{
            mpegTsPlayer.unload();
            mpegTsPlayer.load();
            video.play().catch(()=>{});
          }catch(e){}
        },1500);
      });

      return;
    }catch(e){
      console.log("MPEGTS INIT ERROR",e);
    }
  }

  setStatus("เครื่องนี้ไม่รองรับ TS Live ในเว็บ ให้กด PLAYER", false);
  openExternal(tsUrl);
}

  // DIRECT TS SUPPORT FIX
  // .ts เดี่ยวเล่นตรงใน browser หลายเครื่องไม่ได้
  // จึงแปลงเป็น m3u8 ชั่วคราว แล้วให้ hls.js เล่น
  if(url.toLowerCase().includes(".ts") && !url.toLowerCase().includes(".m3u8")){
    playSingleTsAsHls(url);
    return;
  }

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(Hls.isSupported() && (url.includes(".m3u8") || url.toLowerCase().includes("extension=m3u8"))){
    setStatus(usedProxy ? "กำลังโหลด HLS ผ่าน Worker..." : "กำลังโหลด HLS ตรง...");

    currentHls = new Hls({
      // WORKERS SPORT STABLE FINAL
      enableWorker: false,
      lowLatencyMode: false,

      // เพิ่ม buffer ให้นิ่งขึ้น
      maxBufferLength: 36,
      maxMaxBufferLength: 60,
      backBufferLength: 18,

      // ลดภาพหมุน
      maxBufferHole: 3,
      highBufferWatchdogPeriod: 5,
      nudgeOffset: 0.3,
      nudgeMaxRetry: 8,

      // retry สูงขึ้น
      manifestLoadingMaxRetry: 6,
      manifestLoadingRetryDelay: 2000,
      manifestLoadingMaxRetryTimeout: 20000,

      levelLoadingMaxRetry: 6,
      levelLoadingRetryDelay: 2000,
      levelLoadingMaxRetryTimeout: 20000,

      fragLoadingMaxRetry: 8,
      fragLoadingRetryDelay: 2000,
      fragLoadingMaxRetryTimeout: 25000,

      startFragPrefetch: true,
      capLevelToPlayerSize: true,
      testBandwidth: false,
      abrEwmaDefaultEstimate: 550000,
      abrBandWidthFactor: 0.85,
      abrBandWidthUpFactor: 0.65,

      liveSyncDurationCount: 4,
      liveMaxLatencyDurationCount: 8
    });

    currentHls.loadSource(url);
    currentHls.attachMedia(video);

    let hlsStarted = false;
    currentHls.on(Hls.Events.MANIFEST_PARSED, function(){
      hlsStarted = true;
      forceAudio100();
      video.play().catch(()=>{});
      setTimeout(()=>{ forceAudio100(); video.play().catch(()=>{}); },300);
      setStatus("กำลังเล่น HLS");
    });
    setTimeout(()=>{
      if(!hlsStarted && !usedProxy && !shouldAvoidProxy(url)){
        const purl = makeProxyUrl(url);
        if(purl && purl !== url){
          setStatus("เส้นตรงเริ่มช้า กำลังลองผ่าน Worker...");
          try{ currentHls.destroy(); currentHls = null; }catch(e){}
          useHLS_STABLE(purl, true);
        }
      }
    },9000);

    currentHls.on(Hls.Events.BUFFER_STALLED, function(){
      setStatus("กำลังเติมบัฟเฟอร์...", true);
      try{ currentHls.startLoad(); }catch(e){}
    });

    currentHls.on(Hls.Events.ERROR, function(event, data){
      console.log("HLS ERROR:", data);
      if(!currentHls) return;

      if(data.fatal){
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
          setStatus("เน็ตเวิร์กสะดุด กำลังต่อใหม่...");
          try{ currentHls.startLoad(); }catch(e){}
        }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
          setStatus("สัญญาณวิดีโอสะดุด กำลังกู้คืน...");
          try{ currentHls.recoverMediaError(); }catch(e){}
        }else{
          if(!usedProxy && !shouldAvoidProxy(url)){
            const purl = makeProxyUrl(url);
            if(purl && purl !== url){
              setStatus("เส้นตรงสะดุด กำลังลองผ่าน Worker...");
              try{ currentHls.destroy(); currentHls = null; }catch(e){}
              setTimeout(()=>useHLS_STABLE(purl, true), 800);
              return;
            }
          }
          setStatus("โหลดใหม่เพื่อความนิ่ง...", false);
          try{
            currentHls.destroy();
            currentHls = null;
            setTimeout(()=>useHLS_STABLE(url, usedProxy), 1200);
          }catch(e){}
        }
      }
    });

    startWatchdog(url);

  }else{
    video.src = url;
    setTimeout(()=>{
      forceAudio100();
      video.play().catch(()=>{});
    },300);
  }
}

function startWatchdog(url){
  const video = document.getElementById("html5-player");
  let lastTime = 0;
  let stuckCount = 0;

  hlsWatchdog = setInterval(()=>{
    if(document.getElementById("player-container").style.display !== "block") return;
    if(!currentHls) return;

    forceAudio100();

    if(video.paused || video.readyState < 2){
      try{ currentHls.startLoad(); }catch(e){}
      video.play().catch(()=>{});
      return;
    }

    if(Math.abs(video.currentTime - lastTime) < 0.05){
      stuckCount++;
    }else{
      stuckCount = 0;
    }

    lastTime = video.currentTime;

    if(stuckCount >= 7){
      setStatus("ภาพค้าง กำลังกู้คืน...");
      try{ currentHls.startLoad(); }catch(e){}
      video.play().catch(()=>{});
      stuckCount = 0;
    }
  }, 4000);
}

/* ================= AUTO HIDE PLAYER CONTROLS ================= */
let controlsTimer = null;

function showPlayerControls(){
  const container = document.getElementById("player-container");
  if(!container) return;

  container.classList.remove("controls-hidden");

  if(controlsTimer){
    clearTimeout(controlsTimer);
    controlsTimer = null;
  }

  controlsTimer = setTimeout(()=>{
    if(container.style.display === "block"){
      try{
        const active = document.activeElement;
        if(active && active.classList && active.classList.contains("player-btn")){
          active.blur();
        }
      }catch(e){}
      container.classList.add("controls-hidden");
    }
  }, 3000);
}

function setupAutoHideControls(){
  const container = document.getElementById("player-container");
  if(!container || container.dataset.autohideReady === "1") return;
  container.dataset.autohideReady = "1";

  ["mousemove","mousedown","touchstart","touchmove","click"].forEach(ev=>{
    container.addEventListener(ev, showPlayerControls, {passive:true});
  });

  document.addEventListener("keydown", function(){
    if(container.style.display === "block"){
      showPlayerControls();
    }
  });
}

async function closePlayer(){
  await stopAllPlayers();
  const box = document.getElementById("player-container");
  box.classList.remove("controls-hidden");
  box.style.display = "none";
  try{ document.activeElement && document.activeElement.blur && document.activeElement.blur(); }catch(e){}
  setTimeout(()=>activeElement?.focus(),150);
}

/* ================= REMOTE X / BUTTON FIX ================= */
function getFocusablePlayerButtons(){
  return Array.from(document.querySelectorAll('#player-container .player-btn'))
    .filter(el => el.offsetParent !== null);
}
function focusPlayerButtonByStep(step){
  const buttons = getFocusablePlayerButtons();
  if(!buttons.length) return;
  let idx = buttons.indexOf(document.activeElement);
  if(idx < 0) idx = 0;
  else idx = (idx + step + buttons.length) % buttons.length;
  buttons[idx].focus();
}
document.addEventListener("keydown", function(e){
  const container = document.getElementById("player-container");
  if(!container || container.style.display !== "block") return;

  const active = document.activeElement;
  const onBtn = active && active.classList && active.classList.contains("player-btn");

  if(onBtn && (e.key === "Enter" || e.key === "OK" || e.key === " " || e.keyCode === 23 || e.keyCode === 66)){
    e.preventDefault();
    e.stopPropagation();
    active.click();
    return;
  }

  if(e.key === "ArrowUp" || e.keyCode === 19){
    e.preventDefault();
    e.stopPropagation();
    showPlayerControls();
    const closeBtn = document.getElementById("closeBtn");
    if(closeBtn) closeBtn.focus();
    return;
  }

  if(e.key === "ArrowLeft" || e.keyCode === 21){
    e.preventDefault();
    e.stopPropagation();
    showPlayerControls();
    focusPlayerButtonByStep(-1);
    return;
  }

  if(e.key === "ArrowRight" || e.keyCode === 22){
    e.preventDefault();
    e.stopPropagation();
    showPlayerControls();
    focusPlayerButtonByStep(1);
    return;
  }

  if(e.key === "ArrowDown" || e.keyCode === 20){
    e.preventDefault();
    e.stopPropagation();
    showPlayerControls();
    const buttons = getFocusablePlayerButtons();
    if(buttons.length) buttons[buttons.length - 1].focus();
    return;
  }
}, true);


/* ================= REMOTE ================= */
document.addEventListener("keydown",function(e){
  const container = document.getElementById("player-container");

  if(container.style.display === "block"){
    const video = document.getElementById("html5-player");
    if(e.key === "Escape" || e.key === "Backspace" || e.key === "BrowserBack" || e.keyCode === 10009){ e.preventDefault(); closePlayer(); return; }
    if(e.key === "ArrowLeft" || e.keyCode === 21){ e.preventDefault(); try{ video.currentTime=Math.max(0,(video.currentTime||0)-15); setStatus("⏪ ย้อนกลับ 15 วิ"); }catch(err){} return; }
    if(e.key === "ArrowRight" || e.keyCode === 22){ e.preventDefault(); try{ video.currentTime=(video.currentTime||0)+15; setStatus("⏩ เดินหน้า 15 วิ"); }catch(err){} return; }
    const active = document.activeElement;
    if(active && active.classList && active.classList.contains("player-btn")){
      return;
    }

    if(e.key === "Enter" || e.key === "OK" || e.key === " " || e.keyCode === 23 || e.keyCode === 66 || e.keyCode === 179){
      e.preventDefault();
      try{ if(video.paused){ video.play().catch(()=>{}); setStatus("▶ เล่น"); } else { video.pause(); setStatus("⏸ หยุด"); } }catch(err){}
      return;
    }
  }
});

});
