<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>TIEA IPTV</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<!-- 🔥 กัน header บัง -->
<body class="bg-gray-900 text-white p-4 pt-[80px]">

<!-- 🔥 HEADER FIX -->
<div class="sticky top-[60px] z-50 bg-gray-900/95 backdrop-blur border-b border-white/10">

<div class="flex items-center justify-between px-2 py-2">

<button onclick="goBack()"
class="flex items-center gap-2 px-4 py-2 rounded-xl bg-blue-600 text-white text-sm">
⬅ หน้าหลัก
</button>

<h1 class="text-xl text-center flex-1">
⚽ TIEA IPTV ⚽
</h1>

<div class="w-[90px]"></div>
</div>

<div id="leagueBar" class="flex gap-4 overflow-x-auto px-2 pb-2"></div>

<div class="flex items-center gap-3 mt-2">

<div id="sportTabs"
class="flex gap-2 overflow-x-auto px-2 py-2 bg-slate-800/80 rounded-xl">
</div>

<div id="dateTabs"
class="flex gap-2 overflow-x-auto px-3 py-2 flex-1 justify-end bg-slate-800/60 rounded-xl">
</div>

</div>
</div>

<!-- MATCH -->
<div id="matches"
class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mt-4">
</div>

<style>
.active-server {
box-shadow: 0 0 10px #3b82f6;
}
</style>

<script>
let PLAYLIST = [];
let selectedLeague = null;
let selectedDate = null;
let selectedSport = "football";

// 🔥 โหลด playlist
async function loadPlaylist() {
const res = await fetch("https://raw.githubusercontent.com/nongakka/shortmovie/main/playlist.json");
PLAYLIST = await res.json();
}

// 🔥 หา stream
function normalize(str){
return (str||"").toLowerCase().replace(/[\s_-]/g,"");
}

function findStream(name){
const clean = normalize(name);
return PLAYLIST.find(p=>normalize(p.title).includes(clean));
}

// 🔥 โหลดแมตช์
async function loadMatches(){
const res = await fetch("https://liveplayback.net/api/fixtures/date");
const data = await res.json();

const container = document.getElementById("matches");
container.innerHTML="";

Object.keys(data).forEach(date=>{

container.innerHTML+=`
<h2 class="col-span-full text-sm mt-4 text-blue-300">📅 ${date}</h2>
`;

data[date].forEach(m=>{

const home = m.teamhome?.name||"-";
const away = m.teamaway?.name||"-";

const homeLogo = m.teamhome?.logo||"";
const awayLogo = m.teamaway?.logo||"";

const time = (m.event_time||"").split(" ")[1]||"-";

const stream = findStream(m.channel);
const url = stream?.servers?.[0]?.url || "#";

container.innerHTML+=`
<div class="bg-gray-800 rounded-xl p-3 flex flex-col">

<div class="text-xs text-gray-400 mb-2">${time}</div>

<div class="flex justify-between items-center">

<div class="flex items-center gap-2">
<img src="${homeLogo}" class="w-5 h-5">
<span>${home}</span>
</div>

<span class="text-green-400 font-bold">VS</span>

<div class="flex items-center gap-2">
<span>${away}</span>
<img src="${awayLogo}" class="w-5 h-5">
</div>

</div>

${
url!=="#"
? `<button onclick="openPlayer('${url}')"
class="mt-2 w-full text-xs py-2 bg-blue-600 rounded">
▶ ดูสด
</button>`
: `<div class="text-xs text-gray-500 mt-2">ไม่มีลิ้ง</div>`
}

</div>
`;
});
});
}

// 🔥 PLAYER
let hls;

function openPlayer(url){
const modal = document.getElementById("playerModal");
const video = document.getElementById("videoPlayer");

if(hls){hls.destroy();}

if(Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}

modal.classList.remove("hidden");
modal.classList.add("flex");
}

function closePlayer(){
const modal=document.getElementById("playerModal");
const video=document.getElementById("videoPlayer");

if(hls)hls.destroy();
video.pause();
video.src="";

modal.classList.add("hidden");
modal.classList.remove("flex");
}

function goBack(){
window.location.href="https://tiea9999.github.io/tv/index.html";
}

// 🚀 START
(async()=>{
await loadPlaylist();
loadMatches();
})();
</script>

<!-- PLAYER -->
<div id="playerModal"
onclick="closePlayer()"
class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">

<div class="w-full max-w-4xl mx-4" onclick="event.stopPropagation()">

<button onclick="closePlayer()"
class="text-white mb-2 bg-red-500 px-3 py-1 rounded">
✕ ปิด
</button>

<video id="videoPlayer"
class="w-full"
controls autoplay muted></video>

</div>
</div>

</body>
</html>
