function setStatus(text, autoHide=true){
  const box = document.getElementById("status");

  if(autoHide && text){

function isWorkerUrl(url){
  return String(url || "").includes("workers.dev");
}

function proxyUrl(url){

  // ผ่าน workers.dev ล้วนๆ:
  // ถ้าเป็น workers อยู่แล้วใช้ตรง

  // ถ้าไม่ใช่ workers ให้บังคับผ่าน Worker กลาง
  return WORKER_PROXY + encodeURIComponent(url);
}

function openExternal(url){
  url = url || (activeChannel ? activeChannel.file : "") || activeUrl;
  if(!url) return;
  try{
    const u = new URL(url);
    const scheme = u.protocol.replace(":","");
    const hostPath = u.host + u.pathname + (u.search || "");
    const intent = "intent://" + hostPath + "#Intent;scheme=" + scheme + ";action=android.intent.action.VIEW;type=video/*;S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
    window.location.href = intent;
  }catch(e){
    window.location.href = url;
  }
}

/* ================= MPD ผ่าน workers.dev ================= */
async function playMPD(channel, url){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");

  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  if(!window.shaka){
    setStatus("เครื่องนี้โหลด Shaka Player ไม่ได้", false);
    return;
  }

  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){
    setStatus("เครื่องนี้ไม่รองรับ MPD/DRM ผ่านเว็บ", false);
    return;
  }

  shakaPlayer = new shaka.Player(video);

  shakaPlayer.configure({
    streaming:{
      bufferingGoal: 35,
      rebufferingGoal: 5,
      bufferBehind: 20,
      retryParameters:{
        maxAttempts: 6,
        baseDelay: 1000,
        backoffFactor: 1.5,
        fuzzFactor: 0.5,
        timeout: 30000
      }
    }
  });

  if(channel.drm){
    shakaPlayer.configure({
      drm:{
        clearKeys:{
          [channel.keyId]: channel.key
        }
      }
    });
  }

  shakaPlayer.addEventListener("error", function(e){
    console.log("MPD ERROR:", e.detail);
    setStatus("MPD เล่นในเว็บนี้ไม่ได้ ให้กด PLAYER สำรอง", false);
  });

  try{
    setStatus("กำลังโหลด MPD ผ่าน workers.dev...");
    await shakaPlayer.load(url);
    forceAudio100();
    video.play().catch(()=>{});
    setTimeout(()=>{ forceAudio100(); video.play().catch(()=>{}); },300);
    setStatus("กำลังเล่น MPD ผ่าน workers.dev");
  }catch(e){
    console.log("MPD LOAD ERROR:", e);
    setStatus("MPD เล่นไม่ได้บนเครื่องนี้ / ให้กด PLAYER", false);
  }
}


function playSingleTsAsHls(tsUrl){
  const video = document.getElementById("html5-player");

  setStatus("กำลังโหลด TS Live Smooth...");

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(mpegTsPlayer){
    try{ mpegTsPlayer.destroy(); }catch(e){}
    mpegTsPlayer = null;
  }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(window.mpegts && mpegts.getFeatureList().mseLivePlayback){
    try{
      mpegTsPlayer = mpegts.createPlayer({
        type: "mpegts",
        isLive: true,
        url: tsUrl,
        cors: true,
        withCredentials: false
      },{
        // TS BUFFER SMOOTH FINAL
        // หน่วงเพิ่มนิด แต่ไหลลื่นกว่าแบบเร็ว
        enableWorker: false,
        enableStashBuffer: true,
        stashInitialSize: 1024 * 1024,

        lazyLoad: false,
        deferLoadAfterSourceOpen: false,

        autoCleanupSourceBuffer: true,
        autoCleanupMaxBackwardDuration: 60,
        autoCleanupMinBackwardDuration: 20,

        liveBufferLatencyChasing: true,
        liveBufferLatencyMaxLatency: 8,
        liveBufferLatencyMinRemain: 2,

        fixAudioTimestampGap: true,
        accurateSeek: false
      });

      mpegTsPlayer.attachMediaElement(video);
      mpegTsPlayer.load();

      const tryPlay = ()=>{
        forceAudio100();
        video.play().then(()=>{
          setStatus("กำลังเล่น TS Live Smooth");
        }).catch(()=>{
          setStatus("กด ▶ บนจอ 1 ครั้ง ถ้าเครื่องบล็อก autoplay", false);
        });
      };

      setTimeout(tryPlay, 600);
      setTimeout(tryPlay, 1800);
      setTimeout(tryPlay, 3500);

      let lastTime = 0;
      let stuck = 0;
      let reloadLock = false;

      hlsWatchdog = setInterval(()=>{
        if(document.getElementById("player-container").style.display !== "block"){
          clearInterval(hlsWatchdog);
          hlsWatchdog = null;
          return;
        }

        forceAudio100();

        // ถ้าหยุดเอง ให้เล่นต่อก่อน ยังไม่รีโหลดทันที
        if(video.paused){
          setStatus("เล่นต่ออัตโนมัติ...");
          video.play().catch(()=>{});
          return;
        }

        if(video.readyState < 2){
          setStatus("กำลังเติมบัฟเฟอร์ TS...");
          return;
        }

        if(Math.abs(video.currentTime - lastTime) < 0.05){
          stuck++;
        }else{
          stuck = 0;
        }

        lastTime = video.currentTime;

        // รอให้นานขึ้นก่อน reload เพื่อลดอาการหมุนถี่
        if(stuck >= 10 && !reloadLock){
          reloadLock = true;
          setStatus("TS ค้างนาน กำลังต่อสัญญาณใหม่...");

          try{
            mpegTsPlayer.pause && mpegTsPlayer.pause();
          }catch(e){}

          try{
            mpegTsPlayer.unload();
          }catch(e){}

          setTimeout(()=>{
            try{
              mpegTsPlayer.load();
              video.play().catch(()=>{});
            }catch(e){}
            stuck = 0;
            reloadLock = false;
          },1200);
        }
      },3000);

      mpegTsPlayer.on(mpegts.Events.ERROR,function(type,detail,info){
        console.log("MPEGTS ERROR",type,detail,info);

        // อย่า reload รัว ให้รอแล้วค่อยต่อใหม่
        setStatus("TS สะดุด กำลังรอสัญญาณกลับมา...");
        setTimeout(()=>{
          try{
            mpegTsPlayer.unload();
            mpegTsPlayer.load();
            video.play().catch(()=>{});
          }catch(e){}
        },1500);
      });

      return;
    }catch(e){
      console.log("MPEGTS INIT ERROR",e);
    }
  }

  setStatus("เครื่องนี้ไม่รองรับ TS Live ในเว็บ ให้กด PLAYER", false);
  openExternal(tsUrl);
}

/* ================= HLS นิ่งๆ ผ่าน workers.dev ================= */
function useHLS_STABLE(url){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");

  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  // DIRECT TS SUPPORT FIX
  // .ts เดี่ยวเล่นตรงใน browser หลายเครื่องไม่ได้
  // จึงแปลงเป็น m3u8 ชั่วคราว แล้วให้ hls.js เล่น
  if(url.toLowerCase().includes(".ts") && !url.toLowerCase().includes(".m3u8")){
    playSingleTsAsHls(url);
    return;
  }

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(Hls.isSupported() && (url.includes(".m3u8") || url.toLowerCase().includes("extension=m3u8"))){
    setStatus("กำลังโหลด HLS ผ่าน workers.dev...");

    currentHls = new Hls({
      // WORKERS SPORT STABLE FINAL
      enableWorker: true,
      lowLatencyMode: false,

      // เพิ่ม buffer ให้นิ่งขึ้น
      maxBufferLength: 120,
      maxMaxBufferLength: 180,
      backBufferLength: 60,

      // ลดภาพหมุน
      maxBufferHole: 2.5,
      highBufferWatchdogPeriod: 5,
      nudgeOffset: 0.3,
      nudgeMaxRetry: 8,

      // retry สูงขึ้น
      manifestLoadingMaxRetry: 10,
      manifestLoadingRetryDelay: 2000,
      manifestLoadingMaxRetryTimeout: 20000,

      levelLoadingMaxRetry: 10,
      levelLoadingRetryDelay: 2000,
      levelLoadingMaxRetryTimeout: 20000,

      fragLoadingMaxRetry: 12,
      fragLoadingRetryDelay: 2000,
      fragLoadingMaxRetryTimeout: 25000,

      startFragPrefetch: true,
      capLevelToPlayerSize: true,
      testBandwidth: false,
      abrEwmaDefaultEstimate: 700000,

      liveSyncDurationCount: 5,
      liveMaxLatencyDurationCount: 12
    });

    currentHls.loadSource(url);
    currentHls.attachMedia(video);

    currentHls.on(Hls.Events.MANIFEST_PARSED, function(){
      forceAudio100();
      video.play().catch(()=>{});
      setTimeout(()=>{ forceAudio100(); video.play().catch(()=>{}); },300);
      setStatus("กำลังเล่น HLS");
    });

    currentHls.on(Hls.Events.BUFFER_STALLED, function(){
      setStatus("กำลังเติมบัฟเฟอร์...", true);
      try{ currentHls.startLoad(); }catch(e){}
    });

    currentHls.on(Hls.Events.ERROR, function(event, data){
      console.log("HLS ERROR:", data);
      if(!currentHls) return;

      if(data.fatal){
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
          setStatus("เน็ตเวิร์กสะดุด กำลังต่อใหม่...");
          try{ currentHls.startLoad(); }catch(e){}
        }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
          setStatus("สัญญาณวิดีโอสะดุด กำลังกู้คืน...");
          try{ currentHls.recoverMediaError(); }catch(e){}
        }else{
          setStatus("โหลดใหม่เพื่อความนิ่ง...", false);
          try{
            currentHls.destroy();
            currentHls = null;
            setTimeout(()=>useHLS_STABLE(url), 1200);
          }catch(e){}
        }
      }
    });

    startWatchdog(url);

  }else{
    video.src = url;
    setTimeout(()=>{
      forceAudio100();
      video.play().catch(()=>{});
    },300);
  }
}

function startWatchdog(url){
  const video = document.getElementById("html5-player");
  let lastTime = 0;
  let stuckCount = 0;

  hlsWatchdog = setInterval(()=>{
    if(document.getElementById("player-container").style.display !== "block") return;
    if(!currentHls) return;

    forceAudio100();

    if(video.paused || video.readyState < 2){
      try{ currentHls.startLoad(); }catch(e){}
      video.play().catch(()=>{});
      return;
    }

    if(Math.abs(video.currentTime - lastTime) < 0.05){
      stuckCount++;
    }else{
      stuckCount = 0;
    }

    lastTime = video.currentTime;

    if(stuckCount >= 7){
      setStatus("ภาพค้าง กำลังกู้คืน...");
      try{ currentHls.startLoad(); }catch(e){}
      video.play().catch(()=>{});
      stuckCount = 0;
    }
  }, 4000);
}

function restartCurrent(){
  if(activeChannel) loadChannel(activeChannel, activeElement);
}


/* ================= AUTO HIDE PLAYER CONTROLS ================= */
let controlsTimer = null;

function showPlayerControls(){
  const container = document.getElementById("player-container");
  if(!container) return;

  container.classList.remove("controls-hidden");

  if(controlsTimer){
    clearTimeout(controlsTimer);
    controlsTimer = null;
  }

  controlsTimer = setTimeout(()=>{
    if(container.style.display === "block"){
      try{
        const active = document.activeElement;
        if(active && active.classList && active.classList.contains("player-btn")){
          active.blur();
        }
      }catch(e){}
      container.classList.add("controls-hidden");
    }
  }, 3000);
}

function setupAutoHideControls(){
  const container = document.getElementById("player-container");
  if(!container || container.dataset.autohideReady === "1") return;
  container.dataset.autohideReady = "1";

  ["mousemove","mousedown","touchstart","touchmove","click"].forEach(ev=>{
    container.addEventListener(ev, showPlayerControls, {passive:true});
  });

  document.addEventListener("keydown", function(){
    if(container.style.display === "block"){
      showPlayerControls();
    }
  });
}

/* ================= CLOSE ================= */
async function closePlayer(){
  await stopAllPlayers();
  document.getElementById("player-container").classList.remove("controls-hidden");
  document.getElementById("player-container").style.display = "none";
}

function goHome(){
  window.location.href = "https://tiea9999.github.io/tv/index.html";
}

/* ================= REMOTE ================= */
document.addEventListener("keydown",function(e){
  const container = document.getElementById("player-container");

  if(container.style.display === "block"){
    if(e.key === "Escape" || e.key === "Backspace" || e.key === "BrowserBack"){
      e.preventDefault();
      closePlayer();
    }
  }
});

/* ================= INIT ================= */
document.addEventListener("DOMContentLoaded",function(){
  setupAutoHideControls();
  const listContainer = document.getElementById("channel-list");

  channels.forEach(ch=>{
    const div = document.createElement("div");
    div.className = "channel";
    div.tabIndex = 0;
    div.innerHTML = `<img src="${ch.logo}"><span>${ch.name}</span>`;

    div.onclick = ()=>loadChannel(ch,div);

    div.onkeydown = e=>{
      if(e.key === "Enter" || e.key === "OK"){
        e.preventDefault();
        loadChannel(ch,div);
      }
    };

    listContainer.appendChild(div);
  });
});
    </script>
