function extractPlayable(txt,base){txt=String(txt||'');const abs=txt.match(/https?:[^'"\s<>]+\.m3u8[^'"\s<>]*/i);if(abs)return abs[0].replace(/\\\//g,'/');const file=txt.match(/["']([^"']+\.m3u8[^"']*)["']/i);if(file){try{return new URL(file[1].replace(/\\\//g,'/'),base).toString()}catch(e){return file[1]}}return''}
function playNativeVideo(url){video.style.display='block';frame.style.display='none';video.muted=false;video.volume=1;return new Promise((resolve,reject)=>{let done=false;const ok=()=>{if(done)return;done=true;clear();video.muted=false;video.play().then(resolve).catch(resolve)};const fail=()=>{if(done)return;done=true;clear();reject('video error')};const clear=()=>{video.removeEventListener('loadedmetadata',ok);video.removeEventListener('canplay',ok);video.removeEventListener('playing',ok);video.removeEventListener('error',fail)};video.addEventListener('loadedmetadata',ok,{once:true});video.addEventListener('canplay',ok,{once:true});video.addEventListener('playing',ok,{once:true});video.addEventListener('error',fail,{once:true});video.src=url;video.load();setTimeout(()=>{if(!done)fail()},16000)})}
function playHlsMain(url,referer){const source=proxyUrl(url,referer||getAutoReferer(url));video.style.display='block';frame.style.display='none';video.muted=false;video.volume=1;return new Promise((resolve,reject)=>{let settled=false;const ok=()=>{if(settled)return;settled=true;clear();video.muted=false;video.play().then(resolve).catch(resolve)};const fail=()=>{if(settled)return;settled=true;clear();reject('hls error')};const clear=()=>{video.removeEventListener('loadedmetadata',ok);video.removeEventListener('canplay',ok);video.removeEventListener('playing',ok);video.removeEventListener('error',fail);if(hls){hls.off(Hls.Events.MANIFEST_PARSED,ok);hls.off(Hls.Events.LEVEL_LOADED,ok);hls.off(Hls.Events.ERROR,onErr)}};const onErr=(ev,data)=>{if(data&&data.fatal){if(data.type===Hls.ErrorTypes.NETWORK_ERROR){try{hls.startLoad()}catch(e){}}else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError()}catch(e){}}else fail()}};video.addEventListener('loadedmetadata',ok,{once:true});video.addEventListener('canplay',ok,{once:true});video.addEventListener('playing',ok,{once:true});video.addEventListener('error',fail,{once:true});if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:false,lowLatencyMode:false,maxBufferLength:45,maxMaxBufferLength:60,backBufferLength:20,manifestLoadingTimeOut:20000,fragLoadingTimeOut:25000,levelLoadingTimeOut:20000,manifestLoadingMaxRetry:6,fragLoadingMaxRetry:8,levelLoadingMaxRetry:6});hls.on(Hls.Events.MANIFEST_PARSED,ok);hls.on(Hls.Events.LEVEL_LOADED,ok);hls.on(Hls.Events.ERROR,onErr);hls.loadSource(source);hls.attachMedia(video)}else{video.src=source;video.load()}setTimeout(()=>{if(!settled)fail()},20000)})}
function openSystemPlayer(){const item=currentList[currentIndex];const url=(item&&item.url)||currentUrl;if(!url)return;try{const u=new URL(url);let intent='intent://'+u.host+u.pathname+(u.search||'')+'#Intent;scheme='+u.protocol.replace(':','')+';action=android.intent.action.VIEW;type=video/*;S.browser_fallback_url='+encodeURIComponent(url)+';end';window.location.href=intent}catch(e){window.open(url,'_blank')}}
function openExternal(){const item=currentList[currentIndex];const url=(item&&item.url)||currentUrl;if(!url)return;try{const u=new URL(url);let intent='intent://'+u.host+u.pathname+(u.search||'')+'#Intent;scheme='+u.protocol.replace(':','')+';action=android.intent.action.VIEW;type=video/*;package=com.mxtech.videoplayer.ad;S.browser_fallback_url='+encodeURIComponent(url)+';end';window.location.href=intent}catch(e){window.open(url,'_blank')}}
async function copyCurrentLink(){const item=currentList[currentIndex];const url=(item&&item.url)||currentUrl;if(!url)return;try{await navigator.clipboard.writeText(url);alert('คัดลอกลิงก์ Main แล้ว')}catch(e){prompt('คัดลอกลิงก์ Main',url)}}
function backToListOrGrid(){if(allView.active)renderAllPage();else backToGrid()}
function backToGrid(){overlay.style.display='none';overlay.innerHTML='';grid.style.display='block';allView={active:false,name:'',page:1};setTimeout(()=>lastFocus?.focus?.(),100)}
function goHome(){cleanupPlayers();player.style.display='none';overlay.style.display='none';overlay.innerHTML='';grid.style.display='block';currentList=[];currentIndex=0;window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>lastFocus?.focus?.(),100)}
function seekVideoBy(sec){
  try{
    if(!video || video.style.display==='none')return;
    const cur=Number(video.currentTime||0);
    const dur=Number(video.duration||0);
    let next=cur+sec;
    if(Number.isFinite(dur)&&dur>0) next=Math.max(0,Math.min(dur,next));
    else next=Math.max(0,next);
    video.currentTime=next;
    showPlayerUI();
  }catch(e){}
}
document.getElementById('homeBtn').onclick=()=>{cleanupPlayers();window.location.href='https://tiea9999.github.io/tv/index.html'};
function isPlayerTopFocused(){try{return !!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.topBtns'))}catch(e){return false}}
function focusPlayerClose(){showPlayerUI(true);setTimeout(()=>{const b=document.getElementById('closeTopBtn')||document.querySelector('#player .btn.red');if(b)b.focus()},30)}
document.addEventListener('keydown',e=>{const key=e.key;if(player.style.display==='block')showPlayerUI();
if(player.style.display==='block'){
  if(key==='ArrowUp'||e.keyCode===19){e.preventDefault();focusPlayerClose();return}
  if((key==='ArrowDown'||e.keyCode===20)&&isPlayerTopFocused()){e.preventDefault();video.focus();showPlayerUI();return}
  if(video.style.display!=='none'){
    if(key==='ArrowRight'||key==='MediaFastForward'||e.keyCode===22){e.preventDefault(); if(isPlayerTopFocused()) moveFocus('right'); else seekVideoBy(15); return}
    if(key==='ArrowLeft'||key==='MediaRewind'||e.keyCode===21){e.preventDefault(); if(isPlayerTopFocused()) moveFocus('left'); else seekVideoBy(-15); return}
  }
}
if(key==='ArrowRight'||e.keyCode===22){e.preventDefault();moveFocus('right');return}if(key==='ArrowLeft'||e.keyCode===21){e.preventDefault();moveFocus('left');return}if(key==='ArrowDown'||e.keyCode===20){e.preventDefault();moveFocus('down');return}if(key==='ArrowUp'||e.keyCode===19){e.preventDefault();moveFocus('up');return}if(key==='Escape'||key==='Backspace'||key==='GoBack'||e.keyCode===10009){e.preventDefault();if(player.style.display==='block'){goHome();return}if(overlay.style.display==='block'){backToListOrGrid();return}}if((key==='Enter'||key==='OK'||e.keyCode===23||e.keyCode===66)&&document.activeElement&&typeof document.activeElement.click==='function'){e.preventDefault();document.activeElement.click()}});

let uiTimer=null;
function showPlayerUI(forceFocus){
  player.classList.remove('playerUIHidden');
  clearTimeout(uiTimer);
  if(forceFocus) return;
  uiTimer=setTimeout(()=>{
    if(player.style.display==='block'){
      try{ if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.topBtns')) return; }catch(e){}
      player.classList.add('playerUIHidden');
    }
  },3500);
}
['mousemove','mousedown','touchstart','touchmove','pointermove','click'].forEach(ev=>player.addEventListener(ev,showPlayerUI,{passive:true}));
function visibleFocusables(){return Array.from(document.querySelectorAll('button,.card,.ep-card')).filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=='hidden'&&getComputedStyle(el).display!=='none'})}
function moveFocus(dir){
  const els=visibleFocusables(); if(!els.length)return;
  const cur=document.activeElement&&els.includes(document.activeElement)?document.activeElement:els[0];
  const r=cur.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let best=null,score=1e9;
  for(const el of els){if(el===cur)continue;const b=el.getBoundingClientRect();const x=b.left+b.width/2,y=b.top+b.height/2;const dx=x-cx,dy=y-cy;
    if(dir==='right'&&dx<=8)continue; if(dir==='left'&&dx>=-8)continue; if(dir==='down'&&dy<=8)continue; if(dir==='up'&&dy>=-8)continue;
    const primary=(dir==='right'||dir==='left')?Math.abs(dx):Math.abs(dy); const secondary=(dir==='right'||dir==='left')?Math.abs(dy):Math.abs(dx);
    const s=primary*10+secondary; if(s<score){score=s;best=el;}
  }
  if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'});}
}
