    <script>
        const JSON_URLS=[
  {name:"supjav 18+",url:"https://raw.githubusercontent.com/tiea9999/tv/refs/heads/main/supjav.json"},
  {name:"pornxxx",url:"https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/pornxxx.json"},
  {name:"avpung18+",url:"https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/playlist_avpung.json"},
  {name:"jav24 18+",url:"https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/playlist_jav24.json"}
];
const FALLBACK_LOGO="https://dl.dropboxusercontent.com/scl/fi/k77ovxc35qm0girjo43mt/logo.png?rlkey=1x7w8nk1fl6gptnt9jiaugt54";

const app=document.getElementById("app");
const player=document.getElementById("player");
const loadStatus=document.getElementById("load-status");

let hls=null,shakaPlayer=null,currentChannel=null,currentServerIndex=0,currentElement=null;
let ROW_STORE={};
let OVERLAY_PAGE=1;
let OVERLAY_KEY='';

function clean(v){return String(v||"").trim()}
function pick(o,keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&clean(o[k])!=="")return o[k]}return ""}
function setStatus(t){
  t=String(t||"");
  if(t.includes("กำลังเล่น")){
    t="";
  }
  const el=document.getElementById("status");
  if(el)el.textContent=t;
  const box=document.getElementById("player-container");
  if(box){
    if(t){
      box.classList.add("show-status");
      setTimeout(()=>box.classList.remove("show-status"),1800);
    }else{
      box.classList.remove("show-status");
    }
  }
}
function isJsonUrl(u){u=clean(u).toLowerCase();return u.includes(".json")}
function isM3U8Url(u){u=clean(u).toLowerCase();return u.includes(".m3u8")||u.includes("extension=m3u8")||u.includes("type=m3u8")}

function normalize(item,parentGroup=""){
  let servers=[];

  if(Array.isArray(item.servers)&&item.servers.length){
    item.servers.forEach(s=>{
      const url=clean(pick(s,["url","file","stream","link","source","src"]));
      if(url&&!isJsonUrl(url)){
        servers.push({
          name:pick(s,["name","title","label"])||("Server "+(servers.length+1)),
          url,
          drm:!!s.drm||!!(pick(s,["keyId","kid","key_id"])&&pick(s,["key","clearkey"])),
          keyId:pick(s,["keyId","kid","key_id"])||"",
          key:pick(s,["key","clearkey"])||""
        });
      }
    });
  }else{
    const url=clean(pick(item,["url","file","stream","link","source","src"]));
    if(url&&!isJsonUrl(url)){
      servers.push({
        name:"Main",
        url,
        drm:!!item.drm||!!(pick(item,["keyId","kid","key_id"])&&pick(item,["key","clearkey"])),
        keyId:pick(item,["keyId","kid","key_id"])||"",
        key:pick(item,["key","clearkey"])||""
      });
    }
  }

  if(!servers.length)return null;

  return{
    title:pick(item,["title","name","channel","label"])||"ไม่มีชื่อ",
    logo:pick(item,["logo","poster","image","thumb","cover","icon"])||FALLBACK_LOGO,
    group:pick(item,["group","group-title","category"])||parentGroup||"อื่นๆ",
    servers
  };
}

function collect(data,parentGroup="",out=[]){
  if(Array.isArray(data)){data.forEach(x=>collect(x,parentGroup,out));return out}
  if(!data||typeof data!=="object")return out;

  const title=pick(data,["group","category","title","name"])||parentGroup;

  const one=normalize(data,parentGroup);
  if(one)out.push(one);

  ["items","channels","data","list","rows","episodes","videos"].forEach(k=>{
    if(Array.isArray(data[k]))data[k].forEach(x=>collect(x,title,out));
  });
  return out;
}

function renderFromJson(json, label){
  app.innerHTML="";
  let channels=collect(json);

  const seen=new Set();
  channels=channels.filter(ch=>{
    const key=(ch.title+"|"+ch.servers.map(s=>s.url).join("|")).toLowerCase();
    if(seen.has(key))return false;
    seen.add(key);
    return true;
  });

  if(!channels.length){
    loadStatus.innerHTML="โหลดได้ แต่ไม่พบช่องใน JSON<br>ลองตรวจชื่อ field: title/logo/group/servers/url";
    app.innerHTML='<div class="empty">ไม่พบรายการ</div>';
    return;
  }

  loadStatus.textContent="โหลดสำเร็จ "+channels.length+" รายการ จาก "+label;
  render(channels);
}

async function fetchWithTimeout(url, ms){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  try{
    const res=await fetch(url+"?t="+Date.now(),{cache:"no-store",signal:controller.signal});
    clearTimeout(timer);
    return res;
  }catch(e){
    clearTimeout(timer);
    throw e;
  }
}

async function loadDefaultJson(){
  app.innerHTML="";
  ROW_STORE={};
  loadStatus.textContent="กำลังโหลด JSON...";

  let success=0;
  let total=0;

  for(const src of JSON_URLS){
    const name=typeof src==="string" ? src : src.name;
    const url=typeof src==="string" ? src : src.url;

    try{
      loadStatus.textContent="กำลังโหลด: "+name;

      const res=await fetchWithTimeout(url,12000);
      if(!res.ok) throw new Error("HTTP "+res.status);

      const json=await res.json();

      let raw=[];
      if(Array.isArray(json)) raw=json;
      else if(Array.isArray(json.data)) raw=json.data;
      else if(Array.isArray(json.items)) raw=json.items;

      const channels=collect(raw,name);

      const seen=new Set();
      const cleanList=channels.filter(ch=>{
        const key=(ch.title+"|"+ch.servers.map(s=>s.url).join("|")).toLowerCase();
        if(seen.has(key))return false;
        seen.add(key);
        return true;
      });

      if(cleanList.length){
        ROW_STORE[name]=cleanList;
        renderJsonRow(name,cleanList);
        total+=cleanList.length;
        success++;
      }

    }catch(e){
      console.warn("โหลดไม่ได้:",name,url,e);
      ROW_STORE[name]=[];
      renderJsonRow(name,[]);
    }
  }

  if(!total){
    loadStatus.innerHTML="โหลด JSON ไม่สำเร็จ";
    app.innerHTML='<div class="empty">ยังไม่มีรายการ</div>';
    return;
  }

  loadStatus.innerHTML="โหลดสำเร็จ "+total+" รายการ จาก "+success+" JSON";
}


function displayCategoryName(name){
  name=String(name||"").trim();

  const map={
    "movie24hd.json":"🎬 หนัง 24HD",
    "myseries-china.json":"🇨🇳 ซีรี่ย์จีน",
    "myseries-korea.json":"🇰🇷 ซีรี่ย์เกาหลี",
    "myseries-thai.json":"🇹🇭 ซีรี่ย์ไทย",
    "myseries-japan.json":"🇯🇵 ซีรี่ย์ญี่ปุ่น",
    "myseries-short.json":"🎞️ ซีรี่ย์สั้น",
    "myseries-series.json":"🔥 ซีรี่ย์อัพเดทใหม่"
  };

  for(const k in map){
    if(name.includes(k)) return map[k];
  }

  return name;
}

function renderJsonRow(name,items){
  const rowKey="jsonrow_"+safeKey(name);
  const wrap=document.createElement("div");
  wrap.className="json-section";
  wrap.innerHTML=
    '<div class="group-title" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">'+
      '<span>'+displayCategoryName(name)+'</span>'+
      '<button class="tool-btn" onclick="showAllJsonRow(\''+escapeJs(name)+'\')">ดูทั้งหมด</button>'+
    '</div>'+
    '<div class="channel-row" id="'+rowKey+'"></div>';

  app.appendChild(wrap);

  const row=document.getElementById(rowKey);

  if(!items.length){
    row.innerHTML='<div class="empty">ไม่มีข้อมูล</div>';
    return;
  }

  items.slice(0,20).forEach(ch=>{
    row.appendChild(createChannelCard(ch));
  });
}

function createChannelCard(ch){
  const div=document.createElement("div");
  div.className="channel";
  div.tabIndex=0;
  div.innerHTML='<img src="'+(ch.logo||FALLBACK_LOGO)+'" onerror="this.src=\''+FALLBACK_LOGO+'\'"><div>'+ch.title+'</div>';
  div.onclick=()=>playChannel(ch,div);
  div.onkeydown=e=>{
    if(e.key==="Enter"||e.key==="OK"||e.key===" "){
      e.preventDefault();
      playChannel(ch,div);
    }
  };
  return div;
}

function safeKey(v){
  return String(v||"").replace(/[^\wก-๙-]/g,"_");
}

function escapeJs(v){
  return String(v||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

function showAllJsonRow(name){
  OVERLAY_KEY=name;
  OVERLAY_PAGE=1;
  renderAllJsonPage();
}

function renderAllJsonPage(){
  const items=ROW_STORE[OVERLAY_KEY]||[];
  const perPage=20;
  const total=items.length;
  const pages=Math.max(1,Math.ceil(total/perPage));
  OVERLAY_PAGE=Math.max(1,Math.min(OVERLAY_PAGE,pages));
  const start=(OVERLAY_PAGE-1)*perPage;
  const pageItems=items.slice(start,start+perPage);

  app.innerHTML=
    '<div style="padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">'+
      '<h2 style="padding:0;margin:0;color:orange;">'+displayCategoryName(OVERLAY_KEY)+'</h2>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
        '<button class="tool-btn" onclick="prevAllJsonPage()">◀ ก่อนหน้า</button>'+
        '<button class="tool-btn" onclick="nextAllJsonPage()">ถัดไป ▶</button>'+
        '<button class="tool-btn" onclick="loadDefaultJson()">← กลับ</button>'+
      '</div>'+
    '</div>'+
    '<div id="load-status" style="display:block!important;visibility:visible!important;height:auto!important;margin:8px 10px!important;padding:0!important;color:#9ff;">หน้า '+OVERLAY_PAGE+' / '+pages+' • ทั้งหมด '+total+' รายการ</div>'+
    '<div class="channel-row" id="allJsonBox"></div>';

  const box=document.getElementById("allJsonBox");
  pageItems.forEach(ch=>box.appendChild(createChannelCard(ch)));
  setTimeout(()=>box.querySelector(".channel")?.focus(),150);
}

function nextAllJsonPage(){
  const total=(ROW_STORE[OVERLAY_KEY]||[]).length;
  const pages=Math.max(1,Math.ceil(total/20));
  if(OVERLAY_PAGE<pages){
    OVERLAY_PAGE++;
    renderAllJsonPage();
  }
}

function prevAllJsonPage(){
  if(OVERLAY_PAGE>1){
    OVERLAY_PAGE--;
    renderAllJsonPage();
  }
}

function render(channels){
  const groups={};
  channels.forEach(ch=>{
    if(!groups[ch.group])groups[ch.group]=[];
    groups[ch.group].push(ch);
  });

  Object.keys(groups).forEach(group=>{
    const title=document.createElement("div");
    title.className="group-title";
    title.textContent=group;
    app.appendChild(title);

    const row=document.createElement("div");
    row.className="channel-row";

    groups[group].forEach(ch=>{
      const div=document.createElement("div");
      div.className="channel";
      div.tabIndex=0;
      div.innerHTML='<img src="'+ch.logo+'" onerror="this.src=\''+FALLBACK_LOGO+'\'"><div>'+ch.title+'</div>';
      div.onclick=()=>playChannel(ch,div);
      div.onkeydown=e=>{
        if(e.key==="Enter"||e.key==="OK"||e.key===" "){
          e.preventDefault();
          playChannel(ch,div);
        }
      };
      row.appendChild(div);
    });
    app.appendChild(row);
  });

  setTimeout(()=>document.querySelector(".channel")?.focus(),200);
}

async function stopPlayers(){
  try{if(hls){hls.destroy();hls=null}}catch(e){}
  try{if(shakaPlayer){await shakaPlayer.destroy();shakaPlayer=null}}catch(e){}
  try{player.pause();player.removeAttribute("src");player.load()}catch(e){}
}

async function playChannel(ch,el){
  currentChannel=ch;
  currentElement=el;
  currentServerIndex=0;
  document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));
  if(el)el.classList.add("active");
  document.getElementById("player-container").style.display="block";
  showPlayerUI(false);
  setTimeout(()=>document.getElementById("closeBtn")?.focus(),200);
  await tryServer();
}

async function tryServer(){
  if(!currentChannel)return;
  if(currentServerIndex>=currentChannel.servers.length){
    setStatus("ทุก Server เล่นไม่ได้");
    return;
  }
  await stopPlayers();
  const s=currentChannel.servers[currentServerIndex];
  setStatus("กำลังลอง "+(s.name||("Server "+(currentServerIndex+1)))+"...");
  if(s.url.toLowerCase().includes(".mpd"))playMPD(s);
  else playHLS(s);
}

function nextServer(){
  currentServerIndex++;
  setTimeout(tryServer,2500);
}

function forceMaxVolume(){
  try{
    player.defaultMuted=false;
    player.muted=false;
    player.volume=1.0;
  }catch(e){}
}

function playMPD(s){
  try{
    if(!window.shaka){nextServer();return}
    shaka.polyfill.installAll();
    shakaPlayer=new shaka.Player(player);
    shakaPlayer.configure({streaming:{retryParameters:{maxAttempts:2,timeout:9000}}});
    if(s.drm&&s.keyId&&s.key){
      shakaPlayer.configure({drm:{clearKeys:{[s.keyId]:s.key}}});
    }
    shakaPlayer.load(s.url).then(()=>{
      forceMaxVolume();
      player.play().catch(()=>{});
      setStatus("");
    }).catch(()=>nextServer());
  }catch(e){nextServer()}
}

function playHLS(s){
  const url=s.url;
  let started=false;

  if(window.Hls&&Hls.isSupported()&&isM3U8Url(url)){
    hls=new Hls({
      // TIEA SPORT TV SAFE FINAL
      // ลดอาการเด้งออก-กลับซ้ำ ไม่รีโหลดถี่เกิน
      enableWorker:false,
      lowLatencyMode:false,

      maxBufferLength:(navigator.userAgent.toLowerCase().includes('android tv')?28:18),
      maxMaxBufferLength:(navigator.userAgent.toLowerCase().includes('android tv')?42:26),
      backBufferLength:8,

      maxBufferHole:3,
      highBufferWatchdogPeriod:4,
      nudgeOffset:0.35,
      nudgeMaxRetry:10,

      manifestLoadingTimeOut:25000,
      levelLoadingTimeOut:25000,
      fragLoadingTimeOut:45000,

      manifestLoadingMaxRetry:10,
      levelLoadingMaxRetry:10,
      fragLoadingMaxRetry:14,

      manifestLoadingRetryDelay:2000,
      levelLoadingRetryDelay:2000,
      fragLoadingRetryDelay:3000,

      startFragPrefetch:true,
      startLevel:-1,
      capLevelToPlayerSize:true,
      testBandwidth:false,
      autoStartLoad:true,
      maxLiveSyncPlaybackRate:1,
      liveDurationInfinity:false,

      abrEwmaDefaultEstimate:450000,
      abrBandWidthFactor:0.9,
      abrBandWidthUpFactor:0.7,

      liveSyncDurationCount:(navigator.userAgent.toLowerCase().includes('android tv')?3:3),
      liveMaxLatencyDurationCount:(navigator.userAgent.toLowerCase().includes('android tv')?6:5),

      progressive:true,
      liveDurationInfinity:true
    });

    hls.loadSource(url);
    hls.attachMedia(player);

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      started=true;
      forceMaxVolume();
      player.play().catch(()=>{});
      setStatus("");
    });
    player.addEventListener('stalled',()=>{
      try{
        setStatus("สัญญาณสะดุด กำลังกู้คืน...");
        if(hls) hls.startLoad();
        player.play().catch(()=>{});
      }catch(e){}
    });

    player.addEventListener('waiting',()=>{
      try{
        if(player.readyState>=2){
          player.play().catch(()=>{});
        }
      }catch(e){}
    });


    hls.on(Hls.Events.ERROR,(ev,data)=>{
      if(!data || !hls) return;

      // ไม่จัดการ non-fatal บ่อย เพราะทำให้เด้ง/กระตุก
      if(!data.fatal) return;

      if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
        setStatus("เน็ตสะดุด กำลังต่อเส้นเดิม...");
        try{
          hls.startLoad();
          if(player.readyState>=2) player.play().catch(()=>{});
        }catch(e){}
        return;
      }

      if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
        setStatus("วิดีโอสะดุด กำลังกู้คืน...");
        try{
          hls.recoverMediaError();
          if(player.readyState>=2) player.play().catch(()=>{});
        }catch(e){}
        return;
      }

      // error อื่นค่อยไป backup
      nextServer();
    });

    let lastTime=0;
    let stuck=0;
    let noData=0;
    let recovering=false;

    const watchdog=setInterval(()=>{
      const box=document.getElementById("player-container");
      if(box.style.display!=="block"){
        clearInterval(watchdog);
        return;
      }

      forceMaxVolume();

      // อย่ากด play ซ้ำถ้ายังไม่มี buffer
      if(player.paused && player.readyState>=2){
        player.play().catch(()=>{});
      }

      if(player.readyState<2){
        noData++;
      }else{
        noData=0;
      }

      if(Math.abs((player.currentTime||0)-lastTime)<0.05){
        stuck++;
      }else{
        stuck=0;
      }

      lastTime=player.currentTime||0;

      // AUTO RECOVER FOR ANDROID TV / PROJECTOR
      if((stuck>=6 || noData>=6) && !recovering){
        recovering=true;

        setStatus("สัญญาณค้าง กำลังกู้คืน...");

        try{
          if(hls){
            hls.stopLoad();

            setTimeout(()=>{
              try{
                hls.startLoad(Math.max(0,(player.currentTime||0)-1));

                if(player.readyState>=2){
                  player.play().catch(()=>{});
                }
              }catch(err){}
            },1200);
          }

          if(player.readyState>=2){
            player.play().catch(()=>{});
          }
        }catch(e){}

        if(stuck>=12 || noData>=12){
          try{
            setStatus("รีโหลดสตรีมอัตโนมัติ...");
            const currentUrl = activeUrl();

            if(currentUrl && hls){
              hls.loadSource(currentUrl);
              hls.attachMedia(player);

              setTimeout(()=>{
                try{
                  player.play().catch(()=>{});
                }catch(err){}
              },1500);
            }
          }catch(err){}
        }

        setTimeout(()=>{
          recovering=false;
          stuck=0;
          noData=0;
        },6000);
      }
    },5000);
    setTimeout(()=>{
      if(!started||player.readyState<2){
        setStatus("ยังโหลดอยู่ กำลังรอเส้นหลักอีกนิด...");
        try{ if(hls) hls.startLoad(); }catch(e){}
      }
    },30000);

  }else{
    player.src=url;
    forceMaxVolume();
    player.play().then(()=>{
      setStatus("");
    }).catch(()=>nextServer());
  }
}

function closePlayer(){
  stopPlayers();
  document.getElementById("player-container").style.display="none";
  setTimeout(()=>currentElement?.focus(),150);
}
function reloadPlayer(){if(currentChannel){currentServerIndex=0;tryServer()}}
function goHome(){window.location.href="index.html"}
function activeUrl(){
  if(!currentChannel||!currentChannel.servers[currentServerIndex])return "";
  return currentChannel.servers[currentServerIndex].url;
}

function isProjectorOrTV(){
  const ua=navigator.userAgent.toLowerCase();
  return (
    ua.includes("smart-tv")||
    ua.includes("smarttv")||
    ua.includes("tizen")||
    ua.includes("webos")||
    ua.includes("netcast")||
    ua.includes("android tv")||
    ua.includes("aft")||
    ua.includes("projector")||
    ua.includes("xgimi")||
    ua.includes("mibox")||
    ua.includes("bravia")||
    ua.includes("chromecast")
  );
}

function openDirectSafe(url){
  if(!url)return;
  window.location.href=url;
}

function openIntentPlayer(url,useMX){
  if(!url)return;

  if(isProjectorOrTV()){
    openDirectSafe(url);
    return;
  }

  try{
    const u=new URL(url);
    const scheme=u.protocol.replace(":","");
    const hostPath=u.host+u.pathname+(u.search||"");
    let intent="intent://"+hostPath+"#Intent;scheme="+scheme+";action=android.intent.action.VIEW;type=video/*";
    if(useMX){
      intent+=";package=com.mxtech.videoplayer.ad";
    }
    intent+=";S.browser_fallback_url="+encodeURIComponent(url)+";end";
    window.location.href=intent;
  }catch(e){
    openDirectSafe(url);
  }
}

function openExternal(){
  const url=activeUrl();
  if(!url)return;
  openIntentPlayer(url,false);
}

function openMX(){
  const url=activeUrl();
  if(!url)return;
  openIntentPlayer(url,true);
}

document.addEventListener("keydown",e=>{
  const box=document.getElementById("player-container");
  if(box.style.display==="block"&&(e.key==="Escape"||e.key==="Backspace"||e.key==="BrowserBack"||e.keyCode===10009)){
    e.preventDefault();
    closePlayer();
  }
});

document.getElementById("jsonFile").addEventListener("change",async e=>{
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  try{
    loadStatus.textContent="กำลังอ่านไฟล์ "+file.name+"...";
    const txt=await file.text();
    const json=JSON.parse(txt);
    renderFromJson(json,file.name);
  }catch(err){
    loadStatus.textContent="อ่าน JSON ไม่สำเร็จ: "+(err.message||err);
  }
});


let uiTimer=null;

function showPlayerUI(showStatus=false){
  const box=document.getElementById("player-container");
  if(!box)return;

  box.classList.add("show-ui");
  box.classList.remove("hide-ui");

  if(showStatus){
    box.classList.add("show-status");
  }else{
    box.classList.remove("show-status");
  }

  if(uiTimer) clearTimeout(uiTimer);

  uiTimer=setTimeout(()=>{
    if(box.style.display==="block"){
      box.classList.remove("show-ui");
      box.classList.remove("show-status");
      box.classList.add("hide-ui");
    }
  },3000);
}

function setupAutoHideUI(){
  const box=document.getElementById("player-container");

  [
    "mousemove",
    "mousedown",
    "touchstart",
    "touchmove",
    "pointermove",
    "pointerdown",
    "click"
  ].forEach(ev=>{
    box.addEventListener(ev,showPlayerUI,{passive:true});
  });

  document.addEventListener("keydown",()=>{
    if(box.style.display==="block"){
      showPlayerUI(false);
    }
  });
}


// SEEK REMOTE ANDROID TV
document.addEventListener("keydown",e=>{
  const box=document.getElementById("player-container");

  if(box.style.display!=="block") return;

  const k=e.key||"";
  const c=e.keyCode||0;

  // LEFT = -15s
  if(
    k==="ArrowLeft" ||
    k==="MediaRewind" ||
    c===21
  ){
    e.preventDefault();

    try{
      player.currentTime=Math.max(0,(player.currentTime||0)-15);
      setStatus("⏪ ย้อนกลับ 15 วิ");
      showPlayerUI(false);
    }catch(err){}
  }

  // RIGHT = +15s
  if(
    k==="ArrowRight" ||
    k==="MediaFastForward" ||
    c===22
  ){
    e.preventDefault();

    try{
      player.currentTime=(player.currentTime||0)+15;
      setStatus("⏩ เดินหน้า 15 วิ");
      showPlayerUI(false);
    }catch(err){}
  }

  // PLAY/PAUSE
  if(
    k==="MediaPlayPause" ||
    c===179
  ){
    e.preventDefault();

    try{
      if(player.paused){
        player.play().catch(()=>{});
        setStatus("▶ เล่น");
      }else{
        player.pause();
        setStatus("⏸ หยุด");
      }

      showPlayerUI(false);
    }catch(err){}
  }
});


document.addEventListener("DOMContentLoaded",()=>{setupAutoHideUI();loadDefaultJson();});
