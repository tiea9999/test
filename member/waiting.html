
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>รออนุมัติ VIP</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#050505;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:440px;background:#111;border:1px solid #333;border-radius:20px;padding:24px;box-shadow:0 0 35px rgba(0,200,255,.13)}
.logo{text-align:center;font-size:28px;font-weight:900;color:#00e5ff;margin-bottom:8px}
.sub{text-align:center;color:#bbb;line-height:1.5;margin-bottom:18px}
button{width:100%;display:block;text-align:center;margin-top:14px;padding:14px;border-radius:999px;border:0;background:linear-gradient(90deg,#00c6ff,#0072ff);color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.secondary{background:#222!important;border:1px solid #444}
.msg{margin-top:14px;text-align:center;color:#ffcc66;white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">รออนุมัติ VIP</div>
  <div class="sub">สมัครเรียบร้อยแล้ว<br>กรุณารอแอดมินเปิด VIP</div>
  <button onclick="checkAgain()">ตรวจสอบอีกครั้ง</button>
  <button class="secondary" onclick="logout()">ออกจากระบบ</button>
  <div id="msg" class="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const msg = document.getElementById("msg");
let currentUser = null;

onAuthStateChanged(auth, user => {
  if (!user) {
    location.replace("login.html");
    return;
  }
  currentUser = user;
});

window.checkAgain = async () => {
  if (!currentUser) {
    msg.textContent = "กรุณารอเข้าสู่ระบบ";
    return;
  }

  msg.textContent = "กำลังตรวจสอบ...";

  try {
    const snap = await getDoc(doc(db, "members", currentUser.uid));

    if (snap.exists()) {
      const d = snap.data();

      if (d.role === "admin" || (d.vip === true && d.active === true)) {
        location.replace("../index.html");
        return;
      }
    }

    msg.textContent = "ยังไม่ได้รับอนุมัติ VIP";
  } catch (error) {
    console.error(error);
    msg.textContent = "ตรวจสอบไม่สำเร็จ กรุณาลองใหม่";
  }
};

window.logout = async () => {
  await signOut(auth);
  location.replace("login.html");
};
</script>
</body>
</html>
