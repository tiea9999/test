  memoryRefreshMs: 11*60*1000,
  predictiveFirstMs: 33*60*1000,
  predictiveRepeatMs: 4*60*1000,
  maxRuntimeBeforeResetMs: 55*60*1000,
  longSpinnerMs: 6500,
  guardianEveryMs: 7000
};

const AI_PROFILE={
  softRefreshMs:6*60*1000,
  minSoftRefreshGap:75*1000,
  healthEveryMs:5000,
  lowBufferLimit:3,
  stallLimit:3,
  spinnerRecoverMs:6500,

let playSeq = 0;

function isCurrentSeq(seq){ return seq === playSeq; }
function clearAutoRetry(){

function clearAIEngine(){
  if(aiSoftRefreshTimer){clearTimeout(aiSoftRefreshTimer);aiSoftRefreshTimer=null}

function getBufferedAhead(){
  try{
    const t=video.currentTime||0;
    for(let i=0;i<video.buffered.length;i++){
      if(video.buffered.start(i)<=t && video.buffered.end(i)>=t){
        return Math.max(0,video.buffered.end(i)-t);
      }
    }
  }catch(e){}
  return 0;
}
function aiResetCounters(){
  aiLowBufferCount=0;
  aiStallCount=0;
  aiLastCurrentTime=video.currentTime||0;
  aiLastGoodAt=Date.now();
}
function scheduleAISoftRefresh(seq){
  if(aiSoftRefreshTimer)clearTimeout(aiSoftRefreshTimer);
  aiSoftRefreshTimer=setTimeout(()=>{
    if(!isCurrentSeq(seq))return;
    aiSoftRefresh('scheduled',seq);
  },AI_PROFILE.softRefreshMs);
}
function aiSoftRefresh(reason,seq){
  seq=seq||playSeq;
  if(!isCurrentSeq(seq))return;
  const now=Date.now();
  if(now-aiLastSoftRefreshAt<AI_PROFILE.minSoftRefreshGap)return;
  aiLastSoftRefreshAt=now;
  aiSoftRefreshCount++;

  const url=activeOriginalUrl||activeUrl;
  if(!url)return;

  setStatus('AI รีเฟรชสัญญาณเบา ๆ...',true);

  try{
    if(hls){
      hls.stopLoad();
      setTimeout(()=>{try{if(hls&&isCurrentSeq(seq))hls.startLoad()}catch(e){}},700);
      try{video.play().catch(()=>{})}catch(e){}
    }else{
      try{video.play().catch(()=>{})}catch(e){}
    }
  }catch(e){}

  aiResetCounters();

  if(aiSoftRefreshCount>=AI_PROFILE.maxSoftRefreshBeforeReload){
    aiSoftRefreshCount=0;
    setTimeout(()=>{
      if(isCurrentSeq(seq)&&!hasPicture()){
        playHLS(makeProxyUrl(url),true,seq);
      }
    },1200);
  }

  scheduleAISoftRefresh(seq);
}

function v6HardSoftReset(seq, reason){
  seq = seq || playSeq;
  if(!isCurrentSeq(seq)) return;
  const url = activeOriginalUrl || activeUrl;

  setStatus('V6 รีเฟรชสัญญาณก่อนค้าง...', true);

    if(hls){
      try{hls.stopLoad()}catch(e){}
      try{hls.detachMedia()}catch(e){}
      try{hls.destroy()}catch(e){}
      hls=null;

  try{
    video.pause();
    video.removeAttribute("src");
    video.load();
  }catch(e){}

  setTimeout(()=>{

}

function startV6PredictiveGuardian(seq){
  if(!isCurrentSeq(seq)) return;

  setTimeout(()=>{
    if(isCurrentSeq(seq)) aiSoftRefresh('v6-before-35min', seq);
  }, V6_PROFILE.predictiveFirstMs);

  const repeat = setInterval(()=>{
    if(!isCurrentSeq(seq)){
      clearInterval(repeat);
      return;
    }
    const elapsed = Date.now() - aiPlaybackStartAt;
    if(elapsed > V6_PROFILE.maxRuntimeBeforeResetMs){
      clearInterval(repeat);
      v6HardSoftReset(seq, 'v6-55min-reset');
      return;
    }
    if(elapsed > V6_PROFILE.predictiveFirstMs){
      aiSoftRefresh('v6-predictive-repeat', seq);
    }
  }, V6_PROFILE.predictiveRepeatMs);

  const mem = setInterval(()=>{
    if(!isCurrentSeq(seq)){
      clearInterval(mem);
      return;
    }
    v6MemoryClean('v6-periodic');
  }, V6_PROFILE.memoryRefreshMs);
}

function startAIHealthMonitor(seq){
  clearAIEngine();
  aiPlaybackStartAt=Date.now();
  startV6PredictiveGuardian(seq);
  aiSoftRefreshCount=0;
  aiLastGoodAt=Date.now();
  aiLastCurrentTime=video.currentTime||0;
  scheduleAISoftRefresh(seq);

  aiHealthTimer=setInterval(()=>{
    if(!isCurrentSeq(seq))return;
    const box=document.getElementById("player-container");
    if(!box||box.style.display!=="block")return;

    const ahead=getBufferedAhead();
    const cur=video.currentTime||0;
    const moved=Math.abs(cur-aiLastCurrentTime)>0.12;
    aiLastCurrentTime=cur;

    if(moved&&video.readyState>=2){
      aiLastGoodAt=Date.now();
      aiLowBufferCount=0;
      aiStallCount=0;
      return;
    }

    if(video.readyState<2||ahead<1.5)aiLowBufferCount++;
    else aiLowBufferCount=0;

    if(!moved&&!video.paused)aiStallCount++;
    else aiStallCount=0;

    if(aiLowBufferCount>=AI_PROFILE.lowBufferLimit||aiStallCount>=AI_PROFILE.stallLimit){
      const noGoodFor=Date.now()-aiLastGoodAt;
      if(noGoodFor>=AI_PROFILE.spinnerRecoverMs){
        aiLowBufferCount=0;
        aiStallCount=0;
        aiSoftRefresh('health',seq);
      }else{
        try{if(hls)hls.startLoad();video.play().catch(()=>{})}catch(e){}
      }
    }
  },AI_PROFILE.healthEveryMs);
}

    if(isCurrentSeq(seq)){

      else showFallback('เซิร์ฟเวอร์ไม่นิ่ง ลองกด PLAYER/MX');
    }
  }, delay||1800);
}

function normalizeDropboxUrl(url){
  url=clean(url);
  if(url.includes("dropbox.com")){
    url=url.replace("?dl=0","?dl=1").replace("&dl=0","&dl=1");
    if(!url.includes("dl=1")) url+=(url.includes("?")?"&":"?")+"dl=1";
  }
  return url;
}
function dropboxRaw(url){
  url=normalizeDropboxUrl(url);
  if(!url.includes("dropbox.com")) return url;
  try{
    const u=new URL(url);
    u.hostname="dl.dropboxusercontent.com";
    u.searchParams.delete("dl");
    return u.toString();
  }catch(e){
    return url.replace("www.dropbox.com","dl.dropboxusercontent.com").replace("&dl=1","").replace("?dl=1","");
  }
}
function makeProxyUrl(url){return WORKER_PROXY+encodeURIComponent(clean(url))}
function allOrigins(url){return "https://api.allorigins.win/raw?url="+encodeURIComponent(url)}

// ===== V6.2 FINAL M3U 429 FIX ENGINE =====
const TIEA_LIST_CACHE_KEY = "TIEA_LIVEDOOMOVIES_M3U_CACHE_V62_FINAL";
const TIEA_LIST_CACHE_TIME_KEY = "TIEA_LIVEDOOMOVIES_M3U_CACHE_TIME_V62_FINAL";
const TIEA_LIST_CACHE_MAX_AGE = 1000 * 60 * 60 * 12;

function githubToJsdelivr(url){
  try{
    const u=new URL(url);
    if(u.hostname!=="raw.githubusercontent.com")return "";
    const p=u.pathname.split("/").filter(Boolean);
    const owner=p[0], repo=p[1];
    let branch="", rest=[];
    if(p[2]==="refs" && p[3]==="heads"){
      branch=p[4]||"main";
      rest=p.slice(5);
    }else{
      branch=p[2]||"main";
      rest=p.slice(3);
    }
    if(!owner||!repo||!rest.length)return "";
    return "https://cdn.jsdelivr.net/gh/"+owner+"/"+repo+"@"+branch+"/"+rest.join("/");
  }catch(e){return ""}
}
function addCacheBust(url){return url+(url.includes("?")?"&":"?")+"t="+Date.now()}
async function fetchText(url,ms){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),ms||7000);
  try{
    const r=await fetch(url,{cache:"no-store",signal:c.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const txt=await r.text();
    if(/^429:\s*Too Many Requests/i.test(String(txt||"").trim())) throw new Error("HTTP 429");
    return txt;
  }catch(e){clearTimeout(t);throw e}
}
function getCachedM3U(){
  try{
    const txt=localStorage.getItem(TIEA_LIST_CACHE_KEY)||"";
    const ts=Number(localStorage.getItem(TIEA_LIST_CACHE_TIME_KEY)||0);
    if(txt && txt.includes("#EXTINF") && Date.now()-ts<TIEA_LIST_CACHE_MAX_AGE)return txt;
  }catch(e){}
  return "";
}
function saveCachedM3U(txt){
  try{
    if(txt && txt.includes("#EXTINF")){
      localStorage.setItem(TIEA_LIST_CACHE_KEY,txt);
      localStorage.setItem(TIEA_LIST_CACHE_TIME_KEY,String(Date.now()));
    }
  }catch(e){}
}
function buildM3UTries(url){
  const raw=dropboxRaw(url);
  const direct=normalizeDropboxUrl(url);
  const jsdRaw=githubToJsdelivr(raw);
  const jsdDirect=githubToJsdelivr(direct);
  return [...new Set([
    jsdRaw,
    jsdDirect,
    jsdRaw?addCacheBust(jsdRaw):"",
    jsdDirect?addCacheBust(jsdDirect):"",
    addCacheBust(raw),
    makeProxyUrl(raw),
    makeProxyUrl(direct),
    addCacheBust(direct),
    allOrigins(direct),
    allOrigins(raw)
  ].filter(Boolean))];
}
async function fetchFirstM3U(tries,timeoutEach){
  return new Promise((resolve,reject)=>{
    let done=false, failed=0;
    const errors=[];
    tries.forEach((u,i)=>{
      fetchText(u,timeoutEach||8000).then(txt=>{
        if(done)return;
        if(txt && txt.includes("#EXTINF")){
          done=true;
          resolve({txt,url:u,index:i});
        }else{
          failed++;
          errors.push("not m3u @"+i);
          if(failed>=tries.length && !done)reject(new Error(errors.join(" | ")));
        }
      }).catch(e=>{
        failed++;
        errors.push((e&&e.message?e.message:String(e))+" @"+i);
        if(failed>=tries.length && !done)reject(new Error(errors.join(" | ")));
      });
    });
  });
}

function parseExtinf(line){
  const info={};
  const re=/([a-zA-Z0-9_-]+)="([^"]*)"/g;
  let m;
  while((m=re.exec(line))) info[m[1].toLowerCase()]=m[2];
  const comma=line.lastIndexOf(",");
  info.name=comma>=0?line.slice(comma+1).trim():(info["tvg-name"]||"ไม่มีชื่อ");
  return info;
}
function parseM3U(txt){
  const lines=String(txt||"").replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean);
  const out=[]; let meta=null;
  for(const line of lines){
    if(line.startsWith("#EXTINF")){meta=parseExtinf(line);continue}
    if(line.startsWith("#")) continue;
    if(meta && /^https?:\/\//i.test(line)){
      out.push({
        name:meta["tvg-name"]||meta.name||"ไม่มีชื่อ",
        logo:meta["tvg-logo"]||FALLBACK_LOGO,
        group:meta["group-title"]||"อื่นๆ",
        file:normalizeStreamUrl(line),
        drm:false
      });
      meta=null;
    }
  }
  return out;
}
function normalizeStreamUrl(url){
  url=clean(url);
  if(!url) return "";
  try{
    const u=new URL(url);
    const parts=u.pathname.split("/").filter(Boolean);
    const hasExt=/\.(m3u8|mpd|mp4|ts)(\?|$)/i.test(url);
    const hasLive=parts[0]==="live"||parts[0]==="movie"||parts[0]==="series";
    if(!hasExt && !hasLive && parts.length>=3){
      u.pathname="/live/"+parts.join("/")+".m3u8";
      return u.toString();
    }
    if(!hasExt && hasLive){
      u.pathname=u.pathname.replace(/\/$/,"")+".m3u8";
      return u.toString();
    }
  }catch(e){}
  return url;
}

function playTS(url,usedProxy=false,seq){
  seq = seq || playSeq;
  if(!isCurrentSeq(seq)) return;
  activeUrl=url;
  video.style.display="block";
  forceAudio();

  if(watchdog){clearInterval(watchdog);watchdog=null}
  try{if(tsPlayer){tsPlayer.destroy();tsPlayer=null}}catch(e){}
  try{video.pause();video.removeAttribute("src");video.load()}catch(e){}

  setStatus('V6 กำลังเล่นโหมดเสถียร', true);

  let nativeStarted=false;
  let fallbackStarted=false;

  const isStarted=()=> nativeStarted || video.readyState>=2 || (video.currentTime||0)>0.2;
  const fallbackWorker=()=>{
    if(usedProxy || fallbackStarted) return false;
    fallbackStarted=true;
    const p=makeProxyUrl(url);
    if(p && p!==url){
      setStatus('V6 กำลังเล่นโหมดเสถียร', true);
      if(isCurrentSeq(seq)) playTS(p,true,seq);
      return true;
    }
    return false;
  };

  video.src=url;
  video.load();

  const goNative=()=>{
    forceAudio();
    kickPlay(seq);
    video.play().then(()=>{
      nativeStarted=true;
      markPlaybackStarted(seq);
      hideFallback();
      setStatus('V6 กำลังเล่นโหมดเสถียร');
    }).catch(()=>{});
  };

  goNative();
  setTimeout(goNative,80);
  setTimeout(goNative,180);
  scheduleAutoRetryPlayback(seq,'ts',2600);

  setTimeout(()=>{
    if(!isCurrentSeq(seq)) return;
    if(isStarted()){
      startTsNoJumpWatchdog(false,()=>fallbackWorker());
      return;
    }

    if(window.mpegts && mpegts.getFeatureList().mseLivePlayback){
      try{
        setStatus('V6 กำลังเล่นโหมดเสถียร');
        try{video.pause();video.removeAttribute("src");video.load()}catch(e){}

        tsPlayer=mpegts.createPlayer(
          {type:"mpegts",isLive:true,url:url,cors:true,withCredentials:false},
          {
            enableWorker:false,
            enableStashBuffer:true,
            stashInitialSize:4096*1024,
            lazyLoad:false,
            deferLoadAfterSourceOpen:false,
            autoCleanupSourceBuffer:true,
            autoCleanupMaxBackwardDuration:180,
            autoCleanupMinBackwardDuration:60,
            liveBufferLatencyChasing:false,
            liveBufferLatencyMaxLatency:45,
            liveBufferLatencyMinRemain:12,
            fixAudioTimestampGap:true,
            accurateSeek:false
          }
        );

        tsPlayer.attachMediaElement(video);
        tsPlayer.load();

        const goTs=()=>{
          forceAudio();
          kickPlay(seq);
          video.play().then(()=>{
            nativeStarted=true;
            markPlaybackStarted(seq);
            hideFallback();
            setStatus('V6 กำลังเล่นโหมดเสถียร');
          }).catch(()=>{});
        };

        setTimeout(goTs,120);
        setTimeout(goTs,450);
        setTimeout(goTs,900);

        setTimeout(()=>{
          if(!isStarted()){
            if(!fallbackWorker()) showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX ด้านบน");
          }
        },1200);

        tsPlayer.on(mpegts.Events.ERROR,(type,detail,info)=>{
          console.log("TS ERROR",type,detail,info);
          if(!isStarted()){
            if(fallbackWorker()) return;
          }
          setStatus('V6 กำลังเล่นโหมดเสถียร');
          try{video.play().catch(()=>{})}catch(e){}
        });

        startTsNoJumpWatchdog(true,()=>fallbackWorker());
      }catch(e){
        console.log("TS INIT ERROR",e);
        if(!fallbackWorker()) showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX ด้านบน");
      }
    }else{
      if(!fallbackWorker()) showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX ด้านบน");
    }
  }, 300);
}

function startTsNoJumpWatchdog(usingTsEngine,fallbackWorker){
  if(watchdog) clearInterval(watchdog);
  let last=0,stuck=0,noData=0,lastAction=0;
  watchdog=setInterval(()=>{
    const box=document.getElementById("player-container");
    if(box.style.display!=="block"){
      clearInterval(watchdog);watchdog=null;return;
    }

    forceAudio();

    if(video.paused && video.readyState>=2){
      video.play().catch(()=>{});
      return;
    }

    if(video.readyState<2){
      noData++;
      setStatus('V6 กำลังเล่นโหมดเสถียร');
      if(noData>=6 && typeof fallbackWorker==="function"){
        if(fallbackWorker()) return;
      }
      return;
    }else noData=0;

    if(Math.abs((video.currentTime||0)-last)<0.05) stuck++;
    else stuck=0;

    last=video.currentTime||0;

    if(stuck>=20){
      const now=Date.now();
      if(now-lastAction>20000){
        lastAction=now;
        setStatus('V6 กำลังเล่นโหมดเสถียร');
        try{video.play().catch(()=>{})}catch(e){}
      }
      stuck=0;
    }
  },4000);
}

async function playMPD(url,seq){
  seq = seq || playSeq;
  if(!isCurrentSeq(seq)) return;
  activeUrl=url;
  video.style.display="block";
  if(!window.shaka){showFallback("เครื่องนี้ไม่รองรับ MPD ให้กด PLAYER/MX");return}
  try{
    shaka.polyfill.installAll();
    shakaPlayer=new shaka.Player(video);
    shakaPlayer.configure({streaming:{bufferingGoal:35,rebufferingGoal:5,bufferBehind:20,retryParameters:{maxAttempts:5,timeout:25000}}});
    setStatus("กำลังโหลด MPD...");
    scheduleAutoRetryPlayback(seq,'mpd',4500);
    await shakaPlayer.load(url);
    if(!isCurrentSeq(seq)) return;
    forceAudio();kickPlay(seq);
    markPlaybackStarted(seq);
    setStatus("กำลังเล่น MPD");
    startWatchdog(()=>{try{shakaPlayer.retryStreaming();video.play().catch(()=>{})}catch(e){}});
  }catch(e){console.log(e);showFallback("MPD เล่นในเว็บไม่ได้ ให้กด PLAYER/MX")}
}

function startWatchdog(recover){
  if(watchdog) clearInterval(watchdog);
  let last=0,stuck=0,lowReady=0,lastRecover=0;
  watchdog=setInterval(()=>{
    const box=document.getElementById("player-container");
    if(box.style.display!=="block"){clearInterval(watchdog);watchdog=null;return}
    forceAudio();

    if(video.paused&&video.readyState>=2){
      video.play().catch(()=>{});
      return;
    }

    if(video.readyState<2){
      lowReady++;
      if(!hasPicture()) setStatus('V6 กำลังเล่นโหมดเสถียร', true);
      const now=Date.now();
      if(lowReady>=8 && now-lastRecover>30000){
        lastRecover=now;
        lowReady=0;
        try{recover&&recover()}catch(e){}
      }
      return;
    }else lowReady=0;

    if(Math.abs((video.currentTime||0)-last)<.05) stuck++;
    else stuck=0;

    last=video.currentTime||0;

    if(stuck>=45){
      const now=Date.now();
      setStatus('V6 กำลังเล่นโหมดเสถียร');
      try{
        if(now-lastRecover>30000){
          lastRecover=now;
          recover&&recover();
        }
        video.play().catch(()=>{});
      }catch(e){}
      stuck=0;
    }
  },4000);
}

function openIntent(url,pkg){
  url=url||activeOriginalUrl||activeUrl;
  if(!url)return;
  try{
    const u=new URL(url),scheme=u.protocol.replace(":",""),hostPath=u.host+u.pathname+(u.search||"");
    let intent="intent://"+hostPath+"#Intent;scheme="+scheme+";action=android.intent.action.VIEW;type=video/*";
    if(pkg)intent+=";package="+pkg;
    intent+=";S.browser_fallback_url="+encodeURIComponent(url)+";end";
    window.location.href=intent;
  }catch(e){window.location.href=url}
}
function openExternal(){openIntent(activeOriginalUrl||activeUrl,"")}
function openMX(){openIntent(activeOriginalUrl||activeUrl,"com.mxtech.videoplayer.ad")}

/* ================= REMOTE BUTTON CLICK FIX ================= */
function getFocusablePlayerButtons(){
  return Array.from(document.querySelectorAll('#player-container .player-btn')).filter(el=>el.offsetParent!==null);
}
function focusPlayerButtonByStep(step){
  const buttons=getFocusablePlayerButtons();
  if(!buttons.length) return;
  let idx=buttons.indexOf(document.activeElement);
  if(idx<0) idx=0;
  else idx=(idx+step+buttons.length)%buttons.length;
  buttons[idx].focus();
}
document.addEventListener('keydown',function(e){
  const box=document.getElementById('player-container');
  if(!box || box.style.display!=='block') return;

  const active=document.activeElement;
  const onPlayerButton=active&&active.classList&&active.classList.contains('player-btn');

  if(onPlayerButton&&(e.key==='Enter'||e.key==='OK'||e.key===' '||e.keyCode===23||e.keyCode===66)){
    e.preventDefault();
    e.stopPropagation();
    showUI();
    active.click();
    return;
  }

  if(e.key==='ArrowLeft'||e.keyCode===21){
    e.preventDefault();e.stopPropagation();showUI();focusPlayerButtonByStep(-1);return;
  }
  if(e.key==='ArrowRight'||e.keyCode===22){
    e.preventDefault();e.stopPropagation();showUI();focusPlayerButtonByStep(1);return;
  }
  if(e.key==='ArrowUp'||e.keyCode===19){
    e.preventDefault();e.stopPropagation();showUI();
    const closeBtn=document.getElementById('closeBtn');
    if(closeBtn) closeBtn.focus();
    return;
  }
  if(e.key==='ArrowDown'||e.keyCode===20){
    e.preventDefault();e.stopPropagation();showUI();
    const buttons=getFocusablePlayerButtons();
    if(buttons.length) buttons[buttons.length-1].focus();
    return;
  }
},true);
