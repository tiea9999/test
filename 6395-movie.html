<body>

      </div>

    <video id="html5-player" controls autoplay playsinline webkit-playsinline></video>
    <div id="status" class="status"></div>
  </div>

<script>
const DEFAULT_M3U_URL="https://www.dropbox.com/scl/fi/p7ce77polkqconjm0xbj7/tv_channels_iptv591-gmail.com_plus.m3u?rlkey=aebh95dzko8z59d9d8cxpdnao&dl=1";
const WORKER_PROXY="https://iptv.tawatchai250958.workers.dev/?url=";
const FALLBACK_LOGO="https://dl.dropboxusercontent.com/scl/fi/k77ovxc35qm0girjo43mt/logo.png?rlkey=1x7w8nk1fl6gptnt9jiaugt54";

let channels=[];
let activeChannel=null,activeElement=null,activeUrl="",activeOriginalUrl="";
let hls=null,tsPlayer=null,shakaPlayer=null,watchdog=null,uiTimer=null,playStartedTimer=null;
let playMode = localStorage.getItem("TIEA_PLAY_MODE") || "fast"; // fast = มือถือ/คอม, stable = โปรเจคเตอร์

const app=document.getElementById("app");
const video=document.getElementById("html5-player");

function applyModeLabel(){
  const btn=document.getElementById("modeBtn");
  if(btn){
    btn.textContent = playMode === "fast" ? "📱 FAST" : "📽 STABLE";
  }
  setLoad(playMode === "fast" ? "โหมด FAST: เข้าไวสำหรับมือถือ/คอม" : "โหมด STABLE: นิ่งสำหรับโปรเจคเตอร์");
}
function togglePlayMode(){
  playMode = playMode === "fast" ? "stable" : "fast";
  localStorage.setItem("TIEA_PLAY_MODE", playMode);
  applyModeLabel();
}

function clean(v){return String(v||"").trim()}
function setLoad(t){document.getElementById("load-status").textContent=t||""}

function normalizeDropboxUrl(url){
  url=clean(url);
  if(url.includes("dropbox.com")){
    url=url.replace("?dl=0","?dl=1").replace("&dl=0","&dl=1");
    if(!url.includes("dl=1")) url+=(url.includes("?")?"&":"?")+"dl=1";
  }
  return url;
}
function dropboxRaw(url){
  url=normalizeDropboxUrl(url);
  if(!url.includes("dropbox.com")) return url;
  try{
    const u=new URL(url);
    u.hostname="dl.dropboxusercontent.com";
    u.searchParams.delete("dl");
    return u.toString();
  }catch(e){
    return url.replace("www.dropbox.com","dl.dropboxusercontent.com").replace("&dl=1","").replace("?dl=1","");
  }
}
function makeProxyUrl(url){return WORKER_PROXY+encodeURIComponent(clean(url))}
function allOrigins(url){return "https://api.allorigins.win/raw?url="+encodeURIComponent(url)}

async function fetchText(url,ms){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),ms||10000);
  try{
    const r=await fetch(url,{cache:"no-store",signal:c.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.text();
  }catch(e){clearTimeout(t);throw e}
}

async function loadM3U(url){
  app.innerHTML='<div class="empty">กำลังโหลดรายการ...</div>';
  setLoad("กำลังโหลดรายการ...");
  const raw=dropboxRaw(url);
  const direct=normalizeDropboxUrl(url);
  const tries=[
    raw+(raw.includes("?")?"&":"?")+"t="+Date.now(),
    direct+(direct.includes("?")?"&":"?")+"t="+Date.now(),
    allOrigins(direct),
    allOrigins(raw),
    makeProxyUrl(raw),
    makeProxyUrl(direct)
  ];
  let lastErr=null;
  for(let i=0;i<tries.length;i++){
    try{
      setLoad("กำลังโหลดรายการ... "+(i+1)+"/"+tries.length);
      const txt=await fetchText(tries[i],12000);
      if(txt.includes("#EXTINF")){
        channels=parseM3U(txt);
        renderChannels(channels);
        setLoad("โหลดสำเร็จ "+channels.length+" ช่อง • โหมดโปรเจคเตอร์");
        return;
      }
      lastErr=new Error("ไม่ใช่ไฟล์ M3U");
    }catch(e){lastErr=e;console.log("load fail",i,e)}
  }
  setLoad("โหลดรายการไม่สำเร็จ ลองกดเลือกไฟล์ M3U จากเครื่อง");
  app.innerHTML='<div class="empty">โหลดรายการไม่สำเร็จ<br>ถ้า Dropbox ไม่มา ให้กด “เลือกไฟล์ M3U” จากเครื่อง</div>';
}
function loadDefaultM3U(){loadM3U(DEFAULT_M3U_URL)}

function parseExtinf(line){
  const info={};
  const re=/([a-zA-Z0-9_-]+)="([^"]*)"/g;
  let m;
  while((m=re.exec(line))) info[m[1].toLowerCase()]=m[2];
  const comma=line.lastIndexOf(",");
  info.name=comma>=0?line.slice(comma+1).trim():(info["tvg-name"]||"ไม่มีชื่อ");
  return info;
}
function parseM3U(txt){
  const lines=String(txt||"").replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean);
  const out=[]; let meta=null;
  for(const line of lines){
    if(line.startsWith("#EXTINF")){meta=parseExtinf(line);continue}
    if(line.startsWith("#")) continue;
    if(meta && /^https?:\/\//i.test(line)){
      out.push({
        name:meta["tvg-name"]||meta.name||"ไม่มีชื่อ",
        logo:meta["tvg-logo"]||FALLBACK_LOGO,
        group:meta["group-title"]||"อื่นๆ",
        file:normalizeStreamUrl(line),
        drm:false
      });
      meta=null;
    }
  }
  return out;
}
function normalizeStreamUrl(url){
  url=clean(url);
  if(!url) return "";
  try{
    const u=new URL(url);
    const parts=u.pathname.split("/").filter(Boolean);
    const hasExt=/\.(m3u8|mpd|mp4|ts)(\?|$)/i.test(url);
    const hasLive=parts[0]==="live"||parts[0]==="movie"||parts[0]==="series";
    if(!hasExt && !hasLive && parts.length>=3){
      u.pathname="/live/"+parts.join("/")+".m3u8";
      return u.toString();
    }
    if(!hasExt && hasLive){
      u.pathname=u.pathname.replace(/\/$/,"")+".m3u8";
      return u.toString();
    }
  }catch(e){}
  return url;
}

function renderChannels(list){
  app.innerHTML="";
  if(!list.length){app.innerHTML='<div class="empty">ไม่พบรายการ</div>';return}
  const groups={};
  list.forEach(ch=>{const g=ch.group||"อื่นๆ";(groups[g]||(groups[g]=[])).push(ch)});
  Object.keys(groups).forEach(group=>{
    const title=document.createElement("div");
    title.className="group-title";
    title.textContent="📺 "+group+" ("+groups[group].length+")";
    app.appendChild(title);
    const grid=document.createElement("div");
    grid.className="grid";
    groups[group].forEach(ch=>{
      const div=document.createElement("div");
      div.className="channel";
      div.tabIndex=0;

      const img=document.createElement("img");
      img.src=ch.logo||FALLBACK_LOGO;
      img.onerror=function(){this.src=FALLBACK_LOGO};

      const span=document.createElement("span");
      span.textContent=ch.name||"IPTV";

      div.appendChild(img);
      div.appendChild(span);

      div.onclick=()=>loadChannel(ch,div);
      div.onkeydown=e=>{
        if(e.key==="Enter"||e.key==="OK"||e.key===" "||e.keyCode===23||e.keyCode===66){
          e.preventDefault();
          loadChannel(ch,div);
        }
      };
      grid.appendChild(div);
    });
    app.appendChild(grid);
  });
  setTimeout(()=>document.querySelector(".channel")?.focus(),250);
}
function focusFirstChannel(){document.querySelector(".channel")?.focus()}

function showUI(){
  const box=document.getElementById("player-container");
  box.classList.add("show-ui");
  if(uiTimer) clearTimeout(uiTimer);
  uiTimer=setTimeout(()=>{box.classList.remove("show-ui");box.classList.remove("show-fallback")},4200);
}
function setStatus(t,auto=true){
  const box=document.getElementById("player-container");
  const st=document.getElementById("status");
  st.textContent=t||"";
  if(t){box.classList.add("show-status");showUI()}else box.classList.remove("show-status");
  if(auto&&t){clearTimeout(setStatus._t);setStatus._t=setTimeout(()=>box.classList.remove("show-status"),3600)}
}
function showFallback(msg){
  setStatus(msg || "ถ้าเว็บไม่ขึ้นภาพ ให้กด PLAYER/MX ด้านบน", false);
  showUI();
}
function hideFallback(){
  const box=document.getElementById("player-container");
  if(box) box.classList.remove("show-fallback");
}

async function stopAll(){
  if(playStartedTimer){clearTimeout(playStartedTimer);playStartedTimer=null}
  if(watchdog){clearInterval(watchdog);watchdog=null}
  try{if(hls){hls.destroy();hls=null}}catch(e){}
  try{if(tsPlayer){tsPlayer.destroy();tsPlayer=null}}catch(e){}
  try{if(shakaPlayer){await shakaPlayer.destroy();shakaPlayer=null}}catch(e){}
  try{video.pause();video.removeAttribute("src");video.load()}catch(e){}
  hideFallback();
}
function forceAudio(){try{video.muted=false;video.defaultMuted=false;video.volume=1}catch(e){}}

async function loadChannel(ch,el){
  activeChannel=ch;activeElement=el;
  activeOriginalUrl=normalizeStreamUrl(clean(ch.file));activeUrl=activeOriginalUrl;

  document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));
  if(el) el.classList.add("active");

  const box=document.getElementById("player-container");
  box.style.display="block";
  showUI();
  await stopAll();

  const u=activeOriginalUrl.toLowerCase();

  setTimeout(()=>showFallback("ถ้าเว็บไม่ขึ้นภาพ ให้กด PLAYER/MX ด้านบน"),7000);

  if(u.includes(".mpd")){
    playMPD(activeOriginalUrl);
  }else if(u.includes(".m3u8")||u.includes("extension=m3u8")||u.includes("type=m3u8")){
    playHLS(activeOriginalUrl,false);
  }else{
    playTS(activeOriginalUrl,false);
  }

  setTimeout(()=>{showUI();document.getElementById("closeBtn")?.focus()},250);
}

function playHLS(url,usedProxy){
  activeUrl=url;
  video.style.display="block";
  forceAudio();
  setStatus(usedProxy?"กำลังโหลด HLS ผ่าน Worker...":"กำลังโหลด HLS ตรง...");
  if(hls){try{hls.destroy()}catch(e){} hls=null}
  if(watchdog){clearInterval(watchdog);watchdog=null}

  if(window.Hls&&Hls.isSupported()){
    let started=false;
    const cfg = playMode === "fast" ? {
      enableWorker:true,
      lowLatencyMode:false,
      startFragPrefetch:true,
      progressive:true,

      // FAST: มือถือ/คอม เข้าไว
      maxBufferLength:35,
      maxMaxBufferLength:60,
      backBufferLength:20,
      maxBufferHole:2,
      highBufferWatchdogPeriod:5,
      liveSyncDurationCount:6,
      liveMaxLatencyDurationCount:12,

      fragLoadingMaxRetry:6,
      levelLoadingMaxRetry:5,
      manifestLoadingMaxRetry:5,
      fragLoadingTimeOut:16000,
      levelLoadingTimeOut:12000,
      manifestLoadingTimeOut:12000,

      startLevel:-1,
      abrEwmaDefaultEstimate:900000,
      abrBandWidthFactor:.8,
      abrBandWidthUpFactor:.65,
      capLevelToPlayerSize:true,
      testBandwidth:false
    } : {
      enableWorker:true,
      lowLatencyMode:false,
      startFragPrefetch:true,
      progressive:true,

      // STABLE: โปรเจคเตอร์ บัฟเฟอร์ลึก ลดหมุนระหว่างดู
      maxBufferLength:120,
      maxMaxBufferLength:180,
      backBufferLength:60,
      maxBufferHole:5,
      highBufferWatchdogPeriod:10,
      liveSyncDurationCount:14,
      liveMaxLatencyDurationCount:32,

      fragLoadingMaxRetry:12,
      levelLoadingMaxRetry:10,
      manifestLoadingMaxRetry:10,
      fragLoadingTimeOut:30000,
      levelLoadingTimeOut:22000,
      manifestLoadingTimeOut:22000,

      startLevel:0,
      abrEwmaDefaultEstimate:450000,
      abrBandWidthFactor:.65,
      abrBandWidthUpFactor:.45,
      capLevelToPlayerSize:true,
      testBandwidth:false
    };

    hls=new Hls(cfg);

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      started=true;

      if(playMode === "stable"){
        try{
          if(hls.levels&&hls.levels.length>1){
            hls.currentLevel=0;
            hls.nextLevel=0;
            hls.loadLevel=0;
          }
        }catch(e){}

        forceAudio();
        setStatus("กำลังเติมบัฟเฟอร์โปรเจคเตอร์...");
        setTimeout(()=>{
          forceAudio();
          video.play().catch(()=>{});
          setStatus("กำลังเล่น HLS โหมด STABLE");
        },1500);

        setTimeout(()=>{try{if(hls) hls.currentLevel=-1}catch(e){}},25000);
      }else{
        forceAudio();
        video.play().catch(()=>{});
        setStatus("กำลังเล่น HLS โหมด FAST");
      }
    });

    playStartedTimer=setTimeout(()=>{
      if(!started&&!usedProxy){
        playHLS(makeProxyUrl(url),true);
      }
    }, playMode === "fast" ? 3000 : 6500);

    hls.on(Hls.Events.BUFFER_STALLED,()=>{
      setStatus("กำลังบัฟเฟอร์โปรเจคเตอร์...",true);
      setTimeout(()=>{try{if(video.paused)video.play().catch(()=>{})}catch(e){}},1500);
    });

    hls.on(Hls.Events.ERROR,(ev,data)=>{
      if(!data||!hls)return;
      if(data.fatal){
        if(data.type===Hls.ErrorTypes.NETWORK_ERROR){try{hls.startLoad()}catch(e){}}
        else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError()}catch(e){}}
        else if(!usedProxy) playHLS(makeProxyUrl(url),true);
        else showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX");
      }
    });

    startWatchdog(()=>{try{hls.startLoad();video.play().catch(()=>{})}catch(e){}});
  }else{
    video.src=url;
    video.play().catch(()=>showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX"));
  }
}

function playTS(url,usedProxy=false){
  activeUrl=url;
  video.style.display="block";
  forceAudio();

  if(watchdog){clearInterval(watchdog);watchdog=null}
  try{if(tsPlayer){tsPlayer.destroy();tsPlayer=null}}catch(e){}
  try{video.pause();video.removeAttribute("src");video.load()}catch(e){}

  setStatus(usedProxy ? "กำลังเล่นผ่าน Worker..." : "กำลังเล่นลิงก์ตรงแบบไม่กระโดด...");

  let nativeStarted=false;
  let fallbackStarted=false;

  const isStarted=()=> nativeStarted || video.readyState>=2 || (video.currentTime||0)>0.2;
  const fallbackWorker=()=>{
    if(usedProxy || fallbackStarted) return false;
    fallbackStarted=true;
    const p=makeProxyUrl(url);
    if(p && p!==url){
      setStatus("เส้นตรงไม่ขึ้นภาพ กำลังลอง Worker สำรอง...");
      playTS(p,true);
      return true;
    }
    return false;
  };

  video.src=url;
  video.load();

  const goNative=()=>{
    forceAudio();
    video.play().then(()=>{
      nativeStarted=true;
      hideFallback();
      setStatus(usedProxy ? "กำลังเล่นผ่าน Worker" : "กำลังเล่นลิงก์ตรง");
    }).catch(()=>{});
  };

  setTimeout(goNative,150);
  setTimeout(goNative, playMode === "fast" ? 450 : 800);
  setTimeout(goNative, playMode === "fast" ? 1000 : 1800);

  setTimeout(()=>{
    if(isStarted()){
      startTsNoJumpWatchdog(false,()=>fallbackWorker());
      return;
    }

    if(window.mpegts && mpegts.getFeatureList().mseLivePlayback){
      try{
        setStatus("ลิงก์ตรงยังไม่ขึ้น กำลังลอง TS Engine...");
        try{video.pause();video.removeAttribute("src");video.load()}catch(e){}

        tsPlayer=mpegts.createPlayer(
          {type:"mpegts",isLive:true,url:url,cors:true,withCredentials:false},
          {
            enableWorker:false,
            enableStashBuffer:true,
            stashInitialSize:4096*1024,
            lazyLoad:false,
            deferLoadAfterSourceOpen:false,
            autoCleanupSourceBuffer:true,
            autoCleanupMaxBackwardDuration:180,
            autoCleanupMinBackwardDuration:60,
            liveBufferLatencyChasing:false,
            liveBufferLatencyMaxLatency:45,
            liveBufferLatencyMinRemain:12,
            fixAudioTimestampGap:true,
            accurateSeek:false
          }
        );

        tsPlayer.attachMediaElement(video);
        tsPlayer.load();

        const goTs=()=>{
          forceAudio();
          video.play().then(()=>{
            nativeStarted=true;
            hideFallback();
            setStatus(usedProxy ? "กำลังเล่น TS ผ่าน Worker" : "กำลังเล่น TS Engine");
          }).catch(()=>{});
        };

        setTimeout(goTs,500);
        setTimeout(goTs,1600);
        setTimeout(goTs,3200);

        setTimeout(()=>{
          if(!isStarted()){
            if(!fallbackWorker()) showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX ด้านบน");
          }
        },5000);

        tsPlayer.on(mpegts.Events.ERROR,(type,detail,info)=>{
          console.log("TS ERROR",type,detail,info);
          if(!isStarted()){
            if(fallbackWorker()) return;
          }
          setStatus("สัญญาณสะดุด รอให้กลับมา...");
          try{video.play().catch(()=>{})}catch(e){}
        });

        startTsNoJumpWatchdog(true,()=>fallbackWorker());
      }catch(e){
        console.log("TS INIT ERROR",e);
        if(!fallbackWorker()) showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX ด้านบน");
      }
    }else{
      if(!fallbackWorker()) showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX ด้านบน");
    }
  }, playMode === "fast" ? 1800 : 3200);
}

function startTsNoJumpWatchdog(usingTsEngine,fallbackWorker){
  if(watchdog) clearInterval(watchdog);
  let last=0,stuck=0,noData=0,lastAction=0;
  watchdog=setInterval(()=>{
    const box=document.getElementById("player-container");
    if(box.style.display!=="block"){
      clearInterval(watchdog);watchdog=null;return;
    }

    forceAudio();

    if(video.paused && video.readyState>=2){
      video.play().catch(()=>{});
      return;
    }

    if(video.readyState<2){
      noData++;
      setStatus("กำลังรอสัญญาณ...");
      if(noData>=6 && typeof fallbackWorker==="function"){
        if(fallbackWorker()) return;
      }
      return;
    }else noData=0;

    if(Math.abs((video.currentTime||0)-last)<0.05) stuck++;
    else stuck=0;

    last=video.currentTime||0;

    if(stuck>=20){
      const now=Date.now();
      if(now-lastAction>20000){
        lastAction=now;
        setStatus("สัญญาณนิ่ง กำลังเล่นต่อ...");
        try{video.play().catch(()=>{})}catch(e){}
      }
      stuck=0;
    }
  },4000);
}

async function playMPD(url){
  activeUrl=url;
  video.style.display="block";
  if(!window.shaka){showFallback("เครื่องนี้ไม่รองรับ MPD ให้กด PLAYER/MX");return}
  try{
    shaka.polyfill.installAll();
    shakaPlayer=new shaka.Player(video);
    shakaPlayer.configure({streaming:{bufferingGoal:35,rebufferingGoal:5,bufferBehind:20,retryParameters:{maxAttempts:5,timeout:25000}}});
    setStatus("กำลังโหลด MPD...");
    await shakaPlayer.load(url);
    forceAudio();video.play().catch(()=>{});
    setStatus("กำลังเล่น MPD");
    startWatchdog(()=>{try{shakaPlayer.retryStreaming();video.play().catch(()=>{})}catch(e){}});
  }catch(e){console.log(e);showFallback("MPD เล่นในเว็บไม่ได้ ให้กด PLAYER/MX")}
}

function startWatchdog(recover){
  if(watchdog) clearInterval(watchdog);
  let last=0,stuck=0,lowReady=0,lastRecover=0;
  watchdog=setInterval(()=>{
    const box=document.getElementById("player-container");
    if(box.style.display!=="block"){clearInterval(watchdog);watchdog=null;return}
    forceAudio();

    if(video.paused&&video.readyState>=2){
      video.play().catch(()=>{});
      return;
    }

    if(video.readyState<2){
      lowReady++;
      setStatus("กำลังบัฟเฟอร์โปรเจคเตอร์...");
      const now=Date.now();
      if(lowReady>=8 && now-lastRecover>30000){
        lastRecover=now;
        lowReady=0;
        try{recover&&recover()}catch(e){}
      }
      return;
    }else lowReady=0;

    if(Math.abs((video.currentTime||0)-last)<.05) stuck++;
    else stuck=0;

    last=video.currentTime||0;

    if(stuck>=45){
      const now=Date.now();
      setStatus("สัญญาณหยุดนาน กำลังประคองต่อ...");
      try{
        if(now-lastRecover>30000){
          lastRecover=now;
          recover&&recover();
        }
        video.play().catch(()=>{});
      }catch(e){}
      stuck=0;
    }
  },4000);
}

function openIntent(url,pkg){
  url=url||activeOriginalUrl||activeUrl;
  if(!url)return;
  try{
    const u=new URL(url),scheme=u.protocol.replace(":",""),hostPath=u.host+u.pathname+(u.search||"");
    let intent="intent://"+hostPath+"#Intent;scheme="+scheme+";action=android.intent.action.VIEW;type=video/*";
    if(pkg)intent+=";package="+pkg;
    intent+=";S.browser_fallback_url="+encodeURIComponent(url)+";end";
    window.location.href=intent;
  }catch(e){window.location.href=url}
}
function openExternal(){openIntent(activeOriginalUrl||activeUrl,"")}
function openMX(){openIntent(activeOriginalUrl||activeUrl,"com.mxtech.videoplayer.ad")}

/* ================= REMOTE BUTTON CLICK FIX ================= */
function getFocusablePlayerButtons(){
  return Array.from(document.querySelectorAll('#player-container .player-btn')).filter(el=>el.offsetParent!==null);
}
function focusPlayerButtonByStep(step){
  const buttons=getFocusablePlayerButtons();
  if(!buttons.length) return;
  let idx=buttons.indexOf(document.activeElement);
  if(idx<0) idx=0;
  else idx=(idx+step+buttons.length)%buttons.length;
  buttons[idx].focus();
}
document.addEventListener('keydown',function(e){
  const box=document.getElementById('player-container');
  if(!box || box.style.display!=='block') return;

  const active=document.activeElement;
  const onPlayerButton=active&&active.classList&&active.classList.contains('player-btn');

  if(onPlayerButton&&(e.key==='Enter'||e.key==='OK'||e.key===' '||e.keyCode===23||e.keyCode===66)){
    e.preventDefault();
    e.stopPropagation();
    showUI();
    active.click();
    return;
  }

  if(e.key==='ArrowLeft'||e.keyCode===21){
    e.preventDefault();e.stopPropagation();showUI();focusPlayerButtonByStep(-1);return;
  }
  if(e.key==='ArrowRight'||e.keyCode===22){
    e.preventDefault();e.stopPropagation();showUI();focusPlayerButtonByStep(1);return;
  }
  if(e.key==='ArrowUp'||e.keyCode===19){
    e.preventDefault();e.stopPropagation();showUI();
    const closeBtn=document.getElementById('closeBtn');
    if(closeBtn) closeBtn.focus();
    return;
  }
  if(e.key==='ArrowDown'||e.keyCode===20){
    e.preventDefault();e.stopPropagation();showUI();
    const buttons=getFocusablePlayerButtons();
    if(buttons.length) buttons[buttons.length-1].focus();
    return;
  }
},true);
