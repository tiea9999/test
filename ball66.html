<!DOCTYPE html>
<html lang="th">
<head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.10.9/shaka-player.compiled.min.js"></script>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
    body{padding-top:56px}
    .home-btn{position:fixed;top:10px;left:10px;z-index:9999;background:rgba(0,0,0,.78);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}

    .player-controls{position:absolute;top:12px;left:12px;right:12px;z-index:100000;display:flex;justify-content:space-between;gap:10px;opacity:0;visibility:hidden;pointer-events:none;transition:.22s}

    @media(max-width:480px){body{padding-top:52px}h2{font-size:18px}.grid{grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}.channel{min-height:76px}.channel img{width:50px;height:50px}.channel span{font-size:10px}.player-btn{font-size:12px;padding:7px 8px}}

<body>
  <button class="home-btn" onclick="goHome()">🏠 โฮม</button>
  <h2>TIEA AUTO M3U TS NO JUMP FINAL</h2>
  <div id="load-status">กำลังโหลดรายการ...</div>

  <div class="tools">
    <button class="tool-btn" onclick="loadDefaultM3U()">↻ โหลดรายการใหม่</button>
    <button class="tool-btn" onclick="focusFirstChannel()">🎯 ช่องแรก</button>
    <label class="tool-btn" for="m3uFile">📁 เลือกไฟล์ M3U</label>

      <div class="btn-row">
        <button class="player-btn" id="closeBtn" onclick="closePlayer()">X</button>
        <button class="player-btn" onclick="restartCurrent()">↻ รีโหลด</button>
      </div>
      <div class="btn-row">
        <button class="player-btn" onclick="openExternal()">▶ PLAYER</button>
        <button class="player-btn" onclick="openMX()">▶ MX</button>
        <button class="player-btn" onclick="goHome()">🏠 HOME</button>
      </div>
    </div>
    <video id="html5-player" controls autoplay playsinline webkit-playsinline></video>
    <div id="status" class="status"></div>
</div>

<script>
const DEFAULT_M3U_URL="https://www.dropbox.com/scl/fi/p7ce77polkqconjm0xbj7/tv_channels_iptv591-gmail.com_plus.m3u?rlkey=aebh95dzko8z59d9d8cxpdnao&dl=1";
const WORKER_PROXY="https://iptv.tawatchai250958.workers.dev/?url=";
const FALLBACK_LOGO="https://dl.dropboxusercontent.com/scl/fi/k77ovxc35qm0girjo43mt/logo.png?rlkey=1x7w8nk1fl6gptnt9jiaugt54";

let channels=[];
let activeChannel=null,activeElement=null,activeUrl="",activeOriginalUrl="";
let hls=null,tsPlayer=null,shakaPlayer=null,watchdog=null,uiTimer=null;

const app=document.getElementById("app");
const video=document.getElementById("html5-player");

function clean(v){return String(v||"").trim()}
function setLoad(t){document.getElementById("load-status").textContent=t||""}
function normalizeDropboxUrl(url){
  url=clean(url);
  if(url.includes("dropbox.com")){
    url=url.replace("?dl=0","?dl=1").replace("&dl=0","&dl=1");
    if(!url.includes("dl=1")) url+=(url.includes("?")?"&":"?")+"dl=1";
  }
  return url;
}
function dropboxRaw(url){
  url=normalizeDropboxUrl(url);
  if(!url.includes("dropbox.com")) return url;
  try{
    const u=new URL(url);
    u.hostname="dl.dropboxusercontent.com";
    u.searchParams.delete("dl");
    return u.toString();
  }catch(e){
    return url.replace("www.dropbox.com","dl.dropboxusercontent.com").replace("&dl=1","").replace("?dl=1","");
  }
}
function makeProxyUrl(url){return WORKER_PROXY+encodeURIComponent(clean(url))}
async function fetchText(url,ms){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),ms||10000);
  try{
    const r=await fetch(url,{cache:"no-store",signal:c.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.text();
  }catch(e){clearTimeout(t);throw e}
}
async function loadM3U(url){
  setLoad("กำลังโหลดรายการ...");
  const raw=dropboxRaw(url);
  const direct=normalizeDropboxUrl(url);
  const tries=[
    raw+(raw.includes("?")?"&":"?")+"t="+Date.now(),
    direct+(direct.includes("?")?"&":"?")+"t="+Date.now(),
    makeProxyUrl(raw),
    makeProxyUrl(direct)
  ];
  let lastErr=null;
  for(let i=0;i<tries.length;i++){
    try{
      setLoad("กำลังโหลดรายการ... "+(i+1)+"/"+tries.length);
      const txt=await fetchText(tries[i],10000);
      if(txt.includes("#EXTINF")){
        channels=parseM3U(txt);
        renderChannels(channels);
        setLoad("โหลดสำเร็จ "+channels.length+" ช่อง • TS ไม่กระโดด");
        return;
      }
      lastErr=new Error("ไม่ใช่ไฟล์ M3U");
    }catch(e){lastErr=e;console.log("load fail",i,e)}
  }
  setLoad("โหลดรายการไม่สำเร็จ ลองกดเลือกไฟล์ M3U จากเครื่อง");
  app.innerHTML='<div class="empty">โหลดรายการไม่สำเร็จ</div>';
}
function loadDefaultM3U(){loadM3U(DEFAULT_M3U_URL)}
function parseExtinf(line){
  const info={};
  const re=/([a-zA-Z0-9_-]+)="([^"]*)"/g;
  let m;
  while((m=re.exec(line))) info[m[1].toLowerCase()]=m[2];
  const comma=line.lastIndexOf(",");
  info.name=comma>=0?line.slice(comma+1).trim():(info["tvg-name"]||"ไม่มีชื่อ");
  return info;
}
function parseM3U(txt){
  const lines=String(txt||"").replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean);
  const out=[]; let meta=null;
  for(const line of lines){
    if(line.startsWith("#EXTINF")){meta=parseExtinf(line);continue}
    if(line.startsWith("#")) continue;
    if(meta && /^https?:\/\//i.test(line)){
      out.push({
        name:meta["tvg-name"]||meta.name||"ไม่มีชื่อ",
        logo:meta["tvg-logo"]||FALLBACK_LOGO,
        group:meta["group-title"]||"อื่นๆ",
        file:line,
        drm:false
      });
      meta=null;
    }
  }
  return out;
}
function renderChannels(list){
  app.innerHTML="";
  if(!list.length){app.innerHTML='<div class="empty">ไม่พบรายการ</div>';return}
  const groups={};
  list.forEach(ch=>{const g=ch.group||"อื่นๆ";(groups[g]||(groups[g]=[])).push(ch)});
  Object.keys(groups).forEach(group=>{
    const title=document.createElement("div");
    title.className="group-title";
    title.textContent="📺 "+group+" ("+groups[group].length+")";
    app.appendChild(title);
    const grid=document.createElement("div");
    grid.className="grid";
    groups[group].forEach(ch=>{
      const div=document.createElement("div");
      div.className="channel";
      div.tabIndex=0;
      div.innerHTML='<img src="'+(ch.logo||FALLBACK_LOGO)+'" onerror="this.src=\''+FALLBACK_LOGO+'\'"><span>'+ch.name+'</span>';
      div.onclick=()=>loadChannel(ch,div);
      div.onkeydown=e=>{if(e.key==="Enter"||e.key==="OK"||e.key===" "||e.keyCode===23||e.keyCode===66){e.preventDefault();loadChannel(ch,div)}};
      grid.appendChild(div);
    });
    app.appendChild(grid);
  });
  setTimeout(()=>document.querySelector(".channel")?.focus(),250);
}
function focusFirstChannel(){document.querySelector(".channel")?.focus()}

function showUI(){
  const box=document.getElementById("player-container");
  box.classList.add("show-ui");
  if(uiTimer) clearTimeout(uiTimer);
  uiTimer=setTimeout(()=>{box.classList.remove("show-ui");box.classList.remove("show-fallback")},3200);
}
function setStatus(t,auto=true){
  const box=document.getElementById("player-container");
  const st=document.getElementById("status");
  st.textContent=t||"";
  if(t){box.classList.add("show-status");showUI()}else box.classList.remove("show-status");
  if(auto&&t){clearTimeout(setStatus._t);setStatus._t=setTimeout(()=>box.classList.remove("show-status"),2600)}
}
function showFallback(msg){
  setStatus(msg || "ถ้าเว็บไม่ขึ้นภาพ ให้กด PLAYER/MX ด้านบน", false);
  showUI();
}
function hideFallback(){
  const box=document.getElementById("player-container");
  if(box) box.classList.remove("show-fallback");
}

async function stopAll(){
  if(watchdog){clearInterval(watchdog);watchdog=null}
  try{if(hls){hls.destroy();hls=null}}catch(e){}
  try{if(tsPlayer){tsPlayer.destroy();tsPlayer=null}}catch(e){}
  try{if(shakaPlayer){await shakaPlayer.destroy();shakaPlayer=null}}catch(e){}
  try{video.pause();video.removeAttribute("src");video.load()}catch(e){}
  hideFallback();
}
function forceAudio(){try{video.muted=false;video.defaultMuted=false;video.volume=1}catch(e){}}
async function loadChannel(ch,el){
  activeChannel=ch;activeElement=el;
  activeOriginalUrl=clean(ch.file);activeUrl=activeOriginalUrl;

  document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));
  if(el) el.classList.add("active");

  const box=document.getElementById("player-container");
  box.style.display="block";
  showUI();
  await stopAll();

  const u=activeOriginalUrl.toLowerCase();

  setTimeout(()=>showFallback("ถ้าเว็บไม่ขึ้นภาพ ให้กด PLAYER/MX ด้านบน"),5000);

  if(u.includes(".mpd")){
    playMPD(activeOriginalUrl);
  }else if(u.includes(".m3u8")||u.includes("extension=m3u8")||u.includes("type=m3u8")){
    playHLS(activeOriginalUrl,false);
  }else{
    // สำคัญ: ลิงก์ Xtream แบบ /83 /84 หรือไม่มีนามสกุล เข้า TS/Xtream ทันที
    playTS(activeOriginalUrl,false);
  }

  setTimeout(()=>document.getElementById("closeBtn")?.focus(),250);
}
function playHLS(url,usedProxy){
  activeUrl=url;
  video.style.display="block";
  forceAudio();
  setStatus(usedProxy?"กำลังโหลด HLS ผ่าน Worker...":"กำลังโหลด HLS ตรง...");
  if(hls){try{hls.destroy()}catch(e){} hls=null}
  if(window.Hls&&Hls.isSupported()){
    let started=false;
    hls=new Hls({
      enableWorker:false,lowLatencyMode:false,startFragPrefetch:true,progressive:true,
      maxBufferLength:28,maxMaxBufferLength:45,backBufferLength:10,
      liveSyncDurationCount:4,liveMaxLatencyDurationCount:8,
      fragLoadingMaxRetry:8,levelLoadingMaxRetry:6,manifestLoadingMaxRetry:6,
      fragLoadingTimeOut:18000,levelLoadingTimeOut:12000,manifestLoadingTimeOut:12000,
      abrEwmaDefaultEstimate:700000,abrBandWidthFactor:.8,abrBandWidthUpFactor:.6,
      capLevelToPlayerSize:true,testBandwidth:false
    });
    hls.loadSource(url);hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{started=true;forceAudio();video.play().catch(()=>{});setStatus("กำลังเล่น HLS")});
    setTimeout(()=>{if(!started&&!usedProxy){playHLS(makeProxyUrl(url),true)}},4500);
    hls.on(Hls.Events.ERROR,(ev,data)=>{
      if(!data||!hls)return;
      if(data.fatal){
        if(data.type===Hls.ErrorTypes.NETWORK_ERROR){try{hls.startLoad()}catch(e){}}
        else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError()}catch(e){}}
        else if(!usedProxy) playHLS(makeProxyUrl(url),true);
        else showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX");
      }
    });
    startWatchdog(()=>{try{hls.startLoad();video.play().catch(()=>{})}catch(e){}});
  }else{
    video.src=url;video.play().catch(()=>showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX"));
  }
}
function playTS(url,usedProxy=false){
  activeUrl=url;
  video.style.display="block";
  forceAudio();

  if(watchdog){clearInterval(watchdog);watchdog=null}
  try{if(tsPlayer){tsPlayer.destroy();tsPlayer=null}}catch(e){}
  try{video.pause();video.removeAttribute("src");video.load()}catch(e){}

  setStatus(usedProxy ? "กำลังเล่นผ่าน Worker..." : "กำลังเล่นลิงก์ตรงแบบไม่กระโดด...");

  let nativeStarted=false;
  let fallbackStarted=false;

  const isStarted=()=> nativeStarted || video.readyState>=2 || (video.currentTime||0)>0.2;

  const fallbackWorker=()=>{
    if(usedProxy || fallbackStarted) return false;
    fallbackStarted=true;
    const p=makeProxyUrl(url);
    if(p && p!==url){
      setStatus("เส้นตรงไม่ขึ้นภาพ กำลังลอง Worker สำรอง...");
      playTS(p,true);
      return true;
    }
    return false;
  };

  // NO JUMP MODE: ให้ browser เล่นตรงก่อน เพราะนิ่งกว่า mpegts.js ในหลายกล่อง
  video.src=url;
  video.load();

  const goNative=()=>{
    forceAudio();
    video.play().then(()=>{
      nativeStarted=true;
      hideFallback();
      setStatus(usedProxy ? "กำลังเล่นผ่าน Worker" : "กำลังเล่นลิงก์ตรง");
    }).catch(()=>{});
  };

  setTimeout(goNative,150);
  setTimeout(goNative,700);
  setTimeout(goNative,1500);

  // ถ้า 2.8 วิไม่ขึ้นภาพ ค่อยใช้ mpegts.js
  setTimeout(()=>{
    if(isStarted()){
      startTsNoJumpWatchdog(false,()=>fallbackWorker());
      return;
    }

    if(window.mpegts && mpegts.getFeatureList().mseLivePlayback){
      try{
        setStatus("ลิงก์ตรงยังไม่ขึ้น กำลังลอง TS Engine...");
        try{video.pause();video.removeAttribute("src");video.load()}catch(e){}

        tsPlayer=mpegts.createPlayer(
          {type:"mpegts",isLive:true,url:url,cors:true,withCredentials:false},
          {
            // NO JUMP: ปิด live chasing ทั้งหมด
            enableWorker:false,
            enableStashBuffer:true,
            stashInitialSize:2048*1024,

            lazyLoad:false,
            deferLoadAfterSourceOpen:false,

            autoCleanupSourceBuffer:true,
            autoCleanupMaxBackwardDuration:120,
            autoCleanupMinBackwardDuration:45,

            liveBufferLatencyChasing:false,
            liveBufferLatencyMaxLatency:30,
            liveBufferLatencyMinRemain:8,

            fixAudioTimestampGap:true,
            accurateSeek:false
          }
        );

        tsPlayer.attachMediaElement(video);
        tsPlayer.load();

        const goTs=()=>{
          forceAudio();
          video.play().then(()=>{
            nativeStarted=true;
            hideFallback();
            setStatus(usedProxy ? "กำลังเล่น TS ผ่าน Worker" : "กำลังเล่น TS Engine");
          }).catch(()=>{});
        };

        setTimeout(goTs,400);
        setTimeout(goTs,1400);
        setTimeout(goTs,2600);

        setTimeout(()=>{
          if(!isStarted()){
            if(!fallbackWorker()) showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX ด้านบน");
          }
        },4200);

        tsPlayer.on(mpegts.Events.ERROR,(type,detail,info)=>{
          console.log("TS ERROR",type,detail,info);
          // ไม่ reload ถี่ เพราะเป็นตัวทำให้กระโดด
          if(!isStarted()){
            if(fallbackWorker()) return;
          }
          setStatus("สัญญาณสะดุด รอให้กลับมา...");
          try{video.play().catch(()=>{})}catch(e){}
        });

        startTsNoJumpWatchdog(true,()=>fallbackWorker());
      }catch(e){
        console.log("TS INIT ERROR",e);
        if(!fallbackWorker()) showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX ด้านบน");
      }
    }else{
      if(!fallbackWorker()) showFallback("เว็บเล่นช่องนี้ไม่ได้ ให้กด PLAYER/MX ด้านบน");
    }
  },2800);
}

function startTsNoJumpWatchdog(usingTsEngine,fallbackWorker){
  if(watchdog) clearInterval(watchdog);

  let last=0;
  let stuck=0;
  let noData=0;
  let lastAction=0;

  watchdog=setInterval(()=>{
    const box=document.getElementById("player-container");
    if(box.style.display!=="block"){
      clearInterval(watchdog);
      watchdog=null;
      return;
    }

    forceAudio();

    if(video.paused && video.readyState>=2){
      video.play().catch(()=>{});
      return;
    }

    if(video.readyState<2){
      noData++;
      setStatus("กำลังรอสัญญาณ...");
      if(noData>=3 && typeof fallbackWorker==="function"){
        if(fallbackWorker()) return;
      }
      return;
    }else{
      noData=0;
    }

    if(Math.abs((video.currentTime||0)-last)<0.05) stuck++;
    else stuck=0;

    last=video.currentTime||0;

    // ไม่ unload/load เพราะทำให้ภาพกระโดด ให้แค่ play ต่อ
    if(stuck>=8){
      const now=Date.now();
      if(now-lastAction>12000){
        lastAction=now;
        setStatus("สัญญาณนิ่ง กำลังเล่นต่อ...");
        try{video.play().catch(()=>{})}catch(e){}
      }
      stuck=0;
    }
  },4000);
}

async function playMPD(url){
  activeUrl=url;
  video.style.display="block";
  if(!window.shaka){showFallback("เครื่องนี้ไม่รองรับ MPD ให้กด PLAYER/MX");return}
  try{
    shaka.polyfill.installAll();
    shakaPlayer=new shaka.Player(video);
    shakaPlayer.configure({streaming:{bufferingGoal:20,rebufferingGoal:3,bufferBehind:12,retryParameters:{maxAttempts:4,timeout:20000}}});
    setStatus("กำลังโหลด MPD...");
    await shakaPlayer.load(url);
    forceAudio();video.play().catch(()=>{});
    setStatus("กำลังเล่น MPD");
    startWatchdog(()=>{try{shakaPlayer.retryStreaming();video.play().catch(()=>{})}catch(e){}});
  }catch(e){console.log(e);showFallback("MPD เล่นในเว็บไม่ได้ ให้กด PLAYER/MX")}
}
function startWatchdog(recover){
  if(watchdog) clearInterval(watchdog);
  let last=0,stuck=0;
  watchdog=setInterval(()=>{
    const box=document.getElementById("player-container");
    if(box.style.display!=="block"){clearInterval(watchdog);watchdog=null;return}
    forceAudio();
    if(video.paused&&video.readyState>=2){video.play().catch(()=>{});return}
    if(video.readyState<2){setStatus("กำลังรอสัญญาณ...");return}
    if(Math.abs((video.currentTime||0)-last)<.05) stuck++; else stuck=0;
    last=video.currentTime||0;
    if(stuck>=8){setStatus("สัญญาณค้าง กำลังต่อใหม่...");recover&&recover();stuck=0}
  },4000);
}
function openIntent(url,pkg){
  url=url||activeOriginalUrl||activeUrl;
  if(!url)return;
  try{
    const u=new URL(url),scheme=u.protocol.replace(":",""),hostPath=u.host+u.pathname+(u.search||"");
    let intent="intent://"+hostPath+"#Intent;scheme="+scheme+";action=android.intent.action.VIEW;type=video/*";
    if(pkg)intent+=";package="+pkg;
    intent+=";S.browser_fallback_url="+encodeURIComponent(url)+";end";
    window.location.href=intent;
  }catch(e){window.location.href=url}
}
function openExternal(){openIntent(activeOriginalUrl||activeUrl,"")}
function openMX(){openIntent(activeOriginalUrl||activeUrl,"com.mxtech.videoplayer.ad")}
function restartCurrent(){if(activeChannel)loadChannel(activeChannel,activeElement)}
async function closePlayer(){await stopAll();const box=document.getElementById("player-container");box.style.display="none";box.classList.remove("show-ui","show-status","show-fallback");setTimeout(()=>activeElement?.focus(),150)}
function goHome(){window.location.href="https://tiea9999.github.io/tv-online/index.html"}

["mousemove","mousedown","touchstart","touchmove","pointermove","pointerdown","click"].forEach(ev=>{
  document.getElementById("player-container").addEventListener(ev,showUI,{passive:true});
});
document.addEventListener("keydown",e=>{
  const box=document.getElementById("player-container");
  if(box.style.display==="block"){
    showUI();
    if(e.key==="Escape"||e.key==="Backspace"||e.key==="BrowserBack"||e.keyCode===10009){e.preventDefault();closePlayer();return}
    if(e.key==="ArrowLeft"||e.keyCode===21){try{video.currentTime=Math.max(0,(video.currentTime||0)-15);setStatus("⏪ ย้อนกลับ 15 วิ")}catch(err){}}
    if(e.key==="ArrowRight"||e.keyCode===22){try{video.currentTime=(video.currentTime||0)+15;setStatus("⏩ เดินหน้า 15 วิ")}catch(err){}}
    if(e.key==="Enter"||e.key==="OK"||e.key===" "||e.keyCode===23||e.keyCode===66||e.keyCode===179){
      e.preventDefault();
      try{if(video.paused){video.play().catch(()=>{});setStatus("▶ เล่น")}else{video.pause();setStatus("⏸ หยุด")}}catch(err){}
    }
  }
});
document.getElementById("m3uFile").addEventListener("change",async e=>{
  const file=e.target.files&&e.target.files[0]; if(!file)return;
  try{
    setLoad("กำลังอ่านไฟล์...");
    const txt=await file.text();
    channels=parseM3U(txt);
    renderChannels(channels);
    setLoad("อ่านไฟล์สำเร็จ "+channels.length+" ช่อง");
  }catch(err){setLoad("อ่านไฟล์ไม่สำเร็จ")}
});
document.addEventListener("DOMContentLoaded",()=>{setTimeout(loadDefaultM3U,300)});
