<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIEA IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<script src="https://ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
<script>jwplayer.key="XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";</script>

<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.movie-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}
.movie-card{background:#111;border-radius:10px;cursor:pointer}
.movie-card img{width:100%;height:150px;object-fit:contain;background:#000}
.movie-title{text-align:center;font-size:13px;padding:5px}
#player-container{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;z-index:9999}
video,#jw-player{width:100%;height:100%}
.close-btn{position:absolute;top:10px;right:10px;background:red;border:none;color:#fff;padding:10px}
</style>
</head>

<body>

<div class="movie-grid" id="movieGrid"></div>

<div id="player-container">
<button class="close-btn" onclick="closePlayer()">ปิด</button>

<video id="videoPlayer" controls playsinline autoplay muted></video>
<div id="jw-player" style="display:none;"></div>

</div>

<script>

/* ================= PLAYLIST (ของเดิมคุณ) ================= */
const PLAYLIST = "https://raw.githubusercontent.com/tiea9999/tv/refs/heads/main/M3U/Dooball.json";

let video = document.getElementById("videoPlayer");
let jwInstance = null;
let hls = null;

/* ================= VOLUME FIX ================= */
function setDefaultVolumeHTML5(){
    video.muted = true;
    video.volume = 1.0;

    setTimeout(()=>{
        video.muted = false;
    },300);
}

function setDefaultVolumeJW(){
    if(jwInstance){
        jwInstance.setVolume(100);
    }
}

/* ================= RESET ================= */
function resetPlayers(){

    if(hls){
        try{ hls.destroy(); }catch(e){}
        hls = null;
    }

    if(jwInstance){
        try{
            jwInstance.stop();
            jwInstance.remove();
        }catch(e){}
        jwInstance = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    video.style.display="block";
    document.getElementById("jw-player").style.display="none";
}

/* ================= PLAY ================= */
function playStream(url){

    resetPlayers();

    document.getElementById("player-container").style.display="block";

    const lower = url.toLowerCase();

    // ===== MP4 =====
    if(lower.includes(".mp4")){
        video.src = url;
        setDefaultVolumeHTML5();

        video.play().then(()=>{video.muted=false}).catch(()=>{});
        retryPlay();
        return;
    }

    // ===== HLS =====
    if(lower.includes(".m3u8")){

        if(Hls.isSupported()){

            hls = new Hls({
                enableWorker:true,
                manifestLoadingMaxRetry:6,
                fragLoadingMaxRetry:6
            });

            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function(){
                setDefaultVolumeHTML5();
                video.play().then(()=>{video.muted=false}).catch(()=>{});
                retryPlay();
            });

        }else{
            video.src = url;
            setDefaultVolumeHTML5();
            video.play().then(()=>{video.muted=false}).catch(()=>{});
            retryPlay();
        }

        return;
    }

    // ===== DASH =====
    if(lower.includes(".mpd")){
        const dash = dashjs.MediaPlayer().create();
        dash.initialize(video, url, true);
        setDefaultVolumeHTML5();
        retryPlay();
        return;
    }

    // ===== JW =====
    startJW(url);
}

/* ================= JW ================= */
function startJW(url){

    video.style.display="none";
    document.getElementById("jw-player").style.display="block";

    jwInstance = jwplayer("jw-player").setup({
        file:url,
        width:"100%",
        height:"100%",
        autostart:true
    });

    jwInstance.on('ready', function(){
        setDefaultVolumeJW();
    });
}

/* ================= RETRY ================= */
function retryPlay(){
    setTimeout(()=>{
        if(video.paused){
            video.play().catch(()=>{});
        }
    },1000);
}

/* ================= CLOSE ================= */
function closePlayer(){
    resetPlayers();
    document.getElementById("player-container").style.display="none";
}

/* ================= LOAD ================= */
async function load(){

    const res = await fetch(PLAYLIST);
    const data = await res.json();

    const grid = document.getElementById("movieGrid");

    data.forEach(ch=>{
        const div = document.createElement("div");
        div.className="movie-card";

        div.innerHTML = `
        <img src="${ch.poster || ''}">
        <div class="movie-title">${ch.title}</div>
        `;

        div.onclick = ()=>{
            playStream(ch.stream || ch.url);
        };

        grid.appendChild(div);
    });

}

load();

</script>

</body>
</html>
