<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIEA IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<script src="https://ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
<script>jwplayer.key="XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";</script>

<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:sans-serif}
.movie-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:10px}
.movie-card{background:#1b1b1b;border-radius:10px;cursor:pointer}
.movie-card img{width:100%;height:140px;object-fit:contain;background:#000}
.movie-title{text-align:center;padding:5px;font-size:13px}

#player-container{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#000;display:none;z-index:9999;
}

video,#jw-player{width:100%;height:100%}

.close-btn{
position:absolute;top:10px;right:10px;
background:red;border:none;color:#fff;
width:40px;height:40px;border-radius:50%;
}
</style>
</head>

<body>

<div id="movieGrid" class="movie-grid"></div>

<div id="player-container">
<button class="close-btn" onclick="closePlayer()">✕</button>

<!-- 🔥 แก้ autoplay -->
<video id="videoPlayer" controls playsinline autoplay muted></video>
<div id="jw-player" style="display:none;"></div>

</div>

<script>

let video = document.getElementById("videoPlayer");
let jwInstance = null;
let hls = null;

/* ================= 🔥 FIX VOLUME ================= */
function setDefaultVolumeHTML5(){
    video.muted = true;
    video.volume = 1.0;

    setTimeout(()=>{
        video.muted = false;
    },300);
}

function setDefaultVolumeJW(){
    if(jwInstance){
        jwInstance.setVolume(100);
    }
}

/* ================= RESET ================= */
function resetPlayers(){

    if(hls){
        try{ hls.destroy(); }catch(e){}
        hls=null;
    }

    if(jwInstance){
        try{
            jwInstance.stop();
            jwInstance.remove();
        }catch(e){}
        jwInstance=null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    video.style.display="block";
    document.getElementById("jw-player").style.display="none";
}

/* ================= PLAY ================= */
function playStream(channel){

    resetPlayers();

    document.getElementById("player-container").style.display="block";

    let url = channel.url || channel.stream;
    if(!url && channel.servers && channel.servers.length){
        url = channel.servers[0].url;
    }

    if(!url) return;

    url = url.toLowerCase();

    // ===== MP4 =====
    if(url.includes(".mp4")){
        video.src = url;
        setDefaultVolumeHTML5();

        video.play().then(()=>{video.muted=false}).catch(()=>{});
        retryPlay();
        return;
    }

    // ===== HLS =====
    if(url.includes(".m3u8")){

        if(Hls.isSupported()){

            hls = new Hls({
                manifestLoadingMaxRetry:6,
                fragLoadingMaxRetry:6
            });

            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function(){
                setDefaultVolumeHTML5();

                video.play().then(()=>{video.muted=false}).catch(()=>{});
                retryPlay();
            });

        }else{
            video.src = url;
            setDefaultVolumeHTML5();

            video.play().then(()=>{video.muted=false}).catch(()=>{});
            retryPlay();
        }

        return;
    }

    // ===== DASH =====
    if(url.includes(".mpd")){
        const dash = dashjs.MediaPlayer().create();
        dash.initialize(video, url, true);
        setDefaultVolumeHTML5();
        retryPlay();
        return;
    }

    // ===== JW =====
    startJW(url);
}

/* ================= JW ================= */
function startJW(url){

    video.style.display="none";
    document.getElementById("jw-player").style.display="block";

    jwInstance = jwplayer("jw-player").setup({
        file:url,
        width:"100%",
        height:"100%",
        autostart:true
    });

    jwInstance.on('ready', function(){
        setDefaultVolumeJW();
    });
}

/* ================= RETRY ================= */
function retryPlay(){
    setTimeout(()=>{
        if(video.paused){
            video.play().catch(()=>{});
        }
    },1000);
}

/* ================= CLOSE ================= */
function closePlayer(){
    resetPlayers();
    document.getElementById("player-container").style.display="none";
}

/* ================= LOAD (รองรับ JSON คุณ) ================= */
async function load(){

    const url = "https://raw.githubusercontent.com/tiea9999/tv/refs/heads/main/M3U/Dooball.json";
    const res = await fetch(url);
    const data = await res.json();

    const grid = document.getElementById("movieGrid");

    // รองรับหลายรูปแบบ JSON
    let list = [];

    if(data.groups){
        data.groups.forEach(g=>{
            g.stations.forEach(s=>{
                list.push({
                    title: s.name || "ไม่มีชื่อ",
                    logo: s.image || g.image || "",
                    url: s.url
                });
            });
        });
    }
    else if(Array.isArray(data)){
        list = data;
    }

    list.forEach(ch=>{
        const card = document.createElement("div");
        card.className="movie-card";

        card.innerHTML = `
        <img src="${ch.logo || ''}">
        <div class="movie-title">${ch.title}</div>
        `;

        card.onclick = ()=>{
            playStream(ch);
        };

        grid.appendChild(card);
    });

}

load();

</script>

</body>
</html>
