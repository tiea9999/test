<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TIEA SIMPLE M3U FINAL</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.10.9/shaka-player.compiled.min.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}
.top{
  position:sticky;
  top:0;
  z-index:999;
  background:#111;
  padding:10px;
}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #555;
  background:#000;
  color:#fff;
  box-sizing:border-box;
}
button{
  margin-top:8px;
  padding:10px 14px;
  border-radius:999px;
  border:0;
  background:orange;
  color:#000;
  font-weight:bold;
}
#status{
  padding:8px;
  color:#9ff;
  font-size:13px;
}
.group{
  color:cyan;
  font-size:18px;
  font-weight:bold;
  padding:10px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:10px;
  padding:10px;
}
.card{
  background:#1a1a1a;
  border:2px solid #333;
  border-radius:12px;
  padding:8px;
  text-align:center;
}
.card img{
  width:100%;
  height:170px;
  object-fit:cover;
  border-radius:10px;
}
.card div{
  margin-top:6px;
  font-size:12px;
}
#playerBox{
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999;
  display:none;
}
video{
  width:100%;
  height:100%;
  background:#000;
}
.ctrl{
  position:absolute;
  top:10px;
  left:10px;
  z-index:10000;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.ctrl button{
  margin:0;
}
</style>
</head>
<body>

<div class="top">
<input id="m3u" value="https://www.dropbox.com/scl/fi/p7ce77polkqconjm0xbj7/tv_channels_iptv591-gmail.com_plus.m3u?rlkey=aebh95dzko8z59d9d8cxpdnao&dl=1">
<button onclick="loadM3U()">โหลด M3U</button>
<div id="status">พร้อมโหลด</div>
</div>

<div id="app"></div>

<div id="playerBox">
  <div class="ctrl">
    <button onclick="closePlayer()">X ปิด</button>
    <button onclick="openExternal()">▶ PLAYER</button>
    <button onclick="openMX()">▶ MX</button>
  </div>
  <video id="video" controls autoplay playsinline webkit-playsinline></video>
</div>

<script>
const WORKER="https://iptv.tawatchai250958.workers.dev/?url=";
let currentUrl="";
let hls=null;
let tsPlayer=null;
let shakaPlayer=null;

function setStatus(t){
 document.getElementById('status').textContent=t;
}

function worker(url){
 return WORKER+encodeURIComponent(url);
}

async function loadM3U(){
  try{
    setStatus("กำลังโหลดรายการ...");
    const raw=document.getElementById('m3u').value.trim()
      .replace("www.dropbox.com","dl.dropboxusercontent.com")
      .replace("?dl=1","")
      .replace("&dl=1","");

    let text="";

    try{
      text=await fetch(raw).then(r=>r.text());
    }catch(e){
      text=await fetch(worker(raw)).then(r=>r.text());
    }

    if(!text.includes("#EXTM3U")){
      throw new Error("ไม่ใช่ไฟล์ M3U");
    }

    render(parseM3U(text));
  }catch(e){
    console.log(e);
    setStatus("โหลดไม่สำเร็จ");
  }
}

function parseM3U(text){
  const lines=text.split("\n");
  const out=[];
  let meta=null;

  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();

    if(line.startsWith("#EXTINF")){
      meta=line;
      continue;
    }

    if(meta && line.startsWith("http")){
      const name=(meta.split(",")[1]||"ไม่มีชื่อ").trim();
      const logo=(meta.match(/tvg-logo="([^"]+)"/)||[])[1]||"";
      const group=(meta.match(/group-title="([^"]+)"/)||[])[1]||"อื่นๆ";

      out.push({
        name,logo,group,url:line
      });

      meta=null;
    }
  }

  return out;
}

function render(list){
  const app=document.getElementById('app');
  app.innerHTML="";

  const groups={};

  list.forEach(ch=>{
    if(!groups[ch.group]) groups[ch.group]=[];
    groups[ch.group].push(ch);
  });

  Object.keys(groups).forEach(g=>{
    const title=document.createElement('div');
    title.className='group';
    title.textContent=g;
    app.appendChild(title);

    const grid=document.createElement('div');
    grid.className='grid';

    groups[g].forEach(ch=>{
      const c=document.createElement('div');
      c.className='card';
      c.innerHTML=`
        <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/300x450?text=TV'">
        <div>${ch.name}</div>
      `;
      c.onclick=()=>play(ch.url);
      grid.appendChild(c);
    });

    app.appendChild(grid);
  });

  setStatus("โหลดสำเร็จ "+list.length+" ช่อง");
}

async function stopAll(){
  try{ if(hls){hls.destroy();hls=null;} }catch(e){}
  try{ if(tsPlayer){tsPlayer.destroy();tsPlayer=null;} }catch(e){}
  try{ if(shakaPlayer){await shakaPlayer.destroy();shakaPlayer=null;} }catch(e){}
}

async function play(url){
  currentUrl=url;
  document.getElementById('playerBox').style.display='block';

  const v=document.getElementById('video');
  await stopAll();

  const low=url.toLowerCase();

  if(low.includes(".mpd")){
    playMPD(url);
    return;
  }

  if(low.includes(".m3u8")){
    playHLS(url);
    return;
  }

  playTS(url);
}

function playHLS(url){
  const v=document.getElementById('video');

  if(Hls.isSupported()){
    hls=new Hls({
      maxBufferLength:30,
      maxMaxBufferLength:60,
      backBufferLength:10,
      enableWorker:false
    });

    hls.loadSource(url);
    hls.attachMedia(v);

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      v.play().catch(()=>{});
    });

    hls.on(Hls.Events.ERROR,()=>{
      if(!url.includes("workers.dev")){
        playHLS(worker(url));
      }
    });
  }else{
    v.src=url;
    v.play().catch(()=>{});
  }
}

function playTS(url){
  const v=document.getElementById('video');

  if(window.mpegts && mpegts.getFeatureList().mseLivePlayback){
    tsPlayer=mpegts.createPlayer({
      type:'mpegts',
      url:url,
      isLive:true
    },{
      enableStashBuffer:true,
      stashInitialSize:1024*512
    });

    tsPlayer.attachMediaElement(v);
    tsPlayer.load();

    setTimeout(()=>{
      v.play().catch(()=>{});
    },300);

    tsPlayer.on(mpegts.Events.ERROR,()=>{
      if(!url.includes("workers.dev")){
        playTS(worker(url));
      }
    });
  }else{
    v.src=url;
    v.play().catch(()=>{});
  }
}

async function playMPD(url){
  const v=document.getElementById('video');

  shaka.polyfill.installAll();

  shakaPlayer=new shaka.Player(v);

  try{
    await shakaPlayer.load(url);
    v.play().catch(()=>{});
  }catch(e){
    if(!url.includes("workers.dev")){
      playMPD(worker(url));
    }
  }
}

function closePlayer(){
  stopAll();
  document.getElementById('playerBox').style.display='none';
}

function openExternal(){
  window.location.href=currentUrl;
}

function openMX(){
  try{
    const u=new URL(currentUrl);
    const scheme=u.protocol.replace(":","");
    const host=u.host+u.pathname+(u.search||"");
    const intent='intent://'+host+'#Intent;scheme='+scheme+';package=com.mxtech.videoplayer.ad;action=android.intent.action.VIEW;type=video/*;end';
    location.href=intent;
  }catch(e){
    openExternal();
  }
}

loadM3U();
</script>

</body>
</html>
