    <script>
const WORKER_PROXY = "https://iptv.tawatchai250958.workers.dev/?url=";
const DEFAULT_JSON_URL = "https://raw.githubusercontent.com/tiea9999/tv-online/main/M3U/Dooball.json";
const FALLBACK_LOGO = "https://dl.dropboxusercontent.com/scl/fi/k77ovxc35qm0girjo43mt/logo.png?rlkey=1x7w8nk1fl6gptnt9jiaugt54";

let channels = []; // ใช้ JSON หลักอย่างเดียว: ลบรายการเก่าออกแล้ว



function clean(v){ return String(v || "").trim(); }

function setLoad(text){
  const el = document.getElementById("load-status");
  if(el) el.textContent = text || "";
}

function pick(obj, keys){
  for(const k of keys){
    if(obj && obj[k] !== undefined && obj[k] !== null && clean(obj[k]) !== "") return obj[k];
  }
  return "";
}

function extractDrm(src){
  const out = { drm:false, keyId:"", key:"" };
  if(!src || typeof src !== "object") return out;

  if(src.keyId && src.key){
    out.drm = src.drm !== false;
    out.keyId = clean(src.keyId);
    out.key = clean(src.key);
    return out;
  }

  // รองรับแบบ key: { "kid": "key" }
  if(src.key && typeof src.key === "object"){
    const kid = Object.keys(src.key)[0];
    if(kid && src.key[kid]){
      out.drm = true;
      out.keyId = clean(kid);
      out.key = clean(src.key[kid]);
      return out;
    }
  }

  // รองรับ drm: { keyId:"", key:"" } หรือ drm:{clearKeys:{kid:key}}
  if(src.drm && typeof src.drm === "object"){
    if(src.drm.keyId && src.drm.key){
      out.drm = true;
      out.keyId = clean(src.drm.keyId);
      out.key = clean(src.drm.key);
      return out;
    }
    if(src.drm.clearKeys && typeof src.drm.clearKeys === "object"){
      const kid = Object.keys(src.drm.clearKeys)[0];
      if(kid && src.drm.clearKeys[kid]){
        out.drm = true;
        out.keyId = clean(kid);
        out.key = clean(src.drm.clearKeys[kid]);
        return out;
      }
    }
  }

  if(src.drm === true) out.drm = true;
  return out;
}

function normalizeJsonChannel(item, parentGroup){
  if(!item || typeof item !== "object") return null;

  let server = item;
  if(Array.isArray(item.servers) && item.servers.length){
    // เลือก server แรกที่มี url
    server = item.servers.find(s => pick(s,["file","url","stream","link","source","src"])) || item.servers[0];
  }

  const file = pick(server,["file","url","stream","link","source","src"]) || pick(item,["file","url","stream","link","source","src"]);
  if(!file) return null;

  const name = pick(item,["name","title","channel","label"]) || pick(server,["name","title"]) || "ไม่มีชื่อ";
  const logo = pick(item,["logo","poster","image","thumb","cover","icon"]) || pick(server,["logo","poster","image"]) || FALLBACK_LOGO;
  const group = pick(item,["group","group-title","category","cat"]) || pick(server,["group","group-title","category","cat"]) || parentGroup || "อื่นๆ";

  const drmInfo = extractDrm(server);
  if(!drmInfo.keyId && !drmInfo.key){
    const itemDrm = extractDrm(item);
    if(itemDrm.drm){
      drmInfo.drm = itemDrm.drm;
      drmInfo.keyId = itemDrm.keyId;
      drmInfo.key = itemDrm.key;
    }
  }

  return {
    name: clean(name),
    logo: clean(logo) || FALLBACK_LOGO,
    group: clean(group) || "อื่นๆ",
    file: clean(file),
    drm: !!drmInfo.drm,
    keyId: drmInfo.keyId || "",
    key: drmInfo.key || ""
  };
}

function collectJsonChannels(data, parentGroup, out){
  out = out || [];
  if(Array.isArray(data)){
    data.forEach(x => collectJsonChannels(x, parentGroup, out));
    return out;
  }
  if(!data || typeof data !== "object") return out;

  const groupTitle = pick(data,["group","group-title","category","name","title"]) || parentGroup || "";

  const one = normalizeJsonChannel(data, parentGroup);
  if(one) out.push(one);

  ["items","channels","data","list","rows","videos","episodes"].forEach(k=>{
    if(Array.isArray(data[k])){
      data[k].forEach(x => collectJsonChannels(x, groupTitle, out));
    }
  });
  return out;
}

function parseJSONChannels(text){
  const data = typeof text === "string" ? JSON.parse(text) : text;
  const arr = collectJsonChannels(data, "", []);
  const seen = new Set();
  return arr.filter(ch=>{
    const key = (ch.name + "|" + ch.file).toLowerCase();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

async function fetchText(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms || 12000);
  try{
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), {
      cache:"no-store",
      signal:controller.signal
    });
    clearTimeout(timer);
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.text();
  }catch(e){
    clearTimeout(timer);
    throw e;
  }
}

async function loadDefaultJSON(){
  try{
    setLoad("กำลังโหลด JSON...");
    const txt = await fetchText(DEFAULT_JSON_URL, 12000);
    channels = parseJSONChannels(txt);
    renderChannels(channels);
    setLoad("โหลด JSON สำเร็จ " + channels.length + " ช่อง");
  }catch(e){
    console.log(e);
    setLoad("โหลด JSON ไม่สำเร็จ กรุณาตรวจลิงก์ JSON หรือเลือกไฟล์จากเครื่อง");
    channels = [];
    renderChannels(channels);
  }
}

function renderChannels(list){
  const listContainer = document.getElementById("channel-list");
  if(!listContainer) return;
  listContainer.innerHTML = "";

  if(!list || !list.length){
    listContainer.innerHTML = '<div style="text-align:center;color:#ffcc66;padding:30px">ไม่พบรายการ</div>';
    return;
  }

  const groups = {};
  list.forEach(ch=>{
    const g = ch.group || "อื่นๆ";
    (groups[g] || (groups[g] = [])).push(ch);
  });

  Object.keys(groups).forEach(group=>{
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = "📺 " + group + " (" + groups[group].length + ")";
    listContainer.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "channel-grid";

    groups[group].forEach(ch=>{
      const div = document.createElement("div");
      div.className = "channel";
      div.tabIndex = 0;

      const img = document.createElement("img");
      img.src = ch.logo || FALLBACK_LOGO;
      img.onerror = function(){ this.src = FALLBACK_LOGO; };

      const span = document.createElement("span");
      span.textContent = ch.name || "IPTV";

      div.appendChild(img);
      div.appendChild(span);

      div.onclick = ()=>loadChannel(ch, div);
      div.onkeydown = e=>{
        if(e.key === "Enter" || e.key === "OK" || e.key === " " || e.keyCode === 23 || e.keyCode === 66){
          e.preventDefault();
          loadChannel(ch, div);
        }
      };

      grid.appendChild(div);
    });

    listContainer.appendChild(grid);
  });

  setTimeout(()=>document.querySelector(".channel")?.focus(), 250);
}


let currentHls = null;
let shakaPlayer = null;
let hlsWatchdog = null;
let activeChannel = null;
let activeElement = null;

  box.textContent = text || "";
  box.style.display = text ? "block" : "none";
  if(autoHide && text){

    setStatus._timer = setTimeout(()=>{ box.style.display = "none"; }, 5000);

function proxyUrl(url){

  const video = document.getElementById("html5-player");
  try{
    video.muted = false;
    video.defaultMuted = false;

}

function openExternal(url){
  url = url || activeUrl || (activeChannel ? activeChannel.file : "");
  if(!url) return;
  try{
    const u = new URL(url);
    const scheme = u.protocol.replace(":","");
    const hostPath = u.host + u.pathname + (u.search || "");
    const intent = "intent://" + hostPath +
      "#Intent;scheme=" + scheme +
      ";action=android.intent.action.VIEW;type=video/*;S.browser_fallback_url=" +
      encodeURIComponent(url) + ";end";
    window.location.href = intent;
  }catch(e){
    window.location.href = url;
  }
}

  const video = document.getElementById("html5-player");

async function loadChannel(channel, element){
  activeChannel = channel;
  activeElement = element;

  document.querySelectorAll(".channel").forEach(ch=>ch.classList.remove("active"));
  if(element) element.classList.add("active");

  document.getElementById("player-container").style.display = "block";
  forceShowControls();
  await stopAllPlayers();

  const url = proxyUrl(channel.file);
  activeUrl = url;

  if(url.includes(".mpd")){
    playMPDNotice(channel, url);
  }else{
    useHLS_STABLE(url);
  }

  setTimeout(()=>{
    const btn = document.getElementById("closeBtn");
    if(btn) btn.focus();
  },300);
}

/* ================= MPD FAST V2 =================
   สูตรนี้เน้น "กดแล้วมาไว" สำหรับ MPD/DRM:
   - บัฟเฟอร์เริ่มต้นสั้นมาก
   - ปิด ABR ตอนเริ่ม แล้วบังคับเลือกคุณภาพต่ำสุดก่อน
   - เมื่อภาพมาแล้ว ค่อยปล่อยให้เล่นต่อ ไม่รอบัฟเฟอร์ยาว
*/
let mpdPlayToken = 0;
let mpdFastTimer = null;

function chooseLowestMpdTrack(player, video){
  try{
    const tracks = player.getVariantTracks()
      .filter(t => t.active || t.type === 'variant' || t.bandwidth)
      .sort((a,b)=>(a.bandwidth||999999999)-(b.bandwidth||999999999));

    if(tracks && tracks.length){
      // เลือกความละเอียด/บิตเรตต่ำสุดก่อน เพื่อไม่ให้เห็นภาพแล้วค้างรอนาน
      player.selectVariantTrack(tracks[0], true, 0);
      setStatus('เริ่มภาพไว: ใช้ความละเอียดต่ำก่อน...', true);
      setTimeout(()=>{ try{ video.play().catch(()=>{}); }catch(e){} }, 80);
    }
  }catch(e){
    console.log('chooseLowestMpdTrack error', e);
  }
}

function playMPDNotice(channel, url){
  const token = ++mpdPlayToken;
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");

  if(mpdFastTimer){ clearInterval(mpdFastTimer); mpdFastTimer = null; }
  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  video.autoplay = true;
  video.preload = "auto";
  forceAudio100();

  setStatus("กำลังเปิด MPD แบบเร็วสุด...", true);

  try{
    if(!window.shaka){
      setStatus("เครื่องนี้ไม่รองรับ Shaka/MPD ให้กด PLAYER/MX", false);
      return;
    }

    shaka.polyfill.installAll();
    if(!shaka.Player.isBrowserSupported()){
      setStatus("เครื่องนี้ไม่รองรับ MPD/DRM ในเว็บ ให้กด PLAYER/MX", false);
      return;
    }

    shakaPlayer = new shaka.Player(video);

    shakaPlayer.configure({
      streaming:{
        // ค่านี้ไวกว่าเดิมมาก ลดอาการโชว์ภาพแล้วรอ 20-30 วิ
        bufferingGoal: 2,
        rebufferingGoal: 0.15,
        bufferBehind: 3,
        startAtSegmentBoundary: false,
        jumpLargeGaps: true,
        smallGapLimit: 2,
        lowLatencyMode: true,
        retryParameters:{
          maxAttempts: 2,
          baseDelay: 150,
          backoffFactor: 1.15,
          timeout: 7000
        }
      },
      manifest:{
        retryParameters:{
          maxAttempts: 2,
          baseDelay: 150,
          backoffFactor: 1.15,
          timeout: 7000
        }
      },
      abr:{
        // ปิด ABR ตอนเริ่ม เพื่อไม่ให้เลือกไฟล์ใหญ่จนค้าง
        enabled: false,
        defaultBandwidthEstimate: 350000
      }
    });

    if(channel && channel.drm && channel.keyId && channel.key){
      shakaPlayer.configure({
        drm:{
          clearKeys:{[channel.keyId]:channel.key},
          retryParameters:{
            maxAttempts: 2,
            baseDelay: 150,
            backoffFactor: 1.15,
            timeout: 7000
          }
        }
      });
    }

    shakaPlayer.addEventListener('buffering', function(e){
      if(token !== mpdPlayToken) return;
      if(e.buffering){
        setStatus("เติมบัฟเฟอร์สั้น ๆ...", true);
        try{ video.play().catch(()=>{}); }catch(err){}
      }
    });

    shakaPlayer.addEventListener('trackschanged', function(){
      if(token !== mpdPlayToken) return;
      chooseLowestMpdTrack(shakaPlayer, video);
    });

    shakaPlayer.addEventListener('error', function(e){
      console.log('SHAKA ERROR', e.detail || e);
    });

    // สั่ง play ไว้ก่อน บาง WebView จะเริ่มทันทีเมื่อ source พร้อม
    video.play().catch(()=>{});

    shakaPlayer.load(url).then(()=>{
      if(token !== mpdPlayToken) return;
      forceAudio100();
      chooseLowestMpdTrack(shakaPlayer, video);
      video.play().catch(()=>{});
      setStatus("กำลังเล่น MPD", true);

      // กระตุ้นช่วง 10 วิแรก ลดอาการภาพมาแล้วนิ่ง
      let tick = 0;
      mpdFastTimer = setInterval(()=>{
        if(token !== mpdPlayToken){ clearInterval(mpdFastTimer); mpdFastTimer=null; return; }
        tick++;
        forceAudio100();
        try{
          if(video.paused || video.readyState < 2) video.play().catch(()=>{});
          if(tick === 4) chooseLowestMpdTrack(shakaPlayer, video);
        }catch(e){}
        if(tick >= 10){ clearInterval(mpdFastTimer); mpdFastTimer=null; }
      }, 1000);
    }).catch(e=>{
      if(token !== mpdPlayToken) return;
      console.log("MPD เล่นในเว็บไม่ได้:", e);
      setStatus("MPD เล่นในเว็บนี้ไม่ได้ ให้กด PLAYER/MX", false);
    });

    setTimeout(()=>{ if(token===mpdPlayToken){ forceAudio100(); video.play().catch(()=>{}); } }, 150);
    setTimeout(()=>{ if(token===mpdPlayToken){ forceAudio100(); video.play().catch(()=>{}); } }, 500);
    setTimeout(()=>{ if(token===mpdPlayToken){ forceAudio100(); video.play().catch(()=>{}); } }, 1200);

  }catch(e){
    console.log("MPD ERROR:", e);
    setStatus("MPD เล่นในเว็บนี้ไม่ได้ ให้กด PLAYER/MX", false);
  }
}

/* ================= HLS STABLE CLASSIC ================= */
function useHLS_STABLE(url){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");

  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(Hls.isSupported() && url.includes(".m3u8")){
    setStatus("กำลังโหลด HLS...");

    currentHls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,

      // สูตรเดิมที่นิ่งกว่า: ไม่ล็อกคุณภาพแข็งเกินไป
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      backBufferLength: 20,
      maxBufferHole: 0.5,
      highBufferWatchdogPeriod: 3,

      manifestLoadingMaxRetry: 5,
      manifestLoadingRetryDelay: 1000,
      manifestLoadingMaxRetryTimeout: 8000,
      levelLoadingMaxRetry: 5,
      levelLoadingRetryDelay: 1000,
      levelLoadingMaxRetryTimeout: 8000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 1000,
      fragLoadingMaxRetryTimeout: 10000,

      startFragPrefetch: true,
      capLevelToPlayerSize: true,
      testBandwidth: false,
      abrEwmaDefaultEstimate: 1200000
    });

    currentHls.loadSource(url);
    currentHls.attachMedia(video);

    currentHls.on(Hls.Events.MANIFEST_PARSED, function(){
      forceAudio100();
      video.play().catch(()=>{});
      setTimeout(()=>{ forceAudio100(); video.play().catch(()=>{}); },300);
      setStatus("กำลังเล่น HLS");
    });

    currentHls.on(Hls.Events.BUFFER_STALLED, function(){
      setStatus("กำลังเติมบัฟเฟอร์...", true);
    });

    currentHls.on(Hls.Events.ERROR, function(event, data){
      console.log("HLS ERROR:", data);
      if(!currentHls) return;

      if(data.fatal){
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
          setStatus("เน็ตเวิร์กสะดุด กำลังโหลดต่อ...");
          try{ currentHls.startLoad(); }catch(e){}
        }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
          setStatus("สัญญาณวิดีโอสะดุด กำลังกู้คืน...");
          try{ currentHls.recoverMediaError(); }catch(e){}
        }else{
          setStatus("เล่นไม่ได้ กำลังลองโหลดใหม่...", false);
          try{
            currentHls.destroy();
            currentHls = null;
            setTimeout(()=>useHLS_STABLE(url), 1200);
          }catch(e){}
        }
      }
    });

    // watchdog แบบเบา ไม่รีโหลดถี่เกินไป
    let lastTime = 0;
    let stuckCount = 0;
    hlsWatchdog = setInterval(()=>{
      if(document.getElementById("player-container").style.display !== "block") return;
      if(!currentHls) return;

      forceAudio100();

      if(video.paused || video.readyState < 2){
        try{ currentHls.startLoad(); }catch(e){}
        video.play().catch(()=>{});
        return;
      }

      if(Math.abs(video.currentTime - lastTime) < 0.05){
        stuckCount++;
      }else{
        stuckCount = 0;
      }

      lastTime = video.currentTime;

      if(stuckCount >= 4){
        setStatus("ภาพค้าง กำลังกู้คืน...");
        try{ currentHls.startLoad(); }catch(e){}
        video.play().catch(()=>{});
        stuckCount = 0;
      }
    }, 3000);

  }else{
    video.src = url;
    setTimeout(()=>{
      forceAudio100();
      video.play().catch(()=>{});
    },300);
  }
}

function restartCurrent(){
  if(activeChannel) loadChannel(activeChannel, activeElement);
}



/* ================= FORCE AUTO HIDE PLAYER CONTROLS ================= */
let controlsTimer = null;

function forceShowControls(){
  const box = document.getElementById("player-container");
  if(!box) return;

  box.classList.remove("force-hide-controls");
  box.classList.remove("controls-hidden");

  if(controlsTimer) clearTimeout(controlsTimer);

  controlsTimer = setTimeout(function(){
    forceHideControls();
  }, 3000);
}

function forceHideControls(){
  const box = document.getElementById("player-container");
  if(!box) return;
  if(box.style.display !== "none"){
    try{
      const active = document.activeElement;
      if(active && active.blur) active.blur();
    }catch(e){}
    box.classList.add("force-hide-controls");
    box.classList.add("controls-hidden");
  }
}

function setupForceAutoHide(){
  const box = document.getElementById("player-container");
  if(!box || box.dataset.forceHideReady === "1") return;
  box.dataset.forceHideReady = "1";

  ["mousemove","mousedown","touchstart","touchmove","click","pointermove","pointerdown"].forEach(function(ev){
    box.addEventListener(ev, forceShowControls, {passive:true});
  });

  document.addEventListener("keydown", function(){
    if(box.style.display !== "none"){
      forceShowControls();
    }
  });
}

async function closePlayer(){
  await stopAllPlayers();
  document.getElementById("player-container").classList.remove("controls-hidden");
  document.getElementById("player-container").classList.remove("force-hide-controls");
  document.getElementById("player-container").classList.remove("force-hide-controls");
  document.getElementById("player-container").style.display = "none";
}

function goHome(){
  window.location.href = "https://tiea9999.github.io/tv/index.html";
}

document.addEventListener("keydown",function(e){
  const container = document.getElementById("player-container");
  if(container.style.display === "block"){
    if(e.key === "Escape" || e.key === "Backspace" || e.key === "BrowserBack"){
      e.preventDefault();
      closePlayer();
    }
  }
});

      try{

        channels = parseJSONChannels(txt);

      }catch(err){
        console.log(err);
        setLoad("อ่านไฟล์ JSON ไม่สำเร็จ");
      }
    });
  }
});
