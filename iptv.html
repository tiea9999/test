<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIEA IPTV</title>

<script src="https://ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
<script>
jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';
</script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    text-align:center;
    padding:10px;
    color:orange;
}

/* ปุ่มโฮม */
.back-home{
    position:fixed;
    top:10px;
    left:10px;
    padding:8px 14px;
    border-radius:30px;
    background:rgba(255,255,255,0.2);
    color:#fff;
    cursor:pointer;
    z-index:9999;
    font-size:14px;
}

/* ช่องรายการ */
#channel-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
    gap:10px;
    padding:10px;
}

.channel{
    background:#222;
    border-radius:8px;
    text-align:center;
    padding:5px;
    cursor:pointer;
}

.channel img{
    width:60px;
    height:60px;
    object-fit:contain;
}

/* PLAYER */
#player-container{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:95%;
    max-width:900px;
    aspect-ratio:16/9;
    background:#000;
    z-index:9999;
    display:none;
    border:2px solid orange;
    border-radius:8px;
}

#jw-player, #html5-player{
    width:100%!important;
    height:100%!important;
}

/* ปุ่ม X */
.close-btn{
    position:absolute;
    top:5px;
    right:5px;
    background:red;
    color:#fff;
    border:none;
    padding:5px 10px;
    cursor:pointer;
    z-index:10000;
}

/* มือถือ */
@media(max-width:600px){
    #player-container{
        width:100%;
        height:220px;
        top:auto;
        bottom:0;
        transform:none;
        border-radius:0;
    }
}
</style>
</head>

<body>

<div class="back-home" onclick="goHome()">⬅ กลับหน้าโฮม</div>

<div class="header"><h2>TIEA IPTV</h2></div>

<div id="player-container">
    <div id="jw-player"></div>
    <video id="html5-player" controls autoplay playsinline style="display:none;"></video>
    <button class="close-btn" onclick="closePlayer()">X</button>
</div>

<div id="channel-list"></div>

<script>
const channels = [
{
name:"NBT",
logo:"https://ais-s.ais-vidnt.com/ais/play/origin/LIVE//channelicon/0001.png",
file:"https://cdn-edge.iiptvcdn.com/live_event/smil:f180-054a-38d7-ce66-f7cf.smil/playlist.m3u8"
},
{
name:"ThaiPBS",
logo:"https://ais-s.ais-vidnt.com/ais/play/origin/LIVE/channelicon/0014.png",
file:"https://thaipbs-ophctt.cdn.byteark.com/live/playlist.m3u8"
},
{
name:"PPTV",
logo:"https://ais-s.ais-vidnt.com/ais/play/origin/LIVE/channelicon/PPTV_2024e.jpg",
file:"https://lb-gmmz.sky-cdn.com/gmm/pptv.m3u8"
}
];

let currentHls=null;

function loadChannel(ch){
    const container=document.getElementById("player-container");
    const video=document.getElementById("html5-player");

    container.style.display="block";

    try{jwplayer("jw-player").remove();}catch(e){}
    video.style.display="block";

    if(Hls.isSupported()){
        currentHls=new Hls();
        currentHls.loadSource(ch.file);
        currentHls.attachMedia(video);
        currentHls.on(Hls.Events.MANIFEST_PARSED,function(){
            video.play();
        });
    }else{
        video.src=ch.file;
        video.play();
    }
}

function closePlayer(){
    const container=document.getElementById("player-container");
    container.style.display="none";

    if(currentHls){
        currentHls.destroy();
        currentHls=null;
    }

    const video=document.getElementById("html5-player");
    video.pause();
    video.src="";
}

function goHome(){
    window.location.href="https://tiea9999.github.io/tv/index.html";
}

/* render */
const list=document.getElementById("channel-list");
channels.forEach(ch=>{
    const div=document.createElement("div");
    div.className="channel";
    div.innerHTML=`<img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/60'"><div>${ch.name}</div>`;
    div.onclick=()=>loadChannel(ch);
    list.appendChild(div);
});
</script>

</body>
</html>
