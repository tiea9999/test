<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIEA Studio V1.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,'Tahoma',sans-serif}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#111827;padding:18px;border-right:1px solid #263244}.brand{font-size:24px;font-weight:800;color:#44ff88;margin-bottom:6px}.ver{color:#9ca3af;margin-bottom:18px}.btn{width:100%;padding:12px;margin:6px 0;border:0;border-radius:10px;background:#16a34a;color:white;font-weight:700;cursor:pointer}.btn.alt{background:#2563eb}.btn.gray{background:#374151}.btn.red{background:#dc2626}.main{padding:18px}.panel{background:#111827;border:1px solid #263244;border-radius:14px;padding:14px;margin-bottom:14px}textarea{width:100%;height:220px;background:#030712;color:#e5e7eb;border:1px solid #374151;border-radius:12px;padding:12px;font-family:monospace}input,select{background:#030712;color:#fff;border:1px solid #374151;border-radius:8px;padding:8px;width:100%}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.small{font-size:13px;color:#9ca3af}.stats{display:flex;gap:10px;flex-wrap:wrap}.chip{background:#0f172a;border:1px solid #334155;border-radius:999px;padding:8px 12px}.table-wrap{overflow:auto;max-height:48vh;border-radius:12px;border:1px solid #263244}table{width:100%;border-collapse:collapse;min-width:980px}th,td{border-bottom:1px solid #263244;padding:8px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#1f2937;z-index:1}td input,td select{min-width:130px}.url{min-width:330px}.logo{min-width:260px}.danger{color:#fca5a5}.ok{color:#86efac}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.search{max-width:360px}.hide{display:none}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:relative}.grid{grid-template-columns:1fr 1fr}.table-wrap{max-height:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">TIEA Studio</div>
    <div class="ver">V1.3 Import / Export จริง</div>
    <button class="btn" onclick="importM3U()">Import M3U</button>
    <button class="btn alt" onclick="document.getElementById('m3uFile').click()">เปิดไฟล์ .m3u</button>
    <input id="m3uFile" class="hide" type="file" accept=".m3u,.m3u8,.txt" onchange="openM3UFile(event)">
    <button class="btn gray" onclick="document.getElementById('projectFile').click()">Open Project</button>
    <input id="projectFile" class="hide" type="file" accept=".json" onchange="openProject(event)">
    <hr style="border-color:#263244">
    <button class="btn" onclick="exportTVJSON()">Export tv.json</button>
    <button class="btn" onclick="exportTVM3U()">Export tv.m3u</button>
    <button class="btn alt" onclick="saveProject()">Save Project</button>
    <button class="btn red" onclick="clearAll()">ล้างทั้งหมด</button>
    <p class="small">ขั้นตอน: วาง M3U → เลือกหมวด → Import → ตรวจรายการ → Export</p>
  </aside>

  <main class="main">
    <div class="panel">
      <div class="topline">
        <h2 style="margin:0">Import M3U</h2>
        <div class="small">ไฟล์นี้ทำงานในเครื่องพี่ ไม่ต้องมี Server</div>
      </div>
      <div class="grid" style="margin:10px 0">
        <label>หมวดหลัก
          <select id="category">
            <option value="TV">TV</option>
            <option value="Sport">Sport</option>
            <option value="Movie">Movie</option>
            <option value="Series">Series</option>
            <option value="Anime">Anime</option>
          </select>
        </label>
        <label>Source / แหล่งที่มา
          <input id="source" placeholder="เช่น 6395, Dooball, 3BB">
        </label>
        <label>ชื่อ Server
          <input id="serverName" value="Main">
        </label>
        <label>Referer (ถ้ามี)
          <input id="referer" placeholder="https://example.com/">
        </label>
        <label>User-Agent (ถ้ามี)
          <input id="userAgent" placeholder="Mozilla/5.0">
        </label>
      </div>
      <textarea id="m3uInput" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-name=&quot;CH 3&quot; tvg-logo=&quot;...&quot; group-title=&quot;ดิจิตอล&quot;,CH 3&#10;https://.../83.m3u8"></textarea>
    </div>

    <div class="panel">
      <div class="topline">
        <div class="stats" id="stats"></div>
        <input id="search" class="search" placeholder="ค้นหา ชื่อ / group / source" oninput="renderTable()">
      </div>
    </div>

    <div class="panel">
      <div class="topline">
        <h2 style="margin:0">รายการ</h2>
        <button class="btn alt" style="width:auto" onclick="addBlankItem()">+ เพิ่มรายการ</button>
      </div>
      <div class="table-wrap" style="margin-top:10px">
        <table>
          <thead><tr><th>#</th><th>ชื่อ</th><th>หมวด</th><th>Group</th><th>Source</th><th>Logo</th><th>URL</th><th>ลบ</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script>
let project = { version:'1.3', updated:'', items:[] };
function parseAttr(line, name){
  const re1 = new RegExp(name + '="([^"]*)"','i');
  const m1 = line.match(re1); if(m1) return m1[1].trim();
  const re2 = new RegExp(name + '=([^\\s,]+)','i');
  const m2 = line.match(re2); if(m2) return m2[1].replace(/^"|"$/g,'').trim();
  return '';
}
function titleFromExtinf(line){
  const p = line.lastIndexOf(',');
  if(p >= 0 && p < line.length-1) return line.slice(p+1).trim();
  return parseAttr(line,'tvg-name') || 'ไม่มีชื่อ';
}
function parseM3U(text){
  const lines = text.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
  const items=[]; let meta=null;
  const category = document.getElementById('category').value;
  const source = document.getElementById('source').value.trim();
  const serverName = document.getElementById('serverName').value.trim() || 'Main';
  const referer = document.getElementById('referer').value.trim();
  const userAgent = document.getElementById('userAgent').value.trim();
  for(const line of lines){
    if(line.startsWith('#EXTINF')){
      meta = {
        tvg_id: parseAttr(line,'tvg-id'),
        tvg_name: parseAttr(line,'tvg-name'),
        logo: parseAttr(line,'tvg-logo'),
        group: parseAttr(line,'group-title'),
        title: titleFromExtinf(line)
      };
    } else if(!line.startsWith('#') && /^https?:\/\//i.test(line)){
      const m = meta || {};
      items.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()),
        title: m.title || m.tvg_name || 'ไม่มีชื่อ',
        category, group: m.group || '', source,
        logo: m.logo || '', poster:'', description:'', language:'TH', type:'live', tvg_id:m.tvg_id||'',
        servers:[{name:serverName,url:line,referer,userAgent,drm:false,keyId:'',key:''}]
      });
      meta=null;
    }
  }
  return items;
}
function importM3U(){
  const text=document.getElementById('m3uInput').value;
  const items=parseM3U(text);
  if(!items.length){ alert('ยังไม่พบรายการ กรุณาตรวจ M3U'); return; }
  project.items.push(...items); project.updated=new Date().toISOString();
  renderAll(); alert('Import สำเร็จ '+items.length+' รายการ');
}
function openM3UFile(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{document.getElementById('m3uInput').value=r.result; importM3U();}; r.readAsText(f); e.target.value=''; }
function renderAll(){ renderStats(); renderTable(); }
function renderStats(){
  const total=project.items.length;
  const cats={}; project.items.forEach(i=>cats[i.category]=(cats[i.category]||0)+1);
  let html=`<span class="chip">ทั้งหมด: <b>${total}</b></span>`;
  Object.keys(cats).sort().forEach(k=>html+=`<span class="chip">${k}: <b>${cats[k]}</b></span>`);
  document.getElementById('stats').innerHTML=html;
}
function renderTable(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  project.items.forEach((it,idx)=>{
    const hay=[it.title,it.category,it.group,it.source,it.logo,(it.servers&&it.servers[0]?it.servers[0].url:'')].join(' ').toLowerCase();
    if(q && !hay.includes(q)) return;
    const url=it.servers&&it.servers[0]?it.servers[0].url:'';
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${idx+1}</td>
      <td><input value="${esc(it.title)}" onchange="upd(${idx},'title',this.value)"></td>
      <td><select onchange="upd(${idx},'category',this.value)">${opts(['TV','Sport','Movie','Series','Anime'],it.category)}</select></td>
      <td><input value="${esc(it.group||'')}" onchange="upd(${idx},'group',this.value)"></td>
      <td><input value="${esc(it.source||'')}" onchange="upd(${idx},'source',this.value)"></td>
      <td><input class="logo" value="${esc(it.logo||'')}" onchange="upd(${idx},'logo',this.value)"></td>
      <td><input class="url" value="${esc(url)}" onchange="updUrl(${idx},this.value)"></td>
      <td><button onclick="delItem(${idx})">ลบ</button></td>`;
    tb.appendChild(tr);
  });
}
function esc(s){ return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'); }
function opts(arr,val){ return arr.map(x=>`<option value="${x}" ${x===val?'selected':''}>${x}</option>`).join(''); }
function upd(i,k,v){ project.items[i][k]=v; project.updated=new Date().toISOString(); renderStats(); }
function updUrl(i,v){ if(!project.items[i].servers) project.items[i].servers=[{name:'Main'}]; project.items[i].servers[0].url=v; project.updated=new Date().toISOString(); }
function delItem(i){ if(confirm('ลบรายการนี้?')){ project.items.splice(i,1); renderAll(); } }
function addBlankItem(){ project.items.push({id:String(Date.now()),title:'รายการใหม่',category:'TV',group:'',source:'',logo:'',poster:'',description:'',language:'TH',type:'live',servers:[{name:'Main',url:'',referer:'',userAgent:'',drm:false,keyId:'',key:''}]}); renderAll(); }
function download(name, content, type='application/json;charset=utf-8'){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportTVJSON(){
  const tv=project.items.filter(i=>i.category==='TV');
  if(!tv.length && !confirm('ไม่พบหมวด TV จะ Export ไฟล์ว่างใช่ไหม?')) return;
  download('tv.json', JSON.stringify({version:'1.3',updated:new Date().toISOString(),items:tv},null,2));
}
function makeM3U(items){
  let out='#EXTM3U\n';
  for(const it of items){
    const s=it.servers&&it.servers[0]?it.servers[0]:{};
    out += `#EXTINF:-1 tvg-id="${it.tvg_id||''}" tvg-name="${it.title||''}" tvg-logo="${it.logo||''}" group-title="${it.group||''}",${it.title||''}\n${s.url||''}\n`;
  }
  return out;
}
function exportTVM3U(){ const tv=project.items.filter(i=>i.category==='TV'); download('tv.m3u', makeM3U(tv), 'audio/x-mpegurl;charset=utf-8'); }
function saveProject(){ project.updated=new Date().toISOString(); download('tiea-project.json', JSON.stringify(project,null,2)); }
function openProject(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const obj=JSON.parse(r.result); project={version:obj.version||'1.3',updated:obj.updated||'',items:obj.items||[]}; renderAll(); alert('Open Project สำเร็จ '+project.items.length+' รายการ'); }catch(err){ alert('เปิด Project ไม่ได้: '+err.message); } }; r.readAsText(f); e.target.value=''; }
function clearAll(){ if(confirm('ล้างรายการทั้งหมด?')){ project={version:'1.3',updated:'',items:[]}; renderAll(); } }
renderAll();
</script>
</body>
</html>
