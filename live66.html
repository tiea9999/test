<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIEA IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Kanit', sans-serif;
    background:#020617;
    color:#fff;
    padding-top:70px; /* 🔥 แก้บัง */
    overflow-y:auto;  /* 🔥 เลื่อนสุดได้ */
}

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:9999;
    backdrop-filter:blur(10px);
    background:rgba(5,10,20,0.7);
}

.top-message{
    text-align:center;
    font-size:16px; /* 🔥 ลดขนาด */
    color:#00e5ff;
    padding:4px;
}

.back-home{
    position:fixed;
    top:80px; /* 🔥 ไม่ทับ */
    left:5px;
    padding:4px 8px;
    border-radius:50px;
    background:rgba(255,255,255,0.15);
    color:#fff;
    cursor:pointer;
    z-index:10000;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:10px;
}

/* PLAYER */
#playerBox{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:80%;
    max-width:1000px;
    aspect-ratio:16/9;
    background:#000;
    display:none;
    z-index:9999;
}

#playerOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    z-index:9998;
}

video{
    width:100%;
    height:100%;
}

.close{
    position:absolute;
    top:8px;
    right:8px;
    background:red;
    color:#fff;
    border:none;
    padding:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
    <div class="top-message">📺 TIEA IPTV 📺</div>
</div>

<div class="back-home" onclick="goHome()">⬅กลับ</div>

<div class="container">
    <button onclick="play('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
        ▶️ ทดสอบช่อง
    </button>
</div>

<div id="playerOverlay" onclick="closePlayer()"></div>

<div id="playerBox">
    <button class="close" onclick="closePlayer()">X</button>
    <video id="video" controls autoplay playsinline preload="auto"></video>
</div>

<script>
const video = document.getElementById("video");
let hls;

function play(url){

    document.getElementById("playerBox").style.display="block";
    document.getElementById("playerOverlay").style.display="block";

    if(hls){
        hls.destroy();
    }

    if(Hls.isSupported()){

        hls = new Hls({
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            liveSyncDuration: 3,
            liveMaxLatencyDuration: 10,
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 10,
            fragLoadingTimeOut: 20000,
            manifestLoadingTimeOut: 20000
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
            video.play().catch(()=>{});
        });

        // 🔥 กันหมุน
        hls.on(Hls.Events.ERROR, function(event, data){
            if(data.fatal){
                if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
                    hls.startLoad();
                }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
                    hls.recoverMediaError();
                }else{
                    hls.destroy();
                }
            }
        });

    }else{
        video.src = url;
        video.play().catch(()=>{});
    }
}

function closePlayer(){
    document.getElementById("playerBox").style.display="none";
    document.getElementById("playerOverlay").style.display="none";
    video.pause();
}

function goHome(){
    window.location.href="https://tiea9999.github.io/tv/index.html";
}
</script>

</body>
</html>
