<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>TIEA IPTV</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
/* 🔥 กัน header บัง */
body{
  padding-top:140px;
}

/* 🔥 ลื่นขึ้น */
video{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* 🔥 scroll ลื่น */
html,body{
  overscroll-behavior-y: contain;
}
</style>
</head>

<body class="bg-gray-900 text-white p-4">

<!-- 🔥 HEADER -->
<div class="fixed top-0 left-0 w-full z-50 bg-gray-900/95 backdrop-blur border-b border-white/10">

  <div class="flex items-center justify-between px-2 py-2">
    <button onclick="goBack()"
      class="flex items-center gap-2 px-3 py-2 rounded-lg bg-blue-600 text-sm">
      ⬅ หน้าหลัก
    </button>

    <h1 class="text-lg text-center flex-1">
      📺 TIEA IPTV 📺
    </h1>

    <div class="w-[80px]"></div>
  </div>

  <div id="leagueBar" class="flex gap-3 overflow-x-auto px-2 pb-2"></div>

  <div class="flex gap-2 px-2 pb-2">
    <div id="sportTabs" class="flex gap-2 overflow-x-auto"></div>
    <div id="dateTabs" class="flex gap-2 overflow-x-auto flex-1 justify-end"></div>
  </div>

</div>

<!-- 🔥 CONTENT -->
<div id="matches"
  class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mt-2 pb-20">
</div>

<script>
let hls;

/* 🔥 PLAYER เร็ว + กันหมุน */
function playStream(url){
  const video = document.getElementById("videoPlayer");

  if(hls){
    hls.destroy();
  }

  if(Hls.isSupported()){
    hls = new Hls({
      maxBufferLength: 10,
      maxMaxBufferLength: 20,
      liveSyncDuration: 2,
      enableWorker: true,
      lowLatencyMode: true
    });

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.ERROR, function(event,data){
      if(data.fatal){
        hls.destroy();
      }
    });

  }else{
    video.src = url;
  }
}

/* 🔥 เปิด player */
function openPlayer(url){
  const modal = document.getElementById("playerModal");
  modal.classList.remove("hidden");
  modal.classList.add("flex");

  playStream(url);
}

/* 🔥 ปิด */
function closePlayer(){
  const modal = document.getElementById("playerModal");
  const video = document.getElementById("videoPlayer");

  if(hls) hls.destroy();

  video.pause();
  video.src="";

  modal.classList.add("hidden");
  modal.classList.remove("flex");
}

function goBack(){
  window.location.href="https://tiea9999.github.io/tv/index.html";
}
</script>

<!-- 🔥 PLAYER -->
<div id="playerModal"
  onclick="closePlayer()"
  class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">

  <div class="relative w-full max-w-4xl mx-4"
       onclick="event.stopPropagation()">

    <button onclick="closePlayer()"
      class="absolute -top-10 right-0 bg-red-500 px-3 py-1 rounded">
      ✕
    </button>

    <video id="videoPlayer"
      class="w-full aspect-video bg-black"
      controls autoplay playsinline>
    </video>

  </div>
</div>

</body>
</html>
