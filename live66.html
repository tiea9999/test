<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIEA IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    background:#020617;
    color:#fff;
    font-family:sans-serif;
    padding-top:140px;
}

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:999;
    background:#020617;
    border-bottom:1px solid #333;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    padding:10px;
    color:#00e5ff;
}

.section-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:10px;
}

.card{
    background:#111;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
}

/* 🔥 BG โลโก้ */
.logo-bg{
    height:120px;
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    filter:blur(25px);
    opacity:.4;
}

/* 🔥 โลโก้จริง */
.logo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.logo img{
    height:50px;
    filter:drop-shadow(0 0 8px rgba(0,200,255,.7));
}

/* content */
.content{
    padding:10px;
    text-align:center;
}

.team{
    font-size:14px;
    margin-bottom:4px;
}

.servers button{
    margin:3px;
    padding:4px 8px;
    font-size:11px;
}

/* PLAYER */
#playerBox{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:800px;
    aspect-ratio:16/9;
    background:#000;
    display:none;
    z-index:9999;
}

#playerOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    z-index:9998;
}
</style>
</head>

<body>

<div class="header">
    <div style="text-align:center;padding:10px;">
        📺 TIEA IPTV
    </div>
</div>

<div id="list"></div>

<div id="playerOverlay" onclick="closePlayer()"></div>
<div id="playerBox">
    <video id="video" controls autoplay playsinline style="width:100%;height:100%"></video>
</div>

<script>

const URL = "https://broken-surf-7347.hssmnoy.workers.dev/?url=https://drive.google.com/uc?id=15Ye3NPw0cjNrJGTu2Q2aoqoApOp8GipC&export=download";

let all=[];
let hls;

/* 🔥 หาโลโก้ที่ใช้ได้ */
function getLogo(servers){
    for(const s of servers){
        if(s.image && s.image.startsWith("http")){
            return s.image;
        }
    }
    return "https://i.ibb.co/L8y25Wd/sports-icon.png";
}

/* โหลด */
async function load(){
    try{
        const res = await fetch(URL);
        const json = await res.json();
        all = parse(json);
        render();
    }catch(e){
        document.getElementById("list").innerHTML="❌ โหลดไม่ได้";
    }
}

/* parse */
function parse(data){
    let arr=[];

    function walk(g){
        if(g.stations){
            arr.push({
                title:g.name || "ไม่มีชื่อ",
                time:(g.name.match(/\d{2}:\d{2}/)||["--:--"])[0],
                servers:g.stations
            });
        }
        if(g.groups){
            g.groups.forEach(walk);
        }
    }

    data.groups.forEach(walk);
    return arr;
}

/* render */
function render(){
    const list=document.getElementById("list");
    list.innerHTML="";

    list.innerHTML+=`<div class="section-title">📅 วันนี้</div>`;

    const section=document.createElement("div");
    section.className="section-grid";

    all.forEach(m=>{

        if(!m.servers || !m.servers.length) return;

        const logo = getLogo(m.servers);

        const card=document.createElement("div");
        card.className="card";

        card.innerHTML=`
            <div class="logo-bg" style="background-image:url('${logo}')"></div>

            <div class="logo">
                <img src="${logo}" onerror="this.src='https://i.ibb.co/L8y25Wd/sports-icon.png'">
            </div>

            <div class="content">
                <div class="team">${m.title}</div>
                <div>🕒 ${m.time}</div>

                <div class="servers">
                    ${(m.servers||[]).slice(0,4).map(s=>`
                        <button data-url="${s.url}">ดู</button>
                    `).join("")}
                </div>
            </div>
        `;

        card.onclick=()=>play(m.servers[0].url);

        card.querySelectorAll("button").forEach(b=>{
            b.onclick=(e)=>{
                e.stopPropagation();
                play(b.dataset.url);
            };
        });

        section.appendChild(card);
    });

    list.appendChild(section);
}

/* PLAYER */
const video=document.getElementById("video");

function play(url){

    if(!url) return;

    document.getElementById("playerBox").style.display="block";
    document.getElementById("playerOverlay").style.display="block";

    if(hls){
        hls.destroy();
    }

    if(Hls.isSupported()){
        hls=new Hls({
            maxBufferLength:4,
            liveSyncDuration:1.5,
            lowLatencyMode:true
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
            video.play().catch(()=>{});
        });

    }else{
        video.src=url;
        video.play().catch(()=>{});
    }
}

function closePlayer(){
    document.getElementById("playerBox").style.display="none";
    document.getElementById("playerOverlay").style.display="none";
    video.pause();

    if(hls){
        hls.destroy();
    }
}

load();

</script>

</body>
</html>
