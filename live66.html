<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIEA IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Kanit', sans-serif;
    background:#020617;
    color:#fff;
    margin:0;
}

/* ✅ แก้บังจอ */
.header{
    position:sticky;
    top:0;
    z-index:9999;
    backdrop-filter:blur(12px);
    background:rgba(5,10,20,0.9);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.top-bar{
    display:flex;
    justify-content:space-between;
    padding:8px;
}

.section-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:10px;
}

@media(max-width:700px){
    .section-grid{grid-template-columns:repeat(2,1fr);}
}

.card{
    background:#111;
    border-radius:12px;
    padding:10px;
    cursor:pointer;
}

.servers button{
    margin-top:5px;
    font-size:11px;
    padding:4px 6px;
    border:none;
    border-radius:6px;
    background:#00e5ff;
    color:#000;
}

/* PLAYER */
#playerBox{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:900px;
    aspect-ratio:16/9;
    background:#000;
    display:none;
    z-index:9999;
}

#playerOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    z-index:9998;
}

video{width:100%;height:100%;}
</style>
</head>

<body>

<div class="header">
    <div class="top-bar">
        <div onclick="goHome()">⬅ กลับ</div>
        <div>📺 TIEA IPTV</div>
        <div></div>
    </div>
</div>

<div id="list"></div>

<div id="playerOverlay" onclick="closePlayer()"></div>
<div id="playerBox">
    <video id="video" controls autoplay></video>
</div>

<script>

const URL = "https://broken-surf-7347.hssmnoy.workers.dev/?url=https://drive.google.com/uc?id=15Ye3NPw0cjNrJGTu2Q2aoqoApOp8GipC&export=download";

let all = [];

async function load(){
    try{
        const res = await fetch(URL);
        const json = await res.json();

        all = parse(json);

        console.log("โหลดได้:", all.length);

        render();
    }catch(e){
        console.error("โหลดไม่ได้", e);
        document.getElementById("list").innerHTML="❌ โหลดไม่ได้";
    }
}

function parse(data){
    let arr=[];

    function walk(g){
        if(g.stations){
            arr.push({
                title:g.name,
                time:(g.name.match(/\d{2}:\d{2}/)||["--:--"])[0],
                teams:g.name.split("vs"),
                servers:g.stations
            });
        }
        if(g.groups){
            g.groups.forEach(walk);
        }
    }

    data.groups.forEach(walk);
    return arr;
}

function render(){
    const list=document.getElementById("list");
    list.innerHTML="";

    const grid=document.createElement("div");
    grid.className="section-grid";

    all.forEach(m=>{
        if(!m.servers || !m.servers.length) return;

        const card=document.createElement("div");
        card.className="card";

        card.innerHTML=`
            <div>${m.time}</div>
            <div>${m.teams[0]}</div>
            <div>${m.teams[1]||""}</div>

            ${(m.servers||[]).slice(0,3).map(s=>`
                <button data-url="${s.url}">ดู</button>
            `).join("")}
        `;

        card.onclick=()=>play(m.servers[0].url);

        card.querySelectorAll("button").forEach(btn=>{
            btn.onclick=(e)=>{
                e.stopPropagation();
                play(btn.dataset.url);
            }
        });

        grid.appendChild(card);
    });

    list.appendChild(grid);
}

/* 🔥 PLAYER เร็ว */
const video=document.getElementById("video");
let hls;

function play(url){
    document.getElementById("playerBox").style.display="block";
    document.getElementById("playerOverlay").style.display="block";

    if(hls) hls.destroy();

    if(Hls.isSupported()){
        hls = new Hls({
            maxBufferLength:8,
            liveSyncDuration:2,
            lowLatencyMode:true
        });
        hls.loadSource(url);
        hls.attachMedia(video);
    }else{
        video.src=url;
    }
}

function closePlayer(){
    document.getElementById("playerBox").style.display="none";
    document.getElementById("playerOverlay").style.display="none";
    video.pause();
}

function goHome(){
    window.location.href="https://tiea9999.github.io/tv/index.html";
}

load();

</script>

</body>
</html>
