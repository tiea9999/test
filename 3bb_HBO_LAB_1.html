function lab5Push(list,msg,max=40){
  const t=new Date().toLocaleTimeString("th-TH",{hour12:false});
  list.push(`${t} ${msg}`);
  if(list.length>max) list.splice(0,list.length-max);
}

function lab5SafeJson(obj){
  try{
    return JSON.stringify(obj,(k,v)=>{
      if(k==="stack") return undefined;
      if(v instanceof ArrayBuffer) return `[ArrayBuffer ${v.byteLength}]`;
      if(ArrayBuffer.isView(v)) return `[${v.constructor?.name||"TypedArray"} ${v.byteLength}]`;
      return v;
    });
  }catch(e){
    try{return String(obj)}catch(err){return "-"}
  }
}

function lab5ReqTypeName(type){
  try{
    const RT=shaka.net.NetworkingEngine.RequestType;
    const pairs=[
      ["MANIFEST",RT.MANIFEST],["SEGMENT",RT.SEGMENT],["LICENSE",RT.LICENSE],
      ["APP",RT.APP],["TIMING",RT.TIMING],["SERVER_CERTIFICATE",RT.SERVER_CERTIFICATE]
    ];
    const hit=pairs.find(x=>x[1]===type);
    return hit?hit[0]:String(type);
  }catch(e){return String(type)}
}

function lab5CaptureClearKeyConfig(){
  try{
    if(!shakaPlayer || typeof shakaPlayer.getConfiguration!=="function") return;
    const cfg=shakaPlayer.getConfiguration();
    const keys=cfg?.drm?.clearKeys || {};
    lab5ClearKeyIds=Object.keys(keys);
    lab5ClearKeyCount=lab5ClearKeyIds.length;
  }catch(e){}
}

function lab5InstallReadOnlyTrace(player,channel){
  if(!player || player.__lab5Bound) return;
  player.__lab5Bound=true;

  lab5CaptureClearKeyConfig();
  setTimeout(lab7InspectConfig,0);

  try{
    const net=player.getNetworkingEngine?.();
    if(net){
      if(net.registerRequestFilter){
        net.registerRequestFilter((type,request)=>{
          const name=lab5ReqTypeName(type);
          const uri=request?.uris?.[0] || "-";
          if(name==="MANIFEST") lab5ManifestSeen=true;
          if(name==="SEGMENT") lab5SegmentSeen=true;
          if(name==="LICENSE") lab5LicenseSeen=true;
          lab5Push(lab5NetworkLog,`REQ ${name} uri=${uri}`);
        });
      }
      if(net.registerResponseFilter){
        net.registerResponseFilter((type,response)=>{
          const name=lab5ReqTypeName(type);
          const uri=response?.uri || "-";
          const bytes=response?.data?.byteLength || 0;
          lab5Push(lab5NetworkLog,`RESP ${name} bytes=${bytes} uri=${uri}`);
        });
      }
    }
  }catch(e){
    lab5Push(lab5NetworkLog,`NETWORK TRACE SETUP ERROR ${e?.message||e}`);
  }

  const events=["error","buffering","adaptation","variantchanged","streaming","trackschanged","expirationupdated"];
  events.forEach(name=>{
    try{
      player.addEventListener(name,ev=>{
        if(name==="error"){
          const d=ev?.detail || {};
          lab5LastErrorDetail=lab5SafeJson({
            severity:d.severity,
            category:d.category,
            code:d.code,
            data:d.data,
            handled:d.handled
          });
          lab6UpdateFromErrorDetail(d);
          lab7InspectConfig();
          lab5Push(lab5PlayerLog,`ERROR ${lab5LastErrorDetail}`);
        }else if(name==="buffering"){
          lab5Push(lab5PlayerLog,`BUFFERING ${String(ev?.buffering)}`);
        }else{
          lab5Push(lab5PlayerLog,`${name.toUpperCase()}`);
        }
        lab5CaptureClearKeyConfig();
      });
    }catch(e){}
  });

  lab5Push(lab5PlayerLog,`ARM channel=${channel?.name||"-"}`);
}

function lab5Summary(){
  return [
    `manifest=${lab5ManifestSeen?"YES":"NO"}`,
    `segment=${lab5SegmentSeen?"YES":"NO"}`,
    `license=${lab5LicenseSeen?"YES":"NO"}`,
    `clearKeys=${lab5ClearKeyCount}`,
    `keyIds=${lab5ClearKeyIds.length?lab5ClearKeyIds.join(","):"-"}`
  ].join(" | ");
}


function lab6NormKid(v){
  return String(v||"").toLowerCase().replace(/[^0-9a-f]/g,"");
}

function lab6GetConfiguredKid(){
  try{
    let kid = activeChannel?.keyId || "-";
    if((!kid || kid==="-") && Array.isArray(activeChannel?.servers)){
      const s = activeChannel.servers[activeServerIndex] || activeChannel.servers[0];
      kid = s?.keyId || "-";
    }
    lab6ConfiguredKeyId = kid || "-";
  }catch(e){
    lab6ConfiguredKeyId = "-";
  }
}

function lab6UpdateFromErrorDetail(detail){
  try{
    const data = Array.isArray(detail?.data) ? detail.data : [];
    const first = data[0] || {};
    lab6MissingKeyIds = Array.isArray(first.missingKeys) ? first.missingKeys.slice() : [];
    lab6RestrictedKeyStatuses = Array.isArray(first.restrictedKeyStatuses) ? first.restrictedKeyStatuses.slice() : [];
  }catch(e){
    lab6MissingKeyIds = [];
    lab6RestrictedKeyStatuses = [];
  }
  lab6GetConfiguredKid();

  const cfg = lab6NormKid(lab6ConfiguredKeyId);
  const missing = lab6MissingKeyIds.map(lab6NormKid).filter(Boolean);

  if(!cfg || cfg==="-"){
    lab6KeyMatch = "NO CONFIGURED KID";
  }else if(!missing.length){
    lab6KeyMatch = "NO MISSING KID REPORTED";
  }else{
    lab6KeyMatch = missing.includes(cfg) ? "MATCHES MISSING KID" : "MISMATCH";
  }
}

function lab6Summary(){
  return [
    `configuredKID=${lab6ConfiguredKeyId}`,
    `missingKIDs=${lab6MissingKeyIds.length?lab6MissingKeyIds.join(","):"-"}`,
    `restricted=${lab6RestrictedKeyStatuses.length?lab6RestrictedKeyStatuses.join(","):"-"}`,
    `result=${lab6KeyMatch}`
  ].join(" | ");
}

function lab7MaskKey(v){
  const s = String(v||"");
  if(!s) return "-";
  if(s.length <= 8) return "*".repeat(s.length);
  return s.slice(0,4) + "…" + s.slice(-4);
}

function lab7GetServer(){
  try{
    if(Array.isArray(activeOriginalChannel?.servers)){
      return activeOriginalChannel.servers[activeServerIndex] || activeOriginalChannel.servers[0] || null;
    }
    if(Array.isArray(activeChannel?.servers)){
      return activeChannel.servers[activeServerIndex] || activeChannel.servers[0] || null;
    }
  }catch(e){}
  return null;
}

function lab7InspectConfig(){
  try{
    const s = lab7GetServer();
    const configuredKid = s?.keyId || activeChannel?.keyId || "-";
    const configuredKey = s?.key || activeChannel?.key || "";

    lab7ConfiguredKeyMasked = lab7MaskKey(configuredKey);
    lab7ConfiguredKeyLength = String(configuredKey||"").length;

    let mapIds = [];
    try{
      if(shakaPlayer && typeof shakaPlayer.getConfiguration === "function"){
        const cfg = shakaPlayer.getConfiguration();
        mapIds = Object.keys(cfg?.drm?.clearKeys || {});
      }
    }catch(e){}
    lab7ClearKeyMapIds = mapIds;

    const cfgKid = lab6NormKid(configuredKid);
    const mapNorm = mapIds.map(lab6NormKid).filter(Boolean);
    const missingNorm = lab6MissingKeyIds.map(lab6NormKid).filter(Boolean);

    if(!cfgKid){
      lab7ConfigPairStatus = "NO CONFIGURED KID";
    }else if(!configuredKey){
      lab7ConfigPairStatus = "KID PRESENT / KEY EMPTY";
    }else if(configuredKey.length !== 32){
      lab7ConfigPairStatus = `KEY LENGTH ${configuredKey.length} (EXPECTED 32 HEX)`;
    }else if(mapNorm.length && !mapNorm.includes(cfgKid)){
      lab7ConfigPairStatus = "CONFIG KID NOT PRESENT IN SHAKA CLEARKEY MAP";
    }else{
      lab7ConfigPairStatus = "CONFIG PAIR LOADED";
    }

    if(!missingNorm.length){
      lab7RequestedKidPresentInMap = "NO MISSING KID REPORTED";
    }else{
      const hit = missingNorm.some(k => mapNorm.includes(k));
      lab7RequestedKidPresentInMap = hit ? "YES" : "NO";
    }
  }catch(e){
    lab7ConfigPairStatus = "INSPECT ERROR";
  }
}

function lab7Summary(){
  return [
    `configuredKID=${lab6ConfiguredKeyId}`,
    `configuredKey=${lab7ConfiguredKeyMasked}`,

    `clearKeyMapIDs=${lab7ClearKeyMapIds.length?lab7ClearKeyMapIds.join(","):"-"}`,
    `pairStatus=${lab7ConfigPairStatus}`,
    `missingKidInMap=${lab7RequestedKidPresentInMap}`
  ].join(" | ");
}
function lab4Esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function lab4Frames(video){
  try{
    if(video && typeof video.getVideoPlaybackQuality === "function"){
      const q = video.getVideoPlaybackQuality();
      return {
        decoded:Number(q.totalVideoFrames||0),
        dropped:Number(q.droppedVideoFrames||0),
        corrupted:Number(q.corruptedVideoFrames||0)
      };
    }
  }catch(e){}
  return {
    decoded:Number(video?.webkitDecodedFrameCount||0),
    dropped:Number(video?.webkitDroppedFrameCount||0),
    corrupted:0
  };
}

function lab4Buffered(video){
  const out=[];
  try{
    for(let i=0;i<video.buffered.length;i++){
      out.push(`${video.buffered.start(i).toFixed(1)}-${video.buffered.end(i).toFixed(1)}`);
    }
  }catch(e){}
  return out.length ? out.join(", ") : "-";
}

function lab4SeekRange(){
  try{
    if(shakaPlayer && typeof shakaPlayer.seekRange === "function"){
      const r = shakaPlayer.seekRange();
      if(r) return `${Number(r.start).toFixed(3)} - ${Number(r.end).toFixed(3)}`;
    }
  }catch(e){}
  return "-";
}

async function warmStream(url){

  warmedUrls.add(url);
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 4500);
  try{
    const response = await fetch(url,{method:"GET",cache:"no-store",signal:controller.signal});
    if(response.body && response.body.cancel){ try{ await response.body.cancel(); }catch(e){} }
  }catch(e){}finally{clearTimeout(timer);}
}

function openExternal(url){
  url = url || activeUrl || (activeChannel ? activeChannel.file : "");
  if(!url) return;
  try{
    const u = new URL(url);
    const scheme = u.protocol.replace(":","");
    const hostPath = u.host + u.pathname + (u.search || "");
    const intent = "intent://" + hostPath +
      "#Intent;scheme=" + scheme +
      ";action=android.intent.action.VIEW;type=video/*;S.browser_fallback_url=" +
      encodeURIComponent(url) + ";end";
    window.location.href = intent;
  }catch(e){
    window.location.href = url;
  }
}

function openMX(url){
  url = url || activeUrl || (activeChannel ? activeChannel.file : "");
  if(!url) return;
  try{
    const u = new URL(url);
    const scheme = u.protocol.replace(":","");
    const hostPath = u.host + u.pathname + (u.search || "");
    const intent = "intent://" + hostPath +
      "#Intent;scheme=" + scheme +
      ";action=android.intent.action.VIEW;type=video/*;package=com.mxtech.videoplayer.ad;S.browser_fallback_url=" +
      encodeURIComponent(url) + ";end";
    window.location.href = intent;
  }catch(e){
    window.location.href = url;
  }
}

async function stopAllPlayers(){
  const video = document.getElementById("html5-player");

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(shakaPlayer){
    try{ await shakaPlayer.destroy(); }catch(e){}
    shakaPlayer = null;
  }

  try{
    video.pause();
    video.removeAttribute("src");
    video.load();
  }catch(e){}

  video.style.display = "none";

  const jwBox = document.getElementById("jw-player");
  if(jwBox) jwBox.style.display = "none";
  setStatus("");
}


function resolveChannel(channel, serverIndex=0){
  if(Array.isArray(channel.servers) && channel.servers.length){
    const server = channel.servers[serverIndex] || channel.servers[0];
    if(!server) return null;

    return {
      name: channel.name,
      logo: channel.logo,
      group: channel.group,
      file: server.file || server.url || "",
      drm: typeof server.drm === "boolean" ? server.drm : !!channel.drm,
      keyId: server.keyId || channel.keyId || "",
      key: server.key || channel.key || ""
    };
  }

  return channel && channel.file ? channel : null;
}

function firstChannelUrl(channel){
  const resolved = resolveChannel(channel, 0);
  return resolved ? resolved.file : "";
}

async function loadChannel(channel, element){
  activeOriginalChannel = channel;
  activeServerIndex = 0;
  lab4LastShakaError = "-";
  lab5LastErrorDetail = "-";
  lab5NetworkLog = [];
  lab5PlayerLog = [];
  lab5ManifestSeen = false;
  lab5SegmentSeen = false;
  lab5LicenseSeen = false;
  lab5ClearKeyCount = 0;
  lab5ClearKeyIds = [];
  lab6ConfiguredKeyId = "-";
  lab6MissingKeyIds = [];
  lab6RestrictedKeyStatuses = [];
  lab6KeyMatch = "-";
  lab7ConfiguredKeyMasked = "-";
  lab7ConfiguredKeyLength = 0;
  lab7ClearKeyMapIds = [];
  lab7ConfigPairStatus = "-";
  lab7RequestedKidPresentInMap = "-";
  setTimeout(lab7InspectConfig,0);
  setTimeout(lab6GetConfiguredKid,0);

  const resolvedChannel = resolveChannel(channel, activeServerIndex);
  if(!resolvedChannel || !resolvedChannel.file){
    setStatus("ช่องนี้ยังไม่มีลิงก์", false);
    return;
  }

  activeChannel = resolvedChannel;
  activeElement = element;

  document.querySelectorAll(".channel").forEach(ch=>ch.classList.remove("active"));
  if(element) element.classList.add("active");

  document.getElementById("player-container").style.display = "block";
  forceShowControls();
  await stopAllPlayers();

  const url = proxyUrl(resolvedChannel.file);
  activeUrl = url;

  if(url.includes(".mpd")){
    playMPDNotice(resolvedChannel, url);
  }else{
    useHLS_STABLE(url);
  }

  setTimeout(()=>{
    const btn = document.getElementById("closeBtn");
    if(btn) btn.focus();
  },300);
}

/* ================= MPD =================
   หมายเหตุ: MPD/DRM หลายช่องไม่เล่นใน WebView/Smart TV browser
   เพราะเครื่องไม่รองรับ EME/ClearKey หรือ header/DRM ไม่ผ่าน
   เวอร์ชันนี้ไม่ฝืนเล่นในเว็บ เพื่อไม่ให้ค้าง/จอดำ
*/
function playMPDNotice(channel, url){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");
  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  setStatus("ไฟล์ MPD/DRM เล่นในเว็บนี้ไม่ได้ในบางเครื่อง ให้กด PLAYER หรือ MX", false);

  // ลองด้วย Shaka แบบไม่บังคับ ถ้าเครื่องรองรับจะเล่นได้ ถ้าไม่รองรับจะไม่ค้าง
  try{
    if(window.shaka){
      shaka.polyfill.installAll();
      if(shaka.Player.isBrowserSupported()){
        shakaPlayer = new shaka.Player(video);
        lab5InstallReadOnlyTrace(shakaPlayer, channel);
        lab4LastShakaError = "-";
        shakaPlayer.addEventListener("error", function(event){
          try{
            const d = event.detail || {};
            lab4LastShakaError = `code=${d.code||"-"} severity=${d.severity||"-"} category=${d.category||"-"}`;
          }catch(e){
            lab4LastShakaError = "unknown";
          }
        });
        shakaPlayer.configure({
          streaming:{
            bufferingGoal: 30,
            rebufferingGoal: 5,
            bufferBehind: 15,
            retryParameters:{maxAttempts:4,baseDelay:1000,backoffFactor:1.5,timeout:25000}
          }
        });
        if(channel.drm){
          shakaPlayer.configure({drm:{clearKeys:{[channel.keyId]:channel.key}}});
        }
        shakaPlayer.load(url).then(()=>{
          forceAudio100();
          video.play().catch(()=>{});
          setStatus("กำลังเล่น MPD");
        }).catch(e=>{
          console.log("MPD เล่นในเว็บไม่ได้:", e);
          setStatus("MPD เล่นในเว็บนี้ไม่ได้ ให้กด PLAYER/MX", false);
        });
      }
    }
  }catch(e){
    console.log("MPD ERROR:", e);
  }
}

/* ================= HLS STABLE CLASSIC ================= */
function useHLS_STABLE(url){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");

  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(Hls.isSupported() && url.includes(".m3u8")){
    setStatus("กำลังโหลด HLS...");

    currentHls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,

      // สูตรเดิมที่นิ่งกว่า: ไม่ล็อกคุณภาพแข็งเกินไป
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      backBufferLength: 20,
      maxBufferHole: 0.5,
      highBufferWatchdogPeriod: 3,

      manifestLoadingMaxRetry: 5,
      manifestLoadingRetryDelay: 1000,
      manifestLoadingMaxRetryTimeout: 8000,
      levelLoadingMaxRetry: 5,
      levelLoadingRetryDelay: 1000,
      levelLoadingMaxRetryTimeout: 8000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 1000,
      fragLoadingMaxRetryTimeout: 10000,

      startFragPrefetch: true,
      capLevelToPlayerSize: true,
      testBandwidth: false,
      abrEwmaDefaultEstimate: 1200000
    });

    currentHls.loadSource(url);
    currentHls.attachMedia(video);

    currentHls.on(Hls.Events.MANIFEST_PARSED, function(){
      forceAudio100();
      video.play().catch(()=>{});
      setTimeout(()=>{ forceAudio100(); video.play().catch(()=>{}); },300);
      setStatus("กำลังเล่น HLS");
    });

    currentHls.on(Hls.Events.BUFFER_STALLED, function(){
      setStatus("กำลังเติมบัฟเฟอร์...", true);
    });

    currentHls.on(Hls.Events.ERROR, function(event, data){
      console.log("HLS ERROR:", data);
      if(!currentHls) return;

      if(data.fatal){
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
          setStatus("เน็ตเวิร์กสะดุด กำลังโหลดต่อ...");
          try{ currentHls.startLoad(); }catch(e){}
        }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
          setStatus("สัญญาณวิดีโอสะดุด กำลังกู้คืน...");
          try{ currentHls.recoverMediaError(); }catch(e){}
        }else{
          setStatus("เล่นไม่ได้ กำลังลองโหลดใหม่...", false);
          try{
            currentHls.destroy();
            currentHls = null;
            setTimeout(()=>useHLS_STABLE(url), 1200);
          }catch(e){}
        }
      }
    });

    // watchdog แบบเบา ไม่รีโหลดถี่เกินไป
    let lastTime = 0;
    let stuckCount = 0;
    hlsWatchdog = setInterval(()=>{
      if(document.getElementById("player-container").style.display !== "block") return;
      if(!currentHls) return;

      forceAudio100();

      if(video.paused || video.readyState < 2){
        try{ currentHls.startLoad(); }catch(e){}
        video.play().catch(()=>{});
        return;
      }

      if(Math.abs(video.currentTime - lastTime) < 0.05){
        stuckCount++;
      }else{
        stuckCount = 0;
      }

      lastTime = video.currentTime;

      if(stuckCount >= 4){
        setStatus("ภาพค้าง กำลังกู้คืน...");
        try{ currentHls.startLoad(); }catch(e){}
        video.play().catch(()=>{});
        stuckCount = 0;
      }
    }, 3000);

  }else{
    video.src = url;
    setTimeout(()=>{
      forceAudio100();
      video.play().catch(()=>{});
    },300);
  }
}

function restartCurrent(){
  if(activeOriginalChannel){
    loadChannel(activeOriginalChannel, activeElement);
  }else if(activeChannel){
    loadChannel(activeChannel, activeElement);
  }
}



/* ================= FORCE AUTO HIDE PLAYER CONTROLS ================= */
let controlsTimer = null;

function forceShowControls(){
  const box = document.getElementById("player-container");
  if(!box) return;

  box.classList.remove("force-hide-controls");
  box.classList.remove("controls-hidden");

  if(controlsTimer) clearTimeout(controlsTimer);

  controlsTimer = setTimeout(function(){
    forceHideControls();
  }, 3000);
}

function forceHideControls(){
  const box = document.getElementById("player-container");
  if(!box) return;
  if(box.style.display !== "none"){
    try{
      const active = document.activeElement;
      if(active && active.blur) active.blur();
    }catch(e){}
    box.classList.add("force-hide-controls");
    box.classList.add("controls-hidden");
  }
}

function setupForceAutoHide(){
  const box = document.getElementById("player-container");
  if(!box || box.dataset.forceHideReady === "1") return;
  box.dataset.forceHideReady = "1";

  ["mousemove","mousedown","touchstart","touchmove","click","pointermove","pointerdown"].forEach(function(ev){
    box.addEventListener(ev, forceShowControls, {passive:true});
  });

  document.addEventListener("keydown", function(){
    if(box.style.display !== "none"){
      forceShowControls();
    }
  });
}

async function closePlayer(){
  await stopAllPlayers();
  const box = document.getElementById("player-container");
  box.classList.remove("controls-hidden");
  box.classList.remove("force-hide-controls");
  box.style.display = "none";
  setTimeout(()=>{if(activeElement && document.body.contains(activeElement)) activeElement.focus();},120);
}

function goHome(){
  window.location.href = "https://tiea9999.github.io/tv/index.html";
}

document.addEventListener("keydown",function(e){
  const container = document.getElementById("player-container");
  if(container.style.display === "block"){
    if(e.key === "ArrowUp"){
      e.preventDefault();
      forceShowControls();
      document.getElementById("closeBtn")?.focus();
      return;
    }
    if(e.key === "Escape" || e.key === "Backspace" || e.key === "BrowserBack"){
      e.preventDefault();
      closePlayer();
    }
  }
});

let currentCategory = "ดิจิตอล";
function renderCategory(group){
  currentCategory=group;
  document.querySelectorAll(".category-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.group===group));
  document.getElementById("category-title").textContent="หมวด: "+group;
  const listContainer=document.getElementById("channel-list");
  listContainer.innerHTML="";
  const items=group==="ทั้งหมด"?channels:channels.filter(ch=>(ch.group||"ดิจิตอล")===group);
  items.forEach(ch=>{
    const div=document.createElement("div");
    div.className="channel";
    div.tabIndex=0;
    div.innerHTML=`<img src="${ch.logo}" loading="lazy"><span>${ch.name}</span>`;
    div.onclick=()=>loadChannel(ch,div);
    div.onfocus=()=>warmStream(firstChannelUrl(ch));
    div.onmouseenter=()=>warmStream(firstChannelUrl(ch));
    div.onkeydown=e=>{if(e.key==="Enter"||e.key==="OK"||e.key===" "){e.preventDefault();loadChannel(ch,div);}};
    listContainer.appendChild(div);
  });
  setTimeout(()=>listContainer.querySelector(".channel")?.focus(),100);
}
function setupCategoryMenu(){
  const buttons=Array.from(document.querySelectorAll(".category-btn"));
  buttons.forEach((btn,index)=>{
    btn.onclick=()=>renderCategory(btn.dataset.group);
    btn.onkeydown=e=>{
      if(e.key==="ArrowRight"){e.preventDefault();buttons[(index+1)%buttons.length].focus();}
      else if(e.key==="ArrowLeft"){e.preventDefault();buttons[(index-1+buttons.length)%buttons.length].focus();}
      else if(e.key==="ArrowDown"){e.preventDefault();document.querySelector(".channel")?.focus();}
      else if(e.key==="Enter"||e.key==="OK"||e.key===" "){e.preventDefault();renderCategory(btn.dataset.group);}
    };
  });
}
document.addEventListener("DOMContentLoaded",function(){
  setupForceAutoHide();
  setupCategoryMenu();
  renderCategory("ดิจิตอล");
  startFastWarmup();
});
