*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090c12;color:#fff;font-family:system-ui,'Segoe UI',sans-serif}body{padding-bottom:28px}.top{position:sticky;top:0;z-index:5;background:#141923ed;border-bottom:1px solid #32303b;padding:13px 16px;display:flex;align-items:center;gap:12px;min-height:64px;backdrop-filter:blur(12px)}.brand{font-weight:900;font-size:22px;letter-spacing:.7px}.brand b{color:#ff385a}.back{border:1px solid #59404a;border-radius:12px;background:#241720;color:white;text-decoration:none;padding:10px 13px;font-weight:700}.home{margin-left:auto;color:#fff;text-decoration:none;background:#b91f40;border-radius:12px;padding:10px 14px;font-weight:700}main{max-width:1100px;margin:auto;padding:22px 16px}.hero{background:linear-gradient(125deg,#401329,#181825 70%);border:1px solid #633148;border-radius:22px;padding:25px;margin-bottom:24px}h1{margin:0 0 9px;font-size:clamp(24px,5vw,38px)}p{color:#b9b9c8;line-height:1.6;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.tile{min-width:0;text-decoration:none;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:160px;border-radius:19px;border:1px solid #49303b;background:linear-gradient(145deg,#25212f,#12151c);box-shadow:0 5px 22px #0004;padding:18px 10px;gap:10px}.tile:focus,.tile:hover{outline:3px solid #ff5577;outline-offset:2px;background:#3b2332}.emoji{font-size:43px;line-height:1.2}.name{font-size:clamp(15px,2vw,20px);font-weight:800}.sub{font-size:12px;color:#bdb3bf}.note{border:1px solid #3b3341;border-radius:16px;padding:18px;background:#151821;margin-top:18px}.pill{display:inline-block;padding:6px 12px;border:1px solid #684456;border-radius:30px;color:#ff9caf;font-size:12px;font-weight:700;margin-bottom:10px}.link{color:#ff8eaa}footer{color:#8b8795;text-align:center;font-size:12px;margin-top:24px}@media(max-width:600px){main{padding:15px 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:128px;padding:14px 8px}.emoji{font-size:35px}.top{padding:10px}.brand{font-size:18px}.hero{padding:19px}.back,.home{padding:9px 11px}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.brand-stack{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}.brand-stack small{font-size:11px;font-weight:600;color:#ff9caf;margin-top:4px;letter-spacing:.5px}.top{align-items:center}</style></head><body><header class="top"><a class="back" href="https://tiea9999.github.io/test/app24/index.html">❮ ย้อนกลับ</a><span class="brand brand-stack"><span>TIEA <b>APP24</b></span><small>V1.0</small></span><a class="home" href="https://tiea9999.github.io/test/app24/index.html">⌂ HOME</a></header><main><div class="grid"><a class="tile" href="https://tiea9999.github.io/test/app24/3bb.html"><span class="emoji">📡</span><span class="name">ทีวีออนไลน์</span><span class="sub">กดเพื่อเปิดหมวด</span></a><a class="tile" href="https://tiea9999.github.io/test/app24/movies.html"><span class="emoji">🎬</span><span class="name">หนังทั้งหมด</span><span class="sub">กดเพื่อเปิดหมวด</span></a><a class="tile" href="https://tiea9999.github.io/test/app24/series.html"><span class="emoji">📺</span><span class="name">ซีรีส์</span><span class="sub">กดเพื่อเปิดหมวด</span></a><a class="tile" href="https://tiea9999.github.io/test/app24/short.html"><span class="emoji">🎞️</span><span class="name">ละครสั้น</span><span class="sub">กดเพื่อเปิดหมวด</span></a><a class="tile" href="https://tiea9999.github.io/test/app24/vip.html"><span class="emoji">💎</span><span class="name">VIP</span><span class="sub">กดเพื่อเปิดหมวด</span></a></div></main><script>
/* APP24 remote V2: grid-aware, one move per key, no global OK interception */
(function(){
 const sel='a[href],button:not([disabled]),[tabindex="0"]';
 const visible=e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0&&!e.closest('[hidden]')&&getComputedStyle(e).visibility!=='hidden'};
 document.addEventListener('keydown',function(e){
  const k=({19:'ArrowUp',20:'ArrowDown',21:'ArrowLeft',22:'ArrowRight'})[e.keyCode]||e.key;
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))return;
  if(document.getElementById('tieaPlayerOverlay')?.classList.contains('show'))return;
  const a=document.activeElement;
  if(a&&['INPUT','TEXTAREA','SELECT','VIDEO','IFRAME'].includes(a.tagName))return;
  const items=[...document.querySelectorAll(sel)].filter(visible);
  if(!items.length)return;
  if(!items.includes(a)){e.preventDefault();items[0].focus();return}
  const r=a.getBoundingClientRect(),x=(r.left+r.right)/2,y=(r.top+r.bottom)/2;
  let best=null,score=Infinity;
  for(const item of items){if(item===a)continue;
   const q=item.getBoundingClientRect(),dx=(q.left+q.right)/2-x,dy=(q.top+q.bottom)/2-y;
   const main=k==='ArrowRight'?dx:k==='ArrowLeft'?-dx:k==='ArrowDown'?dy:-dy;
   if(main<5)continue;
   const side=k==='ArrowLeft'||k==='ArrowRight'?Math.abs(dy):Math.abs(dx);
   const cost=main+side*5;
   if(cost<score){score=cost;best=item}
  }
  if(best){e.preventDefault();best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest'});}
 },false);
})();
</script>
