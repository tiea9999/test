<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APP24 Member</title><style>*{box-sizing:border-box}html,body{margin:0;background:#171923;color:#fff;font-family:system-ui,Arial,sans-serif;font-size:13px}.panel{min-height:108px;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px}.info{min-width:0}.name{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis}.expiry{color:#f2adc1;margin-top:5px}.actions{display:flex;flex-direction:column;gap:5px}.btn{display:block;background:#b91f40;border:0;border-radius:9px;color:#fff;padding:8px 11px;font-weight:700;text-align:center;text-decoration:none;white-space:nowrap;font-size:12px}.btn:disabled{opacity:.5}.secondary{background:#30333d}</style></head><body><div class="panel"><div class="info"><div class="name" id="name">กำลังตรวจสอบสมาชิก...</div><div class="expiry" id="expiry">เมนู APP24 ยังเปิดได้ระหว่างตรวจสอบ</div></div><div class="actions"><button class="btn" id="logout" disabled>ออกจากระบบ</button><a class="btn secondary" id="login" href="../member/login.html" target="_top">เข้าสู่ระบบ</a></div></div><script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getAuth,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
import {firebaseConfig} from '../member/firebase-config.js';
const LOGIN='https://tiea9999.github.io/test/member/login.html';
const name=document.getElementById('name'),expiry=document.getElementById('expiry'),logout=document.getElementById('logout'),login=document.getElementById('login');
login.href=LOGIN;
const app=getApps().length?getApp():initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
function dateMs(v){if(!v)return NaN;if(typeof v.toMillis==='function')return v.toMillis();if(typeof v.seconds==='number')return v.seconds*1000;if(typeof v==='number')return v<1e11?v*1000:v;return Date.parse(v);}
function showGuest(){name.textContent='ยังไม่พบการเข้าสู่ระบบ';expiry.textContent='กรุณาเข้าสู่ระบบ VIP';logout.disabled=true;login.style.display='block';}
const timeout=setTimeout(()=>{if(logout.disabled){name.textContent='ยังอ่านสถานะสมาชิกไม่ได้';expiry.textContent='แตะเข้าสู่ระบบเพื่อเปิดบนเว็บไซต์';}},6500);
onAuthStateChanged(auth,async user=>{if(!user){clearTimeout(timeout);showGuest();return;}try{const snap=await getDoc(doc(db,'members',user.uid));if(!snap.exists()){showGuest();return;}const d=snap.data(),exp=dateMs(d.expire),valid=d.role==='admin'||(d.vip===true&&d.active===true&&Number.isFinite(exp)&&exp>Date.now());if(!valid){name.textContent='สมาชิกยังไม่ได้รับสิทธิ์ VIP';expiry.textContent='ตรวจสอบสถานะกับผู้ดูแล';logout.disabled=false;login.style.display='none';return;}name.textContent=d.name||d.displayName||user.displayName||user.email||'สมาชิก VIP';expiry.textContent=d.role==='admin'?'ผู้ดูแลระบบ':'หมดอายุ '+new Date(exp).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});logout.disabled=false;login.style.display='none';clearTimeout(timeout);}catch(e){console.error(e);name.textContent='อ่านข้อมูลสมาชิกไม่สำเร็จ';expiry.textContent='เปิด APP24 ผ่านเว็บไซต์เพื่อตรวจสอบ';}},()=>{showGuest();});
logout.addEventListener('click',async()=>{logout.disabled=true;try{await signOut(auth);top.location.href=LOGIN;}catch(e){console.error(e);name.textContent='ออกจากระบบไม่สำเร็จ';logout.disabled=false;}});
</script></body></html>
