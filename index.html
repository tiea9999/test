/* ===== HARD FIX: REMOTE LEFT TO SIDEBAR ===== */
(function(){
  if (window.__TIEA_REMOTE_LEFT_HARD_FIX__) return;
  window.__TIEA_REMOTE_LEFT_HARD_FIX__ = true;

  function isPlayerOpen(){
    const p = document.getElementById('playerWrap');
    return p && p.style.display === 'block';
  }

  function sidebarWidth(){
    const s = document.getElementById('sidebar') || document.querySelector('.sidebar');
    return s ? s.getBoundingClientRect().right : 235;
  }

  function firstVisibleCard(){
    const list = Array.from(document.querySelectorAll('.card,.sample-card,.ep-btn,#epBackBtn,.more-btn'))
      .filter(el => el.offsetParent !== null);
    return list[0] || null;
  }

  function activeMenu(){
    return document.querySelector('.menu-btn.active') || document.querySelector('.menu-btn');
  }

  function focusMenu(){
    const m = activeMenu();
    if (!m) return false;
    m.focus({preventScroll:false});
    try { m.scrollIntoView({block:'nearest', behavior:'smooth'}); } catch(e) {}
    return true;
  }

  function focusFirstContent(){
    const c = firstVisibleCard();
    if (!c) return false;
    c.focus({preventScroll:false});
    try { c.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'}); } catch(e) {}
    return true;
  }

  document.addEventListener('keydown', function(e){
    if (isPlayerOpen()) return;

    const key = e.key || '';
    const code = e.keyCode || e.which;
    const active = document.activeElement;

    if (!active) return;

    const isLeft = key === 'ArrowLeft' || code === 37;
    const isRight = key === 'ArrowRight' || code === 39;

    if (!isLeft && !isRight) return;

    const inMenu = active.classList && active.classList.contains('menu-btn');
    const inContent =
      active.classList &&
      (
        active.classList.contains('card') ||
        active.classList.contains('sample-card') ||
        active.classList.contains('ep-btn') ||
        active.classList.contains('more-btn') ||
        active.id === 'epBackBtn'
      );

    // เมนูซ้าย -> เข้ารายการ
    if (inMenu && isRight) {
      e.preventDefault();
      e.stopImmediatePropagation();
      focusFirstContent();
      return false;
    }

    // รายการ -> เมนูซ้าย
    if (inContent && isLeft) {
      const rect = active.getBoundingClientRect();
      const leftEdge = sidebarWidth() + 80;

      // ถ้าอยู่ใกล้ซ้าย หรือเป็น ep/list ให้กลับเมนูได้ทันที
      if (rect.left <= leftEdge || active.classList.contains('ep-btn') || active.id === 'epBackBtn') {
        e.preventDefault();
        e.stopImmediatePropagation();
        focusMenu();
        return false;
      }
    }
  }, true);
})();


/* ===== TOUCH MOVE PREVENT CLICK ===== */
(function(){
  let moved = false;

  document.addEventListener('touchstart', () => {
    moved = false;
  }, {passive:true});

  document.addEventListener('touchmove', () => {
    moved = true;
  }, {passive:true});

  document.addEventListener('touchend', (e) => {
    if(moved){
      e.preventDefault();
      e.stopPropagation();
    }
  }, {passive:false});

  document.addEventListener('click', (e) => {
    if(moved){
      e.preventDefault();
      e.stopPropagation();
      moved = false;
      return false;
    }
  }, true);
})();


/* ===== PLAYER BUTTON REMOTE FIX ===== */
(function(){

  function playerOpen(){
    const p = document.getElementById('playerWrap');
    return p && p.style.display === 'block';
  }

  function playerBtns(){
    return Array.from(document.querySelectorAll('#playerBar .player-btn'))
      .filter(el => el.offsetParent !== null);
  }

  document.addEventListener('keydown', function(e){

    if(!playerOpen()) return;

    const key = e.key || '';
    const code = e.keyCode || e.which;

    const isLeft  = key === 'ArrowLeft'  || code === 37;
    const isRight = key === 'ArrowRight' || code === 39;
    const isUp    = key === 'ArrowUp'    || code === 38;

    const active = document.activeElement;
    const btns = playerBtns();

    if(!btns.length) return;

    // ขึ้นบน = แสดงปุ่ม
    if(isUp){
      const bar = document.getElementById('playerBar');
      const wrap = document.getElementById('playerWrap');

      if(bar) bar.classList.remove('hide-ui');
      if(wrap) wrap.classList.add('show-ui');

      if(!active || !active.classList.contains('player-btn')){
        btns[0].focus();
      }

      e.preventDefault();
      e.stopPropagation();
      return;
    }

    // เลื่อนซ้าย/ขวาระหว่างปุ่ม
    if(
      active &&
      active.classList &&
      active.classList.contains('player-btn')
    ){

      let idx = btns.indexOf(active);

      if(isLeft){
        idx = Math.max(0, idx - 1);
        btns[idx].focus();

        e.preventDefault();
        e.stopPropagation();
        return;
      }

      if(isRight){
        idx = Math.min(btns.length - 1, idx + 1);
        btns[idx].focus();

        e.preventDefault();
        e.stopPropagation();
        return;
      }
    }

  }, true);

})();


/* ===== TIEA SMOOTH REMOTE NAV FINAL - KEEP SAME UI ===== */
(function(){
  if (window.__TIEA_SMOOTH_REMOTE_FINAL__) return;
  window.__TIEA_SMOOTH_REMOTE_FINAL__ = true;

  const q = (s, root=document) => Array.from(root.querySelectorAll(s));

  function isVisible(el){
    if (!el) return false;
    const r = el.getBoundingClientRect();
    return el.offsetParent !== null && r.width > 0 && r.height > 0;
  }

  function playerOpen(){
    return playerWrap && playerWrap.style.display === 'block';
  }

  function modalOpen(){
    const m = document.querySelector('.modal.show');
    return !!m;
  }

  function currentContentItems(){
    if (currentMode === 'episodes') {
      return q('#epBackBtn, #epsGrid .ep-btn').filter(isVisible);
    }

    return q('#grid .card, #grid .sample-card, #grid .more-btn, .card, .sample-card, .more-btn')
      .filter(isVisible);
  }

  function menuItems(){
    return q('.sidebar .menu-btn').filter(isVisible);
  }

  function playerButtons(){
    return q('#playerBar .player-btn, #playerBar button').filter(isVisible);
  }

  function focusEl(el){
    if (!el) return false;
    try {
      el.focus({ preventScroll: true });
    } catch(e) {
      try { el.focus(); } catch(err) {}
    }
    try {
      el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
    } catch(e) {}
    return true;
  }

  function focusMenuActive(){
    const active = document.querySelector('.sidebar .menu-btn.active') || menuItems()[0];
    return focusEl(active);
  }

  function focusFirstContent(){
    return focusEl(currentContentItems()[0]);
  }

  function colsForContent(){
    const items = currentContentItems();
    if (items.length < 2) return 1;

    const first = items[0].getBoundingClientRect();
    let cols = 1;

    for (let i = 1; i < items.length; i++) {
      const r = items[i].getBoundingClientRect();
      if (Math.abs(r.top - first.top) < 12) cols++;
      else break;
    }

    return Math.max(1, cols);
  }

  function moveInList(list, delta){
    if (!list.length) return;
    let idx = list.indexOf(document.activeElement);
    if (idx < 0) idx = 0;
    idx = Math.max(0, Math.min(list.length - 1, idx + delta));
    focusEl(list[idx]);
  }

  function requestFull(){
    try {
      if (playerWrap.requestFullscreen) playerWrap.requestFullscreen();
      else if (playerWrap.webkitRequestFullscreen) playerWrap.webkitRequestFullscreen();
    } catch(e) {}
  }

  function seek(sec){
    try {
      video.currentTime = Math.max(0, (video.currentTime || 0) + sec);
    } catch(e) {}
  }

  function showPlayerButtons(focusFirst){
    try {
      showPlayerUi(!!focusFirst);
    } catch(e) {
      try {
        playerBar.classList.remove('hide-ui');
        playerWrap.classList.add('show-ui');
      } catch(err) {}
    }

    if (focusFirst) {
      setTimeout(() => focusEl(playerButtons()[0]), 50);
    }
  }

  document.addEventListener('keydown', function(e){
    const key = e.key || '';
    const code = e.keyCode || e.which;

    const LEFT = key === 'ArrowLeft' || code === 37;
    const RIGHT = key === 'ArrowRight' || code === 39;
    const UP = key === 'ArrowUp' || code === 38;
    const DOWN = key === 'ArrowDown' || code === 40;
    const OK = key === 'Enter' || key === 'OK' || code === 13 || code === 23;
    const BACK = key === 'Escape' || key === 'Backspace' || key === 'BrowserBack' || code === 10009;

    if (!(LEFT || RIGHT || UP || DOWN || OK || BACK)) return;

    const active = document.activeElement;

    // PLAYER MODE
    if (playerOpen()) {
      e.preventDefault();
      e.stopImmediatePropagation();

      const btns = playerButtons();
      const activeIsPlayerBtn = active && btns.includes(active);

      if (UP) {
        showPlayerButtons(true);
        return false;
      }

      if (activeIsPlayerBtn) {
        if (LEFT) { moveInList(btns, -1); return false; }
        if (RIGHT) { moveInList(btns, 1); return false; }
        if (DOWN) {
          try { active.blur(); } catch(e) {}
          showPlayerButtons(false);
          return false;
        }
        if (OK) {
          try { active.click(); } catch(e) {}
          return false;
        }
      }

      if (LEFT) { showPlayerButtons(false); seek(-10); return false; }
      if (RIGHT) { showPlayerButtons(false); seek(10); return false; }
      if (OK) { showPlayerButtons(false); requestFull(); return false; }
      if (BACK) { closePlayer(); return false; }

      return false;
    }

    // MODAL: let modal buttons work, but Back closes modal
    if (modalOpen()) {
      if (BACK) {
        e.preventDefault();
        e.stopImmediatePropagation();
        try { closeModal(); } catch(err) {}
        return false;
      }
      // For grids inside modal, use same content motion below
    }

    // BACK: never exit app unexpectedly
    if (BACK) {
      e.preventDefault();
      e.stopImmediatePropagation();

      if (currentMode === 'episodes') {
        currentMode = 'list';
        currentSeries = null;
        listView.style.display = 'block';
        epsWrap.style.display = 'none';
        setTimeout(() => focusFirstContent(), 80);
        return false;
      }

      // Stay in app; focus active menu instead of navigating away
      focusMenuActive();
      return false;
    }

    const menus = menuItems();
    const content = currentContentItems();
    const inMenu = active && menus.includes(active);
    const inContent = active && content.includes(active);

    // MENU MODE
    if (inMenu) {
      e.preventDefault();
      e.stopImmediatePropagation();

      if (UP) { moveInList(menus, -1); return false; }
      if (DOWN) { moveInList(menus, 1); return false; }
      if (RIGHT) { focusFirstContent(); return false; }
      if (OK) { try { active.click(); } catch(err) {} return false; }
      if (LEFT) { focusEl(active); return false; }

      return false;
    }

    // CONTENT MODE
    if (inContent) {
      e.preventDefault();
      e.stopImmediatePropagation();

      let idx = content.indexOf(active);
      if (idx < 0) idx = 0;
      const cols = colsForContent();

      if (LEFT) {
        const rect = active.getBoundingClientRect();
        const side = document.querySelector('.sidebar')?.getBoundingClientRect();
        const sidebarRight = side ? side.right : 235;

        // If near first column, jump to sidebar. This fixes "cannot go left to menu".
        if (idx % cols === 0 || rect.left <= sidebarRight + 80 || currentMode === 'episodes') {
          focusMenuActive();
        } else {
          focusEl(content[Math.max(0, idx - 1)]);
        }
        return false;
      }

      if (RIGHT) { focusEl(content[Math.min(content.length - 1, idx + 1)]); return false; }
      if (UP) { focusEl(content[Math.max(0, idx - cols)]); return false; }
      if (DOWN) { focusEl(content[Math.min(content.length - 1, idx + cols)]); return false; }
      if (OK) { try { active.click(); } catch(err) {} return false; }

      return false;
    }

    // Fallback focus
    if (RIGHT || DOWN || UP) {
      e.preventDefault();
      e.stopImmediatePropagation();
      if (!focusFirstContent()) focusMenuActive();
      return false;
    }

    if (LEFT) {
      e.preventDefault();
      e.stopImmediatePropagation();
      focusMenuActive();
      return false;
    }

  }, true);

  // Touch: scrolling won't trigger open; tap still opens.
  let sx = 0, sy = 0, moved = false;
  document.addEventListener('touchstart', function(e){
    const t = e.touches && e.touches[0];
    if (!t) return;
    sx = t.clientX; sy = t.clientY; moved = false;
  }, {passive:true});

  document.addEventListener('touchmove', function(e){
    const t = e.touches && e.touches[0];
    if (!t) return;
    if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) moved = true;
  }, {passive:true});

  document.addEventListener('click', function(e){
    if (moved) {
      e.preventDefault();
      e.stopImmediatePropagation();
      moved = false;
      return false;
    }
  }, true);

})();

</script>

      statusBox.textContent = msg || '';

    function sanitize(text) {
      return String(text || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function getThumb(item) {
      return item?.image || item?.poster || item?.thumb || item?.logo || item?.cover || item?.poster_url || FOLDER_LOGO;
    }

    function mapServers(arr) {
      if (!Array.isArray(arr)) return [];
      return arr.map((s, i) => ({
        name: s?.name || s?.title || `Server ${i + 1}`,
        url: s?.url || s?.link || s?.file || s?.source || s?.stream || '',
        drm: !!s?.drm || !!(s?.keyId || s?.kid || s?.key_id),
        keyId: s?.keyId || s?.kid || s?.key_id || '',
        key: s?.key || s?.clearkey || ''
      })).filter(s => s.url);
    }

    function normalizeUrl(url) {
      return String(url || '').trim();
    }

    function isMySeriesSource() {
      return String(currentSource || '').includes('myseries-series.json');
    }

    function isFolderLike(item) {
      const u = normalizeUrl(item?.url || item?.source || item?.link || item?.file || '');
      return !!u && /\.json($|\?)/i.test(u);
    }

    function getPlayableUrl(item, idx = 0) {
      if (!item) return '';
      if (Array.isArray(item.servers) && item.servers.length) {
        return normalizeUrl(item.servers[idx]?.url || item.servers[0]?.url || '');
      }
      return normalizeUrl(item.url || item.link || item.source || item.stream || item.file || '');
    }

    function buildPlayCandidates(url) {
      const raw = normalizeUrl(url);
      if (!raw) return [];
      const lower = raw.toLowerCase();
      const list = [raw];
      const noProxy = lower.includes('.mpd') || lower.includes('thaicdn') || lower.includes('mux.dev') || lower.includes('byteark');
      if (/^https?:/i.test(raw) && !raw.includes('iptv.tawatchai250958.workers.dev') && !noProxy) {
        list.push(PROXY + encodeURIComponent(raw));
      }
      return [...new Set(list)];
    }

    function isHlsUrl(url) {
      url = String(url || '');
      return /\.(m3u8|txt)($|\?)/i.test(url) || /master\.txt($|\?)/i.test(url) || /type=m3u8|extension=m3u8/i.test(url);
    }

    function isDashUrl(url) {
      return /\.mpd($|\?)/i.test(String(url || ''));
    }

    function isVideoFile(url) {
      return /\.(mp4|mkv|webm|mov|m4v|avi)($|\?)/i.test(url);
    }

    function isProbablyIframe(url) {
      return /player|embed|iframe|watch\//i.test(url) && !isHlsUrl(url) && !isDashUrl(url) && !isVideoFile(url);
    }

    function clearMovieFallbackTimer() {
      if (movieFallbackTimer) {
        clearTimeout(movieFallbackTimer);
        movieFallbackTimer = null;
      }
    }

    function destroyEngines() {
      if (hls) {
        try { hls.destroy(); } catch (e) {}
        hls = null;
      }
      if (dash) {
        try { dash.reset(); } catch (e) {}
        dash = null;
      }
    }

    function clearPlayer() {
      stopPlayWatchdog();
      clearMovieFallbackTimer();
      destroyEngines();
      try { video.pause(); } catch (e) {}
      video.removeAttribute('src');
      video.src = '';
      video.load();
      iframePlayer.src = 'about:blank';
      iframePlayer.style.display = 'none';
      video.style.display = 'block';
      playerNextBtn.classList.add('hidden');
    }

    function showPlayerUi(focusClose = false) {
      playerWrap.classList.add('show-ui');
      playerBar.classList.remove('hide-ui');

      if (focusClose) {
        setTimeout(() => {
          if (playerWrap.style.display === 'block') playerCloseBtn.focus();
        }, 60);
      }

      if (playerUiTimer) clearTimeout(playerUiTimer);
      playerUiTimer = setTimeout(() => {
        if (playerWrap.style.display === 'block') {
          playerBar.classList.add('hide-ui');
          playerWrap.classList.remove('show-ui');

          // ไม่ blur focus รีโมท เพื่อให้เลื่อนไปปุ่มอื่นได้
        }
      }, 3200);
    }

    function showPlayer() {
      playerWrap.style.display = 'block';
      showPlayerUi(true);
    }

    function closePlayer() {
      if (playerUiTimer) {
        clearTimeout(playerUiTimer);
        playerUiTimer = null;
      }

      clearPlayer();
      playerWrap.style.display = 'none';
      playerBar.classList.remove('hide-ui');
      playerWrap.classList.remove('show-ui');

      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
      } catch(e) {}

      if (playerReturnMode === 'episodes' && currentSeries) {
        currentMode = 'episodes';
        listView.style.display = 'none';
        epsWrap.style.display = 'block';

        listView.style.display = 'block';
        epsWrap.style.display = 'none';
      }

      focusCurrentView();

    function saveReturnState(extra = {}) {
      try {
        sessionStorage.setItem(RETURN_STATE_KEY, JSON.stringify({
          source: currentSource || '',
          title: currentTitle || '',
          kind: currentKind || '',
          mode: currentMode || 'list',
          seriesTitle: currentSeries?.title || '',
          expand: sectionExpandState || {},
          focusIndex,
          ...extra
        }));
      } catch (e) {}
    }

    function getReturnState() {
      try {
        const raw = sessionStorage.getItem(RETURN_STATE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function clearReturnState() {
      try { sessionStorage.removeItem(RETURN_STATE_KEY); } catch (e) {}
    }

    function openLink(url) {
      if (!url) return;
      location.href = url;
    }

    function openExternalPlayer(url) {

      saveReturnState();
      try {
        const u = new URL(url);

      } catch (e) {
        location.href = url;
      }
    }

    function openMx(url) {
      if (!url) return;
      saveReturnState();
      location.href = 'intent:' + url + '#Intent;package=com.mxtech.videoplayer.ad;end';
    }

    function isMovieItem(item) {
      return currentKind === 'movie' || item?.type === 'movie';
    }

    function categoryOrder(cat) {
      const text = String(cat || '');
      if (text.includes('2026')) return 1;
      if (text.includes('2025')) return 2;
      if (text.includes('ใหม่')) return 3;
      if (text.includes('จีน')) return 4;
      if (text.includes('เกาหลี')) return 5;
      if (text.includes('ญี่ปุ่น')) return 6;
      if (text.includes('ไทย')) return 7;
      if (text.includes('ฝรั่ง')) return 8;
      if (text.includes('พากย์ไทย')) return 9;
      if (text.includes('ซับไทย')) return 10;
      return 99;
    }

    function makeCategory(node, fallback = 'อื่นๆ') {
      const cat = String(node?.category || node?.group || node?.genre || '').trim();
      const sub = String(node?.subcategory || node?.sub_group || '').trim();
      if (currentKind === 'series') return cat || sub || fallback;
      if (cat && sub && cat !== sub) return `${cat} • ${sub}`;
      return cat || sub || fallback;
    }

    function normalizeMovieOrSeries(input) {
      const out = [];
      const seen = new Set();

      function add(item) {
        if (!item) return;
        const key = [item.type, item.title, item.url, item.category, item.year, item.episodes?.length || 0].join('|').toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        out.push(item);
      }

      function walk(node, inherited = {}) {
        if (!node) return;
        if (Array.isArray(node)) {
          node.forEach(n => walk(n, inherited));
          return;
        }
        if (typeof node !== 'object') return;

        const image = getThumb(node) || inherited.image || '';
        const title = node.title || node.name || node.movie_name || node.series_name || node.ep_name || node.episode || 'ไม่มีชื่อ';
        const url = normalizeUrl(node.url || node.link || node.stream || node.source || node.file || '');
        const servers = mapServers(node.servers || node.server || []);
        const category = makeCategory(node, inherited.category || 'อื่นๆ');

        if (Array.isArray(node.episodes) && node.episodes.length) {
          add({
            title,
            image,
            url,
            servers: [],
            type: 'series',
            category,
            status: node.status || '',
            year: node.year || '',
            language: node.language || node.lang || '',
            episodes: node.episodes.map((ep, i) => ({
              title: ep.title || ep.name || ep.ep_name || `EP${i + 1}`,
              image: getThumb(ep) || image || '',
              url: normalizeUrl(ep.url || ep.link || ep.stream || ep.source || ep.file || ''),
              servers: mapServers(ep.servers || ep.server || []),
              type: 'episode'
            })).filter(ep => ep.url || ep.servers.length)
          });
          return;
        }

        if (Array.isArray(node.items) && node.items.length) {
          const nextInherited = {
            image,
            category: makeCategory(node, inherited.category || title || 'อื่นๆ')
          };
          node.items.forEach(child => walk(child, nextInherited));
          return;
        }

        if (node.type === 'menu' && Array.isArray(node.items)) {
          node.items.forEach(child => walk(child, inherited));
          return;
        }

        if (url && /\.json($|\?)/i.test(url) && title) {
          add({
            title,
            image: image || FOLDER_LOGO,
            url,
            servers: [],
            type: 'folder',
            category,
            status: node.status || '',
            year: node.year || '',
            language: node.language || node.lang || ''
          });
          return;
        }

        if ((url || servers.length) && title) {
          add({
            title,
            image,
            url: url || servers[0]?.url || '',
            servers,
            type: currentKind === 'movie' ? 'movie' : (node.type || 'video'),
            category,
            status: node.status || '',
            year: node.year || '',
            language: node.language || node.lang || ''
          });
          return;
        }

        Object.values(node).forEach(v => {
          if (Array.isArray(v) || (v && typeof v === 'object')) walk(v, { image, category });
        });
      }

      walk(input, {});
      return out;
    }

    function normalizeTV(data) {
      const out = [];
      if (Array.isArray(data)) return normalizeMovieOrSeries(data);
      if (Array.isArray(data?.items)) return normalizeMovieOrSeries(data.items);

      if (Array.isArray(data?.groups)) {
        data.groups.forEach(group => {
          const groupName = group?.name || 'ทีวี';
          const stations = Array.isArray(group?.stations) ? group.stations : [];
          const subGroups = Array.isArray(group?.groups) ? group.groups : [];

          stations.forEach((s, i) => {
            const url = normalizeUrl(s?.url || s?.link || s?.file || s?.source || s?.stream || '');
            if (!url) return;
            out.push({
              title: s?.name || `${groupName} ${i + 1}`,
              image: s?.image || s?.logo || group?.image || '',
              url,
              servers: [{ name: s?.name || 'Main', url }],
              type: 'video',
              category: groupName,
              language: s?.info || ''
            });
          });

          subGroups.forEach(sub => {
            const subStations = Array.isArray(sub?.stations) ? sub.stations : [];
            subStations.forEach((s, i) => {
              const url = normalizeUrl(s?.url || s?.link || s?.file || s?.source || s?.stream || '');
              if (!url) return;
              out.push({
                title: s?.name || sub?.name || `${groupName} ${i + 1}`,
                image: s?.image || s?.logo || sub?.image || group?.image || '',
                url,
                servers: [{ name: s?.name || 'Main', url }],
                type: 'video',
                category: sub?.name || groupName,
                language: s?.info || ''
              });
            });
          });
        });
      }

      return out;
    }

    function normalizeM3U(text) {
      const result = [];
      const lines = String(text || '').split(/\r?\n/);
      let current = null;
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) continue;
        if (line.startsWith('#EXTINF:')) {
          const logo = (line.match(/tvg-logo="([^"]*)"/i) || [])[1] || '';
          const group = (line.match(/group-title="([^"]*)"/i) || [])[1] || 'ทีวี';
          const name = line.split(',').pop()?.trim() || 'ไม่มีชื่อ';
          current = {
            title: name,
            image: logo,
            url: '',
            servers: [],
            type: 'video',
            category: group,
            language: ''
          };
        } else if (!line.startsWith('#') && current) {
          current.url = line;
          current.servers = [{ name: 'Main', url: line }];
          result.push(current);
          current = null;
        }
      }
      return result;
    }

    async function fetchText(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('โหลดไฟล์ไม่สำเร็จ: ' + res.status);
      return await res.text();
    }

    async function loadSource(sourceUrl, kind = currentKind) {
      const cacheKey = `${kind}|${sourceUrl}`;
      if (cache[cacheKey]) return cache[cacheKey];
      const lower = String(sourceUrl || '').toLowerCase();

      if ((lower.includes('.m3u8') || lower.includes('master.txt') || lower.includes('.txt') || lower.includes('.mpd')) && !lower.includes('.json')) {
        const direct = [{ title: 'Live Stream', image: '', url: sourceUrl, servers: [{ name: 'Main', url: sourceUrl }], type: 'video', category: 'ถ่ายทอดสด' }];
        cache[cacheKey] = direct;
        return direct;
      }

      const text = await fetchText(sourceUrl);
      const trimmed = text.trim();
      if (!trimmed) return [];

      let result = [];
      if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
        const json = JSON.parse(trimmed);
        if (kind === 'tv') result = normalizeTV(json);
        else if (Array.isArray(json)) result = normalizeMovieOrSeries(json);
        else if (Array.isArray(json?.items)) result = normalizeMovieOrSeries(json.items);
        else result = normalizeMovieOrSeries(json);
      } else if (trimmed.includes('#EXTM3U') || trimmed.includes('#EXTINF')) {
        result = normalizeM3U(trimmed);
      }

      cache[cacheKey] = result;
      return result;
    }

    function sortCategories(keys) {
      return keys.sort((a, b) => {
        const oa = categoryOrder(a);
        const ob = categoryOrder(b);
        if (oa !== ob) return oa - ob;
        return a.localeCompare(b, 'th');
      });
    }

      });
      return sortCategories(Object.keys(groups)).map(key => [key, groups[key]]);
    }

    function stopPlayWatchdog() {
      if (playWatchdog) {
        clearInterval(playWatchdog);
        playWatchdog = null;
      }
    }

    function startPlayWatchdog() {
      stopPlayWatchdog();
      lastVideoTime = 0;
      stuckCount = 0;
      recoverBusy = false;
      lastRecoverAt = 0;

      playWatchdog = setInterval(() => {
        if (playerWrap.style.display !== 'block' || video.style.display === 'none') return;

        try {
          if (video.paused && video.readyState >= 3) {
            video.play().catch(() => {});
          }

          const now = video.currentTime || 0;
          const moved = Math.abs(now - lastVideoTime) > 0.08;

          if (moved || video.readyState >= 3) {
            stuckCount = 0;
          } else if (!video.paused) {
            stuckCount++;
          }

          lastVideoTime = now;

          // รอให้นิ่งก่อนค่อยกู้ ลดอาการเด้ง-หมุน-เด้งซ้ำ
          if (stuckCount >= 12 && !recoverBusy && Date.now() - lastRecoverAt > 35000) {
            recoverBusy = true;
            lastRecoverAt = Date.now();
            stuckCount = 0;

            playerNote.textContent = 'สัญญาณสะดุด กำลังประคองเส้นเดิม...';

            if (hls) {
              try {
                hls.startLoad(Math.max(0, (video.currentTime || 0) - 1));
              } catch(e) {}
            }

            try {
              if (video.readyState >= 2) video.play().catch(() => {});
            } catch(e) {}

            setTimeout(() => {
              recoverBusy = false;
            }, 12000);
          }
        } catch(e) {}
      }, 5000);
    }

    function attachPlaybackSuccessHandlers() {
      const ok = () => clearMovieFallbackTimer();
      video.addEventListener('playing', ok, { once: true });
      video.addEventListener('loadeddata', ok, { once: true });
      video.addEventListener('canplay', ok, { once: true });
    }

    function createStableHls(isMovie = false) {
      return new Hls({
        enableWorker: false,
        autoStartLoad: true,
        startPosition: -1,
        lowLatencyMode: false,
        maxBufferLength: isMovie ? 42 : 32,
        maxMaxBufferLength: isMovie ? 75 : 55,
        backBufferLength: isMovie ? 35 : 16,
        maxBufferHole: 1.6,
        highBufferWatchdogPeriod: 8,
        manifestLoadingTimeOut: 35000,
        levelLoadingTimeOut: 35000,
        fragLoadingTimeOut: 45000,
        manifestLoadingMaxRetry: 10,
        levelLoadingMaxRetry: 10,
        fragLoadingMaxRetry: 14,
        manifestLoadingRetryDelay: 2200,
        levelLoadingRetryDelay: 2200,
        fragLoadingRetryDelay: 2400,
        capLevelToPlayerSize: true,
        testBandwidth: false,
        liveSyncDurationCount: 5,
        liveMaxLatencyDurationCount: 14
      });
    }

    function setupGentleVideoEvents() {
      if (setupGentleVideoEvents._ready) return;
      setupGentleVideoEvents._ready = true;

      video.addEventListener('waiting', () => {
        playerNote.textContent = 'กำลังบัฟเฟอร์...';
        try {
          if (hls) hls.startLoad();
        } catch(e) {}
      });

      video.addEventListener('stalled', () => {
        playerNote.textContent = 'สัญญาณสะดุด รอเส้นหลัก...';
        setTimeout(() => {
          try {
            if (hls) hls.startLoad();
            if (video.readyState >= 2) video.play().catch(() => {});
          } catch(e) {}
        }, 1800);
      });

      video.addEventListener('playing', () => {
        stuckCount = 0;
      });
    }

    function tryStartVideoWithSound(fallbackFn) {
      video.muted = false;
      video.volume = 1;
      const p = video.play();
      if (p && typeof p.then === 'function') {
        p.catch(() => {
          video.muted = true;
          video.play().then(() => {
            setTimeout(() => {
              video.muted = false;
              video.volume = 1;
            }, 300);
          }).catch(() => {
            if (fallbackFn) fallbackFn();
          });
        });
      }
    }

    async function playItem(item, serverIndex = 0) {
      playerReturnMode = currentMode === 'episodes' ? 'episodes' : 'list';
      currentItem = item;
      currentServerIndex = serverIndex;
      clearPlayer();
      const playServer = getPlayableServer(item, serverIndex);
      const directUrl = normalizeUrl(playServer?.url || getPlayableUrl(item, serverIndex));
      if (!directUrl) {
        setStatus('❌ ไม่พบลิงก์เล่น');
        return;
      }

      const candidates = buildPlayCandidates(directUrl);
      currentPlayCandidates = candidates;
      const playUrl = candidates[0] || directUrl;
      const isAndroid = /Android/i.test(navigator.userAgent);
      const movieMode = isMovieItem(item);
      playerNote.textContent = item.title || 'กำลังเล่น';
      updateNextServerButton();

      try {
        if (isProbablyIframe(playUrl)) {
          showIframe(playUrl);
          return;
        }

        showPlayer();
        setupGentleVideoEvents();
        startPlayWatchdog();
        attachPlaybackSuccessHandlers();
        if (movieMode) startMovieFallback(directUrl);

        if (isHlsUrl(playUrl)) {
          if (Hls.isSupported()) {
            hls = createStableHls(movieMode);
            hls.loadSource(playUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => tryStartVideoWithSound(() => openExternalPlayer(directUrl)));
            hls.on(Hls.Events.ERROR, (event, data) => {
              if (!data) return;

              // non-fatal ปล่อยให้ hls.js จัดการเอง ลดอาการเด้งซ้ำ
              if (!data.fatal) return;

              try {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                  playerNote.textContent = 'เน็ตสะดุด กำลังต่อเส้นเดิม...';
                  setTimeout(() => { try { hls.startLoad(); } catch(e) {} }, 1200);
                  return;
                }

                if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                  playerNote.textContent = 'ภาพสะดุด กำลังกู้คืน...';
                  try { hls.recoverMediaError(); } catch(e) {}
                  return;
                }

                // error อื่นค่อยเปิด PLAYER หลังรอ ไม่เด้งทันที
                setTimeout(() => openExternalPlayer(directUrl), 2500);
              } catch (e) {
                setTimeout(() => openExternalPlayer(directUrl), 2500);
              }
            });
            return;
          }
          video.src = playUrl;
          tryStartVideoWithSound(() => openExternalPlayer(directUrl));
          return;
        }

        if (isDashUrl(playUrl)) {
          dash = dashjs.MediaPlayer().create();
          try {
            dash.updateSettings({
              streaming: {
                buffer: { stableBufferTime: 18, bufferTimeAtTopQuality: 25 },
                retryAttempts: { MPD: 3, MediaSegment: 4 },
                retryIntervals: { MPD: 1500, MediaSegment: 1800 }
              }
            });
          } catch(e) {}

          if (playServer?.drm && playServer?.keyId && playServer?.key) {
            try {
              dash.setProtectionData({
                "org.w3.clearkey": {
                  "clearkeys": { [playServer.keyId]: playServer.key }
                }
              });
            } catch(e) {}
          }

          dash.initialize(video, playUrl, true);
          video.muted = true;
          video.play().then(() => {
            setTimeout(() => {
              video.muted = false;
              video.volume = 1;
            }, 300);
          }).catch(() => openExternalPlayer(directUrl));
          return;
        }

        video.src = playUrl;
        tryStartVideoWithSound(() => openExternalPlayer(directUrl));
      } catch (e) {
        console.error(e);
        openExternalPlayer(directUrl);
      }
    }

    };

    backBtn.onclick = async () => {
      if (playerWrap.style.display === 'block') {
        closePlayer();
        return;
      }
      if (currentMode === 'episodes') {
        currentMode = 'list';
        currentSeries = null;
        listView.style.display = 'block';
        epsWrap.style.display = 'none';
        focusCurrentView();
        return;
      }
      const prev = historyStack.pop();
      if (prev?.source) {
        currentSource = prev.source;
        currentTitle = prev.title;
        currentKind = prev.kind;
        await loadCurrentMenu();
        return;
      }
      openLink(HOME_URL);
    };

    playerHomeBtn.onclick = () => openLink(HOME_URL);
    playerCloseBtn.onclick = closePlayer;
    playerRetryBtn.onclick = () => currentItem && playItem(currentItem, currentServerIndex);
    playerExternalBtn.onclick = () => {
      const url = getPlayableUrl(currentItem, currentServerIndex) || currentPlayCandidates[0] || '';
      openExternalPlayer(url);
    };
    playerMxBtn.onclick = () => {
      const url = getPlayableUrl(currentItem, currentServerIndex) || currentPlayCandidates[0] || '';
      openMx(url);
    };
    playerNextBtn.onclick = () => {
      if (!currentItem?.servers?.length) return;
      currentServerIndex = (currentServerIndex + 1) % currentItem.servers.length;
      playItem(currentItem, currentServerIndex);
    };

    ['mousemove','click','touchstart'].forEach(ev => {
      document.addEventListener(ev, () => {
        if (playerWrap.style.display === 'block') showPlayerUi(false);
      }, { passive: true });
    });

    function requestPlayerFullscreen() {
      try {
        if (playerWrap.requestFullscreen) playerWrap.requestFullscreen();
        else if (playerWrap.webkitRequestFullscreen) playerWrap.webkitRequestFullscreen();
      } catch(e) {}
    }

    function seekVideo(sec) {
      try {
        video.currentTime = Math.max(0, (video.currentTime || 0) + sec);
      } catch(e) {}
    }

    function backFromEpisodesToList() {
      currentMode = 'list';
      currentSeries = null;
      listView.style.display = 'block';
      epsWrap.style.display = 'none';
      focusCurrentView();
    }

    document.addEventListener('keydown', async (e) => {
      const isBack = e.key === 'Escape' || e.key === 'Backspace' || e.key === 'BrowserBack' || e.keyCode === 10009;

      if (playerWrap.style.display === 'block') {
        showPlayerUi(true);

        if (e.key === 'ArrowLeft' || e.keyCode === 37) {
          e.preventDefault();
          e.stopPropagation();
          seekVideo(-10);
          return;
        }

        if (e.key === 'ArrowRight' || e.keyCode === 39) {
          e.preventDefault();
          e.stopPropagation();
          seekVideo(10);
          return;
        }

        if (e.key === 'Enter' || e.key === 'OK' || e.keyCode === 13 || e.keyCode === 23) {
          if (document.activeElement === playerCloseBtn) {
            e.preventDefault();
            e.stopPropagation();
            closePlayer();
            return;
          }

          e.preventDefault();
          e.stopPropagation();
          requestPlayerFullscreen();
          return;
        }

        if (isBack) {
          e.preventDefault();
          e.stopPropagation();
          closePlayer();
          return;
        }

        return;
      }

      if (isBack) {
        e.preventDefault();
        e.stopPropagation();

        if (currentMode === 'episodes') {
          backFromEpisodesToList();
          return;
        }

        const prev = historyStack.pop();
        if (prev?.source) {
          currentSource = prev.source;
          currentTitle = prev.title;
          currentKind = prev.kind;
          await loadCurrentMenu();
          return;
        }

        focusCurrentView();
        return;
      }

      const focusables = getCurrentFocusable();
      if (!focusables.length) return;
      const current = document.activeElement;
      let idx = focusables.indexOf(current);
      if (idx < 0) idx = 0;

      const cols = currentMode === 'episodes'
        ? Math.max(1, Math.floor(epsGrid.clientWidth / 150))
        : Math.max(1, Math.floor(mainArea.clientWidth / (currentKind === 'tv' ? 150 : 165)));

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        focusElementByIndex(Math.min(idx + 1, focusables.length - 1));
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        focusElementByIndex(Math.max(idx - 1, 0));
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        focusElementByIndex(Math.min(idx + cols, focusables.length - 1));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        focusElementByIndex(Math.max(idx - cols, 0));
      }
    }, true);

    window.addEventListener('pageshow', async () => {
      const restored = await restoreReturnState();
      if (!restored) await loadCurrentMenu();
    });
    </script>
</body>

</html>
