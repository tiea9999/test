function getUpdateTime(item){
  let raw=String(item.updated||item.update||item.last_update||item.date||item.added||item.created||'').trim();
  if(!raw&&item.raw){
    raw=String(item.raw.updated||item.raw.update||item.raw.last_update||item.raw.date||item.raw.added||item.raw.created||'').trim();
  }
  if(!raw)return 0;
  let t=Date.parse(raw);
  if(!isNaN(t))return t;
  let m=raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m){
    let d=Number(m[1]),mo=Number(m[2])-1,y=Number(m[3]);
    return new Date(y,mo,d).getTime();
  }
  return 0;
}

    return 0;
  });
}

    setTimeout(()=>openDetail(item),120);
  }
}function saveReturnState(obj){try{sessionStorage.setItem('tiea_return_state',JSON.stringify({activeSource:state.activeSource,scroll:content.scrollTop,time:Date.now(),...obj}))}catch(e){}}function restoreReturnState(){try{let raw=sessionStorage.getItem('tiea_return_state');if(!raw)return false;let data=JSON.parse(raw);sessionStorage.removeItem('tiea_return_state');if(data.activeSource&&data.activeSource!=='home'){loadMenuSource(data.activeSource).then(()=>setTimeout(()=>{content.scrollTop=data.scroll||0},500));return true}}catch(e){}return false}
function safeIntent(url,mode){
  url=url||state.originalUrl||state.currentUrl;
  if(!url)return;
  saveReturnState({player:mode||'external',url:url});

  const ua=(navigator.userAgent||'').toLowerCase();
  const isTV =
    ua.includes('android tv') ||
    ua.includes('smart-tv') ||
    ua.includes('smarttv') ||
    ua.includes('projector') ||
    ua.includes('xgimi') ||
    ua.includes('mibox') ||
    ua.includes('bravia') ||
    ua.includes('chromecast') ||
    ua.includes('aft') ||
    ua.includes('tizen') ||
    ua.includes('webos');

  // โปรเจคเตอร์ / Android TV: ห้ามใช้ intent:// เด็ดขาด
  // และไม่เด้งออกอัตโนมัติ ให้ผู้ใช้กด PLAYER/MX เองถ้าจำเป็น
  if(isTV){
    setStatus('ถ้าในเว็บไม่ขึ้นภาพ ให้กด PLAYER/MX เอง');
    return;
  }

  try{
    let u=new URL(url);
    let scheme=u.protocol.replace(':','');
    let hostPath=u.host+u.pathname+(u.search||'');
    let intent='';
    if(mode==='mx'){
      intent='intent://'+hostPath+'#Intent;scheme='+scheme+';action=android.intent.action.VIEW;type=video/*;package=com.mxtech.videoplayer.ad;S.browser_fallback_url='+encodeURIComponent(url)+';end';
    }else{
      intent='intent://'+hostPath+'#Intent;scheme='+scheme+';action=android.intent.action.VIEW;type=video/*;S.browser_fallback_url='+encodeURIComponent(url)+';end';
    }
    setTimeout(()=>{window.location.href=intent},80);
  }catch(e){
    window.location.href=url;
  }
}function openMx(url){safeIntent(url||state.originalUrl||state.currentUrl,'mx')}function openExternal(url){safeIntent(url||state.originalUrl||state.currentUrl,'external')}
async function loadMenuSource(key){state.activeSource=key;let label=document.querySelector(`[data-source="${key}"]`)?.textContent?.trim()||'รายการ';setStatus('กำลังโหลด '+label+' ...');content.innerHTML='<div class="hero"><div class="hero-title">กำลังโหลด...</div><div class="hero-sub">'+label+'</div></div>';try{if(key==='series-update'){let items=await loadSeriesUpdateDirect();renderUpdatePage(items,label);return}if(key==='series-main'){renderRows([{title:'MySeries แยกหมวด',items:MYSERIES_FOLDERS}],label);setStatus('พร้อมใช้งาน • MySeries แยกหมวด');return}let items=await loadSourcePack(key);renderRows(makeRows(items),label);setStatus(items.length?'พร้อมใช้งาน':'ไม่พบรายการ')}catch(e){content.innerHTML='<div class="hero"><div class="hero-title">โหลดไม่สำเร็จ</div><div class="hero-sub">'+e.message+'</div></div>';setStatus('โหลดไม่สำเร็จ')}}function openVip(url){let pass=prompt('กรุณาใส่รหัสผ่าน VIP');if(pass===VIP_PASSWORD)location.href=url;else if(pass!==null)alert('รหัสผ่านไม่ถูกต้อง')}
document.querySelectorAll('.menu-btn').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(btn.dataset.vipLink){openVip(btn.dataset.vipLink);return}if(btn.dataset.link){location.href=btn.dataset.link;return}if(btn.dataset.action==='home'){renderHome();return}if(btn.dataset.action==='live-page'){location.href=LIVE_URL;return}if(btn.dataset.source){loadMenuSource(btn.dataset.source);return}}});
$('homeBtn').onclick=()=>location.href=HOME_URL;$('reloadBtn').onclick=()=>{state.cache={};if(state.activeSource&&state.activeSource!=='home')loadMenuSource(state.activeSource);else renderHome()};$('liveBtn').onclick=()=>location.href=LIVE_URL;$('closePlayerBtn').onclick=closePlayer;$('playerHomeBtn').onclick=()=>location.href=HOME_URL;$('mxBtn').onclick=()=>openMx();$('extBtn').onclick=()=>openExternal();$('closeModalBtn').onclick=closeModal;$('prevPageBtn').onclick=()=>{state.page--;renderModalPage()};$('nextPageBtn').onclick=()=>{state.page++;renderModalPage()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'||e.keyCode===10009){e.preventDefault();if(playerPanel.classList.contains('show'))closePlayer();else if($('modal').classList.contains('show'))closeModal();else location.href=HOME_URL}});document.addEventListener('keydown',e=>{let a=document.activeElement;if(!a||!a.classList||!a.classList.contains('card'))return;if(e.key==='ArrowRight'){let n=a.nextElementSibling;if(n&&n.classList.contains('card')){e.preventDefault();n.focus();n.scrollIntoView({block:'nearest',inline:'center'})}}if(e.key==='ArrowLeft'){let p=a.previousElementSibling;if(p&&p.classList.contains('card')){e.preventDefault();p.focus();p.scrollIntoView({block:'nearest',inline:'center'})}}});

function setupRemoteSeekControl(){
  if(setupRemoteSeekControl._ready)return;
  setupRemoteSeekControl._ready=true;
  document.addEventListener('keydown',function(e){
    const panel=document.getElementById('playerPanel');
    const v=document.getElementById('video');
    if(!panel||!panel.classList.contains('show')||!v)return;

    const key=e.key||'';
    const code=e.keyCode||e.which;
    const active=document.activeElement;
    const activeIsBtn=active&&active.classList&&active.classList.contains('player-btn');

    if(key==='ArrowRight'||code===39){
      e.preventDefault();e.stopPropagation();
      try{v.currentTime=isFinite(v.duration)?Math.min(v.duration,(v.currentTime||0)+10):(v.currentTime||0)+10}catch(err){}
      return;
    }
    if(key==='ArrowLeft'||code===37){
      e.preventDefault();e.stopPropagation();
      try{v.currentTime=Math.max(0,(v.currentTime||0)-10)}catch(err){}
      return;
    }
    if((key==='Enter'||key==='OK'||code===13||code===23)&&!activeIsBtn){
      e.preventDefault();e.stopPropagation();
      try{if(v.paused)v.play().catch(()=>{});else v.pause()}catch(err){}
      return;
    }
    if(key==='ArrowUp'||code===38){
      e.preventDefault();
      e.stopPropagation();
      // ขึ้นบน = แสดงปุ่มและโฟกัสปุ่มปิด
      showPlayerUI(true);
      return;
    }
    if(key==='ArrowDown'||code===40){
      e.preventDefault();e.stopPropagation();
      try{v.volume=Math.max(0,(v.volume||0)-0.1)}catch(err){}
      return;
    }
  },true);
}

window.addEventListener('pageshow',()=>{restoreReturnState()});setupPlayerAutoHide();setupRemoteSeekControl();if(!restoreReturnState())renderHome();
</script>
