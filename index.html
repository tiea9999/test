    <div id="main-player">

        <div id="welcome">
            <img src="https://www.dropbox.com/scl/fi/nfxxskq5ydbebgvs1lcfi/output_857d150a-0947-4571-a612-402b9466aa4d_512x512_1773067860534.png?rlkey=92c2e2ilfdsm12r7tajb63p5d&dl=1">
            <h1>TIEA IPTV</h1>
        </div>

        <iframe id="iframePlayer"></iframe>

        <video id="videoPlayer" controls autoplay muted playsinline style="display:none;background:#000;"></video>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        const links=document.querySelectorAll(".menu-link");
const iframe=document.getElementById("iframePlayer");
const video=document.getElementById("videoPlayer");
const welcome=document.getElementById("welcome");

let hls;

// 🔥 เล่น m3u8 (ลื่น)
function playVideo(url){

iframe.style.display="none";
video.style.display="block";

if(hls){hls.destroy();}

if(Hls.isSupported()){
hls=new Hls({
maxBufferLength:120,
maxMaxBufferLength:240,
liveSyncDuration:15
});
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}
}

// 🔥 เมนู
links.forEach(link=>{
link.onclick=()=>{

links.forEach(l=>l.classList.remove("active"));
link.classList.add("active");

const url=link.dataset.url;

// 🎬 หนัง → เปิดใหม่ (ไม่กระพริบ)
if(link.dataset.type==="movie"){
window.open(url,"_blank");
return;
}

// 📺 TV
if(url.includes(".m3u8")){
playVideo(url);
return;
}

// iframe
iframe.src=url;
video.style.display="none";
iframe.style.display="block";
welcome.style.display="none";

};
});
    </script>
