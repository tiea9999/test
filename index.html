<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIEA IPTV</title>

<link rel="icon" href="https://www.dropbox.com/scl/fi/nfxxskq5ydbebgvs1lcfi/output_857d150a-0947-4571-a612-402b9466aa4d_512x512_1773067860534.png?dl=1">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{
display:flex;
height:100vh;
background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
color:#fff;
overflow:hidden;
}

/* SIDEBAR */
#menu{
width:200px;
background:rgba(20,20,35,0.95);
padding:20px;
overflow-y:auto;
}

.menu-title{
padding:12px;
border-radius:12px;
margin:10px 0;
cursor:pointer;
}

.menu-link{
display:block;
padding:10px;
cursor:pointer;
border-radius:6px;
}

.menu-link.active{
background:#e94560;
}

/* PLAYER */
#main-player{
flex:1;
display:flex;
justify-content:center;
align-items:center;
background:#000;
position:relative;
}

iframe{
width:100%;
height:100%;
border:none;
}

#welcome{
text-align:center;
}

</style>
</head>

<body>

<div id="menu">

<div class="menu-title">📺 ทีวีออนไลน์</div>

<div class="menu-link" data-url="https://tiea9999.github.io/tv/iptv.html">3BB TV</div>
<div class="menu-link" data-url="https://tiea9999.github.io/tv/inwhd.html">GOD TV</div>
<div class="menu-link" data-url="https://tiea9999.github.io/tv/sport.html">SPORT TV</div>
<div class="menu-link" data-url="https://tiea9999.github.io/tv/ball66.html">DOOBALL66</div>

<div class="menu-title">🎬 หนัง</div>

<div class="menu-link" data-url="https://tiea9999.github.io/tv/037hd.html">037HD</div>
<div class="menu-link" data-url="https://tiea9999.github.io/tv/hdx.html">LK-HDX</div>
<div class="menu-link" data-url="https://tiea9999.github.io/tv/24hd.html">24-HDS</div>

</div>

<div id="main-player">

<div id="welcome">
<h1>TIEA IPTV</h1>
</div>

<iframe id="iframePlayer"></iframe>

</div>

<script>

const links=document.querySelectorAll(".menu-link");
const iframe=document.getElementById("iframePlayer");
const welcome=document.getElementById("welcome");

links.forEach(link=>{
link.addEventListener("click",()=>{

links.forEach(l=>l.classList.remove("active"));
link.classList.add("active");

const url=link.dataset.url;

// 🔥 ตรวจว่าเป็นหนัง
const isMovie = url.includes("037hd") || url.includes("hdx") || url.includes("24hd");

// 🎬 หนัง → เปิดใหม่ (แก้กระพริบ)
if(isMovie){
window.open(url,"_blank");
return;
}

// 📺 ทีวี → iframe
if(iframe.src !== url){
iframe.src=url;
}

iframe.style.display="block";
welcome.style.display="none";

});
});

</script>

</body>
</html>
