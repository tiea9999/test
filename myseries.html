<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV NETFLIX FINAL</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;background:#000;color:#fff;font-family:sans-serif;
}
.row-header{display:flex;justify-content:space-between;align-items:center;padding:10px;}
.row-title{color:#00e5ff;font-weight:bold;}
.view-all{color:#ff9800;cursor:pointer;}
.row-items{display:flex;gap:10px;overflow-x:auto;padding:10px;}
.card{min-width:150px;background:#111;border-radius:10px;padding:8px;text-align:center;cursor:pointer;}
.card:focus{outline:2px solid #00ffcc;}
img{width:100%;height:180px;object-fit:cover;border-radius:8px;}
.grid-full{display:flex;flex-wrap:wrap;gap:10px;padding:10px;}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;z-index:999;}
video,iframe{width:100%;height:100%;}
.controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;}
.btn{padding:10px;background:#ff9800;border:none;border-radius:8px;color:#fff;cursor:pointer;}
</style>
</head>

<body>

<div id="grid"></div>

<div id="player">
<div class="controls">
<button class="btn" onclick="togglePlay()">⏯</button>
<button class="btn" onclick="closePlayer()">⬅</button>
<button class="btn" onclick="goHome()">🏠</button>
</div>
<video id="video"></video>
<iframe id="frame"></iframe>
</div>

<script>

const SOURCES=[
{name:"🔥 มาใหม่",url:"https://raw.githubusercontent.com/nongakka/myseries/main/data/new.json"},
{name:"🇨🇳 จีน",url:"https://raw.githubusercontent.com/nongakka/myseries/main/data/chinese.json"},
{name:"🇯🇵 ญี่ปุ่น",url:"https://raw.githubusercontent.com/nongakka/myseries/main/data/japan.json"},
{name:"🇰🇷 เกาหลี",url:"https://raw.githubusercontent.com/nongakka/myseries/main/data/korea.json"},
{name:"🇹🇭 ไทย",url:"https://raw.githubusercontent.com/nongakka/myseries/main/data/thai.json"},
{name:"📱 แนวตั้ง",url:"https://raw.githubusercontent.com/nongakka/myseries/main/data/short.json"}
];

let grid=document.getElementById("grid");
let video=document.getElementById("video");
let frame=document.getElementById("frame");
let hls=null;

async function loadHome(){
grid.innerHTML="";
for(let s of SOURCES){
let data=await fetch(s.url).then(r=>r.json()).catch(()=>[]);
renderRow(s.name,s.url,data.slice(0,12));
}
}

function renderRow(title,url,data){
let row=document.createElement("div");
row.innerHTML=`
<div class="row-header">
<div class="row-title">${title}</div>
<div class="view-all" data-url="${url}">ดูทั้งหมด ▶</div>
</div>
<div class="row-items">
${data.map(item=>`
<div class="card" data-item='${encodeURIComponent(JSON.stringify(item))}'>
<img src="${item.image||''}">
<div>${item.title||item.name||""}</div>
</div>
`).join("")}
</div>`;
grid.appendChild(row);
}

async function openFull(url){
grid.innerHTML="⚡ LOADING...";
let data=await fetch(url).then(r=>r.json()).catch(()=>[]);
grid.innerHTML=`
<div style="padding:10px">
<button class="btn" onclick="loadHome()">⬅ กลับ</button>
</div>
<div class="grid-full">
${data.map(item=>`
<div class="card" data-item='${encodeURIComponent(JSON.stringify(item))}'>
<img src="${item.image||''}">
<div>${item.title||item.name||""}</div>
</div>
`).join("")}
</div>`;
}

document.addEventListener("click",e=>{
let all=e.target.closest(".view-all");
if(all){ openFull(all.dataset.url); return; }
let card=e.target.closest(".card");
if(card){
let item=JSON.parse(decodeURIComponent(card.dataset.item));
startPlay([{url:item.url}]);
}
});

function startPlay(list){
player.style.display="block";
play(list[0].url);
}

function play(url){
if(hls){hls.destroy();hls=null;}
if(url.includes(".m3u8") && Hls.isSupported()){
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
video.play();
return;
}
if(url.includes(".mp4")){
video.src=url; video.play(); return;
}
frame.src=url;
}

function togglePlay(){ if(video.paused) video.play(); else video.pause(); }

function closePlayer(){
video.pause(); video.src=""; frame.src="";
player.style.display="none";
}

function goHome(){ loadHome(); }

loadHome();

</script>

</body>
</html>
