const tsVideo=document.getElementById("ts-video");
const dashVideo=document.getElementById("dash-video");
const container=document.getElementById("player-container");

function setTop(t){document.getElementById("status-top").textContent=t}
function setStatus(t,autoHide=false){
  const box=document.getElementById("status");
  box.textContent=t||"";
  box.style.display=t?"block":"none";
  if(autoHide&&t){
    clearTimeout(setStatus.timer);
    setStatus.timer=setTimeout(()=>box.style.display="none",4500);
  }
}
function currentVideo(){
  if(activeMode==="ts")return tsVideo;
  if(activeMode==="dash")return dashVideo;
  return hlsVideo;
}
function forceAudio(v=currentVideo()){
  try{v.muted=false;v.defaultMuted=false;v.volume=1.0}catch(e){}
}
function hideAllVideos(){
  [hlsVideo,tsVideo,dashVideo].forEach(v=>{
    try{v.pause();v.removeAttribute("src");v.load()}catch(e){}
    v.style.display="none";
  });
}
function showVideo(mode){
  activeMode=mode;
  hlsVideo.style.display=mode==="hls"?"block":"none";
  tsVideo.style.display=mode==="ts"?"block":"none";
  dashVideo.style.display=mode==="dash"?"block":"none";
}
function isWorkerUrl(u){return String(u||"").includes("workers.dev")}
function proxied(u){return WORKER_PROXY+encodeURIComponent(u)}
function isRawTs(u){
  const x=String(u||"").toLowerCase();
  return x.includes(".ts")&&!x.includes(".m3u8");
}
function isM3U8(u){
  const x=String(u||"").toLowerCase();
  return x.includes(".m3u8")||x.includes("extension=m3u8");
}

async function stopAll(){
  if(watchdog){clearInterval(watchdog);watchdog=null}
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  if(dash){try{dash.destroy()}catch(e){}dash=null}
  if(tsPlayer){
    try{tsPlayer.pause&&tsPlayer.pause()}catch(e){}
    try{tsPlayer.unload&&tsPlayer.unload()}catch(e){}
    try{tsPlayer.detachMediaElement&&tsPlayer.detachMediaElement()}catch(e){}
    try{tsPlayer.destroy&&tsPlayer.destroy()}catch(e){}
    tsPlayer=null;
  }
  hideAllVideos();
  setStatus("");
}

function startUiAutoHide(){
  container.classList.remove("controls-hidden");
  if(controlsTimer)clearTimeout(controlsTimer);
  controlsTimer=setTimeout(()=>{
    if(container.style.display==="block"){
      try{
        const a=document.activeElement;
        if(a&&a.classList&&a.classList.contains("player-btn"))a.blur();
      }catch(e){}
      container.classList.add("controls-hidden");
    }
  },3000);
}
function setupUiEvents(){
  ["mousemove","mousedown","touchstart","touchmove","click","pointermove","pointerdown"].forEach(ev=>{
    container.addEventListener(ev,startUiAutoHide,{passive:true});
  });
  document.addEventListener("keydown",()=>{
    if(container.style.display==="block")startUiAutoHide();
  });
}

async function loadChannel(ch,el){
  activeChannel=ch;
  activeElement=el;
  activeUrl=String(ch.file||"").trim();

  document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));
  if(el)el.classList.add("active");

  container.style.display="block";
  startUiAutoHide();
  await stopAll();

  const url=activeUrl;
  const lower=url.toLowerCase();

  if(lower.includes(".mpd")){
    playDash(url,ch);
  }else if(isRawTs(url)){
    // สำคัญ: แยก TS ใช้ video/engine ของตัวเองเท่านั้น
    playTs(url);
  }else{
    playHls(url);
  }

  setTimeout(()=>document.getElementById("closeBtn")?.focus(),250);
}

function playHls(originalUrl){
  showVideo("hls");
  const v=hlsVideo;
  forceAudio(v);

  let url=originalUrl;
  // m3u8 ที่เป็น http ใช้ Worker กัน mixed content
  if(url.startsWith("http://")&&!isWorkerUrl(url))url=proxied(url);

  activeUrl=url;
  setStatus("กำลังโหลด HLS...");

  if(Hls.isSupported()&&isM3U8(url)){
    hls=new Hls({
      enableWorker:false,
      lowLatencyMode:false,
      maxBufferLength:120,
      maxMaxBufferLength:180,
      backBufferLength:60,
      maxBufferHole:2.5,
      highBufferWatchdogPeriod:5,
      nudgeOffset:.3,
      nudgeMaxRetry:8,
      fragLoadingTimeOut:25000,
      manifestLoadingTimeOut:20000,
      levelLoadingTimeOut:20000,
      fragLoadingMaxRetry:12,
      manifestLoadingMaxRetry:10,
      levelLoadingMaxRetry:10,
      fragLoadingRetryDelay:2000,
      manifestLoadingRetryDelay:2000,
      levelLoadingRetryDelay:2000,
      startFragPrefetch:true,
      capLevelToPlayerSize:true,
      testBandwidth:false,
      abrEwmaDefaultEstimate:700000,
      liveSyncDurationCount:5,
      liveMaxLatencyDurationCount:12
    });
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      forceAudio(v);
      v.play().catch(()=>{});
      setStatus("กำลังเล่น HLS",true);
      startHlsWatchdog(v);
    });
    hls.on(Hls.Events.ERROR,(ev,data)=>{
      if(!data)return;
      if(data.fatal){
        if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
          setStatus("HLS เน็ตสะดุด กำลังต่อใหม่...");
          try{hls.startLoad()}catch(e){}
        }else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
          setStatus("HLS สะดุด กำลังกู้คืน...");
          try{hls.recoverMediaError()}catch(e){}
        }else{
          setStatus("HLS เล่นไม่ได้ ให้กด PLAYER",false);
        }
      }
    });
  }else{
    v.src=url;
    v.play().catch(()=>openExternal());
  }
}

function startHlsWatchdog(v){
  let last=0,stuck=0;
  if(watchdog)clearInterval(watchdog);
  watchdog=setInterval(()=>{
    if(container.style.display!=="block"||activeMode!=="hls"){clearInterval(watchdog);watchdog=null;return}
    forceAudio(v);
    if(v.paused)v.play().catch(()=>{});
    if(Math.abs((v.currentTime||0)-last)<.05)stuck++;else stuck=0;
    last=v.currentTime||0;
    if(stuck>=7){
      setStatus("HLS ค้าง กำลังต่อใหม่...");
      try{hls&&hls.startLoad()}catch(e){}
      v.play().catch(()=>{});
      stuck=0;
    }
  },4000);
}

function playDash(url,ch){
  showVideo("dash");
  const v=dashVideo;
  forceAudio(v);
  activeUrl=url;
  setStatus("กำลังโหลด MPD...");
  try{
    dash=dashjs.MediaPlayer().create();
    dash.initialize(v,url,true);
    setTimeout(()=>forceAudio(v),500);
  }catch(e){
    setStatus("MPD เล่นไม่ได้ ให้กด PLAYER",false);
  }
}

function playTs(originalUrl){
  showVideo("ts");
  const v=tsVideo;
  forceAudio(v);

  // บนหน้า https ถ้า TS เป็น http ให้ลองผ่าน Worker ก่อน
  const candidates = originalUrl.startsWith("http://") && !isWorkerUrl(originalUrl)
    ? [proxied(originalUrl), originalUrl]
    : [originalUrl, proxied(originalUrl)];

  let candidateIndex=0;

  function destroyTs(){
    try{
      if(tsPlayer){
        try{tsPlayer.pause&&tsPlayer.pause()}catch(e){}
        try{tsPlayer.unload&&tsPlayer.unload()}catch(e){}
        try{tsPlayer.detachMediaElement&&tsPlayer.detachMediaElement()}catch(e){}
        try{tsPlayer.destroy&&tsPlayer.destroy()}catch(e){}
      }
    }catch(e){}
    tsPlayer=null;
  }

  function makePlayer(url){
    destroyTs();
    activeUrl=url;
    try{v.pause();v.removeAttribute("src");v.load()}catch(e){}

    if(!window.mpegts||!mpegts.getFeatureList().mseLivePlayback){
      setStatus("เครื่องนี้ไม่รองรับ TS ในเว็บ ให้กด PLAYER",false);
      return;
    }

    const fresh=url+(url.includes("?")?"&":"?")+"_t="+Date.now();
    setStatus("กำลังโหลด TS "+(url.includes("workers.dev")?"ผ่าน Worker":"ลิงก์ตรง")+"...");

    tsPlayer=mpegts.createPlayer({
      type:"mpegts",
      isLive:true,
      url:fresh,
      cors:true,
      withCredentials:false
    },{
      enableWorker:false,
      enableStashBuffer:true,
      stashInitialSize:1024*768,
      lazyLoad:false,
      deferLoadAfterSourceOpen:false,
      autoCleanupSourceBuffer:true,
      autoCleanupMaxBackwardDuration:45,
      autoCleanupMinBackwardDuration:15,
      liveBufferLatencyChasing:true,
      liveBufferLatencyMaxLatency:6,
      liveBufferLatencyMinRemain:1.5,
      fixAudioTimestampGap:true,
      accurateSeek:false
    });

    tsPlayer.attachMediaElement(v);
    tsPlayer.load();

    const tryPlay=()=>{
      forceAudio(v);
      v.play().then(()=>setStatus("กำลังเล่น TS Live",true)).catch(()=>setStatus("กด ▶ 1 ครั้ง ถ้าเครื่องบล็อก autoplay",false));
    };
    setTimeout(tryPlay,500);
    setTimeout(tryPlay,1600);
    setTimeout(tryPlay,3200);

    tsPlayer.on(mpegts.Events.ERROR,(type,detail,info)=>{
      console.log("MPEGTS ERROR",type,detail,info);
      if(candidateIndex+1<candidates.length){
        candidateIndex++;
        setStatus("TS เส้นทางแรกไม่ได้ ลองเส้นทางถัดไป...");
        setTimeout(()=>makePlayer(candidates[candidateIndex]),900);
      }else{
        setStatus("TS สะดุด กำลังต่อใหม่...");
        setTimeout(()=>makePlayer(candidates[candidateIndex]),1200);
      }
    });
  }

  makePlayer(candidates[candidateIndex]);

  let last=0,stuck=0,noData=0,lock=false;
  if(watchdog)clearInterval(watchdog);
  watchdog=setInterval(()=>{
    if(container.style.display!=="block"||activeMode!=="ts"){
      clearInterval(watchdog);watchdog=null;destroyTs();return;
    }
    forceAudio(v);
    if(v.paused)v.play().catch(()=>{});
    if(v.readyState<2){noData++;setStatus("กำลังรอสัญญาณ TS...")}else noData=0;
    if(Math.abs((v.currentTime||0)-last)<.05)stuck++;else stuck=0;
    last=v.currentTime||0;
    if((noData>=6||stuck>=8)&&!lock){
      lock=true;noData=0;stuck=0;
      setStatus("TS ค้าง สร้างตัวเล่นใหม่...");
      setTimeout(()=>{makePlayer(candidates[candidateIndex]);lock=false},850);
    }
  },2500);
}

function restartCurrent(){
  if(activeChannel)loadChannel(activeChannel,activeElement);
}

async function closePlayer(){
  await stopAll();
  container.classList.remove("controls-hidden");
  container.style.display="none";
  setTimeout(()=>activeElement?.focus(),120);
}
function goHome(){window.location.href=HOME_URL}
function openExternal(){
  const url=activeChannel?activeChannel.file:activeUrl;
  if(!url)return;
  try{
    const u=new URL(url);
    const scheme=u.protocol.replace(":","");
    const hostPath=u.host+u.pathname+(u.search||"");
    window.location.href="intent://"+hostPath+"#Intent;scheme="+scheme+";action=android.intent.action.VIEW;type=video/*;S.browser_fallback_url="+encodeURIComponent(url)+";end";
  }catch(e){window.location.href=url}
}

document.addEventListener("keydown",e=>{
  if(container.style.display==="block"&&(e.key==="Escape"||e.key==="Backspace"||e.key==="BrowserBack"||e.keyCode===10009)){
    e.preventDefault();
    closePlayer();
  }
});

document.addEventListener("DOMContentLoaded",()=>{
  setupUiEvents();
  const list=document.getElementById("channel-list");
  channels.forEach(ch=>{
    const div=document.createElement("div");
    div.className="channel";
    div.tabIndex=0;
    div.innerHTML=`<img src="${ch.logo}" onerror="this.style.display='none'"><span>${ch.name}</span>`;
    div.onclick=()=>loadChannel(ch,div);
    div.onkeydown=e=>{
      if(e.key==="Enter"||e.key==="OK"||e.key===" "){
        e.preventDefault();
        loadChannel(ch,div);
      }
    };
    list.appendChild(div);
  });
  setTimeout(()=>document.querySelector(".channel")?.focus(),200);
});
</script>
