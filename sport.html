<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>TIEA SPORT TV SAFE FINAL</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.10.9/shaka-player.compiled.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.home-btn{
  position:fixed;top:12px;left:12px;z-index:9999;
  padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35);color:#fff;text-decoration:none;font-weight:900
}
.home-btn:hover,.home-btn:focus{outline:none;box-shadow:0 0 0 4px cyan}
h2{padding:60px 12px 8px;margin:0;color:orange;text-align:center;text-shadow:0 0 8px #000;font-size:22px;line-height:1.2}
#load-status{text-align:center;color:#9ff;font-size:14px;margin:8px 10px;line-height:1.5}
.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 8px}
.tool-btn,.file-label{
  background:#1b1b1b;color:#fff;border:1px solid #555;border-radius:999px;
  padding:10px 14px;font-weight:800;cursor:pointer
}
.tool-btn:focus,.file-label:focus{outline:none;box-shadow:0 0 0 4px cyan}
#jsonFile{display:none}
.group-title{padding:16px 14px 4px;font-size:22px;font-weight:bold;color:cyan}
.channel-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;padding:10px 10px;width:100%}
.channel{background:#222;border:2px solid #444;border-radius:12px;padding:8px;text-align:center;cursor:pointer;min-height:96px;max-width:100%;overflow:hidden}
.channel img{width:68px;height:68px;max-width:100%;object-fit:contain;margin-bottom:5px}.channel div{font-size:13px;line-height:1.25;word-break:break-word;overflow-wrap:anywhere}
.channel:hover,.channel:focus{border-color:orange;outline:none;box-shadow:0 0 0 4px cyan}
.channel.active{background:orange;color:#000;border-color:yellow}
.empty{padding:30px;text-align:center;color:#ffcc66}
#player-container{position:fixed;inset:0;background:#000;display:none;z-index:99999}
#player{width:100vw;height:100dvh;max-width:100%;background:#000;object-fit:contain}
#player-container.hide-ui .player-controls,
#player-container.hide-ui .status{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.player-controls,.status{
  transition:opacity .25s ease, visibility .25s ease;
}
.player-controls{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;z-index:100000}
.left-buttons,.right-buttons{display:flex;gap:10px;flex-wrap:wrap}
.player-btn{background:rgba(0,0,0,.75);color:#fff;border:2px solid #fff;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:900;cursor:pointer}
.player-btn:focus{outline:none;box-shadow:0 0 0 4px cyan}
.status{position:absolute;bottom:15px;left:15px;right:15px;text-align:center;background:rgba(0,0,0,.72);padding:10px;border-radius:10px;z-index:100001}
@media(max-width:900px){
  .channel-row{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;padding:8px}
}
@media(max-width:520px){
  h2{font-size:18px;padding-top:58px}
  #load-status{font-size:12px;margin:6px 8px}
  .home-btn{top:8px;left:8px;padding:8px 12px;font-size:13px}
  .tool-btn,.file-label{font-size:12px;padding:8px 10px}
  .group-title{font-size:18px;padding:12px 10px 2px}
  .channel-row{grid-template-columns:repeat(3,1fr);gap:7px;padding:7px}
  .channel{border-radius:10px;padding:6px;min-height:82px}
  .channel img{width:50px;height:50px}
  .channel div{font-size:11px}
  .player-controls{top:8px;left:8px;right:8px;gap:6px}
  .left-buttons,.right-buttons{gap:6px}
  .player-btn{font-size:12px;padding:7px 8px;border-radius:10px}
  .status{left:8px;right:8px;bottom:8px;font-size:12px;padding:8px}
}
@media(max-width:360px){
  .channel-row{grid-template-columns:repeat(2,1fr)}
  .player-btn{font-size:11px;padding:6px 7px}
}
</style>
</head>
<body>

<a class="home-btn" href="index.html">⬅ กลับหน้าหลัก</a>
<h2>TIEA SPORT TV SAFE FINAL</h2>
<div id="load-status">กำลังโหลด JSON...</div>

<div class="tools">
  <button class="tool-btn" onclick="loadDefaultJson()">↻ โหลด JSON ใหม่</button>
  <label class="file-label" for="jsonFile">📁 เลือกไฟล์ JSON จากเครื่อง</label>
  <input id="jsonFile" type="file" accept=".json,application/json,text/plain">
</div>

<div id="app"></div>

<div id="player-container">
  <div class="player-controls">
    <div class="left-buttons">
      <button class="player-btn" id="closeBtn" onclick="closePlayer()">X</button>
      <button class="player-btn" onclick="reloadPlayer()">↻ รีโหลด</button>
    </div>
    <div class="right-buttons">
      <button class="player-btn" onclick="openExternal()">▶ PLAYER</button>
      <button class="player-btn" onclick="openMX()">▶ MX</button>
      <button class="player-btn" onclick="goHome()">🏠 HOME</button>
    </div>
  </div>
  <video id="player" controls autoplay playsinline webkit-playsinline></video>
  <div id="status" class="status">กำลังโหลด...</div>
</div>

<script>
const JSON_URLS=[
  "https://raw.githubusercontent.com/tiea9999/tv-online/main/M3U/Dooball.json",
  "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/M3U/Dooball.json"
];
const FALLBACK_LOGO="https://dl.dropboxusercontent.com/scl/fi/k77ovxc35qm0girjo43mt/logo.png?rlkey=1x7w8nk1fl6gptnt9jiaugt54";

const app=document.getElementById("app");
const player=document.getElementById("player");
const loadStatus=document.getElementById("load-status");

let hls=null,shakaPlayer=null,currentChannel=null,currentServerIndex=0,currentElement=null;

function clean(v){return String(v||"").trim()}
function pick(o,keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&clean(o[k])!=="")return o[k]}return ""}
function setStatus(t){document.getElementById("status").textContent=t||""}
function isJsonUrl(u){u=clean(u).toLowerCase();return u.includes(".json")}
function isM3U8Url(u){u=clean(u).toLowerCase();return u.includes(".m3u8")||u.includes("extension=m3u8")||u.includes("type=m3u8")}

function normalize(item,parentGroup=""){
  let servers=[];

  if(Array.isArray(item.servers)&&item.servers.length){
    item.servers.forEach(s=>{
      const url=clean(pick(s,["url","file","stream","link","source","src"]));
      if(url&&!isJsonUrl(url)){
        servers.push({
          name:pick(s,["name","title","label"])||("Server "+(servers.length+1)),
          url,
          drm:!!s.drm||!!(pick(s,["keyId","kid","key_id"])&&pick(s,["key","clearkey"])),
          keyId:pick(s,["keyId","kid","key_id"])||"",
          key:pick(s,["key","clearkey"])||""
        });
      }
    });
  }else{
    const url=clean(pick(item,["url","file","stream","link","source","src"]));
    if(url&&!isJsonUrl(url)){
      servers.push({
        name:"Main",
        url,
        drm:!!item.drm||!!(pick(item,["keyId","kid","key_id"])&&pick(item,["key","clearkey"])),
        keyId:pick(item,["keyId","kid","key_id"])||"",
        key:pick(item,["key","clearkey"])||""
      });
    }
  }

  if(!servers.length)return null;

  return{
    title:pick(item,["title","name","channel","label"])||"ไม่มีชื่อ",
    logo:pick(item,["logo","poster","image","thumb","cover","icon"])||FALLBACK_LOGO,
    group:pick(item,["group","group-title","category"])||parentGroup||"อื่นๆ",
    servers
  };
}

function collect(data,parentGroup="",out=[]){
  if(Array.isArray(data)){data.forEach(x=>collect(x,parentGroup,out));return out}
  if(!data||typeof data!=="object")return out;

  const title=pick(data,["group","category","title","name"])||parentGroup;

  const one=normalize(data,parentGroup);
  if(one)out.push(one);

  ["items","channels","data","list","rows","episodes","videos"].forEach(k=>{
    if(Array.isArray(data[k]))data[k].forEach(x=>collect(x,title,out));
  });
  return out;
}

function renderFromJson(json, label){
  app.innerHTML="";
  let channels=collect(json);

  const seen=new Set();
  channels=channels.filter(ch=>{
    const key=(ch.title+"|"+ch.servers.map(s=>s.url).join("|")).toLowerCase();
    if(seen.has(key))return false;
    seen.add(key);
    return true;
  });

  if(!channels.length){
    loadStatus.innerHTML="โหลดได้ แต่ไม่พบช่องใน JSON<br>ลองตรวจชื่อ field: title/logo/group/servers/url";
    app.innerHTML='<div class="empty">ไม่พบรายการ</div>';
    return;
  }

  loadStatus.textContent="โหลดสำเร็จ "+channels.length+" รายการ จาก "+label;
  render(channels);
}

async function fetchWithTimeout(url, ms){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  try{
    const res=await fetch(url+"?t="+Date.now(),{cache:"no-store",signal:controller.signal});
    clearTimeout(timer);
    return res;
  }catch(e){
    clearTimeout(timer);
    throw e;
  }
}

async function loadDefaultJson(){
  app.innerHTML="";
  loadStatus.textContent="กำลังโหลด JSON...";
  let lastErr="";
  for(const u of JSON_URLS){
    try{
      loadStatus.textContent="กำลังโหลด: "+u;
      const res=await fetchWithTimeout(u,12000);
      if(!res.ok)throw new Error("HTTP "+res.status);
      const json=await res.json();
      renderFromJson(json,u);
      return;
    }catch(e){
      lastErr=e.message||String(e);
    }
  }
  loadStatus.innerHTML="โหลด JSON ไม่สำเร็จ: "+lastErr+"<br>ถ้าเปิดจากไฟล์ในเครื่อง ให้กด “เลือกไฟล์ JSON จากเครื่อง”";
  app.innerHTML='<div class="empty">ยังไม่มีรายการ</div>';
}

function render(channels){
  const groups={};
  channels.forEach(ch=>{
    if(!groups[ch.group])groups[ch.group]=[];
    groups[ch.group].push(ch);
  });

  Object.keys(groups).forEach(group=>{
    const title=document.createElement("div");
    title.className="group-title";
    title.textContent=group;
    app.appendChild(title);

    const row=document.createElement("div");
    row.className="channel-row";

    groups[group].forEach(ch=>{
      const div=document.createElement("div");
      div.className="channel";
      div.tabIndex=0;
      div.innerHTML='<img src="'+ch.logo+'" onerror="this.src=\''+FALLBACK_LOGO+'\'"><div>'+ch.title+'</div>';
      div.onclick=()=>playChannel(ch,div);
      div.onkeydown=e=>{
        if(e.key==="Enter"||e.key==="OK"||e.key===" "){
          e.preventDefault();
          playChannel(ch,div);
        }
      };
      row.appendChild(div);
    });
    app.appendChild(row);
  });

  setTimeout(()=>document.querySelector(".channel")?.focus(),200);
}

async function stopPlayers(){
  try{if(hls){hls.destroy();hls=null}}catch(e){}
  try{if(shakaPlayer){await shakaPlayer.destroy();shakaPlayer=null}}catch(e){}
  try{player.pause();player.removeAttribute("src");player.load()}catch(e){}
}

async function playChannel(ch,el){
  currentChannel=ch;
  currentElement=el;
  currentServerIndex=0;
  document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));
  if(el)el.classList.add("active");
  document.getElementById("player-container").style.display="block";
  showPlayerUI();
  setTimeout(()=>document.getElementById("closeBtn")?.focus(),200);
  await tryServer();
}

async function tryServer(){
  if(!currentChannel)return;
  if(currentServerIndex>=currentChannel.servers.length){
    setStatus("ทุก Server เล่นไม่ได้");
    return;
  }
  await stopPlayers();
  const s=currentChannel.servers[currentServerIndex];
  setStatus("กำลังลอง "+(s.name||("Server "+(currentServerIndex+1)))+"...");
  if(s.url.toLowerCase().includes(".mpd"))playMPD(s);
  else playHLS(s);
}

function nextServer(){
  currentServerIndex++;
  setTimeout(tryServer,2500);
}

function forceMaxVolume(){
  try{
    player.defaultMuted=false;
    player.muted=false;
    player.volume=1.0;
  }catch(e){}
}

function playMPD(s){
  try{
    if(!window.shaka){nextServer();return}
    shaka.polyfill.installAll();
    shakaPlayer=new shaka.Player(player);
    shakaPlayer.configure({streaming:{retryParameters:{maxAttempts:2,timeout:9000}}});
    if(s.drm&&s.keyId&&s.key){
      shakaPlayer.configure({drm:{clearKeys:{[s.keyId]:s.key}}});
    }
    shakaPlayer.load(s.url).then(()=>{
      forceMaxVolume();
      player.play().catch(()=>{});
      setStatus("กำลังเล่น "+(s.name||"Server "+(currentServerIndex+1)));
    }).catch(()=>nextServer());
  }catch(e){nextServer()}
}

function playHLS(s){
  const url=s.url;
  let started=false;

  if(window.Hls&&Hls.isSupported()&&isM3U8Url(url)){
    hls=new Hls({
      // TIEA SPORT TV SAFE FINAL
      // ลดอาการเด้งออก-กลับซ้ำ ไม่รีโหลดถี่เกิน
      enableWorker:true,
      lowLatencyMode:false,

      maxBufferLength:(navigator.userAgent.toLowerCase().includes('android tv')?110:75),
      maxMaxBufferLength:(navigator.userAgent.toLowerCase().includes('android tv')?170:120),
      backBufferLength:40,

      maxBufferHole:3,
      highBufferWatchdogPeriod:8,
      nudgeOffset:0.35,
      nudgeMaxRetry:10,

      manifestLoadingTimeOut:25000,
      levelLoadingTimeOut:25000,
      fragLoadingTimeOut:30000,

      manifestLoadingMaxRetry:10,
      levelLoadingMaxRetry:10,
      fragLoadingMaxRetry:14,

      manifestLoadingRetryDelay:2000,
      levelLoadingRetryDelay:2000,
      fragLoadingRetryDelay:2000,

      startFragPrefetch:true,
      startLevel:0,
      capLevelToPlayerSize:true,
      testBandwidth:false,

      abrEwmaDefaultEstimate:650000,
      abrBandWidthFactor:0.9,
      abrBandWidthUpFactor:0.7,

      liveSyncDurationCount:(navigator.userAgent.toLowerCase().includes('android tv')?9:7),
      liveMaxLatencyDurationCount:(navigator.userAgent.toLowerCase().includes('android tv')?24:18),

      progressive:true,
      liveDurationInfinity:true
    });

    hls.loadSource(url);
    hls.attachMedia(player);

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      started=true;
      forceMaxVolume();
      player.play().catch(()=>{});
      setStatus("กำลังเล่น "+(s.name||"Server "+(currentServerIndex+1)));
    });

    hls.on(Hls.Events.ERROR,(ev,data)=>{
      if(!data || !hls) return;

      // ไม่จัดการ non-fatal บ่อย เพราะทำให้เด้ง/กระตุก
      if(!data.fatal) return;

      if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
        setStatus("เน็ตสะดุด กำลังต่อเส้นเดิม...");
        try{
          hls.startLoad();
          if(player.readyState>=2) player.play().catch(()=>{});
        }catch(e){}
        return;
      }

      if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
        setStatus("วิดีโอสะดุด กำลังกู้คืน...");
        try{
          hls.recoverMediaError();
          if(player.readyState>=2) player.play().catch(()=>{});
        }catch(e){}
        return;
      }

      // error อื่นค่อยไป backup
      nextServer();
    });

    let lastTime=0;
    let stuck=0;
    let noData=0;
    let recovering=false;

    const watchdog=setInterval(()=>{
      const box=document.getElementById("player-container");
      if(box.style.display!=="block"){
        clearInterval(watchdog);
        return;
      }

      forceMaxVolume();

      // อย่ากด play ซ้ำถ้ายังไม่มี buffer
      if(player.paused && player.readyState>=2){
        player.play().catch(()=>{});
      }

      if(player.readyState<2){
        noData++;
      }else{
        noData=0;
      }

      if(Math.abs((player.currentTime||0)-lastTime)<0.05){
        stuck++;
      }else{
        stuck=0;
      }

      lastTime=player.currentTime||0;

      // รอให้นานพอ ลดการเด้งออก-กลับซ้ำ
      if((stuck>=10 || noData>=10) && !recovering){
        recovering=true;
        setStatus("สัญญาณสะดุด กำลังประคองเส้นเดิม...");
        try{
          if(hls){
            hls.startLoad(Math.max(0,(player.currentTime||0)-0.5));
          }
          if(player.readyState>=2){
            player.play().catch(()=>{});
          }
        }catch(e){}

        setTimeout(()=>{
          recovering=false;
          stuck=0;
          noData=0;
        },9000);
      }
    },5000);
    setTimeout(()=>{
      if(!started||player.readyState<2){
        setStatus("ยังโหลดอยู่ กำลังรอเส้นหลักอีกนิด...");
        try{ if(hls) hls.startLoad(); }catch(e){}
      }
    },22000);

  }else{
    player.src=url;
    forceMaxVolume();
    player.play().then(()=>{
      setStatus("กำลังเล่น "+(s.name||"Server "+(currentServerIndex+1)));
    }).catch(()=>nextServer());
  }
}

function closePlayer(){
  stopPlayers();
  document.getElementById("player-container").style.display="none";
  setTimeout(()=>currentElement?.focus(),150);
}
function reloadPlayer(){if(currentChannel){currentServerIndex=0;tryServer()}}
function goHome(){window.location.href="index.html"}
function activeUrl(){
  if(!currentChannel||!currentChannel.servers[currentServerIndex])return "";
  return currentChannel.servers[currentServerIndex].url;
}

function isProjectorOrTV(){
  const ua=navigator.userAgent.toLowerCase();
  return (
    ua.includes("smart-tv")||
    ua.includes("smarttv")||
    ua.includes("tizen")||
    ua.includes("webos")||
    ua.includes("netcast")||
    ua.includes("android tv")||
    ua.includes("aft")||
    ua.includes("projector")||
    ua.includes("xgimi")||
    ua.includes("mibox")||
    ua.includes("bravia")||
    ua.includes("chromecast")
  );
}

function openDirectSafe(url){
  if(!url)return;
  window.location.href=url;
}

function openIntentPlayer(url,useMX){
  if(!url)return;

  if(isProjectorOrTV()){
    openDirectSafe(url);
    return;
  }

  try{
    const u=new URL(url);
    const scheme=u.protocol.replace(":","");
    const hostPath=u.host+u.pathname+(u.search||"");
    let intent="intent://"+hostPath+"#Intent;scheme="+scheme+";action=android.intent.action.VIEW;type=video/*";
    if(useMX){
      intent+=";package=com.mxtech.videoplayer.ad";
    }
    intent+=";S.browser_fallback_url="+encodeURIComponent(url)+";end";
    window.location.href=intent;
  }catch(e){
    openDirectSafe(url);
  }
}

function openExternal(){
  const url=activeUrl();
  if(!url)return;
  openIntentPlayer(url,false);
}

function openMX(){
  const url=activeUrl();
  if(!url)return;
  openIntentPlayer(url,true);
}

document.addEventListener("keydown",e=>{
  const box=document.getElementById("player-container");
  if(box.style.display==="block"&&(e.key==="Escape"||e.key==="Backspace"||e.key==="BrowserBack"||e.keyCode===10009)){
    e.preventDefault();
    closePlayer();
  }
});

document.getElementById("jsonFile").addEventListener("change",async e=>{
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  try{
    loadStatus.textContent="กำลังอ่านไฟล์ "+file.name+"...";
    const txt=await file.text();
    const json=JSON.parse(txt);
    renderFromJson(json,file.name);
  }catch(err){
    loadStatus.textContent="อ่าน JSON ไม่สำเร็จ: "+(err.message||err);
  }
});


let uiTimer=null;

function showPlayerUI(){
  const box=document.getElementById("player-container");

  box.classList.remove("hide-ui");

  if(uiTimer) clearTimeout(uiTimer);

  uiTimer=setTimeout(()=>{
    if(box.style.display==="block"){
      box.classList.add("hide-ui");
    }
  },3000);
}

function setupAutoHideUI(){
  const box=document.getElementById("player-container");

  [
    "mousemove",
    "mousedown",
    "touchstart",
    "touchmove",
    "pointermove",
    "pointerdown",
    "click"
  ].forEach(ev=>{
    box.addEventListener(ev,showPlayerUI,{passive:true});
  });

  document.addEventListener("keydown",()=>{
    if(box.style.display==="block"){
      showPlayerUI();
    }
  });
}

document.addEventListener("DOMContentLoaded",()=>{setupAutoHideUI();loadDefaultJson();});
</script>
</body>
</html>
