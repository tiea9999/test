<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIEA IPTV</title>

<script src="https://ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
<script>
jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';
</script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
}

/* Header */
h2{
color:orange;
text-align:center;
margin:10px 0;
}

/* Grid */
#channel-list{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
gap:10px;
padding:10px;
}

/* Channel */
.channel{
background:#222;
border:2px solid #444;
border-radius:10px;
padding:5px;
text-align:center;
cursor:pointer;
transition:.2s;
}
.channel:hover{border-color:orange;}
.channel.active{background:orange;color:#000;}

.channel img{
width:60px;
height:60px;
object-fit:contain;
}
.channel span{
font-size:11px;
display:block;
margin-top:4px;
}

/* Player */
#player-container{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:1000px;
aspect-ratio:16/9;
background:#000;
z-index:9999;
border:2px solid orange;
border-radius:10px;
display:none;
}

#jw-player,#html5-player{
width:100%!important;
height:100%!important;
}

/* Buttons */
#closeBtn{
position:absolute;
top:10px;
right:10px;
z-index:10001;
background:red;
color:#fff;
border:none;
padding:6px 10px;
font-size:14px;
cursor:pointer;
border-radius:5px;
}

#maximizeBtn{
position:absolute;
top:10px;
right:55px;
z-index:10001;
background:orange;
border:none;
padding:6px 10px;
cursor:pointer;
}

/* Home */
.back-home{
position:fixed;
top:10px;
left:10px;
background:rgba(255,255,255,0.2);
padding:8px 12px;
border-radius:20px;
cursor:pointer;
z-index:9999;
}
</style>
</head>

<body>

<div class="back-home" onclick="goHome()">⬅ หน้าโฮม</div>
<h2>TIEA IPTV</h2>

<div id="player-container">
<div id="jw-player"></div>
<video id="html5-player" controls autoplay muted playsinline style="display:none;"></video>

<button id="closeBtn" onclick="closePlayer()">X</button>
<button id="maximizeBtn" onclick="toggleMaximize()">⬜</button>
</div>

<div id="channel-list"></div>

<script>

const channels = [
{ name:"MAX01",logo:"https://www.fileinwtv.site/postor/20250830165328Mono1.jpg",file:"https://love.bebin98399.workers.dev/lx-origin/th-monomax01_720/chunks.m3u8"},
{ name:"MAX02",logo:"https://www.fileinwtv.site/postor/20250830165343Mono2.jpg",file:"https://love.bebin98399.workers.dev/lx-origin/th-monomax02_720/chunks.m3u8"},
{ name:"SPORT01",logo:"https://cms.dmpcdn.com/livetv/2023/04/24/81825540-e28a-11ed-9bb2-7fe2e28bfd8c_webp_original.png",file:"https://love.bebin98399.workers.dev/vx-origin/hd-tsport1_720/chunks.m3u8"},
{ name:"SPORT02",logo:"https://cms.dmpcdn.com/livetv/2023/04/28/2960b3f0-e593-11ed-b26c-6b89d082d464_webp_original.webp",file:"https://love.bebin98399.workers.dev/vx-origin/hd-tsport2_720/chunks.m3u8"}
];

/* Load channels */
document.addEventListener("DOMContentLoaded",()=>{
const list=document.getElementById("channel-list");

channels.forEach(ch=>{
let div=document.createElement("div");
div.className="channel";

div.innerHTML=`
<img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/60?text=TV'">
<span>${ch.name}</span>
`;

div.onclick=()=>loadChannel(ch,div);
list.appendChild(div);
});
});

let currentHls=null;
let isMax=false;

/* Play */
function loadChannel(ch,el){

document.querySelectorAll('.channel').forEach(c=>c.classList.remove('active'));
el.classList.add('active');

const container=document.getElementById("player-container");
container.style.display="block";

const jw=document.getElementById("jw-player");
const video=document.getElementById("html5-player");

if(currentHls){currentHls.destroy(); currentHls=null;}
try{jwplayer("jw-player").remove();}catch(e){}

video.pause();
video.src="";
video.style.display="none";

jw.style.display="block";

let player=jwplayer("jw-player").setup({
file:ch.file,
width:"100%",
aspectratio:"16:9",
autostart:true
});

/* fallback */
player.on("error",()=>useHTML5(ch.file));
}

/* HTML5 fallback */
function useHTML5(url){
const jw=document.getElementById("jw-player");
const video=document.getElementById("html5-player");

jw.style.display="none";
video.style.display="block";

if(video.canPlayType('application/vnd.apple.mpegurl')){
video.src=url;
video.play();
}else if(Hls.isSupported()){
currentHls=new Hls();
currentHls.loadSource(url);
currentHls.attachMedia(video);
currentHls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}
}

/* Close */
function closePlayer(){
document.getElementById("player-container").style.display="none";

if(currentHls){currentHls.destroy(); currentHls=null;}
try{jwplayer("jw-player").remove();}catch(e){}

let v=document.getElementById("html5-player");
v.pause();
v.src="";
}

/* Maximize */
function toggleMaximize(){
let c=document.getElementById("player-container");

if(!isMax){
c.style.width="100%";
c.style.height="100%";
c.style.top="0";
c.style.left="0";
c.style.transform="none";
isMax=true;
}else{
c.style.width="90%";
c.style.aspectRatio="16/9";
c.style.top="50%";
c.style.left="50%";
c.style.transform="translate(-50%,-50%)";
isMax=false;
}
}

/* Home */
function goHome(){
window.location.href="https://tiea9999.github.io/tv/index.html";
}

</script>

</body>
</html>
