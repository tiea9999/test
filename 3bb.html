function isExternalGatewayUrl(url){
  if(!url) return false;

  let value = String(url).trim().toLowerCase();

  // ถ้าเป็น Worker ของ TIEA ให้ตรวจ URL ต้นทางที่อยู่ในพารามิเตอร์ url
  try{
    const parsed = new URL(value);
    const nested = parsed.searchParams.get("url");
    if(nested){
      try{
        value = decodeURIComponent(nested).toLowerCase();
      }catch(e){
        value = nested.toLowerCase();
      }
    }
  }catch(e){}

  return (
    value.includes("play/live.php") ||
    value.includes("mac=") ||
    value.includes(":2095/") ||
    value.includes("lookontv.") ||
    value.includes("ultratv.")
  );
}

function openExternalGateway(url){
  if(!url) return;

  const gatewayUrl = new URL("external.html", window.location.href);
  gatewayUrl.searchParams.set("url", url);

  try{

  }catch(e){}

  // ใช้แท็บเดิม ไม่ใช้ window.open
  window.location.assign(gatewayUrl.href);
}

function resolveChannel(channel, serverIndex=0){
  if(Array.isArray(channel.servers) && channel.servers.length){
    const server = channel.servers[serverIndex] || channel.servers[0];
    if(!server) return null;

    return {
      name: channel.name,
      logo: channel.logo,
      group: channel.group,
      file: server.file || server.url || "",
      drm: typeof server.drm === "boolean" ? server.drm : !!channel.drm,
      keyId: server.keyId || channel.keyId || "",
      key: server.key || channel.key || ""
    };
  }

  return channel && channel.file ? channel : null;
}

function firstChannelUrl(channel){

}

function diagEscape(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function pushDeepDiagEvent(name, detail=""){
  const stamp = new Date().toLocaleTimeString();
  deepDiagEvents.push(`${stamp} ${name}${detail ? " | " + detail : ""}`);
  if(deepDiagEvents.length > 12) deepDiagEvents.splice(0, deepDiagEvents.length - 12);
}

function bindDeepDiagEvents(){
  const video = document.getElementById("html5-player");
  if(!video || deepDiagBoundVideo === video) return;
  deepDiagBoundVideo = video;

  [
    "loadstart","loadedmetadata","loadeddata","canplay","canplaythrough",
    "play","playing","pause","waiting","stalled","suspend","seeking","seeked",
    "emptied","ended","error"
  ].forEach(name=>{
    video.addEventListener(name, ()=>{
      let detail = "";
      if(name === "error" && video.error){
        detail = `code=${video.error.code} message=${video.error.message || ""}`;
      }else{
        detail = `t=${Number(video.currentTime||0).toFixed(1)} ready=${video.readyState} net=${video.networkState}`;
      }
      pushDeepDiagEvent(name.toUpperCase(), detail);
    });
  });

  video.addEventListener("encrypted", (ev)=>{
    let len = 0, head = "-";
    try{
      len = ev.initData ? ev.initData.byteLength : 0;
      if(ev.initData){
        const bytes = new Uint8Array(ev.initData).slice(0,16);
        head = Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
      }
    }catch(e){}
    const info = {type:ev.initDataType || "unknown", length:len, head};
    deepDiagEncryptedInfo.push(info);
    if(deepDiagEncryptedInfo.length > 8) deepDiagEncryptedInfo.shift();
    pushDeepDiagEvent(
      "ENCRYPTED",
      `type=${info.type} bytes=${info.length} head=${info.head} mediaKeys=${video.mediaKeys ? "YES" : "NO"}`
    );
  });
}

}

function getDecodedFrames(video){
  try{
    if(video && typeof video.getVideoPlaybackQuality === "function"){
      const q = video.getVideoPlaybackQuality();
      return {
        total: Number(q.totalVideoFrames || 0),
        dropped: Number(q.droppedVideoFrames || 0),
        corrupted: Number(q.corruptedVideoFrames || 0)
      };
    }
  }catch(e){}
  return {
    total: Number(video?.webkitDecodedFrameCount || 0),
    dropped: Number(video?.webkitDroppedFrameCount || 0),
    corrupted: 0
  };
}

function getBufferedSummary(video){
  const ranges = [];
  try{
    for(let i=0;i<video.buffered.length;i++){
      ranges.push(`${video.buffered.start(i).toFixed(1)}-${video.buffered.end(i).toFixed(1)}`);
    }
  }catch(e){}
  return ranges.length ? ranges.join(", ") : "-";
}

function mediaErrorText(video){
  if(!video || !video.error) return "-";
  const map = {
    1:"MEDIA_ERR_ABORTED",
    2:"MEDIA_ERR_NETWORK",

    4:"MEDIA_ERR_SRC_NOT_SUPPORTED"
  };
  return `${map[video.error.code] || "MEDIA_ERROR"} (${video.error.code}) ${video.error.message || ""}`.trim();
}

function v5CaptureTrace(){
  const video = document.getElementById("html5-player");
  if(!video) return;
  const ps = v5PlayerIdentity();
  const vs = `ready=${video.readyState} net=${video.networkState} paused=${video.paused} seeking=${video.seeking} t=${Number(video.currentTime||0).toFixed(1)} size=${video.videoWidth||0}x${video.videoHeight||0} mediaKeys=${video.mediaKeys?"YES":"NO"}`;
  if(ps !== v5LastPlayerSnapshot){
    v5PlayerTrace.push(`${new Date().toLocaleTimeString()} PLAYER ${ps}`);
    v5LastPlayerSnapshot = ps;
  }
  if(vs !== v5LastVideoSnapshot){
    v5PlayerTrace.push(`${new Date().toLocaleTimeString()} VIDEO ${vs}`);
    v5LastVideoSnapshot = vs;
  }
  if(v5PlayerTrace.length > 16) v5PlayerTrace.splice(0, v5PlayerTrace.length - 16);
}

function v6PatchMediaSeeking(){
  if(v6PatchedCurrentTime) return;
  v6PatchedCurrentTime = true;

  try{
    const proto = HTMLMediaElement.prototype;
    const desc = Object.getOwnPropertyDescriptor(proto, "currentTime");
    if(desc && desc.get && desc.set){
      Object.defineProperty(proto, "currentTime", {
        configurable: desc.configurable,
        enumerable: desc.enumerable,
        get: function(){
          return desc.get.call(this);
        },
        set: function(value){
          const video = document.getElementById("html5-player");
          if(this === video){
            let before = 0;
            try{ before = desc.get.call(this); }catch(e){}
            const after = Number(value);
            v6LastSeekFrom = Number(before || 0);
            v6LastSeekTo = Number(after || 0);
            v6PushSeekTrace(
              "SET currentTime",
              `${v6LastSeekFrom.toFixed(3)} -> ${v6LastSeekTo.toFixed(3)} | ${v6ShortStack()}`
            );
          }
          return desc.set.call(this, value);
        }
      });
    }
  }catch(e){
    v6PushSeekTrace("PATCH currentTime ERROR", e?.message || String(e));
  }

  try{
    const proto = HTMLMediaElement.prototype;
    if(typeof proto.fastSeek === "function" && !v6PatchedFastSeek){
      const originalFastSeek = proto.fastSeek;
      proto.fastSeek = function(value){
        const video = document.getElementById("html5-player");
        if(this === video){
          let before = 0;
          try{ before = this.currentTime || 0; }catch(e){}
          v6PushSeekTrace(
            "fastSeek",
            `${Number(before).toFixed(3)} -> ${Number(value).toFixed(3)} | ${v6ShortStack()}`
          );
        }
        return originalFastSeek.call(this, value);
      };
      v6PatchedFastSeek = true;
    }
  }catch(e){
    v6PushSeekTrace("PATCH fastSeek ERROR", e?.message || String(e));
  }
}

function v6BindSeekEvents(){
  const video = document.getElementById("html5-player");
  if(!video || video.dataset.v6SeekBound === "1") return;
  video.dataset.v6SeekBound = "1";

  video.addEventListener("seeking", ()=>{
    const now = performance.now();
    const delta = v6LastSeekEventAt ? Math.round(now - v6LastSeekEventAt) : 0;
    v6LastSeekEventAt = now;
    v6PushSeekTrace(
      "SEEKING EVENT",
      `t=${Number(video.currentTime||0).toFixed(3)} ready=${video.readyState} net=${video.networkState} Δ=${delta}ms`
    );
  });

  video.addEventListener("seeked", ()=>{
    v6PushSeekTrace(
      "SEEKED EVENT",
      `t=${Number(video.currentTime||0).toFixed(3)} ready=${video.readyState} net=${video.networkState}`
    );
  });

  video.addEventListener("timeupdate", ()=>{
    if(video.seeking){
      v6PushSeekTrace(
        "TIMEUPDATE while seeking",
        `t=${Number(video.currentTime||0).toFixed(3)}`
      );
    }
  });
}

function v6TimelineSnapshot(){
  const video = document.getElementById("html5-player");
  if(!video) return "-";

  let seekable = "-";
  try{
    const arr = [];
    for(let i=0;i<video.seekable.length;i++){
      arr.push(`${video.seekable.start(i).toFixed(1)}-${video.seekable.end(i).toFixed(1)}`);
    }
    seekable = arr.length ? arr.join(", ") : "-";
  }catch(e){}

  let buffered = "-";
  try{
    const arr = [];
    for(let i=0;i<video.buffered.length;i++){
      arr.push(`${video.buffered.start(i).toFixed(1)}-${video.buffered.end(i).toFixed(1)}`);
    }
    buffered = arr.length ? arr.join(", ") : "-";
  }catch(e){}

  return [
    `current=${Number(video.currentTime||0).toFixed(3)}`,
    `duration=${Number.isFinite(video.duration) ? video.duration.toFixed(3) : String(video.duration)}`,
    `seeking=${video.seeking}`,
    `seekable=${seekable}`,
    `buffered=${buffered}`
  ].join(" | ");
}

v6PatchMediaSeeking();

function v7Attr(node,name){
  return node ? node.getAttribute(name) : null;
}

function v7SegmentTimelineSummary(doc){
  try{
    const st = doc.querySelector("SegmentTimeline");
    if(!st) return "-";
    const rows = Array.from(st.querySelectorAll("S")).slice(0,10).map((s,i)=>
      `S${i+1}: t=${s.getAttribute("t")||"-"} d=${s.getAttribute("d")||"-"} r=${s.getAttribute("r")||"0"}`
    );
    return rows.length ? rows.join(" | ") : "-";
  }catch(e){
    return "ERROR " + (e?.message || String(e));
  }
}

function v7RepresentationSummary(doc){
  try{
    const reps = Array.from(doc.querySelectorAll("Representation")).slice(0,10);
    if(!reps.length) return "-";
    return reps.map((r,i)=>{
      const p = r.parentElement;
      return `#${i+1} id=${v7Attr(r,"id")||"-"} bw=${v7Attr(r,"bandwidth")||"-"} codecs=${v7Attr(r,"codecs")||v7Attr(p,"codecs")||"-"} mime=${v7Attr(r,"mimeType")||v7Attr(p,"mimeType")||"-"} size=${v7Attr(r,"width")||"-"}x${v7Attr(r,"height")||"-"}`;
    }).join(" | ");
  }catch(e){
    return "ERROR " + (e?.message || String(e));
  }
}

function v7ComputeInfo(doc){
  const mpd = doc.documentElement;
  const period = doc.querySelector("Period");
  const st = doc.querySelector("SegmentTemplate");
  const sNodes = Array.from(doc.querySelectorAll("SegmentTimeline S"));
  const firstS = sNodes[0] || null;
  const lastS = sNodes[sNodes.length-1] || null;

  const timescale = st ? (v7Attr(st,"timescale") || "-") : "-";
  const pto = st ? (v7Attr(st,"presentationTimeOffset") || "-") : "-";
  const firstT = firstS ? (v7Attr(firstS,"t") || "-") : "-";

  let computedFirstSec = "-";
  try{
    const ts = Number(timescale);
    const t = Number(firstT);
    const p = Number(pto);
    if(Number.isFinite(ts) && ts > 0 && Number.isFinite(t)){
      computedFirstSec = ((t - (Number.isFinite(p)?p:0))/ts).toFixed(3);
    }
  }catch(e){}

  return {
    type: v7Attr(mpd,"type") || "-",
    availabilityStartTime: v7Attr(mpd,"availabilityStartTime") || "-",
    publishTime: v7Attr(mpd,"publishTime") || "-",
    minimumUpdatePeriod: v7Attr(mpd,"minimumUpdatePeriod") || "-",
    timeShiftBufferDepth: v7Attr(mpd,"timeShiftBufferDepth") || "-",
    suggestedPresentationDelay: v7Attr(mpd,"suggestedPresentationDelay") || "-",
    mediaPresentationDuration: v7Attr(mpd,"mediaPresentationDuration") || "-",
    periodStart: v7Attr(period,"start") || "-",
    periodDuration: v7Attr(period,"duration") || "-",
    timescale,
    presentationTimeOffset: pto,
    startNumber: st ? (v7Attr(st,"startNumber") || "-") : "-",
    duration: st ? (v7Attr(st,"duration") || "-") : "-",
    firstT,
    firstD: firstS ? (v7Attr(firstS,"d") || "-") : "-",
    lastT: lastS ? (v7Attr(lastS,"t") || "-") : "-",
    lastD: lastS ? (v7Attr(lastS,"d") || "-") : "-",
    lastR: lastS ? (v7Attr(lastS,"r") || "0") : "-",
    computedFirstSec,
    timeline: v7SegmentTimelineSummary(doc),
    representations: v7RepresentationSummary(doc)
  };
}

async function v7InspectMpd(url){
  v7MpdUrl = url || "";
  v7MpdInfo = null;
  v7MpdError = "";

  if(!url || !String(url).includes(".mpd")) return;

  try{
    const res = await fetch(url,{cache:"no-store"});
    const text = await res.text();
    if(!res.ok){
      v7MpdError = `HTTP ${res.status}`;
      return;
    }

    const doc = new DOMParser().parseFromString(text,"application/xml");
    if(doc.querySelector("parsererror")){
      v7MpdError = "XML PARSE ERROR";
      return;
    }
    v7MpdInfo = v7ComputeInfo(doc);
  }catch(e){
    v7MpdError = e?.message || String(e);
  }
}

function v7MpdSummary(){
  if(v7MpdError) return "ERROR: " + v7MpdError;
  if(!v7MpdInfo) return "ยังไม่มีข้อมูล";
  const x = v7MpdInfo;
  return [
    `type=${x.type}`,
    `AST=${x.availabilityStartTime}`,
    `publish=${x.publishTime}`,
    `MUP=${x.minimumUpdatePeriod}`,
    `TSBD=${x.timeShiftBufferDepth}`,
    `SPD=${x.suggestedPresentationDelay}`,
    `MPDdur=${x.mediaPresentationDuration}`,
    `PeriodStart=${x.periodStart}`,
    `PeriodDur=${x.periodDuration}`,
    `timescale=${x.timescale}`,
    `PTO=${x.presentationTimeOffset}`,
    `startNumber=${x.startNumber}`,
    `duration=${x.duration}`,
    `firstT=${x.firstT}`,
    `firstD=${x.firstD}`,
    `lastT=${x.lastT}`,
    `lastD=${x.lastD}`,
    `lastR=${x.lastR}`,
    `computedFirstSec=${x.computedFirstSec}`
  ].join(" | ");
}
function renderMpdDiagnostic(){
  const body = document.getElementById("mpd-diagnostic-body");
  const video = document.getElementById("html5-player");
  if(!body || !video) return;

  bindDeepDiagEvents();
  bindDeepShakaEvents();
  v6BindSeekEvents();
  v5CaptureTrace();

  const frames = getDecodedFrames(video);

  if(deepDiagLastSampleAt){
    deepDiagFrameDelta = frames.total - deepDiagLastFrameCount;
    deepDiagTimeDelta = Number(video.currentTime || 0) - deepDiagLastTime;
  }
  deepDiagLastFrameCount = frames.total;
  deepDiagLastTime = Number(video.currentTime || 0);
  deepDiagLastSampleAt = performance.now();

  let track = null;
  let tracks = [];
  let stats = {};
  let bufferedInfo = null;

  try{
    if(shakaPlayer){
      tracks = shakaPlayer.getVariantTracks ? shakaPlayer.getVariantTracks() : [];
      track = tracks.find(t=>t.active) || tracks[0] || null;
      stats = shakaPlayer.getStats ? shakaPlayer.getStats() : {};
      bufferedInfo = shakaPlayer.getBufferedInfo ? shakaPlayer.getBufferedInfo() : null;
    }
  }catch(e){
    pushDeepDiagEvent("DIAG SHAKA READ ERROR", e?.message || String(e));
  }

  const width = video.videoWidth || track?.width || 0;
  const height = video.videoHeight || track?.height || 0;
  const codec = track?.videoCodec || track?.codecs || "";
  const audioCodec = track?.audioCodec || "";
  const picture = (width>0 && height>0 && frames.total>0) ? "YES" : "NO / WAIT";
  const playback = video.paused ? "PAUSED" : (video.readyState>=2 ? "PLAYING" : "LOADING");

  let ahead = 0;
  try{
    if(video.buffered && video.buffered.length){
      for(let i=0;i<video.buffered.length;i++){
        if(video.currentTime >= video.buffered.start(i) && video.currentTime <= video.buffered.end(i)){
          ahead = Math.max(0, video.buffered.end(i) - video.currentTime);
          break;
        }
      }
    }
  }catch(e){}

  const activeVariant = track ? [
    `id=${track.id ?? "-"}`,
    `bw=${track.bandwidth ? Math.round(track.bandwidth/1000)+"kbps" : "-"}`,
    `fps=${track.frameRate || "-"}`,
    `lang=${track.language || "-"}`,
    `primary=${!!track.primary}`
  ].join(" ") : "-";

  const formatRanges = arr => Array.isArray(arr) && arr.length
    ? arr.map(r=>`${r.start.toFixed(1)}-${r.end.toFixed(1)}`).join("|")
    : "-";

  const shakaBuffer = bufferedInfo ? [
    `total:${formatRanges(bufferedInfo.total)}`,
    `video:${formatRanges(bufferedInfo.video)}`,
    `audio:${formatRanges(bufferedInfo.audio)}`
  ].join(" / ") : "-";

  const diagnosis =
    frames.total === 0 && video.readyState <= 1 && ahead > 0
      ? "ข้อมูลมีใน Buffer แต่ decoder ยังไม่เริ่ม"
      : frames.total === 0 && video.readyState >= 2
      ? "มี Media Data แต่ยังไม่มี decoded frame"
      : frames.total > 0
      ? "Decoder ทำงาน"
      : "รอข้อมูลเพิ่ม";

  let v4Hint = "-";
  if(frames.total === 0 && video.readyState <= 1 && ahead > 0){
    if(String(keyStatuses).toLowerCase().includes("usable")){
      v4Hint = "Key usable แต่ media pipeline ยังไม่ผ่าน HAVE_METADATA";
    }else if(String(keyStatuses) !== "-"){
      v4Hint = "ดู Key Status: ยังไม่เห็นสถานะ usable";
    }else{
      v4Hint = "ยังอ่าน Key Status ไม่ได้; ดู InitData และ Shaka events";
    }
  }else if(frames.total > 0){
    v4Hint = "Reference ผ่าน: key + decoder + media pipeline ทำงาน";
  }

  const readyNames = ["HAVE_NOTHING","HAVE_METADATA","HAVE_CURRENT_DATA","HAVE_FUTURE_DATA","HAVE_ENOUGH_DATA"];
  const networkNames = ["NETWORK_EMPTY","NETWORK_IDLE","NETWORK_LOADING","NETWORK_NO_SOURCE"];

  const drmInfo = readDrmInfo();
  const keyStatuses = readKeyStatuses();
  const encryptedSummary = deepDiagEncryptedInfo.length
    ? deepDiagEncryptedInfo.map((x,i)=>`#${i+1} ${x.type} ${x.length}B ${x.head}`).join(" | ")
    : "-";

  const rows = [
    ["Channel", activeChannel?.name || "-"],
    ["Playback", playback],
    ["Picture", picture],
    ["Diagnosis", diagnosis],
    ["V4 Hint", v4Hint],
    ["Time", (video.currentTime||0).toFixed(1)+" sec"],
    ["Time Δ / sec", deepDiagTimeDelta.toFixed(2)],
    ["Video Size", width&&height ? `${width}x${height}` : "0x0"],
    ["Decoded Frames", String(frames.total)],
    ["Frames Δ / sec", String(deepDiagFrameDelta)],
    ["Dropped Frames", String(frames.dropped)],
    ["Corrupted Frames", String(frames.corrupted)],
    ["ReadyState", `${video.readyState} (${readyNames[video.readyState] || "?"})`],
    ["NetworkState", `${video.networkState} (${networkNames[video.networkState] || "?"})`],
    ["Paused / Seeking", `${video.paused} / ${video.seeking}`],
    ["MediaKeys", video.mediaKeys ? "ATTACHED" : "NONE"],
    ["Key Status", keyStatuses],
    ["DRM KeySystem", drmInfo?.keySystem || "-"],
    ["DRM License URI", drmInfo?.licenseServerUri || "-"],
    ["Video Robustness", drmInfo?.videoRobustness || "-"],
    ["Audio Robustness", drmInfo?.audioRobustness || "-"],
    ["Encrypted Events", String(deepDiagEncryptedInfo.length)],
    ["InitData Summary", encryptedSummary],
    ["Media Error", mediaErrorText(video)],
    ["HTML5 Buffer Ahead", ahead.toFixed(1)+" sec"],
    ["HTML5 Buffered", getBufferedSummary(video)],
    ["Variant Count", String(tracks.length)],
    ["Active Variant", activeVariant],
    ["Video Codec", codec || "-"],
    ["Audio Codec", audioCodec || "-"],
    ["Video Track", track ? "FOUND" : "ไม่พบ/Player อื่น"],
    ["Shaka Buffer", shakaBuffer],
    ["Est. Bandwidth", stats.estimatedBandwidth ? Math.round(stats.estimatedBandwidth/1000)+" kbps" : "-"],
    ["Stream Bandwidth", stats.streamBandwidth ? Math.round(stats.streamBandwidth/1000)+" kbps" : "-"],
    ["Load Latency", Number.isFinite(stats.loadLatency) ? stats.loadLatency.toFixed(2)+" sec" : "-"],
    ["DRM Time", Number.isFinite(stats.drmTime) ? stats.drmTime.toFixed(3)+" sec" : "-"],
    ["License Time", Number.isFinite(stats.licenseTime) ? stats.licenseTime.toFixed(3)+" sec" : "-"],
    ["DRM Config", activeChannel?.drm ? "ClearKey configured" : "ไม่ใช้/ไม่ระบุ"],
    ["V5 Player Instance", v5PlayerIdentity()],
    ["V5 Active Track", v5ActiveTrackSummary()],
    ["V6 Timeline", v6TimelineSnapshot()],
    ["V6 Last Seek", `${Number(v6LastSeekFrom||0).toFixed(3)} -> ${Number(v6LastSeekTo||0).toFixed(3)}`],
    ["V7 MPD URL", v7MpdUrl || "-"],
    ["V7 MPD Timeline", v7MpdSummary()],
    ["Mode", "INSPECT ACTIVE PLAYER ONLY"]
  ];

  body.innerHTML = rows.map(([k,v])=>{
    let cls = "";
    if(k==="Picture") cls = v==="YES" ? "diag-ok" : "diag-warn";
    if(k==="Playback") cls = v==="PLAYING" ? "diag-ok" : "diag-warn";
    if(k==="Diagnosis"){
      cls = v==="Decoder ทำงาน" ? "diag-ok" : (v.includes("decoder") ? "diag-bad" : "diag-warn");
    }
    if(k==="Media Error" && v !== "-") cls = "diag-bad";
    return `<div class="diag-row"><div class="diag-key">${diagEscape(k)}</div><div class="diag-value ${cls}">${diagEscape(v)}</div></div>`;
  }).join("") +
  `<div class="diag-section">EVENT LOG (ล่าสุด)</div>` +
  `<div class="diag-log">${diagEscape(deepDiagEvents.length ? deepDiagEvents.join("\n") : "ยังไม่มี event")}</div>` +
  `<div class="diag-section">V5 ACTIVE SHAKA TRACE</div>` +
  `<div class="diag-log">${diagEscape(v5PlayerTrace.length ? v5PlayerTrace.join("\n") : "ยังไม่มี trace")}</div>` +
  `<div class="diag-section">V5 VARIANTS</div>` +
  `<div class="diag-log">${diagEscape(v5AllVariantsSummary())}</div>` +
  `<div class="diag-section">V6 SEEKING / TIMELINE TRACE</div>` +
  `<div class="diag-log">${diagEscape(v6SeekTrace.length ? v6SeekTrace.join("\n") : "ยังไม่มี seek trace")}</div>` +
  `<div class="diag-section">V7 MPD TIMELINE INSPECTOR</div>` +
  `<div class="diag-log">${diagEscape(v7MpdError ? "ERROR: "+v7MpdError : v7MpdSummary())}</div>` +
  `<div class="diag-section">V7 SEGMENT TIMELINE</div>` +
  `<div class="diag-log">${diagEscape(v7MpdInfo?.timeline || "-")}</div>` +
  `<div class="diag-section">V7 REPRESENTATIONS</div>` +
  `<div class="diag-log">${diagEscape(v7MpdInfo?.representations || "-")}</div>`;
}

function playMPDNotice(channel, url){
  v7InspectMpd(url);
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");
  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  setStatus("กำลังตรวจ MPD/DRM ด้วย Shaka...", false);

  try{
    if(window.shaka){
      shaka.polyfill.installAll();

      if(shaka.Player.isBrowserSupported()){
        shakaPlayer = new shaka.Player(video);

        shakaPlayer.addEventListener("error", function(event){
          try{
            const detail = event.detail || {};
            pushDeepDiagEvent(
              "SHAKA ERROR",
              `code=${detail.code || "-"} severity=${detail.severity || "-"} category=${detail.category || "-"}`
            );
          }catch(e){}
        });

        shakaPlayer.configure({
          streaming:{
            bufferingGoal: 30,
            rebufferingGoal: 5,
            bufferBehind: 15,
            retryParameters:{maxAttempts:4,baseDelay:1000,backoffFactor:1.5,timeout:25000}
          }
        });

        if(channel.drm){
          if(channel.keyId && channel.key){
            shakaPlayer.configure({
              drm:{
                clearKeys:{
                  [channel.keyId]:channel.key
                }
              }
            });
          }else{
          }
        }

        shakaPlayer.load(url).then(()=>{
          forceAudio100();
          video.play().catch(()=>{});
          setStatus("MPD โหลดสำเร็จ — ดูผลที่ 📊 DIAG", true);
        }).catch(e=>{
          console.log("MPD เล่นในเว็บไม่ได้:", e);
          setStatus("MPD โหลดไม่สำเร็จ — ดูผลที่ 📊 DIAG", false);
        });
      }else{
        mpdDiagLoadState = "FAIL";
        setStatus("อุปกรณ์นี้ไม่รองรับ Shaka/EME — ดู 📊 DIAG", false);
        renderMpdDiagnostic();
      }
    }else{
      mpdDiagLoadState = "FAIL";
      setStatus("ไม่พบ Shaka Player", false);
      renderMpdDiagnostic();
    }
  }catch(e){
    console.log("MPD ERROR:", e);
    mpdDiagLoadState = "FAIL";
    setStatus("MPD ERROR — ดู 📊 DIAG", false);
    renderMpdDiagnostic();
  }
}

function useHLS_STABLE(url){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");

  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(Hls.isSupported() && url.includes(".m3u8")){
    setStatus("กำลังโหลด HLS...");

    currentHls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,

      // สูตรเดิมที่นิ่งกว่า: ไม่ล็อกคุณภาพแข็งเกินไป
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      backBufferLength: 20,
      maxBufferHole: 0.5,
      highBufferWatchdogPeriod: 3,

      manifestLoadingMaxRetry: 5,
      manifestLoadingRetryDelay: 1000,
      manifestLoadingMaxRetryTimeout: 8000,
      levelLoadingMaxRetry: 5,
      levelLoadingRetryDelay: 1000,
      levelLoadingMaxRetryTimeout: 8000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 1000,
      fragLoadingMaxRetryTimeout: 10000,

      startFragPrefetch: true,
      capLevelToPlayerSize: true,
      testBandwidth: false,
      abrEwmaDefaultEstimate: 1200000
    });

    currentHls.loadSource(url);
    currentHls.attachMedia(video);

    currentHls.on(Hls.Events.MANIFEST_PARSED, function(){
      forceAudio100();
      video.play().catch(()=>{});
      setTimeout(()=>{ forceAudio100(); video.play().catch(()=>{}); },300);
      setStatus("กำลังเล่น HLS");
    });

    currentHls.on(Hls.Events.BUFFER_STALLED, function(){
      setStatus("กำลังเติมบัฟเฟอร์...", true);
    });

    currentHls.on(Hls.Events.ERROR, function(event, data){
      console.log("HLS ERROR:", data);
      if(!currentHls) return;

      if(data.fatal){
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
          setStatus("เน็ตเวิร์กสะดุด กำลังโหลดต่อ...");
          try{ currentHls.startLoad(); }catch(e){}
        }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
          setStatus("สัญญาณวิดีโอสะดุด กำลังกู้คืน...");
          try{ currentHls.recoverMediaError(); }catch(e){}
        }else{
          setStatus("เล่นไม่ได้ กำลังลองโหลดใหม่...", false);
          try{
            currentHls.destroy();
            currentHls = null;
            setTimeout(()=>useHLS_STABLE(url), 1200);
          }catch(e){}
        }
      }
    });

    // watchdog แบบเบา ไม่รีโหลดถี่เกินไป
    let lastTime = 0;
    let stuckCount = 0;
    hlsWatchdog = setInterval(()=>{
      if(document.getElementById("player-container").style.display !== "block") return;
      if(!currentHls) return;

      forceAudio100();

      if(video.paused || video.readyState < 2){
        try{ currentHls.startLoad(); }catch(e){}
        video.play().catch(()=>{});
        return;
      }

      if(Math.abs(video.currentTime - lastTime) < 0.05){
        stuckCount++;
      }else{
        stuckCount = 0;
      }

      lastTime = video.currentTime;

      if(stuckCount >= 4){
        setStatus("ภาพค้าง กำลังกู้คืน...");
        try{ currentHls.startLoad(); }catch(e){}
        video.play().catch(()=>{});
        stuckCount = 0;
      }
    }, 3000);

  }else{
    video.src = url;
    setTimeout(()=>{
      forceAudio100();
      video.play().catch(()=>{});
    },300);
  }
}

function restartCurrent(){
  if(activeOriginalChannel){
    loadChannel(activeOriginalChannel, activeElement);
  }else if(activeChannel){
    loadChannel(activeChannel, activeElement);
  }
}



/* ================= FORCE AUTO HIDE PLAYER CONTROLS ================= */
let controlsTimer = null;

function forceShowControls(){
  const box = document.getElementById("player-container");
  if(!box) return;

  box.classList.remove("force-hide-controls");
  box.classList.remove("controls-hidden");

  if(controlsTimer) clearTimeout(controlsTimer);

  controlsTimer = setTimeout(function(){
    forceHideControls();
  }, 3000);
}

function forceHideControls(){
  const box = document.getElementById("player-container");
  if(!box) return;
  if(box.style.display !== "none"){
    try{
      const active = document.activeElement;
      if(active && active.blur) active.blur();
    }catch(e){}
    box.classList.add("force-hide-controls");
    box.classList.add("controls-hidden");
  }
}

function setupForceAutoHide(){
  const box = document.getElementById("player-container");
  if(!box || box.dataset.forceHideReady === "1") return;
  box.dataset.forceHideReady = "1";

  ["mousemove","mousedown","touchstart","touchmove","click","pointermove","pointerdown"].forEach(function(ev){
    box.addEventListener(ev, forceShowControls, {passive:true});
  });

  document.addEventListener("keydown", function(){
    if(box.style.display !== "none"){
      forceShowControls();
    }
  });
}

async function closePlayer(){
  await stopAllPlayers();
  const box = document.getElementById("player-container");
  box.classList.remove("controls-hidden");
  box.classList.remove("force-hide-controls");
  box.style.display = "none";
  setTimeout(()=>{if(activeElement && document.body.contains(activeElement)) activeElement.focus();},120);
}

function goHome(){
  window.location.href = "https://tiea9999.github.io/tv/index.html";
}

document.addEventListener("keydown",function(e){
  const container = document.getElementById("player-container");
  if(container.style.display === "block"){
    if(e.key === "ArrowUp"){
      e.preventDefault();
      forceShowControls();
      document.getElementById("closeBtn")?.focus();
      return;
    }
    if(e.key === "Escape" || e.key === "Backspace" || e.key === "BrowserBack"){
      e.preventDefault();
      closePlayer();
    }
  }
});

let currentCategory = "ดิจิตอล";
function renderCategory(group){
  currentCategory=group;
  document.querySelectorAll(".category-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.group===group));
  document.getElementById("category-title").textContent="หมวด: "+group;
  const listContainer=document.getElementById("channel-list");
  listContainer.innerHTML="";
  const items=group==="ทั้งหมด"?channels:channels.filter(ch=>(ch.group||"ดิจิตอล")===group);
  items.forEach(ch=>{
    const div=document.createElement("div");
    div.className="channel";
    div.tabIndex=0;
    div.innerHTML=`<img src="${ch.logo}" loading="lazy"><span>${ch.name}</span>`;
    div.onclick=()=>loadChannel(ch,div);
    div.onfocus=()=>warmStream(firstChannelUrl(ch));
    div.onmouseenter=()=>warmStream(firstChannelUrl(ch));
    div.onkeydown=e=>{if(e.key==="Enter"||e.key==="OK"||e.key===" "){e.preventDefault();loadChannel(ch,div);}};
    listContainer.appendChild(div);
  });
  setTimeout(()=>listContainer.querySelector(".channel")?.focus(),100);
}
function setupCategoryMenu(){
  const buttons=Array.from(document.querySelectorAll(".category-btn"));
  buttons.forEach((btn,index)=>{
    btn.onclick=()=>renderCategory(btn.dataset.group);
    btn.onkeydown=e=>{
      if(e.key==="ArrowRight"){e.preventDefault();buttons[(index+1)%buttons.length].focus();}
      else if(e.key==="ArrowLeft"){e.preventDefault();buttons[(index-1+buttons.length)%buttons.length].focus();}
      else if(e.key==="ArrowDown"){e.preventDefault();document.querySelector(".channel")?.focus();}
      else if(e.key==="Enter"||e.key==="OK"||e.key===" "){e.preventDefault();renderCategory(btn.dataset.group);}
    };
  });
}
document.addEventListener("DOMContentLoaded",function(){
  setupForceAutoHide();
  setupCategoryMenu();
  renderCategory("ดิจิตอล");
  startFastWarmup();
});
