function codecLooksAvc(level){
  const codec = String(level?.videoCodec || level?.codecSet || level?.attrs?.CODECS || "").toLowerCase();
  return !codec || codec.includes("avc1") || codec.includes("h264");
}

function chooseProjectorSafeLevel(levels){
  if(!Array.isArray(levels) || !levels.length) return -1;
  const candidates = levels
    .map((level,index)=>({level,index}))
    .filter(x=>codecLooksAvc(x.level))
    .filter(x=>(x.level.height || 0) <= 720 || !(x.level.height));
  const list = candidates.length ? candidates : levels.map((level,index)=>({level,index}));
  list.sort((a,b)=>{
    const ah=a.level.height||9999, bh=b.level.height||9999;
    if(ah!==bh) return bh-ah;
    return (a.level.bitrate||0)-(b.level.bitrate||0);
  });
  return list[0]?.index ?? 0;
}

}

function getServerCount(){
  return Array.isArray(activeOriginalChannel?.servers) ? activeOriginalChannel.servers.length : 1;
}

function canSwitchServer(){
  return Array.isArray(activeOriginalChannel?.servers) &&
         activeServerIndex + 1 < activeOriginalChannel.servers.length;
}

async function switchToNextServer(reason){
  if(!canSwitchServer()){
    addPlaybackLog("FAIL", "ไม่มี Backup เหลือ: " + reason);
    setStatus("ทุก Server เล่นไม่ได้", false);
    return false;
  }

  activeServerIndex++;
  serverSwitchCount++;
  serverFailureCount = 0;

  let next = resolveChannel(activeOriginalChannel, activeServerIndex);
  next = lab14ApplyExistingMatch(next);
  if(!next || !next.file){
    addPlaybackLog("FAIL", "Backup ไม่มีลิงก์");
    return switchToNextServer("Backup ไม่มีลิงก์");
  }

  activeChannel = next;
  currentServerName =
    activeOriginalChannel.servers?.[activeServerIndex]?.name ||
    ("Backup " + activeServerIndex);
  activeUrl = proxyUrl(next.file);
  audioOnlyRetryDone = false;
  selectedSafeLevel = -1;

  addPlaybackLog("SWITCH", "สลับไป " + currentServerName + " เพราะ " + reason);
  setStatus("กำลังสลับ Server...", true);

  await stopAllPlayers();
  const myToken = ++playbackAttemptToken;

  setTimeout(()=>{
    if(myToken !== playbackAttemptToken) return;
    if(activeUrl.includes(".mpd")) playMPDNotice(next, activeUrl);
    else useHLS_STABLE(activeUrl);
  }, 500);

  return true;
}

function markPlaybackSuccess(kind){
  serverFailureCount = 0;
  lastPlaybackStartedAt = Date.now();
  addPlaybackLog("PLAY", "เล่นสำเร็จผ่าน " + currentServerName + " • " + kind);
}

function handlePlaybackFailure(reason, fatal=true){
  serverFailureCount++;
  addPlaybackLog(fatal ? "ERROR" : "WARN", reason);

  // จำกัดการสลับ: Fatal สลับทันที / ปัญหาชั่วคราวรอ 2 ครั้ง
  if(fatal || serverFailureCount >= 2){
    switchToNextServer(reason);
  }
}




function lab14Esc(v){
  return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function lab14NormHex(v){
  return String(v||"").toLowerCase().replace(/[^0-9a-f]/g,"");
}
function lab14BuildKnownKeyMap(){
  const map = {};
  for(const ch of channels){
    const servers = Array.isArray(ch.servers) ? ch.servers : [ch];
    for(const s of servers){
      const kid = lab14NormHex(s?.keyId);
      const key = lab14NormHex(s?.key);
      if(kid.length===32 && key.length===32){
        map[kid] = {key, source:ch.name || "unknown"};
      }
    }
  }
  return map;
}
function lab14IsDrmChannel(channel){

}

function lab14ChannelKey(channel){

  lab14RequiredKid = "-";

function resolveChannel(channel, serverIndex=0){
  if(Array.isArray(channel.servers) && channel.servers.length){
    const server = channel.servers[serverIndex] || channel.servers[0];
    if(!server) return null;

    return {
      name: channel.name,
      logo: channel.logo,
      group: channel.group,
      file: server.file || server.url || "",
      drm: typeof server.drm === "boolean" ? server.drm : !!channel.drm,
      keyId: server.keyId || channel.keyId || "",
      key: server.key || channel.key || ""
    };
  }

  return channel && channel.file ? channel : null;
}

function firstChannelUrl(channel){
  const resolved = resolveChannel(channel, 0);
  return resolved ? resolved.file : "";
}

/* ================= MPD =================
   หมายเหตุ: MPD/DRM หลายช่องไม่เล่นใน WebView/Smart TV browser
   เพราะเครื่องไม่รองรับ EME/ClearKey หรือ header/DRM ไม่ผ่าน
   เวอร์ชันนี้ไม่ฝืนเล่นในเว็บ เพื่อไม่ให้ค้าง/จอดำ
*/
function playMPDNotice(channel, url){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");
  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  setStatus("ไฟล์ MPD/DRM เล่นในเว็บนี้ไม่ได้ในบางเครื่อง ให้กด PLAYER หรือ MX", false);

  // ลองด้วย Shaka แบบไม่บังคับ ถ้าเครื่องรองรับจะเล่นได้ ถ้าไม่รองรับจะไม่ค้าง
  try{
    if(window.shaka){
      shaka.polyfill.installAll();
      if(shaka.Player.isBrowserSupported()){
        shakaPlayer = new shaka.Player(video);
        lab14LastError="-";
        lab14MissingKids=[];
        shakaPlayer.addEventListener("error", function(event){
          try{
            const d=event.detail||{};
            lab14LastError=`code=${d.code||"-"} severity=${d.severity||"-"} category=${d.category||"-"}`;
            const data=Array.isArray(d.data)?d.data:[];
            for(const item of data){
              if(item && Array.isArray(item.missingKeys)){
                lab14MissingKids=[...new Set(item.missingKeys.map(lab14NormHex).filter(Boolean))];
                const known = lab14BuildKnownKeyMap();
                const exact = lab14MissingKids.find(k => known[k]);
                if(exact){
                  lab14RequiredKid = exact;
                  lab14ResolvedKidCache[lab14ChannelKey(activeChannel)] = exact;
                }

                // DIAG ONLY: record missing KID; never change key or reload automatically.
                lab14ResolvedOnce = false;
                lab14ReloadCount = 0;
              }
            }
          }catch(e){}
        });
        shakaPlayer.configure({
          streaming:{
            bufferingGoal: 30,
            rebufferingGoal: 5,
            bufferBehind: 15,
            retryParameters:{maxAttempts:4,baseDelay:1000,backoffFactor:1.5,timeout:25000}
          }
        });
        if(channel.drm){
          shakaPlayer.configure({drm:{clearKeys:{[channel.keyId]:channel.key}}});
        }
        shakaPlayer.load(url).then(()=>{
          applyBalancedVolume(url);
          video.play().catch(()=>{});
          startAudioOnlyWatch(url);
          setStatus("กำลังเล่น MPD • " + currentServerName);
          markPlaybackSuccess("MPD");
        }).catch(e=>{
          console.log("MPD เล่นในเว็บไม่ได้:", e);
          setStatus("MPD เล่นไม่ได้ กำลังตรวจ Backup...", true);
          handlePlaybackFailure("MPD load error: " + (e?.message || e), true);
        });
      }
    }
  }catch(e){
    console.log("MPD ERROR:", e);
    handlePlaybackFailure("MPD exception: " + (e?.message || e), true);
  }
}

/* ================= HLS ANALYZER ENGINE LAB ================= */
function useHLS_STABLE(url){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");

  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.style.opacity = "1";
  video.style.visibility = "visible";
  video.style.transform = "translateZ(0)";
  video.controls = true;
  video.autoplay = true;
  video.setAttribute("playsinline", "");
  video.setAttribute("webkit-playsinline", "");
  forceAudio100();

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(window.Hls && Hls.isSupported()){
    setStatus("กำลังโหลดด้วย Analyzer Engine...");
    addPlaybackLog("ENGINE", "เริ่ม HLS แบบเดียวกับ TIEA Stream Analyzer");

    // Build 2403: googlecdnforstreaming Worker HLS fix.
    // The Worker playlist can contain child/segment URLs that must continue
    // through the same Worker + referer. Rewrite every HLS request here.
    const workerBase = "https://iptv.tawatchai250958.workers.dev/?url=";
    let inheritedReferer = "";
    try{ inheritedReferer = new URL(url).searchParams.get("referer") || ""; }catch(e){}
    const isTieaWorkerHls = url.startsWith(workerBase) && /googlecdnforstreaming\.live/i.test(url);

    function tieaRewriteHlsRequest(requestUrl){
      if(!isTieaWorkerHls || !requestUrl) return requestUrl;
      if(requestUrl.startsWith(workerBase)) return requestUrl;
      if(!/^https?:\/\//i.test(requestUrl)) return requestUrl;
      return workerBase + encodeURIComponent(requestUrl) +
        (inheritedReferer ? "&referer=" + encodeURIComponent(inheritedReferer) : "");
    }

    class TieaWorkerLoader extends Hls.DefaultConfig.loader {
      load(context, config, callbacks){
        context.url = tieaRewriteHlsRequest(context.url);
        super.load(context, config, callbacks);
      }
    }

    currentHls = new Hls({
      loader: TieaWorkerLoader,
      enableWorker: true,
      lowLatencyMode: false,
      autoStartLoad: true,
      startFragPrefetch: true,
      backBufferLength: 30,
      maxBufferLength: 20,
      maxMaxBufferLength: 40,
      fragLoadingMaxRetry: 4,
      manifestLoadingMaxRetry: 3,
      levelLoadingMaxRetry: 3
    });

    currentHls.attachMedia(video);

    currentHls.on(Hls.Events.MEDIA_ATTACHED, function(){
      addPlaybackLog("HLS", "MEDIA_ATTACHED");
      currentHls.loadSource(url);
    });

    currentHls.on(Hls.Events.MANIFEST_PARSED, function(event, data){
      addPlaybackLog("HLS", "MANIFEST_PARSED levels=" + ((data && data.levels) ? data.levels.length : 0));
      applyBalancedVolume(url);
      video.play().catch(function(){
        setStatus("กด PLAY หนึ่งครั้งเพื่อเริ่มเล่น", true);
      });
      setStatus("กำลังเล่น HLS • Analyzer Engine • " + currentServerName);
      markPlaybackSuccess("HLS ANALYZER");
    });

    currentHls.on(Hls.Events.FRAG_LOADED, function(event, data){
      const loaded = data && data.frag && data.frag.stats ? (data.frag.stats.loaded || 0) : 0;
      addPlaybackLog("HLS", "FRAG_LOADED " + loaded + " bytes");
    });

    currentHls.on(Hls.Events.FRAG_PARSED, function(){
      addPlaybackLog("HLS", "FRAG_PARSED");
    });

    currentHls.on(Hls.Events.ERROR, function(event, data){
      if(!currentHls) return;
      const detail = `${data.type || "unknown"}/${data.details || "unknown"}`;
      addPlaybackLog(data.fatal ? "FATAL" : "WARN", "HLS " + detail);

      if(!data.fatal) return;

      if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
        try{ currentHls.startLoad(); }catch(e){}
      }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
        try{ currentHls.recoverMediaError(); }catch(e){}
      }else{
        handlePlaybackFailure("HLS Fatal: " + detail, true);
      }
    });

    video.addEventListener("playing", function analyzerPlaying(){
      applyBalancedVolume(url);
      addPlaybackLog("VIDEO", "PLAYING " + (video.videoWidth || 0) + "x" + (video.videoHeight || 0));
      setStatus("กำลังเล่น • " + (video.videoWidth || 0) + "x" + (video.videoHeight || 0));
      video.removeEventListener("playing", analyzerPlaying);
    });

  }else if(video.canPlayType("application/vnd.apple.mpegurl")){
    addPlaybackLog("ENGINE", "NATIVE HLS MODE");
    video.src = url;
    video.play().catch(()=>{});
  }else{
    setStatus("อุปกรณ์นี้ไม่รองรับ HLS/MSE", true);
    handlePlaybackFailure("NO HLS/MSE SUPPORT", true);
  }
}

let controlsTimer = null;

function forceShowControls(){
  const box = document.getElementById("player-container");
  if(!box) return;

  box.classList.remove("force-hide-controls");
  box.classList.remove("controls-hidden");

  if(controlsTimer) clearTimeout(controlsTimer);

  controlsTimer = setTimeout(function(){
    forceHideControls();
  }, 3000);
}

function forceHideControls(){
  const box = document.getElementById("player-container");
  if(!box) return;
  if(box.style.display !== "none"){
    try{
      const active = document.activeElement;
      if(active && active.blur) active.blur();
    }catch(e){}
    box.classList.add("force-hide-controls");
    box.classList.add("controls-hidden");
  }
}

function setupForceAutoHide(){
  const box = document.getElementById("player-container");
  if(!box || box.dataset.forceHideReady === "1") return;
  box.dataset.forceHideReady = "1";

  ["mousemove","mousedown","touchstart","touchmove","click","pointermove","pointerdown"].forEach(function(ev){
    box.addEventListener(ev, forceShowControls, {passive:true});
  });

  document.addEventListener("keydown", function(){
    if(box.style.display !== "none"){
      forceShowControls();
    }
  });
}

function setupCategoryMenu(){
  const buttons=Array.from(document.querySelectorAll(".category-btn"));
  buttons.forEach((btn,index)=>{
    btn.onclick=()=>renderCategory(btn.dataset.group);
    btn.onkeydown=e=>{
      if(e.key==="ArrowRight"){e.preventDefault();buttons[(index+1)%buttons.length].focus();}
      else if(e.key==="ArrowLeft"){e.preventDefault();buttons[(index-1+buttons.length)%buttons.length].focus();}
      else if(e.key==="ArrowDown"){e.preventDefault();document.querySelector(".channel")?.focus();}
      else if(e.key==="Enter"||e.key==="OK"||e.key===" "){e.preventDefault();renderCategory(btn.dataset.group);}
    };
  });
}
