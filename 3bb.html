async function warmStream(url){
  if(!url || warmedUrls.has(url) || !url.includes(".m3u8")) return;

  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 4500);

    if(response.body && response.body.cancel){ try{ await response.body.cancel(); }catch(e){} }
  }catch(e){}finally{clearTimeout(timer);}
}

function isExternalGatewayUrl(url){
  if(!url) return false;

  let value = String(url).trim().toLowerCase();

  // ถ้าเป็น Worker ของ TIEA ให้ตรวจ URL ต้นทางที่อยู่ในพารามิเตอร์ url
  try{
    const parsed = new URL(value);
    const nested = parsed.searchParams.get("url");
    if(nested){
      try{
        value = decodeURIComponent(nested).toLowerCase();
      }catch(e){
        value = nested.toLowerCase();
      }
    }
  }catch(e){}

  return (
    value.includes("play/live.php") ||
    value.includes("mac=") ||
    value.includes(":2095/") ||
    value.includes("lookontv.") ||
    value.includes("ultratv.")
  );
}

function openExternalGateway(url){
  if(!url) return;

  const gatewayUrl = new URL("external.html", window.location.href);
  gatewayUrl.searchParams.set("url", url);

  try{
    sessionStorage.setItem("TIEA_EXTERNAL_RETURN", window.location.href);
  }catch(e){}

  // ใช้แท็บเดิม ไม่ใช้ window.open
  window.location.assign(gatewayUrl.href);
}

function resolveChannel(channel, serverIndex=0){
  if(Array.isArray(channel.servers) && channel.servers.length){
    const server = channel.servers[serverIndex] || channel.servers[0];
    if(!server) return null;

    return {
      name: channel.name,
      logo: channel.logo,
      group: channel.group,
      file: server.file || server.url || "",
      drm: typeof server.drm === "boolean" ? server.drm : !!channel.drm,
      keyId: server.keyId || channel.keyId || "",
      key: server.key || channel.key || ""
    };
  }

  return channel && channel.file ? channel : null;
}

function firstChannelUrl(channel){
  const resolved = resolveChannel(channel, 0);
  return resolved ? resolved.file : "";
}

function diagEscape(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function pushDeepDiagEvent(name, detail=""){
  const stamp = new Date().toLocaleTimeString();
  deepDiagEvents.push(`${stamp} ${name}${detail ? " | " + detail : ""}`);
  if(deepDiagEvents.length > 12) deepDiagEvents.splice(0, deepDiagEvents.length - 12);
}

function bindDeepDiagEvents(){
  const video = document.getElementById("html5-player");
  if(!video || deepDiagBoundVideo === video) return;
  deepDiagBoundVideo = video;

  [
    "loadstart","loadedmetadata","loadeddata","canplay","canplaythrough",
    "play","playing","pause","waiting","stalled","suspend","seeking","seeked",
    "emptied","ended","error"
  ].forEach(name=>{
    video.addEventListener(name, ()=>{
      let detail = "";
      if(name === "error" && video.error){
        detail = `code=${video.error.code} message=${video.error.message || ""}`;
      }else{
        detail = `t=${Number(video.currentTime||0).toFixed(1)} ready=${video.readyState} net=${video.networkState}`;
      }
      pushDeepDiagEvent(name.toUpperCase(), detail);
    });
  });

  video.addEventListener("encrypted", (ev)=>{
    let len = 0, head = "-";
    try{
      len = ev.initData ? ev.initData.byteLength : 0;
      if(ev.initData){
        const bytes = new Uint8Array(ev.initData).slice(0,16);
        head = Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
      }
    }catch(e){}
    const info = {type:ev.initDataType || "unknown", length:len, head};
    deepDiagEncryptedInfo.push(info);
    if(deepDiagEncryptedInfo.length > 8) deepDiagEncryptedInfo.shift();
    pushDeepDiagEvent(
      "ENCRYPTED",
      `type=${info.type} bytes=${info.length} head=${info.head} mediaKeys=${video.mediaKeys ? "YES" : "NO"}`
    );
  });
}

function getDecodedFrames(video){
  try{
    if(video && typeof video.getVideoPlaybackQuality === "function"){
      const q = video.getVideoPlaybackQuality();
      return {
        total: Number(q.totalVideoFrames || 0),
        dropped: Number(q.droppedVideoFrames || 0),
        corrupted: Number(q.corruptedVideoFrames || 0)
      };
    }
  }catch(e){}
  return {
    total: Number(video?.webkitDecodedFrameCount || 0),
    dropped: Number(video?.webkitDroppedFrameCount || 0),
    corrupted: 0
  };
}

function getBufferedSummary(video){
  const ranges = [];
  try{
    for(let i=0;i<video.buffered.length;i++){
      ranges.push(`${video.buffered.start(i).toFixed(1)}-${video.buffered.end(i).toFixed(1)}`);
    }
  }catch(e){}
  return ranges.length ? ranges.join(", ") : "-";
}

function mediaErrorText(video){
  if(!video || !video.error) return "-";
  const map = {
    1:"MEDIA_ERR_ABORTED",
    2:"MEDIA_ERR_NETWORK",
    3:"MEDIA_ERR_DECODE",
    4:"MEDIA_ERR_SRC_NOT_SUPPORTED"
  };
  return `${map[video.error.code] || "MEDIA_ERROR"} (${video.error.code}) ${video.error.message || ""}`.trim();
}


function bindDeepShakaEvents(){
  if(!shakaPlayer || deepDiagShakaEventsBound) return;
  deepDiagShakaEventsBound = true;

  ["adaptation","variantchanged","trackschanged","buffering","streaming","error"].forEach(name=>{
    try{
      shakaPlayer.addEventListener(name, (ev)=>{
        let detail = "";
        try{
          if(name === "buffering"){
            detail = `buffering=${String(ev.buffering)}`;
          }else if(name === "error"){
            const d = ev.detail || {};
            detail = `code=${d.code || "-"} severity=${d.severity || "-"} category=${d.category || "-"}`;
          }else{
            const tracks = shakaPlayer.getVariantTracks ? shakaPlayer.getVariantTracks() : [];
            const active = tracks.find(t=>t.active);
            if(active){
              detail = `id=${active.id} bw=${Math.round((active.bandwidth||0)/1000)}kbps ${active.width||0}x${active.height||0} fps=${active.frameRate||"-"}`;
            }
          }
        }catch(e){}
        pushDeepDiagEvent("SHAKA "+name.toUpperCase(), detail);
      });
    }catch(e){}
  });
}

function readKeyStatuses(){
  try{
    if(shakaPlayer && typeof shakaPlayer.getKeyStatuses === "function"){
      const statuses = shakaPlayer.getKeyStatuses();
      const parts = [];
      if(statuses && typeof statuses.forEach === "function"){
        statuses.forEach((status,keyId)=>{
          parts.push(`${String(keyId)}:${status}`);
        });
      }
      if(parts.length) deepDiagLastKeyStatusText = parts.join(" | ");
    }
  }catch(e){}
  return deepDiagLastKeyStatusText || "-";
}

function v6PatchMediaSeeking(){
  if(v6PatchedCurrentTime) return;
  v6PatchedCurrentTime = true;

  try{
    const proto = HTMLMediaElement.prototype;
    const desc = Object.getOwnPropertyDescriptor(proto, "currentTime");
    if(desc && desc.get && desc.set){
      Object.defineProperty(proto, "currentTime", {
        configurable: desc.configurable,
        enumerable: desc.enumerable,
        get: function(){
          return desc.get.call(this);
        },
        set: function(value){
          const video = document.getElementById("html5-player");
          if(this === video){
            let before = 0;
            try{ before = desc.get.call(this); }catch(e){}
            const after = Number(value);
            v6LastSeekFrom = Number(before || 0);
            v6LastSeekTo = Number(after || 0);
            v6PushSeekTrace(
              "SET currentTime",
              `${v6LastSeekFrom.toFixed(3)} -> ${v6LastSeekTo.toFixed(3)} | ${v6ShortStack()}`
            );
          }
          return desc.set.call(this, value);
        }
      });
    }
  }catch(e){
    v6PushSeekTrace("PATCH currentTime ERROR", e?.message || String(e));
  }

  try{
    const proto = HTMLMediaElement.prototype;
    if(typeof proto.fastSeek === "function" && !v6PatchedFastSeek){
      const originalFastSeek = proto.fastSeek;
      proto.fastSeek = function(value){
        const video = document.getElementById("html5-player");
        if(this === video){
          let before = 0;
          try{ before = this.currentTime || 0; }catch(e){}
          v6PushSeekTrace(
            "fastSeek",
            `${Number(before).toFixed(3)} -> ${Number(value).toFixed(3)} | ${v6ShortStack()}`
          );
        }
        return originalFastSeek.call(this, value);
      };
      v6PatchedFastSeek = true;
    }
  }catch(e){
    v6PushSeekTrace("PATCH fastSeek ERROR", e?.message || String(e));
  }
}

function v6BindSeekEvents(){
  const video = document.getElementById("html5-player");
  if(!video || video.dataset.v6SeekBound === "1") return;
  video.dataset.v6SeekBound = "1";

  video.addEventListener("seeking", ()=>{
    const now = performance.now();
    const delta = v6LastSeekEventAt ? Math.round(now - v6LastSeekEventAt) : 0;
    v6LastSeekEventAt = now;
    v6PushSeekTrace(
      "SEEKING EVENT",
      `t=${Number(video.currentTime||0).toFixed(3)} ready=${video.readyState} net=${video.networkState} Δ=${delta}ms`
    );
  });

  video.addEventListener("seeked", ()=>{
    v6PushSeekTrace(
      "SEEKED EVENT",
      `t=${Number(video.currentTime||0).toFixed(3)} ready=${video.readyState} net=${video.networkState}`
    );
  });

  video.addEventListener("timeupdate", ()=>{
    if(video.seeking){
      v6PushSeekTrace(
        "TIMEUPDATE while seeking",
        `t=${Number(video.currentTime||0).toFixed(3)}`
      );
    }
  });
}

function v7ComputeInfo(doc){
  const mpd = doc.documentElement;
  const period = doc.querySelector("Period");
  const st = doc.querySelector("SegmentTemplate");
  const sNodes = Array.from(doc.querySelectorAll("SegmentTimeline S"));
  const firstS = sNodes[0] || null;
  const lastS = sNodes[sNodes.length-1] || null;

  const timescale = st ? (v7Attr(st,"timescale") || "-") : "-";
  const pto = st ? (v7Attr(st,"presentationTimeOffset") || "-") : "-";
  const firstT = firstS ? (v7Attr(firstS,"t") || "-") : "-";

  let computedFirstSec = "-";
  try{
    const ts = Number(timescale);
    const t = Number(firstT);
    const p = Number(pto);
    if(Number.isFinite(ts) && ts > 0 && Number.isFinite(t)){
      computedFirstSec = ((t - (Number.isFinite(p)?p:0))/ts).toFixed(3);
    }
  }catch(e){}

  return {
    type: v7Attr(mpd,"type") || "-",
    availabilityStartTime: v7Attr(mpd,"availabilityStartTime") || "-",
    publishTime: v7Attr(mpd,"publishTime") || "-",
    minimumUpdatePeriod: v7Attr(mpd,"minimumUpdatePeriod") || "-",
    timeShiftBufferDepth: v7Attr(mpd,"timeShiftBufferDepth") || "-",
    suggestedPresentationDelay: v7Attr(mpd,"suggestedPresentationDelay") || "-",
    mediaPresentationDuration: v7Attr(mpd,"mediaPresentationDuration") || "-",
    periodStart: v7Attr(period,"start") || "-",
    periodDuration: v7Attr(period,"duration") || "-",
    timescale,
    presentationTimeOffset: pto,
    startNumber: st ? (v7Attr(st,"startNumber") || "-") : "-",
    duration: st ? (v7Attr(st,"duration") || "-") : "-",
    firstT,
    firstD: firstS ? (v7Attr(firstS,"d") || "-") : "-",
    lastT: lastS ? (v7Attr(lastS,"t") || "-") : "-",
    lastD: lastS ? (v7Attr(lastS,"d") || "-") : "-",
    lastR: lastS ? (v7Attr(lastS,"r") || "0") : "-",
    computedFirstSec,
    timeline: v7SegmentTimelineSummary(doc),
    representations: v7RepresentationSummary(doc)
  };
}

  if(!url || !String(url).includes(".mpd")) return;

  if(!channel) return false;

function v9NormalizeManifestText(text, channel){
  v9PatchApplied = false;
  v9PatchBase = null;
  v9OriginalAST = "";
  v9PatchedAST = "";

  if(!v9ShouldPatchChannel(channel)) return text;

  try{
    const doc = new DOMParser().parseFromString(text, "application/xml");
    if(doc.querySelector("parsererror")) return text;

    const mpd = doc.documentElement;
    if(!mpd || mpd.nodeName.toLowerCase() !== "mpd") return text;

    const type = mpd.getAttribute("type") || "";
    if(type.toLowerCase() !== "dynamic") return text;

    const templates = Array.from(doc.querySelectorAll("SegmentTemplate"));
    if(!templates.length) return text;

    let detectedBase = null;

    for(const st of templates){
      const timescale = Number(st.getAttribute("timescale") || "1");
      const timeline = st.querySelector("SegmentTimeline");
      const firstS = timeline ? timeline.querySelector("S") : null;
      if(!firstS || !Number.isFinite(timescale) || timescale <= 0) continue;

      const firstT = Number(firstS.getAttribute("t"));
      if(!Number.isFinite(firstT)) continue;

      const existingPto = Number(st.getAttribute("presentationTimeOffset") || "0");
      const base = (firstT - (Number.isFinite(existingPto) ? existingPto : 0)) / timescale;

      // Only abnormal huge timelines are candidates.
      if(base <= 100000) continue;

      if(detectedBase === null) detectedBase = base;

      // Normalize segment presentation time to start near 0.
      st.setAttribute("presentationTimeOffset", String(firstT));
    }

    if(!Number.isFinite(detectedBase) || detectedBase <= 100000){
      return text;
    }

    v9PatchBase = detectedBase;

    // Keep live-edge math aligned after applying PTO.
    const ast = mpd.getAttribute("availabilityStartTime");
    if(ast){
      v9OriginalAST = ast;
      const shifted = v9ShiftIsoTime(ast, detectedBase);
      mpd.setAttribute("availabilityStartTime", shifted);
      v9PatchedAST = shifted;
    }

    v9PatchApplied = true;
    v9Log(
      `PATCH channel=${channel?.name||"-"} base=${detectedBase.toFixed(3)} ` +
      `AST=${v9OriginalAST || "-"} -> ${v9PatchedAST || "-"}`
    );

    return new XMLSerializer().serializeToString(doc);
  }catch(e){
    v9Log(`PATCH ERROR ${e?.message || String(e)}`);
    return text;
  }
}

function v9InstallManifestResponseFilter(player, channel){
  if(!player || !player.getNetworkingEngine) return;

  const net = player.getNetworkingEngine();
  if(!net || !net.registerResponseFilter) return;

  const filter = (type, response)=>{
    try{
      const ManifestType = shaka.net.NetworkingEngine.RequestType.MANIFEST;
      if(type !== ManifestType) return;
      if(!response || !response.data) return;

      const decoder = new TextDecoder("utf-8");
      const encoder = new TextEncoder();
      const original = decoder.decode(response.data);
      const patched = v9NormalizeManifestText(original, channel);

      if(v9PatchApplied && patched !== original){
        response.data = encoder.encode(patched).buffer;
        v9Log(`MANIFEST RESPONSE NORMALIZED uri=${response.uri || "-"}`);
      }else{
        v9Log(`MANIFEST BYPASS channel=${channel?.name||"-"}`);
      }
    }catch(e){
      v9Log(`FILTER ERROR ${e?.message || String(e)}`);
    }
  };

  net.registerResponseFilter(filter);
}

  // V9.4: ปิด Force Live Edge ทั้งหมด
  // เพื่อดู decoder/segment ตามธรรมชาติ โดยไม่ให้ seek ซ้ำรบกวนผล

function v93GetRange(){
  try{
    if(shakaPlayer && typeof shakaPlayer.seekRange === "function"){
      const r = shakaPlayer.seekRange();
      if(r && Number.isFinite(r.start) && Number.isFinite(r.end)){
        return {start:r.start, end:r.end};
      }
    }
  }catch(e){}
  return null;
}

function v93TryForceLiveEdge(channel){
  if(!v93ShouldForce(channel)) return;

  const video = document.getElementById("html5-player");
  if(!video) return;

  const r = v93GetRange();
  if(!r) {
    v93Push("WAIT no Shaka seekRange");
    return;
  }

  const span = r.end - r.start;
  if(!(span > 0)) {
    v93Push(`WAIT invalid range ${r.start}-${r.end}`);
    return;
  }

  // Stay slightly behind the end to avoid landing on an incomplete live segment.
  const backoff = Math.min(3, Math.max(1, span * 0.08));
  const target = Math.max(r.start + 0.25, r.end - backoff);
  const current = Number(video.currentTime || 0);

  v93Attempts++;
  v93Target = target;

  const inRange = current >= r.start - 0.25 && current <= r.end + 0.25;
  const frames = getDecodedFrames(video);

  if(inRange && frames.total > 0){
    v93Applied = true;
    v93Push(`PASS current=${current.toFixed(3)} target=${target.toFixed(3)} frames=${frames.total}`);
    return;
  }

  try{
    video.currentTime = target;
    v93Applied = true;
    v93Push(
      `FORCE ${current.toFixed(3)} -> ${target.toFixed(3)} ` +
      `range=${r.start.toFixed(3)}-${r.end.toFixed(3)} ready=${video.readyState} frames=${frames.total}`
    );

    const p = video.play();
    if(p && typeof p.catch === "function"){
      p.catch(e=>v93Push(`PLAY ERROR ${e?.message || String(e)}`));
    }
  }catch(e){
    v93Push(`FORCE ERROR ${e?.message || String(e)}`);
  }
}

function v93Start(channel){
  if(!v93ShouldForce(channel)){
    v93Push(`BYPASS channel=${channel?.name||"-"}`);
    return;
  }

  if(v93Timer){
    clearInterval(v93Timer);
    v93Timer = null;
  }

  v93Push(`ARM channel=${channel?.name||"-"}`);

  [250,600,1000,1600,2400,3500,5000].forEach(ms=>{
    setTimeout(()=>v93TryForceLiveEdge(channel), ms);
  });

  let ticks = 0;
  v93Timer = setInterval(()=>{
    ticks++;
    v93TryForceLiveEdge(channel);
    if(ticks >= 12){
      clearInterval(v93Timer);
      v93Timer = null;
    }
  },1000);
}

    state = "VIDEO DECODING";

    state = "VIDEO SEGMENTS ARRIVE / NO DECODED FRAMES";

function v94InstallSegmentDecoderTrace(player, channel){
  if(!player || !player.getNetworkingEngine) return;

  const net = player.getNetworkingEngine();
  if(!net || !net.registerResponseFilter) return;

  const filter = (type, response)=>{
    try{
      const RT = shaka.net.NetworkingEngine.RequestType;
      if(type !== RT.SEGMENT) return;

      const uri = response?.uri || "-";
      const bytes = Number(response?.data?.byteLength || 0);
      const kind = v94ClassifySegmentUri(uri);

      if(kind === "video"){
        v94VideoCount++;
        v94VideoBytes += bytes;
        v94Push(
          v94VideoSegments,
          `VIDEO SEGMENT #${v94VideoCount} bytes=${bytes} uri=${uri}`
        );
      }else if(kind === "audio"){
        v94AudioCount++;
        v94AudioBytes += bytes;
        v94Push(
          v94AudioSegments,
          `AUDIO SEGMENT #${v94AudioCount} bytes=${bytes} uri=${uri}`
        );
      }else{
        v94Push(
          v94OtherSegments,
          `OTHER SEGMENT bytes=${bytes} uri=${uri}`,
          10
        );
      }

      setTimeout(v94CaptureDecoderState, 0);
    }catch(e){
      v94Push(v94OtherSegments, `TRACE ERROR ${e?.message || String(e)}`, 10);
    }
  };

  net.registerResponseFilter(filter);

  const video = document.getElementById("html5-player");

    [
      "loadedmetadata","loadeddata","canplay","playing",
      "waiting","stalled","progress","timeupdate","error"

      video.addEventListener(name, ()=>{
        v94CaptureDecoderState();
      });
    });
  }

  v94Push(v94OtherSegments, `ARM channel=${channel?.name || "-"}`, 10);

  [300,800,1500,2500,4000,6000,9000].forEach(ms=>{
    setTimeout(v94CaptureDecoderState, ms);
  });
}

function v95Classify(uri){

  else if(u.includes("/audio/") || u.includes("audio_") || u.includes("audioseg")) kind = "audio";

function v96Ascii4(data, offset){
  try{
    const u = new Uint8Array(data, offset, 4);
    return String.fromCharCode(u[0],u[1],u[2],u[3]);
  }catch(e){
    return "????";
  }
}

function v96U32(data, offset){
  try{
    const dv = new DataView(data, offset, 4);
    return dv.getUint32(0);
  }catch(e){
    return 0;
  }
}

function v96ParseMp4Boxes(buffer){
  const out = [];
  if(!buffer || !buffer.byteLength) return out;

  let off = 0;
  let guard = 0;
  const total = buffer.byteLength;

  while(off + 8 <= total && guard < 24){
    guard++;

    let size = v96U32(buffer, off);
    const type = v96Ascii4(buffer, off + 4);
    let header = 8;

    if(size === 1){
      if(off + 16 > total) break;
      const dv = new DataView(buffer, off + 8, 8);
      const high = dv.getUint32(0);
      const low = dv.getUint32(4);
      size = high * 4294967296 + low;
      header = 16;
    }else if(size === 0){
      size = total - off;
    }

    if(!Number.isFinite(size) || size < header || off + size > total){
      out.push(`${type}(invalid:${size})`);
      break;
    }

    out.push(`${type}(${size})`);
    off += size;
  }

  return out;
}

function v96ClassifyBoxes(boxes){
  const types = boxes.map(x => String(x).split("(")[0]);
  const hasFtyp = types.includes("ftyp");
  const hasMoov = types.includes("moov");
  const hasMoof = types.includes("moof");
  const hasMdat = types.includes("mdat");

  if(hasFtyp || hasMoov) return "INIT";
  if(hasMoof || hasMdat) return "MEDIA";
  return "UNKNOWN";
}

function v96InstallMp4BoxTrace(player, channel){
  if(!player || !player.getNetworkingEngine) return;
  const net = player.getNetworkingEngine();
  if(!net || !net.registerResponseFilter) return;

  net.registerResponseFilter((type, response)=>{
    try{
      const RT = shaka.net.NetworkingEngine.RequestType;
      if(type !== RT.SEGMENT) return;
      if(!response || !response.data) return;

      const uri = response.uri || "-";
      const bytes = Number(response.data.byteLength || 0);
      const boxes = v96ParseMp4Boxes(response.data);
      const cls = v96ClassifyBoxes(boxes);

      if(cls === "INIT"){
        v96InitLikeCount++;
        v96LastInitUri = uri;
      }else if(cls === "MEDIA"){
        v96MediaLikeCount++;
        v96LastMediaUri = uri;
      }else{
        v96UnknownBoxCount++;
      }

      v96LastBoxSummary = boxes.length ? boxes.join(" | ") : "(no boxes)";
      v96Push(
        `${cls} bytes=${bytes} boxes=${v96LastBoxSummary} uri=${uri}`
      );
    }catch(e){
      v96Push(`BOX TRACE ERROR ${e?.message || String(e)}`);
    }
  });

  v96Push(`ARM channel=${channel?.name || "-"}`);
}

  ].join(" | ");
}

/* ================= MPD =================
   หมายเหตุ: MPD/DRM หลายช่องไม่เล่นใน WebView/Smart TV browser
   เพราะเครื่องไม่รองรับ EME/ClearKey หรือ header/DRM ไม่ผ่าน
   เวอร์ชันนี้ไม่ฝืนเล่นในเว็บ เพื่อไม่ให้ค้าง/จอดำ
*/
function playMPDNotice(channel, url){
  v7InspectMpd(url);
  setTimeout(()=>v81AutoInitDiagnostic(channel), 20);
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");
  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  setStatus("กำลังตรวจ MPD/DRM ด้วย Shaka...", false);

  try{
    if(window.shaka){
      shaka.polyfill.installAll();

      if(shaka.Player.isBrowserSupported()){
        shakaPlayer = new shaka.Player(video);
        v96InstallMp4BoxTrace(shakaPlayer, channel);
        v95InstallRequestSequenceTrace(shakaPlayer, channel);
        v94InstallSegmentDecoderTrace(shakaPlayer, channel);
        v92InstallSegmentTrace(shakaPlayer, channel);
        v92BindPlayerEvents(shakaPlayer);
        // V9: normalize only abnormal dynamic MPD timelines.
        // CINEMAX and normal timelines are always bypassed.
        v9InstallManifestResponseFilter(shakaPlayer, channel);

        shakaPlayer.addEventListener("error", function(event){
          try{
            const detail = event.detail || {};
            pushDeepDiagEvent(
              "SHAKA ERROR",
              `code=${detail.code || "-"} severity=${detail.severity || "-"} category=${detail.category || "-"}`
            );
          }catch(e){}
        });

        shakaPlayer.configure({
          streaming:{
            bufferingGoal: 30,
            rebufferingGoal: 5,
            bufferBehind: 15,
            retryParameters:{maxAttempts:4,baseDelay:1000,backoffFactor:1.5,timeout:25000}
          }
        });

        if(channel.drm){
          if(channel.keyId && channel.key){
            shakaPlayer.configure({
              drm:{
                clearKeys:{
                  [channel.keyId]:channel.key
                }
              }
            });
          }else{
          }
        }

        shakaPlayer.load(url).then(()=>{
          forceAudio100();
          v93Start(channel);
          v92CapturePlaybackWindow();
          [300,800,1500,3000,5000,8000].forEach(ms=>setTimeout(v92CapturePlaybackWindow, ms));
          setTimeout(()=>v8Observe(channel),300);
          video.play().catch(()=>{});
          setStatus("MPD โหลดสำเร็จ — ดูผลที่ 📊 DIAG", true);
        }).catch(e=>{
          console.log("MPD เล่นในเว็บไม่ได้:", e);
          setStatus("MPD โหลดไม่สำเร็จ — ดูผลที่ 📊 DIAG", false);
        });
      }else{
        mpdDiagLoadState = "FAIL";
        setStatus("อุปกรณ์นี้ไม่รองรับ Shaka/EME — ดู 📊 DIAG", false);
        renderMpdDiagnostic();
      }
    }else{
      mpdDiagLoadState = "FAIL";
      setStatus("ไม่พบ Shaka Player", false);
      renderMpdDiagnostic();
    }
  }catch(e){
    console.log("MPD ERROR:", e);
    mpdDiagLoadState = "FAIL";
    setStatus("MPD ERROR — ดู 📊 DIAG", false);
    renderMpdDiagnostic();
  }
}

/* ================= HLS STABLE CLASSIC ================= */
function useHLS_STABLE(url){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");

  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(Hls.isSupported() && url.includes(".m3u8")){
    setStatus("กำลังโหลด HLS...");

    currentHls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,

      // สูตรเดิมที่นิ่งกว่า: ไม่ล็อกคุณภาพแข็งเกินไป
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      backBufferLength: 20,
      maxBufferHole: 0.5,
      highBufferWatchdogPeriod: 3,

      manifestLoadingMaxRetry: 5,
      manifestLoadingRetryDelay: 1000,
      manifestLoadingMaxRetryTimeout: 8000,
      levelLoadingMaxRetry: 5,
      levelLoadingRetryDelay: 1000,
      levelLoadingMaxRetryTimeout: 8000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 1000,
      fragLoadingMaxRetryTimeout: 10000,

      startFragPrefetch: true,
      capLevelToPlayerSize: true,
      testBandwidth: false,
      abrEwmaDefaultEstimate: 1200000
    });

    currentHls.loadSource(url);
    currentHls.attachMedia(video);

    currentHls.on(Hls.Events.MANIFEST_PARSED, function(){
      forceAudio100();
      video.play().catch(()=>{});
      setTimeout(()=>{ forceAudio100(); video.play().catch(()=>{}); },300);
      setStatus("กำลังเล่น HLS");
    });

    currentHls.on(Hls.Events.BUFFER_STALLED, function(){
      setStatus("กำลังเติมบัฟเฟอร์...", true);
    });

    currentHls.on(Hls.Events.ERROR, function(event, data){
      console.log("HLS ERROR:", data);
      if(!currentHls) return;

      if(data.fatal){
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
          setStatus("เน็ตเวิร์กสะดุด กำลังโหลดต่อ...");
          try{ currentHls.startLoad(); }catch(e){}
        }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
          setStatus("สัญญาณวิดีโอสะดุด กำลังกู้คืน...");
          try{ currentHls.recoverMediaError(); }catch(e){}
        }else{
          setStatus("เล่นไม่ได้ กำลังลองโหลดใหม่...", false);
          try{
            currentHls.destroy();
            currentHls = null;
            setTimeout(()=>useHLS_STABLE(url), 1200);
          }catch(e){}
        }
      }
    });

    // watchdog แบบเบา ไม่รีโหลดถี่เกินไป
    let lastTime = 0;
    let stuckCount = 0;
    hlsWatchdog = setInterval(()=>{
      if(document.getElementById("player-container").style.display !== "block") return;
      if(!currentHls) return;

      forceAudio100();

      if(video.paused || video.readyState < 2){
        try{ currentHls.startLoad(); }catch(e){}
        video.play().catch(()=>{});
        return;
      }

      if(Math.abs(video.currentTime - lastTime) < 0.05){
        stuckCount++;
      }else{
        stuckCount = 0;
      }

      lastTime = video.currentTime;

      if(stuckCount >= 4){
        setStatus("ภาพค้าง กำลังกู้คืน...");
        try{ currentHls.startLoad(); }catch(e){}
        video.play().catch(()=>{});
        stuckCount = 0;
      }
    }, 3000);

  }else{
    video.src = url;
    setTimeout(()=>{
      forceAudio100();
      video.play().catch(()=>{});
    },300);
  }
}

/* ================= FORCE AUTO HIDE PLAYER CONTROLS ================= */
let controlsTimer = null;

function forceShowControls(){
  const box = document.getElementById("player-container");
  if(!box) return;

  box.classList.remove("force-hide-controls");
  box.classList.remove("controls-hidden");

  if(controlsTimer) clearTimeout(controlsTimer);

  controlsTimer = setTimeout(function(){
    forceHideControls();
  }, 3000);
}

function forceHideControls(){
  const box = document.getElementById("player-container");
  if(!box) return;
  if(box.style.display !== "none"){
    try{
      const active = document.activeElement;
      if(active && active.blur) active.blur();
    }catch(e){}
    box.classList.add("force-hide-controls");
    box.classList.add("controls-hidden");
  }
}

function setupForceAutoHide(){
  const box = document.getElementById("player-container");
  if(!box || box.dataset.forceHideReady === "1") return;
  box.dataset.forceHideReady = "1";

  ["mousemove","mousedown","touchstart","touchmove","click","pointermove","pointerdown"].forEach(function(ev){
    box.addEventListener(ev, forceShowControls, {passive:true});
  });

  document.addEventListener("keydown", function(){
    if(box.style.display !== "none"){
      forceShowControls();
    }
  });
}

async function closePlayer(){
  await stopAllPlayers();
  const box = document.getElementById("player-container");
  box.classList.remove("controls-hidden");
  box.classList.remove("force-hide-controls");
  box.style.display = "none";
  setTimeout(()=>{if(activeElement && document.body.contains(activeElement)) activeElement.focus();},120);
}

function goHome(){
  window.location.href = "https://tiea9999.github.io/tv/index.html";
}

document.addEventListener("keydown",function(e){
  const container = document.getElementById("player-container");
  if(container.style.display === "block"){
    if(e.key === "ArrowUp"){
      e.preventDefault();
      forceShowControls();
      document.getElementById("closeBtn")?.focus();
      return;
    }
    if(e.key === "Escape" || e.key === "Backspace" || e.key === "BrowserBack"){
      e.preventDefault();
      closePlayer();
    }
  }
});

let currentCategory = "ดิจิตอล";
function renderCategory(group){
  currentCategory=group;
  document.querySelectorAll(".category-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.group===group));
  document.getElementById("category-title").textContent="หมวด: "+group;
  const listContainer=document.getElementById("channel-list");
  listContainer.innerHTML="";
  const items=group==="ทั้งหมด"?channels:channels.filter(ch=>(ch.group||"ดิจิตอล")===group);
  items.forEach(ch=>{
    const div=document.createElement("div");
    div.className="channel";
    div.tabIndex=0;
    div.innerHTML=`<img src="${ch.logo}" loading="lazy"><span>${ch.name}</span>`;
    div.onclick=()=>loadChannel(ch,div);
    div.onfocus=()=>warmStream(firstChannelUrl(ch));
    div.onmouseenter=()=>warmStream(firstChannelUrl(ch));
    div.onkeydown=e=>{if(e.key==="Enter"||e.key==="OK"||e.key===" "){e.preventDefault();loadChannel(ch,div);}};
    listContainer.appendChild(div);
  });
  setTimeout(()=>listContainer.querySelector(".channel")?.focus(),100);
}
function setupCategoryMenu(){
  const buttons=Array.from(document.querySelectorAll(".category-btn"));
  buttons.forEach((btn,index)=>{
    btn.onclick=()=>renderCategory(btn.dataset.group);
    btn.onkeydown=e=>{
      if(e.key==="ArrowRight"){e.preventDefault();buttons[(index+1)%buttons.length].focus();}
      else if(e.key==="ArrowLeft"){e.preventDefault();buttons[(index-1+buttons.length)%buttons.length].focus();}
      else if(e.key==="ArrowDown"){e.preventDefault();document.querySelector(".channel")?.focus();}
      else if(e.key==="Enter"||e.key==="OK"||e.key===" "){e.preventDefault();renderCategory(btn.dataset.group);}
    };
  });
}
document.addEventListener("DOMContentLoaded",function(){
  setupForceAutoHide();
  setupCategoryMenu();
  renderCategory("ดิจิตอล");
  startFastWarmup();
});
