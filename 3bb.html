function setStatus(text, autoHide=true){
  const box = document.getElementById("status");
  if(!box) return;
  box.textContent = text || "";
  box.style.display = text ? "block" : "none";
  if(autoHide && text){
    clearTimeout(setStatus._timer);
    setStatus._timer = setTimeout(()=>{ box.style.display = "none"; }, 5000);
  }
}

function proxyUrl(url){
  const raw = String(url || "").trim();
  if(!raw) return "";

  // ถ้าเป็น Worker อยู่แล้ว ห้ามห่อซ้ำ
  if(raw.includes("workers.dev/?url=") || raw.includes("workers.dev?url=")){
    return raw;
  }

  const lower = raw.toLowerCase();

  // GitHub Pages เป็น HTTPS จึงเปิด HTTP ตรงไม่ได้
  // LiveDooMovies และ 6395 ให้ผ่าน Worker ตั้งแต่ครั้งแรก
  const mustUseWorker =
    lower.startsWith("http://") ||
    lower.includes("live.livedoomovies.com") ||
    lower.includes("livedoomovies.com") ||
    lower.includes("6395online.com");

  if(mustUseWorker){
    // Worker ตัวนี้ใช้รูปแบบ URL ตรง ไม่เข้ารหัสทั้งลิงก์
    // ตัวอย่าง: ?url=http://host/live/0.m3u8
    return WORKER_PROXY + raw;
  }

  // MPD/3BB และ HTTPS ทั่วไป ให้ Direct ก่อน
  return raw;
}

function normalizeServers(channel){
  if(Array.isArray(channel.servers) && channel.servers.length){
    return channel.servers
      .map((s,index)=>({
        name:s.name || (index===0 ? "Main" : "Backup"+index),
        file:s.file || s.url || "",
        drm:typeof s.drm==="boolean" ? s.drm : !!channel.drm,
        keyId:s.keyId || channel.keyId || "",
        key:s.key || channel.key || ""
      }))
      .filter(s=>s.file);
  }

  if(channel.file){
    return [{
      name:"Main",
      file:channel.file,
      drm:!!channel.drm,
      keyId:channel.keyId || "",
      key:channel.key || ""
    }];
  }

  return [];
}

function clearServerFailTimer(){
  if(serverFailTimer){
    clearTimeout(serverFailTimer);
    serverFailTimer = null;
  }
}

function armServerFailTimer(token, ms){
  clearServerFailTimer();
  serverFailTimer = setTimeout(()=>{
    if(token !== activeLoadToken) return;
    tryNextServer("เปิดช้าเกินกำหนด");
  }, ms || 12000);
}

function currentServer(){
  return activeServers[activeServerIndex] || null;
}

async function tryNextServer(reason){
  clearServerFailTimer();

  if(activeServerIndex + 1 >= activeServers.length){
    setStatus("ทุก Server เล่นไม่ได้" + (reason ? " • " + reason : ""), false);
    return;
  }

  activeServerIndex++;
  const next = currentServer();
  setStatus("กำลังสลับ Server...", true);
  await playActiveServer(next);
}

async function playActiveServer(server){
  if(!server || !server.file){
    return tryNextServer("ไม่มีลิงก์");
  }

  const token = ++activeLoadToken;
  await stopAllPlayers();

  activeUrl = proxyUrl(server.file);

  const routeText = activeUrl === server.file ? "DIRECT" : "WORKER";
  console.log("[TIEA V8.2]", routeText, activeUrl);
  setStatus("กำลังเปิด " + routeText + "...", true);

  const mergedChannel = Object.assign({}, activeChannel, {
    file: server.file,
    drm: server.drm,
    keyId: server.keyId,
    key: server.key
  });

  armServerFailTimer(token, 16000);

  const originalLower = String(server.file || "").toLowerCase();

  if(originalLower.includes(".mpd")){
    playMPDNotice(mergedChannel, activeUrl, token);
  }else{
    useHLS_STABLE(activeUrl, token);
  }
}

async function loadChannel(channel, element){

  activeServerIndex = 0;

}

/* ================= MPD =================
   หมายเหตุ: MPD/DRM หลายช่องไม่เล่นใน WebView/Smart TV browser
   เพราะเครื่องไม่รองรับ EME/ClearKey หรือ header/DRM ไม่ผ่าน
   เวอร์ชันนี้ไม่ฝืนเล่นในเว็บ เพื่อไม่ให้ค้าง/จอดำ
*/
function playMPDNotice(channel, url, token){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");
  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  setStatus("ไฟล์ MPD/DRM เล่นในเว็บนี้ไม่ได้ในบางเครื่อง ให้กด PLAYER หรือ MX", false);

  // ลองด้วย Shaka แบบไม่บังคับ ถ้าเครื่องรองรับจะเล่นได้ ถ้าไม่รองรับจะไม่ค้าง
  try{
    if(window.shaka){
      shaka.polyfill.installAll();
      if(shaka.Player.isBrowserSupported()){
        shakaPlayer = new shaka.Player(video);
        shakaPlayer.configure({
          streaming:{
            bufferingGoal: 30,
            rebufferingGoal: 5,
            bufferBehind: 15,
            retryParameters:{maxAttempts:4,baseDelay:1000,backoffFactor:1.5,timeout:25000}
          }
        });
        if(channel.drm){
          shakaPlayer.configure({drm:{clearKeys:{[channel.keyId]:channel.key}}});
        }
        shakaPlayer.load(url).then(()=>{
          if(token !== activeLoadToken) return;
          clearServerFailTimer();
          forceAudio100();
          video.play().catch(()=>{});
          setStatus("กำลังเล่น MPD");
        }).catch(e=>{
          if(token !== activeLoadToken) return;
          console.log("MPD เล่นในเว็บไม่ได้:", e);
          tryNextServer("MPD เล่นไม่ได้");
        });
      }
    }
  }catch(e){
    console.log("MPD ERROR:", e);
  }
}

/* ================= HLS STABLE CLASSIC ================= */
function useHLS_STABLE(url, token){
  const video = document.getElementById("html5-player");
  const jwBox = document.getElementById("jw-player");

  if(jwBox) jwBox.style.display = "none";
  video.style.display = "block";
  video.controls = true;
  forceAudio100();

  if(currentHls){
    try{ currentHls.destroy(); }catch(e){}
    currentHls = null;
  }

  if(hlsWatchdog){
    clearInterval(hlsWatchdog);
    hlsWatchdog = null;
  }

  if(Hls.isSupported() && url.includes(".m3u8")){
    setStatus("กำลังโหลด HLS...");

    currentHls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,

      // สูตรเดิมที่นิ่งกว่า: ไม่ล็อกคุณภาพแข็งเกินไป
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      backBufferLength: 20,
      maxBufferHole: 0.5,
      highBufferWatchdogPeriod: 3,

      manifestLoadingMaxRetry: 5,
      manifestLoadingRetryDelay: 1000,
      manifestLoadingMaxRetryTimeout: 8000,
      levelLoadingMaxRetry: 5,
      levelLoadingRetryDelay: 1000,
      levelLoadingMaxRetryTimeout: 8000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 1000,
      fragLoadingMaxRetryTimeout: 10000,

      startFragPrefetch: true,
      capLevelToPlayerSize: true,
      testBandwidth: false,
      abrEwmaDefaultEstimate: 1200000
    });

    currentHls.loadSource(url);
    currentHls.attachMedia(video);

    currentHls.on(Hls.Events.MANIFEST_PARSED, function(){
      if(token !== activeLoadToken) return;
      clearServerFailTimer();
      forceAudio100();
      video.play().catch(()=>{});
      setTimeout(()=>{ forceAudio100(); video.play().catch(()=>{}); },300);
      setStatus("กำลังเล่น HLS");
    });

    currentHls.on(Hls.Events.BUFFER_STALLED, function(){
      setStatus("กำลังเติมบัฟเฟอร์...", true);
    });

    currentHls.on(Hls.Events.ERROR, function(event, data){
      console.log("HLS ERROR:", data);
      if(!currentHls) return;

      if(data.fatal){
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
          setStatus("เน็ตเวิร์กสะดุด กำลังโหลดต่อ...");
          try{ currentHls.startLoad(); }catch(e){}
        }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
          setStatus("สัญญาณวิดีโอสะดุด กำลังกู้คืน...");
          try{ currentHls.recoverMediaError(); }catch(e){}
        }else{
          setStatus("เล่นไม่ได้ กำลังสลับ Server...", true);
          tryNextServer("HLS Fatal");
        }
      }
    });

    // watchdog แบบเบา ไม่รีโหลดถี่เกินไป
    let lastTime = 0;
    let stuckCount = 0;
    hlsWatchdog = setInterval(()=>{
      if(document.getElementById("player-container").style.display !== "block") return;
      if(!currentHls) return;

      forceAudio100();

      if(video.paused || video.readyState < 2){
        try{ currentHls.startLoad(); }catch(e){}
        video.play().catch(()=>{});
        return;
      }

      if(Math.abs(video.currentTime - lastTime) < 0.05){
        stuckCount++;
      }else{
        stuckCount = 0;
      }

      lastTime = video.currentTime;

      if(stuckCount >= 4){
        setStatus("ภาพค้าง กำลังกู้คืน...");
        try{ currentHls.startLoad(); }catch(e){}
        video.play().catch(()=>{});
        stuckCount = 0;
      }
    }, 3000);

  }else{
    video.src = url;

    const onPlaying = ()=>{
      if(token !== activeLoadToken) return;
      clearServerFailTimer();
      setStatus("กำลังเล่น");
      video.removeEventListener("playing", onPlaying);
      video.removeEventListener("error", onError);
    };

    const onError = ()=>{
      if(token !== activeLoadToken) return;
      video.removeEventListener("playing", onPlaying);
      video.removeEventListener("error", onError);
      tryNextServer("Native HLS เล่นไม่ได้");
    };

    video.addEventListener("playing", onPlaying);
    video.addEventListener("error", onError);

    setTimeout(()=>{
      forceAudio100();
      video.play().catch(()=>{});
    },300);
  }
}

function restartCurrent(){
  if(activeChannel){
    activeServerIndex = 0;
    loadChannel(activeChannel, activeElement);
  }
}



/* ================= FORCE AUTO HIDE PLAYER CONTROLS ================= */
let controlsTimer = null;

function forceShowControls(){
  const box = document.getElementById("player-container");
  if(!box) return;

  box.classList.remove("force-hide-controls");
  box.classList.remove("controls-hidden");

  if(controlsTimer) clearTimeout(controlsTimer);

  controlsTimer = setTimeout(function(){
    forceHideControls();
  }, 3000);
}

function forceHideControls(){
  const box = document.getElementById("player-container");
  if(!box) return;
  if(box.style.display !== "none"){
    try{
      const active = document.activeElement;
      if(active && active.blur) active.blur();
    }catch(e){}
    box.classList.add("force-hide-controls");
    box.classList.add("controls-hidden");
  }
}

function setupForceAutoHide(){
  const box = document.getElementById("player-container");
  if(!box || box.dataset.forceHideReady === "1") return;
  box.dataset.forceHideReady = "1";

  ["mousemove","mousedown","touchstart","touchmove","click","pointermove","pointerdown"].forEach(function(ev){
    box.addEventListener(ev, forceShowControls, {passive:true});
  });

  document.addEventListener("keydown", function(){
    if(box.style.display !== "none"){
      forceShowControls();
    }
  });
}

async function closePlayer(){
  activeLoadToken++;
  await stopAllPlayers();
  const box = document.getElementById("player-container");
  box.classList.remove("controls-hidden");
  box.classList.remove("force-hide-controls");
  box.style.display = "none";

  setTimeout(()=>{
    if(activeElement && document.body.contains(activeElement)){
      activeElement.focus();
    }
  },120);
}

function goHome(){
  window.location.href = "https://tiea9999.github.io/tv/index.html";
}

document.addEventListener("keydown",function(e){
  const container = document.getElementById("player-container");
  if(container.style.display === "block"){
    const buttons = Array.from(container.querySelectorAll(".player-btn"));

    if(e.key === "ArrowUp"){
      e.preventDefault();
      forceShowControls();
      document.getElementById("closeBtn")?.focus();
      return;
    }

    if((e.key === "ArrowLeft" || e.key === "ArrowRight") &&
       document.activeElement &&
       document.activeElement.classList.contains("player-btn")){
      e.preventDefault();
      forceShowControls();
      const index = buttons.indexOf(document.activeElement);
      const step = e.key === "ArrowRight" ? 1 : -1;
      buttons[(index + step + buttons.length) % buttons.length].focus();
      return;
    }

    if(e.key === "Escape" || e.key === "Backspace" || e.key === "BrowserBack"){
      e.preventDefault();
      closePlayer();
    }
  }
});

let currentCategory="ดิจิตอล";

function renderCategory(group){
  currentCategory=group;
  document.querySelectorAll(".category-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.group===group));
  document.getElementById("category-title").textContent="หมวด: "+group;
  const list=document.getElementById("channel-list");
  list.innerHTML="";
  const items=group==="ทั้งหมด"?channels:channels.filter(ch=>(ch.group||"ดิจิตอล")===group);
  if(!items.length){
    list.innerHTML='<div id="empty-message">หมวดนี้ยังไม่มีรายการ</div>';
    return;
  }
  items.forEach(ch=>{
    const div=document.createElement("div");
    div.className="channel";
    div.tabIndex=0;
    div.innerHTML=`<img src="${ch.logo}" loading="lazy"><span>${ch.name}</span>`;
    div.onclick=()=>loadChannel(ch,div);
    div.onkeydown=e=>{
      if(e.key==="Enter"||e.key==="OK"||e.key===" "){
        e.preventDefault();
        loadChannel(ch,div);
      }
    };
    list.appendChild(div);
  });
  setTimeout(()=>list.querySelector(".channel")?.focus(),100);
}

function setupCategoryMenu(){
  const buttons=Array.from(document.querySelectorAll(".category-btn"));
  buttons.forEach((btn,index)=>{
    btn.onclick=()=>renderCategory(btn.dataset.group);
    btn.onkeydown=e=>{
      if(e.key==="ArrowRight"){e.preventDefault();buttons[(index+1)%buttons.length].focus();}
      else if(e.key==="ArrowLeft"){e.preventDefault();buttons[(index-1+buttons.length)%buttons.length].focus();}
      else if(e.key==="ArrowDown"){e.preventDefault();document.querySelector(".channel")?.focus();}
      else if(e.key==="Enter"||e.key==="OK"||e.key===" "){e.preventDefault();renderCategory(btn.dataset.group);}
    };
  });
}

document.addEventListener("DOMContentLoaded",function(){
  setupForceAutoHide();
  setupCategoryMenu();
  renderCategory("ดิจิตอล");
});
